# Release (OPS-008, rapor §7.4): a `v*` tag promotes the image that main
# already built for the tagged commit (ci.yml publish); nothing is rebuilt.
# This workflow resolves ghcr.io/koro-org/koro-backend:<sha> to its digest,
# verifies the cosign signature (ci.yml on refs/heads/main) and prints the
# production deploy request. Production is approved in the deploy repository:
# by its `prod` environment reviewers when they exist (then PROD_AUTO_DISPATCH
# lets this workflow request the deploy), otherwise by a person running the
# printed command. Every action is pinned to a commit SHA (tag in the comment).
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash # -eo pipefail

jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read # resolve the digest, read the signature
    env:
      IMAGE: ghcr.io/koro-org/koro-backend
      IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/ci.yml@refs/heads/main
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      - name: Resolve and verify the image of the tagged commit
        id: image
        run: |
          if ! digest=$(docker buildx imagetools inspect "$IMAGE:$GITHUB_SHA" --format '{{json .Manifest}}' | jq -r .digest); then
            echo "::error::$IMAGE:$GITHUB_SHA does not exist: tag a main commit whose ci run published an image"
            exit 1
          fi
          ref="$IMAGE:$GITHUB_SHA@$digest"
          cosign verify --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com "$ref" >/dev/null
          echo "ref=$ref" >>"$GITHUB_OUTPUT"
          {
            echo "### $GITHUB_REF_NAME → production"
            echo '```'
            echo "$ref"
            echo '```'
            echo "Deploy (a person listed in the deploy repository's PROD_DEPLOYERS):"
            echo '```'
            echo "gh workflow run deploy.yml -R $GITHUB_REPOSITORY_OWNER/koro-infra --ref main -f environment=prod -f component=api -f image=$ref"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
      - name: Deploy token
        id: deploy-token
        if: vars.DEPLOY_ENABLED == 'true' && vars.PROD_AUTO_DISPATCH == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.DEPLOY_APP_CLIENT_ID }}
          private-key: ${{ secrets.DEPLOY_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: koro-infra
          permission-actions: write
      - name: Request the production deploy (waits for the environment reviewers)
        if: vars.DEPLOY_ENABLED == 'true' && vars.PROD_AUTO_DISPATCH == 'true'
        env:
          GH_TOKEN: ${{ steps.deploy-token.outputs.token }}
          REF: ${{ steps.image.outputs.ref }}
        run: |
          gh workflow run deploy.yml -R "$GITHUB_REPOSITORY_OWNER/koro-infra" --ref main \
            -f environment=prod -f component=api -f image="$REF"
          echo "Production deploy requested; approve it in the deploy repository." >>"$GITHUB_STEP_SUMMARY"
