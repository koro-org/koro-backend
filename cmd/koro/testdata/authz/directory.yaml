# Authz matrix of the directory module (03 §5.3, 04 §2.3; BE-020, club claims BE-022, BE-128). 27 operations × 18
# personas.
# The catalog (universities, departments, skills, clubs) is public (P); an inactive university is
# visible to platform_admin only (others 404). /clubs/{club_id}/... is a resource surface (03 §7.6):
# a club is visible to everyone, so a signed-in user without the club_admin role of that club gets
# 403, an unknown club 404. Admin surface (03 §7.2-3): everyone without the role → 403 before
# anything is read. adminSetClubSensitivity is R: the body carries the matrix password (identity
# fixtures). Business rules (428/412, 422 k7, 409) live in scenarios/directory.yaml and the
# service tests. Club claims (BE-022): createClubClaim is for adult verified students (stu, clm, cla,
# stf; k8) — an unverified account or staff get 403 students.verification_required, a minor 403
# directory.minor_restricted; /me/club-claims is the caller's own (another user's claim 404). The claim's
# approver decides (E-21, orchestrator 2026-10-04): the university_rep of the club's university when it has
# one and the club is not sensitive, platform_admin otherwise. uni_a has a rep (persona university_rep), uni_b
# none. The queue and detail are support's and platform_admin's (every claim) and the approving rep's (their
# claims; another claim 404). Without a decide/list path: 403 before the claim is read. Fixtures:
# claim_pending (student, club_unclaimed: the rep decides), claim_sensitive (student, club_sensitive:
# platform_admin decides), claim_b (other_club_admin, club_b of uni_b: platform_admin decides; the grant is a
# no-op, other_club_admin already runs club_b).
version: 1
groups:
  # signed-in users without the club_admin role of club_a.
  not_club_a_admin: [user_unverified, student, student_minor, club_member, other_club_admin, event_staff,
                     university_rep, company_member, company_admin, other_company_member]
  # signed-in users without a platform role.
  no_platform_role_dir: [user_unverified, student, student_minor, club_member, club_admin, other_club_admin,
                         event_staff, university_rep, company_member, company_admin, other_company_member]
  # platform roles other than platform_admin.
  other_staff_dir: [moderator, support, dpo, finance_admin, talent_auditor]
  # signed-in users who are no adult verified students (createClubClaim 403).
  no_claimants: [user_unverified, student_minor, university_rep, company_member, company_admin, other_company_member,
                 moderator, support, dpo, platform_admin, finance_admin, talent_auditor]
  # signed-in users without a platform role and without the university_rep role.
  no_staff_no_rep: [user_unverified, student, student_minor, club_member, club_admin, other_club_admin,
                    event_staff, company_member, company_admin, other_company_member]
  # platform roles that cannot read the claim queue.
  no_claim_queue: [moderator, dpo, finance_admin, talent_auditor]
  # signed-in users other than the student persona (another user's claim).
  not_claimant: [user_unverified, student_minor, club_member, club_admin, other_club_admin, event_staff,
                 university_rep, company_member, company_admin, other_company_member,
                 moderator, support, dpo, platform_admin, finance_admin, talent_auditor]

operations:
  listUniversities:
    method: GET
    path: /api/v1/universities
    action: directory.university.list
    public: true
    expect: { "@all": 200 }
    variants:
      - name: search_by_name
        query: { q: matris, sort: name, type: state }
        expect: { "@all": 200 }
      - name: of_university_org
        query: { org_id: "{{fixture:uni_a}}" }
        note: BE-127 — a university panel finds its own university
        expect: { "@all": 200 }

  getUniversity:
    method: GET
    path: /api/v1/universities/{university_id}
    action: directory.university.read
    public: true
    path_params: { university_id: uni_a_university }
    expect: { "@all": 200 }
    variants:
      - name: inactive_university
        path_params: { university_id: uni_inactive }
        note: a deactivated university is hidden from everyone but platform_admin
        expect:
          anonymous: 404
          "@no_platform_role_dir": 404
          "@other_staff_dir": 404
          platform_admin: 200
      - name: unknown_university
        path_params: { university_id: "literal:00000000-0000-7000-8000-0000000000aa" }
        expect: { "@all": 404 }

  listDepartments:
    method: GET
    path: /api/v1/universities/{university_id}/departments
    action: directory.department.list
    public: true
    path_params: { university_id: uni_a_university }
    expect: { "@all": 200 }
    variants:
      - name: filtered
        query: { q: matris, faculty_id: "{{fixture:faculty_a}}", degree_level: bachelor }
        expect: { "@all": 200 }
      - name: inactive_university
        path_params: { university_id: uni_inactive }
        expect:
          anonymous: 404
          "@no_platform_role_dir": 404
          "@other_staff_dir": 404
          platform_admin: 200

  getDepartment:
    method: GET
    path: /api/v1/departments/{department_id}
    action: directory.department.list
    public: true
    path_params: { department_id: department_a }
    note: BE-166 — names a stored department_id; visibility follows its university (listDepartments)
    expect: { "@all": 200 }
    variants:
      - name: inactive_university
        path_params: { department_id: department_inactive_uni }
        expect:
          anonymous: 404
          "@no_platform_role_dir": 404
          "@other_staff_dir": 404
          platform_admin: 200
      - name: unknown_department
        path_params: { department_id: "literal:00000000-0000-7000-8000-0000000000aa" }
        expect: { "@all": 404 }

  listSkills:
    method: GET
    path: /api/v1/skills
    action: directory.skill.list
    public: true
    expect: { "@all": 200 }
    variants:
      - name: english_names
        headers: { Accept-Language: "en-US" }
        query: { category: technical }
        expect: { "@all": 200 }

  listClubs:
    method: GET
    path: /api/v1/clubs
    action: directory.club.list
    public: true
    expect: { "@all": 200 }
    variants:
      - name: filtered
        query: { q: matris, university_id: "{{fixture:uni_a_university}}", category: technology, claimed: "true", sort: name }
        expect: { "@all": 200 }

  getClub:
    method: GET
    path: /api/v1/clubs/{club_id}
    action: directory.club.read
    public: true
    path_params: { club_id: club_a }
    expect: { "@all": 200 }
    variants:
      - name: sensitive_club
        path_params: { club_id: club_sensitive }
        note: the club exists publicly; its membership is private (member_count null)
        expect: { "@all": 200 }
      - name: unknown_club
        path_params: { club_id: "literal:00000000-0000-7000-8000-0000000000aa" }
        expect: { "@all": 404 }

  updateClub:
    method: PATCH
    path: /api/v1/clubs/{club_id}
    action: directory.club.update
    path_params: { club_id: club_a }
    headers: { If-Match: '"1hmhuo3hji000"' }
    body: bodies/directory/update_club.json
    expect:
      anonymous: 401
      "@not_club_a_admin": 403   # the club is visible to everyone (resource surface)
      club_admin: 200            # S
      "@other_staff_dir": 403
      platform_admin: 200
    variants:
      - name: other_club
        path_params: { club_id: club_b }
        note: IDOR — club_a's admin is not club_b's
        expect:
          anonymous: 401
          user_unverified: 403
          student: 403
          student_minor: 403
          club_member: 403
          club_admin: 403
          other_club_admin: 200
          event_staff: 403
          university_rep: 403
          company_member: 403
          company_admin: 403
          other_company_member: 403
          "@other_staff_dir": 403
          platform_admin: 200
      - name: unknown_club
        path_params: { club_id: "literal:00000000-0000-7000-8000-0000000000aa" }
        expect:
          anonymous: 401
          "@no_platform_role_dir": 404
          "@other_staff_dir": 404
          platform_admin: 404

  requestClubSensitivity:
    method: POST
    path: /api/v1/clubs/{club_id}/sensitivity-requests
    action: directory.club.request_sensitivity
    path_params: { club_id: club_a }
    body: bodies/directory/request_sensitivity.json
    note: only the club's club_admin asks; the platform admin sets the flag directly
    expect:
      anonymous: 401
      "@not_club_a_admin": 403
      club_admin: 202
      "@other_staff_dir": 403
      platform_admin: 403

  adminCreateClub:
    method: POST
    path: /api/v1/admin/clubs
    action: directory.club.create
    body: bodies/directory/create_club.json
    expect:
      anonymous: 401
      "@no_platform_role_dir": 403
      "@other_staff_dir": 403
      platform_admin: 201

  adminSetClubSensitivity:
    method: POST
    path: /api/v1/admin/clubs/{club_id}/sensitivity
    action: directory.club.set_sensitivity
    path_params: { club_id: club_a }
    body: bodies/directory/set_sensitivity.json
    expect:
      anonymous: 401
      "@no_platform_role_dir": 403
      "@other_staff_dir": 403
      platform_admin: 200
    variants:
      - name: unknown_club
        path_params: { club_id: "literal:00000000-0000-7000-8000-0000000000aa" }
        expect:
          anonymous: 401
          "@no_platform_role_dir": 403   # no ID probing without a platform role
          "@other_staff_dir": 403
          platform_admin: 404

  adminCreateUniversity:
    method: POST
    path: /api/v1/admin/universities
    action: directory.university.manage
    body: bodies/directory/create_university.json
    expect:
      anonymous: 401
      "@no_platform_role_dir": 403
      "@other_staff_dir": 403
      platform_admin: 201

  adminUpdateUniversity:
    method: PATCH
    path: /api/v1/admin/universities/{university_id}
    action: directory.university.manage
    path_params: { university_id: uni_a_university }
    body: bodies/directory/update_university.json
    expect:
      anonymous: 401
      "@no_platform_role_dir": 403
      "@other_staff_dir": 403
      platform_admin: 200
    variants:
      - name: unknown_university
        path_params: { university_id: "literal:00000000-0000-7000-8000-0000000000aa" }
        expect:
          anonymous: 401
          "@no_platform_role_dir": 403
          "@other_staff_dir": 403
          platform_admin: 404

  adminPutUniversityEmailDomain:
    method: PUT
    path: /api/v1/admin/universities/{university_id}/email-domains/{domain}
    action: directory.university.manage
    path_params: { university_id: uni_a_university, domain: "literal:ogr.matris.edu.tr" }
    body: bodies/directory/put_domain.json
    expect:
      anonymous: 401
      "@no_platform_role_dir": 403
      "@other_staff_dir": 403
      platform_admin: 200

  adminCreateDepartment:
    method: POST
    path: /api/v1/admin/universities/{university_id}/departments
    action: directory.university.manage
    path_params: { university_id: uni_a_university }
    body: bodies/directory/create_department.json
    expect:
      anonymous: 401
      "@no_platform_role_dir": 403
      "@other_staff_dir": 403
      platform_admin: 201

  adminListUniversities:
    method: GET
    path: /api/v1/admin/universities
    action: directory.university.manage
    query: { state: all }
    note: BE-128 managers' list, inactive universities included
    expect:
      anonymous: 401
      "@no_platform_role_dir": 403
      "@other_staff_dir": 403
      platform_admin: 200

  adminListUniversityEmailDomains:
    method: GET
    path: /api/v1/admin/universities/{university_id}/email-domains
    action: directory.university.manage
    path_params: { university_id: uni_a_university }
    note: BE-128 every e-mail domain of a university
    expect:
      anonymous: 401
      "@no_platform_role_dir": 403
      "@other_staff_dir": 403
      platform_admin: 200
    variants:
      - name: unknown_university
        path_params: { university_id: "literal:00000000-0000-7000-8000-0000000000aa" }
        expect:
          anonymous: 401
          "@no_platform_role_dir": 403
          "@other_staff_dir": 403
          platform_admin: 404

  adminCreateFaculty:
    method: POST
    path: /api/v1/admin/universities/{university_id}/faculties
    action: directory.university.manage
    path_params: { university_id: uni_a_university }
    body: bodies/directory/create_faculty.json
    note: BE-128 a faculty for adminCreateDepartment's faculty_id
    expect:
      anonymous: 401
      "@no_platform_role_dir": 403
      "@other_staff_dir": 403
      platform_admin: 201

  adminCreateSkill:
    method: POST
    path: /api/v1/admin/skills
    action: directory.skill.manage
    body: bodies/directory/create_skill.json
    expect:
      anonymous: 401
      "@no_platform_role_dir": 403
      "@other_staff_dir": 403
      platform_admin: 201

  adminUpdateSkill:
    method: PATCH
    path: /api/v1/admin/skills/{skill_id}
    action: directory.skill.manage
    path_params: { skill_id: skill_a }
    body: bodies/directory/update_skill.json
    expect:
      anonymous: 401
      "@no_platform_role_dir": 403
      "@other_staff_dir": 403
      platform_admin: 200

  adminListSkills:
    method: GET
    path: /api/v1/admin/skills
    action: directory.skill.manage
    query: { state: inactive }
    note: BE-128 managers' list, both names, inactive skills included
    expect:
      anonymous: 401
      "@no_platform_role_dir": 403
      "@other_staff_dir": 403
      platform_admin: 200

  createClubClaim:
    method: POST
    path: /api/v1/clubs/{club_id}/claims
    action: directory.club_claim.create
    path_params: { club_id: club_a }
    body: bodies/directory/create_claim.json
    note: >-
      k8 — club_a is claimed but a club may have several admins (E-21): its club_admin already runs it (409
      directory.invalid_state); other_club_admin is a uni_b student (422 directory.university_mismatch)
    expect:
      anonymous: 401
      student: 201
      club_member: 201
      club_admin: 409
      other_club_admin: 422
      event_staff: 201
      "@no_claimants": 403
    variants:
      - name: unclaimed_club
        path_params: { club_id: club_unclaimed }
        note: student already has the pending claim claim_pending for club_unclaimed (409 directory.claim_pending)
        expect:
          anonymous: 401
          student: 409
          club_member: 201
          club_admin: 201
          other_club_admin: 422
          event_staff: 201
          "@no_claimants": 403
      - name: sensitive_club
        path_params: { club_id: club_sensitive }
        note: >-
          a sensitive club is claimed like any other (its first admin comes from a claim); student already has
          claim_sensitive (409); uni_b student 422
        expect:
          anonymous: 401
          student: 409
          club_member: 201
          club_admin: 201
          other_club_admin: 422
          event_staff: 201
          "@no_claimants": 403
      - name: unknown_club
        path_params: { club_id: "literal:00000000-0000-7000-8000-0000000000aa" }
        expect:
          anonymous: 401
          "@signed_in": 404

  listMyClubClaims:
    method: GET
    path: /api/v1/me/club-claims
    action: directory.club_claim.read_own
    note: O — every account lists its own claims (an empty list without one)
    expect:
      anonymous: 401
      "@signed_in": 200

  withdrawMyClubClaim:
    method: POST
    path: /api/v1/me/club-claims/{claim_id}/withdraw
    action: directory.club_claim.withdraw
    path_params: { claim_id: claim_pending }
    note: O — only the claimant (student) sees the claim; everyone else gets 404
    expect:
      anonymous: 401
      student: 200
      "@not_claimant": 404
    variants:
      - name: unknown_claim
        path_params: { claim_id: "literal:00000000-0000-7000-8000-0000000000aa" }
        expect:
          anonymous: 401
          "@signed_in": 404

  adminListClubClaims:
    method: GET
    path: /api/v1/admin/club-claims
    action: directory.club_claim.list
    note: university_rep gets the claims they approve (uni_a's non-sensitive clubs)
    expect:
      anonymous: 401
      "@no_staff_no_rep": 403
      "@no_claim_queue": 403
      university_rep: 200
      support: 200
      platform_admin: 200
    variants:
      - name: decided
        query: { status: approved }
        expect:
          anonymous: 401
          "@no_staff_no_rep": 403
          "@no_claim_queue": 403
          university_rep: 200
          support: 200
          platform_admin: 200
      - name: own_university_panel
        query: { university_org_id: "{{fixture:uni_a}}" }
        note: BE-127 — the university panel's queue
        expect:
          anonymous: 401
          "@no_staff_no_rep": 403
          "@no_claim_queue": 403
          university_rep: 200
          support: 200
          platform_admin: 200
      - name: other_university_panel
        query: { university_org_id: "{{fixture:uni_b}}" }
        note: BE-127 — a university the rep does not represent is 404 (invisible claims); staff read it
        expect:
          anonymous: 401
          "@no_staff_no_rep": 403
          "@no_claim_queue": 403
          university_rep: 404
          support: 200
          platform_admin: 200

  adminGetClubClaim:
    method: GET
    path: /api/v1/admin/club-claims/{claim_id}
    action: directory.club_claim.list
    path_params: { claim_id: claim_pending }
    note: claim_pending is the rep's to decide, so the rep reads it too
    expect:
      anonymous: 401
      "@no_staff_no_rep": 403   # the claimant included: the admin view is the reviewers'
      "@no_claim_queue": 403
      university_rep: 200
      support: 200
      platform_admin: 200
    variants:
      - name: sensitive_club
        path_params: { claim_id: claim_sensitive }
        note: a sensitive club's claim stays with platform staff (03 Y2); the rep does not see it
        expect:
          anonymous: 401
          "@no_staff_no_rep": 403
          "@no_claim_queue": 403
          university_rep: 404
          support: 200
          platform_admin: 200
      - name: university_without_rep
        path_params: { claim_id: claim_b }
        expect:
          anonymous: 401
          "@no_staff_no_rep": 403
          "@no_claim_queue": 403
          university_rep: 404
          support: 200
          platform_admin: 200
      - name: unknown_claim
        path_params: { claim_id: "literal:00000000-0000-7000-8000-0000000000aa" }
        expect:
          anonymous: 401
          "@no_staff_no_rep": 403   # no ID probing without a list path
          "@no_claim_queue": 403
          university_rep: 404
          support: 404
          platform_admin: 404

  adminDecideClubClaim:
    method: POST
    path: /api/v1/admin/club-claims/{claim_id}/decision
    action: directory.club_claim.decide
    path_params: { claim_id: claim_pending }
    body: bodies/directory/decide_claim_approve.json
    note: >-
      E-21 — uni_a has a university_rep: the rep decides claim_pending, platform_admin may not (403)
    expect:
      anonymous: 401
      "@no_staff_no_rep": 403
      "@other_staff_dir": 403
      university_rep: 200
      platform_admin: 403
    variants:
      - name: reject
        body: bodies/directory/decide_claim_reject.json
        expect:
          anonymous: 401
          "@no_staff_no_rep": 403
          "@other_staff_dir": 403
          university_rep: 200
          platform_admin: 403
      - name: sensitive_club
        path_params: { claim_id: claim_sensitive }
        note: a sensitive club's claim is platform_admin's (the rep does not see it)
        expect:
          anonymous: 401
          "@no_staff_no_rep": 403
          "@other_staff_dir": 403
          university_rep: 404
          platform_admin: 200
      - name: university_without_rep
        path_params: { claim_id: claim_b }
        note: uni_b has no rep, so platform_admin decides
        expect:
          anonymous: 401
          "@no_staff_no_rep": 403
          "@other_staff_dir": 403
          university_rep: 404
          platform_admin: 200
      - name: unknown_claim
        path_params: { claim_id: "literal:00000000-0000-7000-8000-0000000000aa" }
        expect:
          anonymous: 401
          "@no_staff_no_rep": 403   # 403 before the claim is read
          "@other_staff_dir": 403
          university_rep: 404
          platform_admin: 404
