# BE-054: the live check-in board's WebSocket (04 §2.0, §W), a gin route outside OpenAPI. events.checkin.stats with
# the cells of getCheckinStats: 101 = upgraded (club_admin, event_staff on event_door); otherwise the handshake is
# answered like the REST counters (401 / 403) and nothing is upgraded.
non_api_routes:
  - method: GET
    path: /api/v1/events/{event_id}/check-ins/live
    websocket: true
    path_params: { event_id: event_door }
    expect:
      anonymous: 401
      "@ev_not_door": 403
      club_admin: 101
      event_staff: 101
      "@platform_staff": 403
