# Authz matrix of the events module (03 §5.6, 04 §2.6; BE-024, BE-026, BE-028). 27 operations × 18 personas.
# Event visibility (03 §3.6): published public events are everyone's; a members event is its org's
# members', its staff's and every platform role's; a university event is also the verified students'
# of that university; a draft is its organiser's club_admin / university_rep's and every platform
# role's. /events/{event_id}/... is a resource surface (03 §7.6): an invisible event is 404, a visible
# one without the role 403. /orgs/{org_id}/events is the org management surface: members without the
# role 403, non-members 404. k-po: platform_admin creates, publishes, deletes and manages staff only
# for the platform org (no persona is a member of it → 403); it updates and cancels any event. k13:
# companies create no events (403). Business rules (428/412, 409 status machine, 422 form_required,
# 404 unknown staff account) live in scenarios/events.yaml and the service tests.
# BE-026 forms: the published form follows the event's visibility (P); the draft and its publication
# are the organiser's management sub-surface: the org's other members 403, everyone else 404 (another
# org's form is 404, 03 §3.6), platform roles 403 (k-po: no persona is in the platform org). Lint rules
# are the admin surface: dpo and platform_admin; every other signed-in user 403.
# BE-028 registrations: verified students register (stu, min, clm, cla, stf; the others 403 — usr with
# students.verification_required); a university event only its university's students. /me/registrations
# are O (anyone else's 404). The organiser's list/read/decide/cancel are the event's sub-surface (03 §7.6):
# managers 200, others who see the event 403; support and platform_admin read by break-glass only
# (X-Koro-Access-Reason; without it 403) and never a sensitive club's event (Y2: 404).
version: 1
groups:
  # signed-in users without a membership in club_a (and no platform role).
  ev_outsiders_club_a: [user_unverified, student, student_minor, other_club_admin, event_staff, university_rep,
                        company_member, company_admin, other_company_member]
  # signed-in users without a membership in company_a.
  ev_outsiders_company_a: [user_unverified, student, student_minor, club_member, club_admin, other_club_admin,
                           event_staff, university_rep, other_company_member]
  # signed-in users without a membership in uni_a.
  ev_outsiders_uni_a: [user_unverified, student, student_minor, club_member, club_admin, other_club_admin, event_staff,
                       company_member, company_admin, other_company_member]
  # platform roles other than platform_admin.
  ev_other_staff: [moderator, support, dpo, finance_admin, talent_auditor]
  # platform roles without listOrgEvents (03 §5.6: mod, sup and pad have it).
  ev_list_denied_staff: [dpo, finance_admin, talent_auditor]
  # signed-in users who see public event_a but do not manage it.
  ev_not_manager_a: [user_unverified, student, student_minor, club_member, other_club_admin, event_staff,
                     university_rep, company_member, company_admin, other_company_member]
  # signed-in users who do not see event_a_members (no club_a membership, no staff role on it).
  ev_members_hidden: [user_unverified, student, student_minor, other_club_admin, university_rep, company_member,
                      company_admin, other_company_member]
  # signed-in users who do not see event_a_draft (not club_a's club_admin, no platform role).
  ev_draft_hidden: [user_unverified, student, student_minor, club_member, other_club_admin, event_staff,
                    university_rep, company_member, company_admin, other_company_member]
  # verified students of uni_a (they see event_uni_a).
  ev_uni_a_students: [student, student_minor, club_member, club_admin, event_staff]
  # signed-in users who do not see event_uni_a.
  ev_uni_hidden: [user_unverified, other_club_admin, company_member, company_admin, other_company_member]
  # signed-in users without a platform role (the admin surface answers them 403).
  ev_no_platform_role: [user_unverified, student, student_minor, club_member, club_admin, other_club_admin, event_staff,
                        university_rep, company_member, company_admin, other_company_member]
  # platform roles other than dpo and platform_admin (no lint rule grant).
  ev_lint_denied_staff: [moderator, support, finance_admin, talent_auditor]
  # signed-in users who do not see event_sensitive (club_member is a member of club_sensitive).
  ev_sensitive_hidden: [user_unverified, student, student_minor, club_admin, other_club_admin, event_staff,
                        university_rep, company_member, company_admin, other_company_member]
  # verified students (they register for an event they see).
  ev_registrants: [student, student_minor, club_member, club_admin, other_club_admin, event_staff]
  # signed-in users who see a public event but hold no student verification (no registration grant).
  ev_not_students: [user_unverified, university_rep, company_member, company_admin, other_company_member]
  # signed-in users other than the persona student (owner of reg_student and reg_pending).
  ev_not_owner: [user_unverified, student_minor, club_member, club_admin, other_club_admin, event_staff, university_rep,
                 company_member, company_admin, other_company_member, moderator, support, dpo, platform_admin,
                 finance_admin, talent_auditor]
  # platform roles without break-glass (support and platform_admin have it).
  ev_no_bg_staff: [moderator, dpo, finance_admin, talent_auditor]

operations:
  listEvents:
    method: GET
    path: /api/v1/events
    action: events.event.list
    public: true
    expect: { "@all": 200 }
    variants:
      - name: filtered
        query: { q: matris, category: workshop, city: istanbul, sort: "-published_at", starts_from: "2026-11-01",
                 org_id: "{{fixture:club_a}}" }
        expect: { "@all": 200 }
      - name: by_university
        query: { university_id: "{{fixture:uni_a_university}}" }
        expect: { "@all": 200 }

  getEvent:
    method: GET
    path: /api/v1/events/{event_id}
    action: events.event.read
    public: true
    path_params: { event_id: event_a }
    expect: { "@all": 200 }
    variants:
      - name: members_event
        path_params: { event_id: event_a_members }
        note: club_a's members and the event's staff only; every platform role sees it
        expect:
          anonymous: 404
          "@ev_members_hidden": 404
          club_member: 200
          club_admin: 200
          event_staff: 200
          "@platform_staff": 200
      - name: draft_event
        path_params: { event_id: event_a_draft }
        expect:
          anonymous: 404
          "@ev_draft_hidden": 404
          club_admin: 200
          "@platform_staff": 200
      - name: university_event
        path_params: { event_id: event_uni_a }
        expect:
          anonymous: 404
          "@ev_uni_hidden": 404
          "@ev_uni_a_students": 200
          university_rep: 200
          "@platform_staff": 200
      - name: sensitive_club_members_event
        path_params: { event_id: event_sensitive }
        note: club_member is a member of club_sensitive
        expect:
          anonymous: 404
          "@ev_sensitive_hidden": 404
          club_member: 200
          "@platform_staff": 200
      - name: unknown_event
        path_params: { event_id: "literal:00000000-0000-7000-8000-0000000000aa" }
        expect: { "@all": 404 }

  listOrgEvents:
    method: GET
    path: /api/v1/orgs/{org_id}/events
    action: events.event.list_org
    path_params: { org_id: club_a }
    expect:
      anonymous: 401
      "@ev_outsiders_club_a": 404
      club_member: 403
      club_admin: 200
      moderator: 200
      support: 200
      platform_admin: 200
      "@ev_list_denied_staff": 403
    variants:
      - name: drafts_only
        query: { status: draft }
        expect:
          anonymous: 401
          "@ev_outsiders_club_a": 404
          club_member: 403
          club_admin: 200
          moderator: 200
          support: 200
          platform_admin: 200
          "@ev_list_denied_staff": 403
      - name: university_org
        path_params: { org_id: uni_a }
        expect:
          anonymous: 401
          "@ev_outsiders_uni_a": 404
          university_rep: 200
          moderator: 200
          support: 200
          platform_admin: 200
          "@ev_list_denied_staff": 403

  createEvent:
    method: POST
    path: /api/v1/orgs/{org_id}/events
    action: events.event.create
    path_params: { org_id: club_a }
    body: bodies/events/create_event.json
    expect:
      anonymous: 401
      "@ev_outsiders_club_a": 404
      club_member: 403
      club_admin: 201
      "@platform_staff": 403
    variants:
      - name: university_org
        path_params: { org_id: uni_a }
        expect:
          anonymous: 401
          "@ev_outsiders_uni_a": 404
          university_rep: 201
          "@platform_staff": 403
      - name: company_org
        path_params: { org_id: company_a }
        note: k13 / T-17 — companies create no events in v1
        expect:
          anonymous: 401
          "@ev_outsiders_company_a": 404
          company_member: 403
          company_admin: 403
          "@platform_staff": 403

  updateEvent:
    method: PATCH
    path: /api/v1/events/{event_id}
    action: events.event.update
    path_params: { event_id: event_a }
    headers: { If-Match: '"1hmhuo3hji000"' }
    body: bodies/events/update_event.json
    expect:
      anonymous: 401
      "@ev_not_manager_a": 403
      club_admin: 200
      "@ev_other_staff": 403
      platform_admin: 200
    variants:
      - name: draft_event
        path_params: { event_id: event_a_draft }
        expect:
          anonymous: 401
          "@ev_draft_hidden": 404
          club_admin: 200
          "@ev_other_staff": 403
          platform_admin: 200
      - name: university_event
        path_params: { event_id: event_uni_a }
        expect:
          anonymous: 401
          "@ev_uni_hidden": 404
          "@ev_uni_a_students": 403
          university_rep: 200
          "@ev_other_staff": 403
          platform_admin: 200

  publishEvent:
    method: POST
    path: /api/v1/events/{event_id}/publish
    action: events.event.publish
    path_params: { event_id: event_a_draft }
    expect:
      anonymous: 401
      "@ev_draft_hidden": 404
      club_admin: 200
      "@platform_staff": 403

  cancelEvent:
    method: POST
    path: /api/v1/events/{event_id}/cancel
    action: events.event.cancel
    path_params: { event_id: event_a }
    body: bodies/events/cancel_event.json
    expect:
      anonymous: 401
      "@ev_not_manager_a": 403
      club_admin: 200
      "@ev_other_staff": 403
      platform_admin: 200
    variants:
      - name: members_event
        path_params: { event_id: event_a_members }
        expect:
          anonymous: 401
          "@ev_members_hidden": 404
          club_member: 403
          club_admin: 200
          event_staff: 403
          "@ev_other_staff": 403
          platform_admin: 200

  deleteEventDraft:
    method: DELETE
    path: /api/v1/events/{event_id}
    action: events.event.delete
    path_params: { event_id: event_a_draft_bare }
    note: a draft whose form has a published version keeps it (immutable versions; 409), so the draft without one
    expect:
      anonymous: 401
      "@ev_draft_hidden": 404
      club_admin: 204
      "@platform_staff": 403

  listEventStaff:
    method: GET
    path: /api/v1/events/{event_id}/staff
    action: events.staff.list
    path_params: { event_id: event_a }
    expect:
      anonymous: 401
      "@ev_not_manager_a": 403
      club_admin: 200
      "@platform_staff": 403
    variants:
      - name: draft_event
        path_params: { event_id: event_a_draft }
        expect:
          anonymous: 401
          "@ev_draft_hidden": 404
          club_admin: 200
          "@platform_staff": 403

  addEventStaff:
    method: POST
    path: /api/v1/events/{event_id}/staff
    action: events.staff.manage
    path_params: { event_id: event_a }
    body: bodies/events/add_staff.json
    expect:
      anonymous: 401
      "@ev_not_manager_a": 403
      club_admin: 201
      "@platform_staff": 403
    variants:
      - name: university_event
        path_params: { event_id: event_uni_a }
        expect:
          anonymous: 401
          "@ev_uni_hidden": 404
          "@ev_uni_a_students": 403
          university_rep: 201
          "@platform_staff": 403

  updateEventStaff:
    method: PATCH
    path: /api/v1/events/{event_id}/staff/{user_id}
    action: events.staff.manage
    path_params: { event_id: event_a, user_id: event_staff }
    body: bodies/events/update_staff.json
    expect:
      anonymous: 401
      "@ev_not_manager_a": 403
      club_admin: 200
      "@platform_staff": 403

  removeEventStaff:
    method: DELETE
    path: /api/v1/events/{event_id}/staff/{user_id}
    action: events.staff.manage
    path_params: { event_id: event_a, user_id: event_staff }
    expect:
      anonymous: 401
      "@ev_not_manager_a": 403
      club_admin: 204
      "@platform_staff": 403
    variants:
      - name: members_event
        path_params: { event_id: event_a_members }
        expect:
          anonymous: 401
          "@ev_members_hidden": 404
          club_member: 403
          club_admin: 204
          event_staff: 403
          "@platform_staff": 403

  getEventForm:
    method: GET
    path: /api/v1/events/{event_id}/form
    action: events.form.read
    public: true
    path_params: { event_id: event_a }
    expect: { "@all": 200 }
    variants:
      - name: members_event
        path_params: { event_id: event_a_members }
        expect:
          anonymous: 404
          "@ev_members_hidden": 404
          club_member: 200
          club_admin: 200
          event_staff: 200
          "@platform_staff": 200
      - name: draft_event
        path_params: { event_id: event_a_draft }
        note: a draft event's form is published before the event (publishEvent needs it); its managers read it
        expect:
          anonymous: 404
          "@ev_draft_hidden": 404
          club_admin: 200
          "@platform_staff": 200
      - name: university_event
        path_params: { event_id: event_uni_a }
        expect:
          anonymous: 404
          "@ev_uni_hidden": 404
          "@ev_uni_a_students": 200
          university_rep: 200
          "@platform_staff": 200
      - name: no_published_version
        path_params: { event_id: event_a_draft_bare }
        note: 04 §2.6 — an event without a published form version has no form (404 for everyone)
        expect: { "@all": 404 }

  getEventFormDraft:
    method: GET
    path: /api/v1/events/{event_id}/form/draft
    action: events.form.manage
    path_params: { event_id: event_a }
    expect:
      anonymous: 401
      "@ev_outsiders_club_a": 404
      club_member: 403
      club_admin: 200
      "@platform_staff": 403
    variants:
      - name: draft_event
        path_params: { event_id: event_a_draft }
        expect:
          anonymous: 401
          "@ev_draft_hidden": 404
          club_admin: 200
          "@platform_staff": 403
      - name: university_event
        path_params: { event_id: event_uni_a }
        expect:
          anonymous: 401
          "@ev_outsiders_uni_a": 404
          university_rep: 200
          "@platform_staff": 403

  putEventFormDraft:
    method: PUT
    path: /api/v1/events/{event_id}/form/draft
    action: events.form.manage
    path_params: { event_id: event_a }
    headers: { If-Match: '"1hmhuo3hji000"' }
    body: bodies/events/put_form_draft.json
    expect:
      anonymous: 401
      "@ev_outsiders_club_a": 404
      club_member: 403
      club_admin: 200
      "@platform_staff": 403
    variants:
      - name: draft_event
        path_params: { event_id: event_a_draft }
        expect:
          anonymous: 401
          "@ev_draft_hidden": 404
          club_admin: 200
          "@platform_staff": 403
      - name: university_event
        path_params: { event_id: event_uni_a }
        expect:
          anonymous: 401
          "@ev_outsiders_uni_a": 404
          university_rep: 200
          "@platform_staff": 403

  publishEventForm:
    method: POST
    path: /api/v1/events/{event_id}/form/versions
    action: events.form.publish
    path_params: { event_id: event_a }
    expect:
      anonymous: 401
      "@ev_outsiders_club_a": 404
      club_member: 403
      club_admin: 201
      "@platform_staff": 403
    variants:
      - name: first_version
        path_params: { event_id: event_a_draft_bare }
        expect:
          anonymous: 401
          "@ev_draft_hidden": 404
          club_admin: 201
          "@platform_staff": 403
      - name: university_event
        path_params: { event_id: event_uni_a }
        expect:
          anonymous: 401
          "@ev_outsiders_uni_a": 404
          university_rep: 201
          "@platform_staff": 403

  adminListFormLintRules:
    method: GET
    path: /api/v1/admin/form-lint-rules
    action: events.lint_rule.manage
    expect:
      anonymous: 401
      "@ev_no_platform_role": 403
      dpo: 200
      platform_admin: 200
      "@ev_lint_denied_staff": 403

  adminCreateFormLintRule:
    method: POST
    path: /api/v1/admin/form-lint-rules
    action: events.lint_rule.manage
    body: bodies/events/create_lint_rule.json
    expect:
      anonymous: 401
      "@ev_no_platform_role": 403
      dpo: 201
      platform_admin: 201
      "@ev_lint_denied_staff": 403

  adminUpdateFormLintRule:
    method: PATCH
    path: /api/v1/admin/form-lint-rules/{rule_id}
    action: events.lint_rule.manage
    path_params: { rule_id: "literal:01990000-0000-7000-8000-000000000016" }
    body: bodies/events/update_lint_rule.json
    expect:
      anonymous: 401
      "@ev_no_platform_role": 403
      dpo: 200
      platform_admin: 200
      "@ev_lint_denied_staff": 403
    variants:
      - name: unknown_rule
        path_params: { rule_id: "literal:00000000-0000-7000-8000-0000000000bb" }
        expect:
          anonymous: 401
          "@ev_no_platform_role": 403
          dpo: 404
          platform_admin: 404
          "@ev_lint_denied_staff": 403

  createRegistration:
    method: POST
    path: /api/v1/events/{event_id}/registrations
    action: events.registration.create
    idempotency: required
    path_params: { event_id: event_a }
    body: bodies/events/create_registration.json
    expect:
      anonymous: 401
      "@ev_registrants": 201
      "@ev_not_students": 403
      "@platform_staff": 403
    variants:
      - name: members_event
        path_params: { event_id: event_a_members }
        expect:
          anonymous: 401
          "@ev_members_hidden": 404
          club_member: 201
          club_admin: 201
          event_staff: 201
          "@platform_staff": 403
      - name: university_event
        path_params: { event_id: event_uni_a }
        note: student already holds reg_uni (409); the other students of uni_a register
        expect:
          anonymous: 401
          "@ev_uni_hidden": 404
          student: 409
          student_minor: 201
          club_member: 201
          club_admin: 201
          event_staff: 201
          university_rep: 403
          "@platform_staff": 403

  listMyRegistrations:
    method: GET
    path: /api/v1/me/registrations
    action: events.registration.list_own
    expect:
      anonymous: 401
      "@signed_in": 200
    variants:
      - name: upcoming_confirmed
        query: { upcoming: "true", status: confirmed }
        expect:
          anonymous: 401
          "@signed_in": 200

  getMyRegistration:
    method: GET
    path: /api/v1/me/registrations/{registration_id}
    action: events.registration.read_own
    path_params: { registration_id: reg_student }
    expect:
      anonymous: 401
      student: 200
      "@ev_not_owner": 404
    variants:
      - name: unknown_registration
        path_params: { registration_id: "literal:00000000-0000-7000-8000-0000000000cc" }
        expect:
          anonymous: 401
          "@signed_in": 404

  cancelMyRegistration:
    method: POST
    path: /api/v1/me/registrations/{registration_id}/cancel
    action: events.registration.cancel_own
    path_params: { registration_id: reg_student }
    body: bodies/events/cancel_my_registration.json
    expect:
      anonymous: 401
      student: 200
      "@ev_not_owner": 404
    variants:
      - name: pending_application
        path_params: { registration_id: reg_pending }
        note: a pending application is withdrawn
        expect:
          anonymous: 401
          student: 200
          "@ev_not_owner": 404

  listEventRegistrations:
    method: GET
    path: /api/v1/events/{event_id}/registrations
    action: events.registration.list
    path_params: { event_id: event_reg }
    expect:
      anonymous: 401
      "@ev_not_manager_a": 403
      club_admin: 200
      "@platform_staff": 403
    variants:
      - name: break_glass
        headers: { X-Koro-Access-Reason: "Destek talebi 4711: kayıt sorunu inceleniyor" }
        expect:
          anonymous: 401
          "@ev_not_manager_a": 403
          club_admin: 200
          support: 200
          platform_admin: 200
          "@ev_no_bg_staff": 403
      - name: members_event
        path_params: { event_id: event_a_members }
        expect:
          anonymous: 401
          "@ev_members_hidden": 404
          club_member: 403
          club_admin: 200
          event_staff: 403
          "@platform_staff": 403
      - name: university_event
        path_params: { event_id: event_uni_a }
        expect:
          anonymous: 401
          "@ev_uni_hidden": 404
          "@ev_uni_a_students": 403
          university_rep: 200
          "@platform_staff": 403
      - name: sensitive_club_break_glass
        path_params: { event_id: event_sensitive }
        headers: { X-Koro-Access-Reason: "Destek talebi 4711: kayıt sorunu inceleniyor" }
        note: Y2 — break-glass never reaches a sensitive club's event (only club_sensitive's admin, a helper, lists)
        expect:
          anonymous: 401
          "@ev_sensitive_hidden": 404
          club_member: 403
          support: 404
          platform_admin: 404
          "@ev_no_bg_staff": 403

  getEventRegistration:
    method: GET
    path: /api/v1/events/{event_id}/registrations/{registration_id}
    action: events.registration.read
    path_params: { event_id: event_reg, registration_id: reg_student }
    expect:
      anonymous: 401
      "@ev_not_manager_a": 403
      club_admin: 200
      "@platform_staff": 403
    variants:
      - name: break_glass
        headers: { X-Koro-Access-Reason: "Destek talebi 4711: kayıt sorunu inceleniyor" }
        expect:
          anonymous: 401
          "@ev_not_manager_a": 403
          club_admin: 200
          support: 200
          platform_admin: 200
          "@ev_no_bg_staff": 403
      - name: registration_of_another_event
        path_params: { event_id: event_reg, registration_id: reg_pending }
        note: 06 H-38 — a registration is read through its own event only
        expect:
          anonymous: 401
          "@ev_not_manager_a": 403
          club_admin: 404
          "@platform_staff": 403
      - name: university_event
        path_params: { event_id: event_uni_a, registration_id: reg_uni }
        expect:
          anonymous: 401
          "@ev_uni_hidden": 404
          "@ev_uni_a_students": 403
          university_rep: 200
          "@platform_staff": 403
      - name: sensitive_club_break_glass
        path_params: { event_id: event_sensitive, registration_id: reg_sensitive }
        headers: { X-Koro-Access-Reason: "Destek talebi 4711: kayıt sorunu inceleniyor" }
        expect:
          anonymous: 401
          "@ev_sensitive_hidden": 404
          club_member: 403
          support: 404
          platform_admin: 404
          "@ev_no_bg_staff": 403

  decideEventRegistration:
    method: POST
    path: /api/v1/events/{event_id}/registrations/{registration_id}/decision
    action: events.registration.decide
