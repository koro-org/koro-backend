# Authz matrix of the feed module (03 §5.7, 04 §2.7; BE-027, BE-029). 21 operations × 18 personas.
# Post visibility (03 §3.6): a published public post is everyone's; a commercial post is not a minor's nor an
# anonymous reader's (k15, T-57); a followers post is its followers' and the author org's members' (persona
# student follows club_a); drafts and posts in review are the author org's writers', moderators' and platform
# admins'; a removed post is moderators' and platform admins' only. /posts/{post_id} is a resource surface
# (03 §7.6): an invisible post is 404, a visible one without the role 403. /orgs/{org_id}/posts is the org
# management surface: members without a writer role 403, non-members 404, every platform role 403 (k-po:
# platform_admin writes for the platform org only, no persona belongs to it). Business rules (428/412, 409
# state machine and immutable audience, 422 Tiptap body) live in scenarios/feed.yaml and the service tests.
# BE-029: a like, a save or a hide needs a published post the reader sees (invisible 404; a draft its writers
# and moderators see 409 feed.invalid_state); unlike/unsave are 204 without a row on a visible post and 404 on
# an invisible one (no existence leak); follows and mutes address an org whose profile the reader sees; the
# lists are the caller's own (anonymous 401).
# BE-032: a targeted post is created on the org management surface like a post (k16 — the targeting scope, k ≥ 10,
# the sensitive club ban — is outreach.Compile's: 422, scenarios); a company spends a targeted_post unit (company_a
# holds 4; the "Hak yok" scenario empties company_b). Reports are every signed-in user's on what they see. The
# moderation endpoints are the admin surface: moderator and platform_admin, every other user 403 (03 §3.6), with
# MFA (k-mfa) and k17 (a moderator never suspends).
version: 1
groups:
  # signed-in users without a membership in club_a (and no platform role).
  fd_outsiders_club_a: [user_unverified, student, student_minor, other_club_admin, event_staff, university_rep,
                        company_member, company_admin, other_company_member]
  # signed-in users without a membership in company_a.
  fd_outsiders_company_a: [user_unverified, student, student_minor, club_member, club_admin, other_club_admin,
                           event_staff, university_rep, other_company_member]
  # signed-in users without a membership in uni_a.
  fd_outsiders_uni_a: [user_unverified, student, student_minor, club_member, club_admin, other_club_admin, event_staff,
                       company_member, company_admin, other_company_member]
  # moderator and platform_admin see drafts and removed posts.
  fd_post_staff: [moderator, platform_admin]
  # platform roles that read only what readers read.
  fd_other_staff: [support, dpo, finance_admin, talent_auditor]
  # signed-in users who see post_a but do not write it.
  fd_not_writer_a: [user_unverified, student, student_minor, club_member, other_club_admin, event_staff,
                    university_rep, company_member, company_admin, other_company_member,
                    moderator, support, dpo, platform_admin, finance_admin, talent_auditor]
  # users who do not see a club_a draft (not its writer, not moderator / platform_admin).
  fd_draft_hidden_a: [user_unverified, student, student_minor, club_member, other_club_admin, event_staff,
                      university_rep, company_member, company_admin, other_company_member,
                      support, dpo, finance_admin, talent_auditor]
  # users who do not see a club_b draft.
  fd_draft_hidden_b: [user_unverified, student, student_minor, club_member, club_admin, event_staff, university_rep,
                      company_member, company_admin, other_company_member, support, dpo, finance_admin,
                      talent_auditor]
  # users who do not see a company_a draft.
  fd_draft_hidden_company: [user_unverified, student, student_minor, club_member, club_admin, other_club_admin,
                            event_staff, university_rep, other_company_member, support, dpo, finance_admin,
                            talent_auditor]
  # signed-in users who see post_company (commercial) but do not write it; student_minor does not see it.
  fd_not_writer_company: [user_unverified, student, club_member, club_admin, other_club_admin, event_staff,
                          university_rep, other_company_member, moderator, support, dpo, platform_admin,
                          finance_admin, talent_auditor]
  # who sees post_a_followers: its followers (student), club_a's members and moderator / platform_admin.
  fd_followers_a: [student, club_member, club_admin, moderator, platform_admin]
  fd_not_followers_a: [user_unverified, student_minor, other_club_admin, event_staff, university_rep,
                       company_member, company_admin, other_company_member, support, dpo, finance_admin,
                       talent_auditor]
  # signed-in users without a platform role (the admin surface answers them 403).
  fd_no_platform_role: [user_unverified, student, student_minor, club_member, club_admin, other_club_admin,
                        event_staff, university_rep, company_member, company_admin, other_company_member]

operations:
  getFeed:
    method: GET
    path: /api/v1/feed
    action: feed.feed.read
    expect:
      anonymous: 401
      "@signed_in": 200
    variants:
      - name: following
        query: { tab: following, kind: text, limit: "5" }
        expect:
          anonymous: 401
          "@signed_in": 200

  listPosts:
    method: GET
    path: /api/v1/posts
    action: feed.post.list_by_org
    public: true
    query: { org_id: "{{fixture:club_a}}" }
    expect: { "@all": 200 }
    variants:
      - name: company_page
        query: { org_id: "{{fixture:company_a}}", limit: "10" }
        note: anonymous readers and minors get an empty page (every company post is commercial)
        expect: { "@all": 200 }
      - name: unknown_org
        query: { org_id: "00000000-0000-7000-8000-0000000000aa" }
        expect: { "@all": 404 }

  getPost:
    method: GET
    path: /api/v1/posts/{post_id}
    action: feed.post.read
    public: true
    path_params: { post_id: post_a }
    expect: { "@all": 200 }
    variants:
      - name: commercial_post
        path_params: { post_id: post_company }
        note: k15 — no commercial post for a minor; T-57 — none for an anonymous reader
        expect:
          anonymous: 404
          student_minor: 404
          "@fd_not_writer_company": 200
          company_member: 200
          company_admin: 200
      - name: followers_post
        path_params: { post_id: post_a_followers }
        expect:
          anonymous: 404
          "@fd_followers_a": 200
          "@fd_not_followers_a": 404
      - name: draft
        path_params: { post_id: post_a_draft }
        expect:
          anonymous: 404
          "@fd_draft_hidden_a": 404
          club_admin: 200
          "@fd_post_staff": 200
      - name: removed
        path_params: { post_id: post_a_removed }
        note: the author org sees a removed post in its management list only
        expect:
          anonymous: 404
          "@fd_draft_hidden_a": 404
          club_admin: 404
          "@fd_post_staff": 200
      - name: hidden_by_moderation
        path_params: { post_id: post_a_hidden }
        note: BE-126 — the feed never lists it; its writers and the moderators read it, everyone else the 404 of an unknown post
        expect:
          anonymous: 404
          "@fd_draft_hidden_a": 404
          club_admin: 200
          "@fd_post_staff": 200
      - name: pending_review
        path_params: { post_id: post_company_review }
        note: BE-126 — a company post in review, not yet in any feed
        expect:
          anonymous: 404
          "@fd_draft_hidden_company": 404
          company_member: 200
          company_admin: 200
          "@fd_post_staff": 200
      - name: unknown_post
        path_params: { post_id: "literal:00000000-0000-7000-8000-0000000000aa" }
        expect: { "@all": 404 }

  listOrgPostsManage:
    method: GET
    path: /api/v1/orgs/{org_id}/posts
    action: feed.post.list_org_manage
    path_params: { org_id: club_a }
    expect:
      anonymous: 401
      "@fd_outsiders_club_a": 404
      club_member: 403
      club_admin: 200
      "@platform_staff": 403
    variants:
      - name: drafts_only
        query: { status: draft }
        expect:
          anonymous: 401
          "@fd_outsiders_club_a": 404
          club_member: 403
          club_admin: 200
          "@platform_staff": 403
      - name: company_org
        path_params: { org_id: company_a }
        expect:
          anonymous: 401
          "@fd_outsiders_company_a": 404
          company_member: 200
          company_admin: 200
          "@platform_staff": 403
      - name: university_org
        path_params: { org_id: uni_a }
        expect:
          anonymous: 401
          "@fd_outsiders_uni_a": 404
          university_rep: 200
          "@platform_staff": 403

  createPost:
    method: POST
    path: /api/v1/orgs/{org_id}/posts
    action: feed.post.create
    path_params: { org_id: club_a }
    body: bodies/feed/create_post.json
    expect:
      anonymous: 401
      "@fd_outsiders_club_a": 404
      club_member: 403
      club_admin: 201
      "@platform_staff": 403
    variants:
      - name: company_org
        path_params: { org_id: company_a }
        note: a recruiter (company_member) posts too; the post is always commercial
        expect:
          anonymous: 401
          "@fd_outsiders_company_a": 404
          company_member: 201
          company_admin: 201
          "@platform_staff": 403
      - name: university_org
        path_params: { org_id: uni_a }
        expect:
          anonymous: 401
          "@fd_outsiders_uni_a": 404
          university_rep: 201
          "@platform_staff": 403

  updatePost:
    method: PATCH
    path: /api/v1/posts/{post_id}
    action: feed.post.update
    path_params: { post_id: post_a }
    headers: { If-Match: '"1hmhuo3hji000"' }
    body: bodies/feed/update_post.json
    expect:
      anonymous: 401
      "@fd_not_writer_a": 403
      club_admin: 200
    variants:
      - name: draft
        path_params: { post_id: post_a_draft }
        expect:
          anonymous: 401
          "@fd_draft_hidden_a": 404
          club_admin: 200
          "@fd_post_staff": 403
      - name: company_draft
        path_params: { post_id: post_company_draft }
        expect:
          anonymous: 401
          "@fd_draft_hidden_company": 404
          company_member: 200
          company_admin: 200
          "@fd_post_staff": 403
      - name: university_draft
        path_params: { post_id: post_uni_draft }
        expect:
          anonymous: 401
          "@fd_outsiders_uni_a": 404
          "@fd_other_staff": 404
          university_rep: 200
          "@fd_post_staff": 403

  publishPost:
    method: POST
    path: /api/v1/posts/{post_id}/publish
    action: feed.post.publish
    path_params: { post_id: post_a_draft }
    expect:
      anonymous: 401
      "@fd_draft_hidden_a": 404
      club_admin: 200
      "@fd_post_staff": 403
    variants:
      - name: company_draft
        path_params: { post_id: post_company_draft }
        note: company_a is new (no feed settings), so the post goes to pending_review (200)
        expect:
          anonymous: 401
          "@fd_draft_hidden_company": 404
          company_member: 200
          company_admin: 200
          "@fd_post_staff": 403

  deletePost:
    method: DELETE
    path: /api/v1/posts/{post_id}
    action: feed.post.delete
    path_params: { post_id: post_a_draft }
    expect:
      anonymous: 401
      "@fd_draft_hidden_a": 404
      club_admin: 204
      "@fd_post_staff": 403
    variants:
      - name: published
        path_params: { post_id: post_a }
        note: a published post becomes removed
        expect:
          anonymous: 401
          "@fd_not_writer_a": 403
          club_admin: 204
      - name: another_orgs_draft
        path_params: { post_id: post_b_draft }
        note: 06 H-38 — club_b's draft does not exist for club_a's admin
        expect:
          anonymous: 401
          "@fd_draft_hidden_b": 404
          other_club_admin: 204
          "@fd_post_staff": 403

  getPostStats:
    method: GET
    path: /api/v1/posts/{post_id}/stats
    action: feed.post.stats
    path_params: { post_id: post_a }
    expect:
      anonymous: 401
      "@fd_not_writer_a": 403
      club_admin: 200
    variants:
      - name: commercial_post
        path_params: { post_id: post_company }
        expect:
          anonymous: 401
          student_minor: 404
          "@fd_not_writer_company": 403
          company_member: 200
          company_admin: 200

  likePost:
    method: PUT
    path: /api/v1/posts/{post_id}/like
    action: feed.reaction.manage
    path_params: { post_id: post_a }
    expect:
      anonymous: 401
      "@signed_in": 204
    variants:
      - name: commercial_post
        path_params: { post_id: post_company }
        note: k15 — a minor does not see a commercial post
        expect:
          anonymous: 401
          student_minor: 404
          "@fd_not_writer_company": 204
          company_member: 204
          company_admin: 204
      - name: followers_post
        path_params: { post_id: post_a_followers }
        expect:
          anonymous: 401
          "@fd_followers_a": 204
          "@fd_not_followers_a": 404
      - name: draft
        path_params: { post_id: post_a_draft }
        note: a draft takes no like; who does not see it gets 404, its writer and moderators 409
        expect:
          anonymous: 401
          "@fd_draft_hidden_a": 404
          club_admin: 409
          "@fd_post_staff": 409
      - name: unknown_post
        path_params: { post_id: "literal:00000000-0000-7000-8000-0000000000aa" }
        expect:
          anonymous: 401
          "@signed_in": 404

  unlikePost:
    method: DELETE
    path: /api/v1/posts/{post_id}/like
    action: feed.reaction.manage
    path_params: { post_id: post_a }
    note: idempotent — 204 without a like
    expect:
      anonymous: 401
      "@signed_in": 204
    variants:
      - name: removed_post
        path_params: { post_id: post_a_removed }
        note: no like on an invisible post is 404 (moderators still see it)
        expect:
          anonymous: 401
          "@fd_draft_hidden_a": 404
          club_admin: 404
          "@fd_post_staff": 204

  savePost:
    method: PUT
    path: /api/v1/posts/{post_id}/save
    action: feed.save.manage
    path_params: { post_id: post_a }
    expect:
      anonymous: 401
      "@signed_in": 204
    variants:
      - name: commercial_post
        path_params: { post_id: post_company }
        expect:
          anonymous: 401
          student_minor: 404
          "@fd_not_writer_company": 204
          company_member: 204
          company_admin: 204
      - name: draft
        path_params: { post_id: post_a_draft }
        note: a draft takes no interaction (409 feed.invalid_state for those who see it)
        expect:
          anonymous: 401
          "@fd_draft_hidden_a": 404
          club_admin: 409
          "@fd_post_staff": 409

  unsavePost:
    method: DELETE
    path: /api/v1/posts/{post_id}/save
    action: feed.save.manage
    path_params: { post_id: post_a }
    expect:
      anonymous: 401
      "@signed_in": 204
    variants:
      - name: followers_post
        path_params: { post_id: post_a_followers }
        expect:
          anonymous: 401
          "@fd_followers_a": 204
          "@fd_not_followers_a": 404

  hidePost:
    method: POST
    path: /api/v1/posts/{post_id}/hide
    action: feed.hide.create
    path_params: { post_id: post_a }
    expect:
      anonymous: 401
      "@signed_in": 204
    variants:
      - name: followers_post
        path_params: { post_id: post_a_followers }
        expect:
          anonymous: 401
          "@fd_followers_a": 204
          "@fd_not_followers_a": 404
      - name: draft
        path_params: { post_id: post_a_draft }
        note: a draft takes no interaction (409 feed.invalid_state for those who see it)
        expect:
          anonymous: 401
          "@fd_draft_hidden_a": 404
          club_admin: 409
          "@fd_post_staff": 409

  listMySavedPosts:
    method: GET
    path: /api/v1/me/saved-posts
    action: feed.save.list_own
    query: { limit: "10" }
    expect:
      anonymous: 401
      "@signed_in": 200

  followOrg:
    method: PUT
    path: /api/v1/me/follows/{org_id}
    action: feed.follow.manage
    path_params: { org_id: club_a }
    expect:
      anonymous: 401
      "@signed_in": 204
    variants:
      - name: sensitive_club
        path_params: { org_id: club_sensitive }
        note: following a sensitive club by hand is the reader's own choice (no automatic follow)
        expect:
          anonymous: 401
          "@signed_in": 204
      - name: company
        path_params: { org_id: company_a }
        expect:
          anonymous: 401
          "@signed_in": 204
      - name: unknown_org
        path_params: { org_id: "literal:00000000-0000-7000-8000-0000000000aa" }
        expect:
          anonymous: 401
          "@signed_in": 404

  unfollowOrg:
    method: DELETE
    path: /api/v1/me/follows/{org_id}
    action: feed.follow.manage
    path_params: { org_id: club_a }
    note: idempotent — 204 without a follow (persona student follows club_a)
    expect:
      anonymous: 401
      "@signed_in": 204
    variants:
      - name: unknown_org
        path_params: { org_id: "literal:00000000-0000-7000-8000-0000000000aa" }
        expect:
          anonymous: 401
          "@signed_in": 404

  listMyFollows:
    method: GET
    path: /api/v1/me/follows
    action: feed.follow.list_own
    expect:
      anonymous: 401
      "@signed_in": 200

  muteOrg:
    method: PUT
    path: /api/v1/me/mutes/{org_id}
    action: feed.mute.manage
    path_params: { org_id: company_a }
    expect:
      anonymous: 401
      "@signed_in": 204
    variants:
      - name: unknown_org
        path_params: { org_id: "literal:00000000-0000-7000-8000-0000000000aa" }
        expect:
          anonymous: 401
          "@signed_in": 404

  unmuteOrg:
    method: DELETE
    path: /api/v1/me/mutes/{org_id}
    action: feed.mute.manage
    path_params: { org_id: company_a }
    expect:
      anonymous: 401
      "@signed_in": 204

  listMyMutes:
    method: GET
    path: /api/v1/me/mutes
    action: feed.mute.list_own
    query: { limit: "5" }
    expect:
      anonymous: 401
      "@signed_in": 200

  # BE-122: the reader's own relations (never on the public org reads).
  listMyOrgRelations:
    method: GET
    path: /api/v1/me/org-relations
    action: feed.follow.list_own
    query: { org_id: "{{fixture:club_a}}" }
    expect:
      anonymous: 401
      "@signed_in": 200

  # ---- BE-032: targeted posts, reports, moderation

  createTargetedPost:
    method: POST
    path: /api/v1/orgs/{org_id}/targeted-posts
    action: feed.post.create_targeted
    idempotency: required
    path_params: { org_id: club_a }
    body: bodies/feed/create_targeted_club.json
    note: a club addresses its own members (club:<id>) without k ≥ 10 and without a quota
    expect:
      anonymous: 401
      "@fd_outsiders_club_a": 404
      club_member: 403
      club_admin: 201
      "@platform_staff": 403
    variants:
      - name: company_org
        path_params: { org_id: company_a }
        body: bodies/feed/create_targeted_uni.json
        note: k ≥ 10 (fixture audience_uni_a) and one targeted_post unit of company_a
        expect:
          anonymous: 401
          "@fd_outsiders_company_a": 404
          company_member: 201
          company_admin: 201
          "@platform_staff": 403
      - name: university_org
        path_params: { org_id: uni_a }
        body: bodies/feed/create_targeted_uni.json
        note: uni:<own university> (k ≥ 10, no quota)
        expect:
          anonymous: 401
          "@fd_outsiders_uni_a": 404
          university_rep: 201
          "@platform_staff": 403

  createContentReport:
    method: POST
    path: /api/v1/reports
    action: feed.report.create
    body: bodies/feed/create_report.json
    expect:
      anonymous: 401
      "@signed_in": 201
    variants:
      - name: commercial_post
        body: bodies/feed/create_report_company_post.json
        note: k15 — a minor does not see a commercial post
        expect:
          anonymous: 401
          student_minor: 404
          "@fd_not_writer_company": 201
          company_member: 201
          company_admin: 201
      - name: draft
        body: bodies/feed/create_report_draft.json
        note: a draft is not reported (409 feed.invalid_state for those who see it, 404 for the others)
        expect:
          anonymous: 401
          "@fd_draft_hidden_a": 404
          club_admin: 409
          "@fd_post_staff": 409
      - name: org
        body: bodies/feed/create_report_org.json
        expect:
          anonymous: 401
          "@signed_in": 201

  adminListReports:
    method: GET
    path: /api/v1/admin/reports
    action: feed.report.list
    query: { status: open, sort: "-created_at" }
    expect:
      anonymous: 401
      "@fd_no_platform_role": 403
      "@fd_other_staff": 403
      "@fd_post_staff": 200

  adminGetReport:
    method: GET
    path: /api/v1/admin/reports/{report_id}
    action: feed.report.read
    path_params: { report_id: report_a }
    expect:
      anonymous: 401
      "@fd_no_platform_role": 403
      "@fd_other_staff": 403
      "@fd_post_staff": 200
    variants:
      - name: unknown_report
        path_params: { report_id: "literal:00000000-0000-7000-8000-0000000000aa" }
        expect:
          anonymous: 401
          "@fd_no_platform_role": 403
          "@fd_other_staff": 403
          "@fd_post_staff": 404

  adminResolveReport:
    method: POST
    path: /api/v1/admin/reports/{report_id}/resolve
    action: feed.report.resolve
    path_params: { report_id: report_a }
    body: bodies/feed/resolve_in_review.json
    expect:
      anonymous: 401
      "@fd_no_platform_role": 403
      "@fd_other_staff": 403
      "@fd_post_staff": 200
    variants:
      - name: actioned_without_action
        body: bodies/feed/resolve_actioned.json
        note: actioned needs a moderation action with the report (409 feed.moderation_action_required)
        expect:
          anonymous: 401
          "@fd_no_platform_role": 403
          "@fd_other_staff": 403
          "@fd_post_staff": 409

  adminListReviewQueue:
    method: GET
    path: /api/v1/admin/review-queue
    action: feed.review_queue.list
    expect:
      anonymous: 401
      "@fd_no_platform_role": 403
      "@fd_other_staff": 403
      "@fd_post_staff": 200

  adminModeratePost:
    method: POST
    path: /api/v1/admin/posts/{post_id}/moderation
    action: feed.post.moderate
    path_params: { post_id: post_a }
    body: bodies/feed/moderate_hide.json
    expect:
      anonymous: 401
      "@fd_no_platform_role": 403
      "@fd_other_staff": 403
      "@fd_post_staff": 200
    variants:
      - name: approve_in_review
        path_params: { post_id: post_company_review }
        body: bodies/feed/moderate_approve.json
        expect:
          anonymous: 401
          "@fd_no_platform_role": 403
          "@fd_other_staff": 403
          "@fd_post_staff": 200
      - name: restore_hidden
        path_params: { post_id: post_a_hidden }
        body: bodies/feed/moderate_restore.json
        expect:
          anonymous: 401
          "@fd_no_platform_role": 403
          "@fd_other_staff": 403
          "@fd_post_staff": 200
      - name: approve_published
        body: bodies/feed/moderate_approve.json
        note: approve applies to a post in review only (409 feed.invalid_state)
        expect:
          anonymous: 401
          "@fd_no_platform_role": 403
          "@fd_other_staff": 403
          "@fd_post_staff": 409
