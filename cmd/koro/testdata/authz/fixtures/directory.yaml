# Fixtures of the directory module (cmd/koro/matrix_directory_test.go; BE-020). IDs are authztest.ID(name).
# Besides these, the seeder writes a universities row for every university org of authztest
# (ID authztest.UniversityID(org): uni_a_university, uni_b_university) and a clubs row for every club
# org (club_a and club_b claimed, club_sensitive a sensitive religious club, club_unclaimed), all
# dated 2026-10-01T00:00:00Z: an untouched club's ETag is "1hmhuo3hji000".
version: 1
fixtures:
  uni_inactive: { kind: university, active: false }
  faculty_a: { kind: faculty, university: uni_a_university }
  department_a: { kind: department, university: uni_a_university, faculty: faculty_a }
  # BE-166: getDepartment of a department whose university is inactive (404 but for platform_admin).
  faculty_inactive_uni: { kind: faculty, university: uni_inactive }
  department_inactive_uni: { kind: department, university: uni_inactive, faculty: faculty_inactive_uni }
  skill_a: { kind: skill }
  # BE-022: student's pending claim for club_unclaimed (03 §7.3 claim_pending), with evidence text.
  claim_pending: { kind: claim, claimant: student, club: club_unclaimed }
  # BE-022: claims a platform_admin decides (a sensitive club; a university without a rep).
  claim_sensitive: { kind: claim, claimant: student, club: club_sensitive }
  claim_b: { kind: claim, claimant: other_club_admin, club: club_b }
