# Fixtures of the events module (cmd/koro/matrix_events_test.go; BE-024, BE-026). IDs are authztest.ID(name).
# Every event starts 2026-11-20T15:00:00Z (after the matrix clock), lasts two hours, needs registration
# (auto) and has a form draft; form: published gives it a published form version 1 (one required
# long_text field) and a draft with one more optional field, so the event can be published and the draft
# published as version 2. created_at/updated_at of events and form drafts are 2026-10-01T00:00:00Z: an
# untouched event's and form draft's ETag is "1hmhuo3hji000". Staff: persona event_staff scans event_a,
# helper event_manager_a manages it (03 §7.3). Lint rules: the 19 seeded rules of migration 000060.
# BE-028: an event may set capacity, waitlist and mode (manual); kind registration (event, user, status)
# is stored as is (a confirmed one holds its seat, no ticket). event_reg carries the registrations of the
# organiser's matrix rows (student's confirmed reg_student), event_manual the pending application,
# event_full a full event without a waiting list.
# BE-031: event_door has check-in on (event_staff scans it, event_manager_a manages it); reg_door is
# student's confirmed registration with an active ticket (manual code MTRXK001), reg_door_in club_member's
# checked-in one (ticket MTRXK002, check-in checkin_door by event_staff); event_ended (check-in on) ended
# on 2026-10-01, before the matrix clock, so its attendance can be closed.
version: 1
