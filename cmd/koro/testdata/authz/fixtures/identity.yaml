# Fixtures of the identity module (cmd/koro/matrix_identity_test.go). IDs are
# authztest.ID(name). Besides these, the seeder creates an active account for
# every persona and helper user (<name>@matrix.koro.test, password
# matrixReauthPassword) and one mobile session per account with the persona's
# session ID. E-mail tokens carry a literal token (the bodies hold it):
# fixture name without underscores, upper case, padded with A to 52 characters.
version: 1
fixtures:
  user_pending: { kind: user, email: pending@matrix.koro.test, status: pending_email }
  session_student_2: { kind: session, user: student }
  token_verify_pending: { kind: email_token, user: user_pending, purpose: account_email }
  token_reset_student_b: { kind: email_token, user: student_b, purpose: password_reset }
  token_change_student_b: { kind: email_token, user: student_b, purpose: email_change, target_email: student_b.new@matrix.koro.test }
  # BE-016: a suspended account and platform role assignments (02 §5.7, 06 H-17).
  user_suspended: { kind: user, email: suspended@matrix.koro.test, status: suspended }
  role_pending_finance_b: { kind: role_assignment, user: student_b, role: finance_admin, status: pending, requested_by: platform_admin_2 }
  role_moderator_b: { kind: role_assignment, user: student_b, role: moderator, status: active, requested_by: platform_admin_2 }
  role_talent_granted: { kind: role_assignment, user: student_granted, role: talent_auditor, status: active, requested_by: platform_admin_2, approved_by: dpo_2 }
  mfa_challenge_b: { kind: mfa_challenge, user: student_b }
  # BE-018: an e-mail token of student_b's renewal, student documents (edu_document files in the
  # files store, uploaded by their user; attached_to: the verification that holds them) and two
  # pending verifications in the review queue.
  token_edu_student_b: { kind: email_token, user: student_b, purpose: edu_email, target_email: student_b.yeni@ogr.matrix.edu.tr }
  edu_file_student: { kind: edu_document_file, user: student }
  edu_file_b: { kind: edu_document_file, user: student_b, attached_to: edu_pending_b }
  edu_file_pad: { kind: edu_document_file, user: platform_admin, attached_to: edu_pending_pad }
  edu_pending_b: { kind: edu_verification, user: student_b, file: edu_file_b }
  edu_pending_pad: { kind: edu_verification, user: platform_admin, file: edu_file_pad }
