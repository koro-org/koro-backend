  # doc_payee_rejected a payee party's (the admin surface); acct_club_rejected an org submission of club_admin waiting
  # for the first eye on payee_club_a3 (club_a's third payee, its own party: one pending account per payee).
  party_foundation_d: { kind: party, party_kind: payee, legal_type: foundation, status: verified, tax_no: "8642097532" }
