  acct_uni_a: { kind: account, payee: payee_uni_a, iban: TR950001200945200058000003, status: pending_verification,
                submitted_by: university_rep }
  acct_club_a2: { kind: account, payee: payee_club_a2, iban: TR809999900000000000000001, status: pending_approval,
                  submitted_by: club_admin, verified_by: finance_admin_2 }
  acct_admin: { kind: account, payee: payee_draft, iban: TR039999901234567890123456, status: pending_approval,
                submitted_by: platform_admin, admin: true }
