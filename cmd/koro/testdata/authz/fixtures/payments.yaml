# Fixtures of the payments module (cmd/koro/matrix_payments_test.go; BE-041). IDs are authztest.ID(name).
# Collection accounts belong to party_platform (parties' fixture); an active account was created by created_by
# and approved by approved_by (four eyes). coll_default is Koro's active default account (the IBAN orders'
# matrix shows in the payment instructions, hooks.collectionAccount). Transfers arrived at coll_default with
# value date 2026-10-02 and were recorded by entered_by at 2026-10-01T00:00:00Z; a transfer with order: carries
# that order's reference code in its description (ord_a_unpaid → KRA3CMA4HG). A file is an unattached, active
# upload of uploaded_by (purpose transfer_receipt or refund_receipt). ord_c_direct is a model C order of
# company_a whose fee Koro has collected (it waits for the direct payment confirmation); like orders' fixtures
# it is seeded only under the matrix config orders_seed: true.
# BE-043: pay_a is the captured payment of tr_matched (1,250,000 kuruş for ord_a_paid's 1,200,000: 50,000 is an
# overpayment); refunds draw from it: ref_requested (requested by the helper finance_admin_2, finance_admin
# decides), ref_requested_own (requested by finance_admin itself) and ref_approved (requested by the helper,
# approved by finance_admin: any finance admin completes it), all overpayment refunds of 10,000. file_refund_receipt
# is the EFT receipt of a refund.
version: 1
fixtures:
  coll_default: { kind: account, status: active, default: true, iban: TR330006100519786457841326, created_by: finance_admin_2, approved_by: platform_admin_2 }
  coll_active: { kind: account, status: active, iban: TR940001000999990123456789, created_by: finance_admin_2, approved_by: platform_admin_2 }
  # coll_pending_fin: created by finance_admin (the persona may not decide it); coll_pending_fin2 by the helper.
  coll_pending_fin: { kind: account, status: pending_approval, iban: TR190001200000000001234567, created_by: finance_admin }
  coll_pending_fin2: { kind: account, status: pending_approval, iban: TR680006400000000009876543, created_by: finance_admin_2 }
  tr_unmatched: { kind: transfer, account: coll_default, amount: 1200000, order: ord_a_unpaid, entered_by: finance_admin_2, sender_iban: TR100006200000000006295938 }
  tr_unmatched_b: { kind: transfer, account: coll_default, amount: 5000, entered_by: finance_admin_2, sender_iban: TR100006200000000006295938 }
  tr_matched: { kind: transfer, account: coll_default, amount: 1250000, status: matched, matched_order: ord_a_paid, matched_by: finance_admin_2, entered_by: finance_admin_2 }
  # tr_return_requested: requested by the helper (finance_admin decides); tr_return_own: by finance_admin itself.
  tr_return_requested: { kind: transfer, account: coll_default, amount: 7000, status: return_requested, requested_by: finance_admin_2, entered_by: finance_admin_2, sender_iban: TR100006200000000006295938 }
  tr_return_own: { kind: transfer, account: coll_default, amount: 8000, status: return_requested, requested_by: finance_admin, entered_by: finance_admin_2, sender_iban: TR100006200000000006295938 }
  tr_return_approved: { kind: transfer, account: coll_default, amount: 9000, status: return_approved, requested_by: finance_admin_2, approved_by: finance_admin, entered_by: finance_admin_2, sender_iban: TR100006200000000006295938 }
  file_transfer_receipt: { kind: file, purpose: transfer_receipt, uploaded_by: finance_admin }
  file_return_receipt: { kind: file, purpose: refund_receipt, uploaded_by: finance_admin }
  file_direct_evidence: { kind: file, purpose: transfer_receipt, uploaded_by: finance_admin }
  ord_c_direct: { kind: order_c, org: company_a, party: party_buyer_a, placed_by: company_admin }
  pay_a: { kind: payment, transfer: tr_matched, org: company_a, captured_by: finance_admin_2 }
  ref_requested: { kind: refund, payment: pay_a, order: ord_a_paid, amount: 10000, reason: overpayment, requested_by: finance_admin_2 }
  ref_requested_own: { kind: refund, payment: pay_a, order: ord_a_paid, amount: 10000, reason: overpayment, requested_by: finance_admin }
  ref_approved: { kind: refund, payment: pay_a, order: ord_a_paid, amount: 10000, reason: overpayment, status: approved, requested_by: finance_admin_2, approved_by: finance_admin }
  file_refund_receipt: { kind: file, purpose: refund_receipt, uploaded_by: finance_admin }

  ln_receivable: { kind: collection_line }
  file_collect_free: { kind: file, purpose: transfer_receipt, uploaded_by: finance_admin }
  file_collect_pending: { kind: file, purpose: transfer_receipt, uploaded_by: finance_admin_2 }
  tr_collect_free: { kind: transfer, account: coll_default, amount: 10000, receipt: file_collect_free, entered_by: finance_admin }
  tr_collect_pending: { kind: transfer, account: coll_default, amount: 10000, receipt: file_collect_pending, entered_by: finance_admin_2 }
  collection_pending: { kind: collection, transfer: tr_collect_pending, line: ln_receivable, requested_by: finance_admin_2 }

  # BE-132: buyers' refund requests of orders' fixture lines (company_a's, sold by club_a). rr_open waits on ln_a_paid
  # (ord_a_paid; pay_a can fund it) with its evidence file_rr_evidence; rr_review is in review (ln_a_marked);
  # rr_rejected is decided (ln_a_disputed); rr_own was asked by finance_admin (a staff member who is also a buyer's
  # admin: the four eyes of the decisions; ln_a_unpaid); rr_b is company_b's (IDOR; ord_b_unpaid's line, sold by
  # club_a too). file_rr_new is an unattached evidence upload of company_a.
  file_rr_evidence: { kind: rr_file, org: company_a, uploaded_by: company_admin, attached: rr_open }
  file_rr_new: { kind: rr_file, org: company_a, uploaded_by: company_admin }
  rr_open: { kind: refund_request, order: ord_a_paid, line: ln_a_paid, org: company_a, seller: club_a, amount: 100000,
             requested_by: company_admin, evidence: file_rr_evidence }
  rr_review: { kind: refund_request, order: ord_a_marked, line: ln_a_marked, org: company_a, seller: club_a, amount: 50000,
               requested_by: company_admin, status: in_review, reviewed_by: finance_admin_2 }
  rr_rejected: { kind: refund_request, order: ord_a_disputed, line: ln_a_disputed, org: company_a, seller: club_a, amount: 50000,
                 requested_by: company_admin, status: rejected, decided_by: finance_admin_2 }
  rr_own: { kind: refund_request, order: ord_a_unpaid, line: ln_a_unpaid, org: company_a, seller: club_a, amount: 1000,
            requested_by: finance_admin }
  rr_b: { kind: refund_request, order: ord_b_unpaid, line: ln_b_unpaid, org: company_b, seller: club_a, amount: 1000,
          requested_by: other_company_member }

  # BE-154b: records whose receipt or evidence the scan rejected after the upload (scan: infected); the replacements of
  # the matrix are file_transfer_receipt, file_return_receipt, file_direct_evidence, file_refund_receipt and file_rr_new.
  # tr_returned's return went through both eyes and its receipt; pay_direct is a model C direct payment (of
  # ord_a_rejected_ev, no other payment) with its evidence; ref_completed is a completed goodwill refund of pay_a (no
  # line, no money held); rr_ev_rejected waits on ln_a_rejected_ev (orders' fixture) with its rejected evidence.
  file_receipt_rejected: { kind: file, purpose: transfer_receipt, uploaded_by: finance_admin, scan: infected }
  tr_receipt_rejected: { kind: transfer, account: coll_default, amount: 6000, receipt: file_receipt_rejected, entered_by: finance_admin_2 }
  file_return_rejected: { kind: file, purpose: refund_receipt, uploaded_by: finance_admin, scan: infected }
  tr_returned: { kind: transfer, account: coll_default, amount: 9500, status: returned, requested_by: finance_admin_2,
                 approved_by: finance_admin, return_receipt: file_return_rejected, entered_by: finance_admin_2,
                 sender_iban: TR100006200000000006295938 }
  file_direct_rejected: { kind: file, purpose: transfer_receipt, uploaded_by: finance_admin, scan: infected }
  pay_direct: { kind: payment, order: ord_a_rejected_ev, org: company_a, captured_by: finance_admin, evidence: file_direct_rejected }
  file_refund_rejected: { kind: file, purpose: refund_receipt, uploaded_by: finance_admin, scan: infected }
  ref_completed: { kind: refund, payment: pay_a, order: ord_a_paid, amount: 10000, reason: goodwill, status: completed,
                   requested_by: finance_admin_2, approved_by: finance_admin, receipt: file_refund_rejected }
  file_rr_rejected: { kind: rr_file, org: company_a, uploaded_by: company_admin, attached: rr_ev_rejected, scan: infected }
  rr_ev_rejected: { kind: refund_request, order: ord_a_rejected_ev, line: ln_a_rejected_ev, org: company_a, seller: club_a,
                    amount: 1000, requested_by: company_admin, evidence: file_rr_rejected }
