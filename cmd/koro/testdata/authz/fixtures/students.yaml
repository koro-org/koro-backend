# Fixtures of the students module (cmd/koro/matrix_students_test.go; BE-023). IDs are authztest.ID(name).
# experience_student is the persona student's experience (with its profile at uni_a): the IDOR
# target of updateMyExperience / deleteMyExperience. notice_discovery is the published consent text
# of discovery_profile in the consent store; bodies/students/update_privacy_discoverable.json holds
# the SHA-256 of its body (matrixDiscoveryText).
# BE-025: cv_student is the persona student's current CV (with its profile); its file is files'
# fixture file_attached (purpose cv, uploaded by student, active, served while the scan is not
# required).
# BE-046: grant_granted_a is company_a's active level 3 grant on helper student_granted (with a
# profile, no CV); grant_student_b is company_b's on the persona student (whose CV is cv_student).
version: 1
fixtures:
  experience_student: { kind: experience, owner: student }
  notice_discovery: { kind: consent_text, purpose: discovery_profile }
  cv_student: { kind: cv, owner: student, file: file_attached }
  grant_granted_a: { kind: grant, student: student_granted, company: company_a }
  grant_student_b: { kind: grant, student: student, company: company_b }
