# Authz matrix of the identity module (03 §5.1, 04 §2.1; BE-014, BE-016, BE-018). 37 operations × 18 personas.
# Public (P) operations are the same for every persona, a signed-in caller included (the
# operation ignores the session; 06 H-25). O cells: /me/... and /auth/sessions/current act on
# the caller's own account and sessions only; another user's session is 404. password.change
# and email_change.request are O · R: the bodies carry the matrix password as proof
# (current_password / reauth.password); the missing and wrong proofs are scenarios.
# BE-016: identity_mfa (none | enrolled | enabled) gives every matrix account an unconfirmed or a
# confirmed TOTP with one secret; its code at the container clock is in the bodies (mfa_*.json).
# Staff cells need an MFA-verified session (k-mfa); the personas' sessions are (03 §7.3).
# BE-018: every verified student persona has a verified .edu.tr row (<name>@matrix.edu.tr, its
# university); the matrix domain resolver knows matrix.edu.tr and its subdomains (uni_a).
# Student documents are edu_document files in the files store (matrix_identity_test.go).
version: 1
config:
  identity_mfa: none
groups:
  mfa_roles: [university_rep, company_admin, other_company_member, moderator, support, dpo, platform_admin,
              finance_admin, talent_auditor]
  no_mfa_role: [user_unverified, student, student_minor, club_member, club_admin, other_club_admin, event_staff,
                company_member]
  not_staff: [user_unverified, student, student_minor, club_member, club_admin, other_club_admin, event_staff,
              university_rep, company_member, company_admin, other_company_member]
  not_student: [user_unverified, student_minor, club_member, club_admin, other_club_admin, event_staff,
                university_rep, company_member, company_admin, other_company_member, moderator, support, dpo,
                platform_admin, finance_admin, talent_auditor]
  edu_bystanders: [moderator, dpo, finance_admin, talent_auditor]
operations:
  registerAccount:
    method: POST
    path: /api/v1/auth/register
    action: identity.account.register
    public: true
    body: bodies/identity/register.json
    note: registration is anonymous by design (P); 202 whether or not the address exists (no enumeration)
    expect: { "@all": 202 }
    variants:
      - name: with_consent
        body: bodies/identity/register_with_consent.json
        note: an optional commercial consent recorded in the registration transaction
        expect: { "@all": 202 }
      - name: taken_address
        body: bodies/identity/register_taken.json
        note: a registered address answers exactly like a new one (ASVS 6.3.8)
        expect: { "@all": 202 }

  createSession:
    method: POST
    path: /api/v1/auth/sessions
    action: identity.session.create
    public: true
    body: bodies/identity/login.json
    note: login is anonymous by design (P); student_b's credentials
    expect: { "@all": 200 }
    variants:
      - name: mfa_account
        config: { identity_mfa: enabled }
        note: an MFA account gets a challenge (200 mfa_required), no session (03 §6.4-1)
        expect: { "@all": 200 }
      - name: wrong_password
        body: bodies/identity/login_wrong.json
        note: identity.invalid_credentials (same answer as an unknown address)
        expect: { "@all": 401 }
      - name: unknown_address
        body: bodies/identity/login_unknown.json
        note: identity.invalid_credentials (no enumeration)
        expect: { "@all": 401 }
      - name: pending_email
        body: bodies/identity/login_pending.json
        note: right password, unverified address → identity.email_not_verified (03 §2.2-3)
        expect: { "@all": 403 }

  deleteCurrentSession:
    method: DELETE
    path: /api/v1/auth/sessions/current
    action: identity.session.delete_current
    expect: { anonymous: 401, "@signed_in": 204 }

  listMySessions:
    method: GET
    path: /api/v1/me/sessions
    action: identity.session.list_own
    expect: { anonymous: 401, "@signed_in": 200 }

  revokeMySession:
    method: DELETE
    path: /api/v1/me/sessions/{session_id}
    action: identity.session.revoke_own
    path_params: { session_id: session_student_2 }
    note: the second session of student; anyone else's view of it is 404 (O cell)
    expect:
      anonymous: 401
      student: 204
      user_unverified: 404
      student_minor: 404
      club_member: 404
      club_admin: 404
      other_club_admin: 404
      event_staff: 404
      university_rep: 404
      company_member: 404
      company_admin: 404
      other_company_member: 404
      moderator: 404
      support: 404
      dpo: 404
      platform_admin: 404
      finance_admin: 404
      talent_auditor: 404
    variants:
      - name: missing
        path_params: { session_id: "literal:00000000-0000-7000-8000-0000000000e1" }
        expect: { anonymous: 401, "@signed_in": 404 }

  confirmEmail:
    method: POST
    path: /api/v1/auth/email-verifications/confirm
    action: identity.email.verify
    public: true
    body: bodies/identity/verify.json
    note: the token in the e-mail is the credential (P); single use
    expect: { "@all": 204 }

  resendEmailVerification:
    method: POST
    path: /api/v1/auth/email-verifications/resend
    action: identity.email.resend_verification
    public: true
    body: bodies/identity/resend.json
    note: anonymous by design (P); always 202 (no enumeration)
    expect: { "@all": 202 }

  requestPasswordReset:
    method: POST
    path: /api/v1/auth/password-resets
    action: identity.password.reset_request
    public: true
    body: bodies/identity/reset_request.json
    note: anonymous by design (P); always 202 (no enumeration)
    expect: { "@all": 202 }

  confirmPasswordReset:
    method: POST
    path: /api/v1/auth/password-resets/confirm
    action: identity.password.reset
    public: true
    body: bodies/identity/reset_confirm.json
    note: the reset token is the credential (P); every session of student_b closes
    expect: { "@all": 204 }

  changeMyPassword:
    method: POST
    path: /api/v1/me/password
    action: identity.password.change
    body: bodies/identity/change_password.json
    expect: { anonymous: 401, "@signed_in": 204 }

  requestEmailChange:
    method: POST
    path: /api/v1/me/email-change
    action: identity.email_change.request
    body: bodies/identity/email_change.json
    expect: { anonymous: 401, "@signed_in": 202 }

  confirmEmailChange:
    method: POST
    path: /api/v1/auth/email-change/confirm
    action: identity.email_change.confirm
    public: true
    body: bodies/identity/email_change_confirm.json
    note: the token sent to the new address is the credential (P)
    expect: { "@all": 204 }

  getMe:
    method: GET
    path: /api/v1/me
    action: identity.account.read_own
    expect: { anonymous: 401, "@signed_in": 200 }

  updateMe:
    method: PATCH
    path: /api/v1/me
    action: identity.account.update_own
    body: bodies/identity/update_me.json
    expect: { anonymous: 401, "@signed_in": 200 }

  completeMfaLogin:
    method: POST
    path: /api/v1/auth/sessions/mfa
    action: identity.session.create
    public: true
    config: { identity_mfa: enabled }
    body: bodies/identity/mfa_login.json
    note: the challenge of student_b's password step is the credential (P); single use and a wrong code are the
      mfa_login scenario
    expect: { "@all": 200 }
    variants:
      - name: unknown_challenge
        body: bodies/identity/mfa_login_unknown.json
        note: identity.mfa_login_failed, the same answer as a wrong code or an expired challenge
        expect: { "@all": 401 }

  enrollTotp:
    method: POST
    path: /api/v1/me/mfa/totp
    action: identity.mfa.enroll
    body: bodies/identity/role_reauth.json
    note: O · R (06 H-46) - reauth.password; missing proof is the mfa_enroll_reauth scenario
    expect: { anonymous: 401, "@signed_in": 200 }
    variants:
      - name: already_enabled
        config: { identity_mfa: enabled }
        note: TOTP is on; the secret is never shown again (identity.mfa_already_enabled)
        expect: { anonymous: 401, "@signed_in": 409 }

  confirmTotp:
    method: POST
    path: /api/v1/me/mfa/totp/confirm
    action: identity.mfa.confirm
    config: { identity_mfa: enrolled }
    body: bodies/identity/mfa_confirm.json
    note: O · R (06 H-46) - the code and reauth.password
    expect: { anonymous: 401, "@signed_in": 200 }

  verifyMfa:
    method: POST
    path: /api/v1/me/mfa/verify
    action: identity.mfa.verify
    config: { identity_mfa: enabled }
    body: bodies/identity/mfa_code.json
    expect: { anonymous: 401, "@signed_in": 204 }

  disableTotp:
    method: POST
    path: /api/v1/me/mfa/totp/disable
    action: identity.mfa.disable
    config: { identity_mfa: enabled }
    body: bodies/identity/mfa_reauth_totp.json
    note: 03 §5.1 k1 - a user holding an MFA role cannot turn TOTP off (409 identity.mfa_required_by_role)
    expect: { anonymous: 401, "@no_mfa_role": 204, "@mfa_roles": 409 }

  regenerateRecoveryCodes:
    method: POST
    path: /api/v1/me/mfa/recovery-codes
    action: identity.mfa_recovery.regenerate
    config: { identity_mfa: enabled }
    body: bodies/identity/mfa_reauth_totp.json
    expect: { anonymous: 401, "@signed_in": 200 }

  adminSearchUsers:
    method: GET
    path: /api/v1/admin/users
    action: identity.user.search
    query: { q: student_b@matrix.koro.test }
    expect: { anonymous: 401, "@not_staff": 403, moderator: 403, support: 200, dpo: 200, platform_admin: 200,
              finance_admin: 403, talent_auditor: 403 }

  adminGetUser:
    method: GET
    path: /api/v1/admin/users/{user_id}
    action: identity.user.read
    path_params: { user_id: student_b }
    expect: { anonymous: 401, "@not_staff": 403, moderator: 403, support: 200, dpo: 200, platform_admin: 200,
              finance_admin: 403, talent_auditor: 403 }
    variants:
      - name: missing
        path_params: { user_id: "literal:00000000-0000-7000-8000-0000000000e3" }
        note: the admin surface decides before it reads (03 §3.2); only staff with the action learn it is missing
        expect: { anonymous: 401, "@not_staff": 403, moderator: 403, support: 404, dpo: 404, platform_admin: 404,
                  finance_admin: 403, talent_auditor: 403 }

  adminSuspendUser:
    method: POST
    path: /api/v1/admin/users/{user_id}/suspend
    action: identity.user.suspend
    path_params: { user_id: student_b }
    body: bodies/identity/admin_reason.json
    expect: { anonymous: 401, "@not_staff": 403, moderator: 403, support: 403, dpo: 403, platform_admin: 200,
              finance_admin: 403, talent_auditor: 403 }

  adminUnsuspendUser:
    method: POST
    path: /api/v1/admin/users/{user_id}/unsuspend
    action: identity.user.suspend
    path_params: { user_id: user_suspended }
    body: bodies/identity/admin_reason.json
    expect: { anonymous: 401, "@not_staff": 403, moderator: 403, support: 403, dpo: 403, platform_admin: 200,
              finance_admin: 403, talent_auditor: 403 }

  adminRevokeUserSessions:
    method: POST
    path: /api/v1/admin/users/{user_id}/sessions/revoke
    action: identity.user.revoke_sessions
    path_params: { user_id: student_b }
    body: bodies/identity/admin_reason.json
    expect: { anonymous: 401, "@not_staff": 403, moderator: 403, support: 204, dpo: 403, platform_admin: 204,
              finance_admin: 403, talent_auditor: 403 }

  adminResetUserMfa:
    method: POST
    path: /api/v1/admin/users/{user_id}/mfa/reset
    action: identity.user.reset_mfa
    path_params: { user_id: student_b }
    body: bodies/identity/admin_reset_mfa.json
    expect: { anonymous: 401, "@not_staff": 403, moderator: 403, support: 403, dpo: 403, platform_admin: 204,
              finance_admin: 403, talent_auditor: 403 }
    variants:
      - name: own_account
        path_params: { user_id: platform_admin }
        note: k2 / Y6 - nobody resets their own MFA
        expect: { anonymous: 401, "@signed_in": 403 }

  adminListPlatformRoles:
    method: GET
    path: /api/v1/admin/platform-roles
    action: identity.platform_role.list
    expect: { anonymous: 401, "@not_staff": 403, moderator: 403, support: 403, dpo: 200, platform_admin: 200,
              finance_admin: 403, talent_auditor: 403 }

  adminGrantPlatformRole:
    method: POST
    path: /api/v1/admin/platform-roles
    action: identity.platform_role.grant
    body: bodies/identity/grant_role.json
    note: moderator takes effect at once (one admin, 02 §5.7); privileged roles are the four_eyes_grant scenario
    expect: { anonymous: 401, "@not_staff": 403, moderator: 403, support: 403, dpo: 403, platform_admin: 201,
              finance_admin: 403, talent_auditor: 403 }
    variants:
      - name: privileged_request
        body: bodies/identity/grant_role_finance.json
        note: finance_admin opens a pending request (06 H-17)
        expect: { anonymous: 401, "@not_staff": 403, moderator: 403, support: 403, dpo: 403, platform_admin: 201,
                  finance_admin: 403, talent_auditor: 403 }
      - name: self
        body: bodies/identity/grant_role_self.json
        note: Y6 - nobody grants a role to themselves
        expect: { anonymous: 401, "@signed_in": 403 }

  adminApprovePlatformRole:
    method: POST
    path: /api/v1/admin/platform-roles/{assignment_id}/approve
    action: identity.platform_role.grant
    path_params: { assignment_id: role_pending_finance_b }
    body: bodies/identity/role_reauth.json
    note: the second eye (06 H-17, T-79); the request is platform_admin_2's
    expect: { anonymous: 401, "@not_staff": 403, moderator: 403, support: 403, dpo: 403, platform_admin: 200,
              finance_admin: 403, talent_auditor: 403 }
    variants:
      - name: missing
        path_params: { assignment_id: "literal:00000000-0000-7000-8000-0000000000e4" }
        expect: { anonymous: 401, "@not_staff": 403, moderator: 403, support: 403, dpo: 403, platform_admin: 404,
                  finance_admin: 403, talent_auditor: 403 }

  adminRevokePlatformRole:
    method: POST
    path: /api/v1/admin/platform-roles/{assignment_id}/revoke
    action: identity.platform_role.revoke
    path_params: { assignment_id: role_moderator_b }
    body: bodies/identity/revoke_role.json
    expect: { anonymous: 401, "@not_staff": 403, moderator: 403, support: 403, dpo: 403, platform_admin: 200,
              finance_admin: 403, talent_auditor: 403 }

  # ---- BE-018: student verification
  startEduVerification:
    method: POST
    path: /api/v1/me/edu-verifications
    action: identity.edu_verification.start
    body: bodies/identity/edu_start.json
    note: O - a link to the .edu.tr address (renewal for verified students); 202 also for an address that verifies another account
    expect: { anonymous: 401, "@signed_in": 202 }
    variants:
      - name: unknown_domain
        body: bodies/identity/edu_start_unknown.json
        note: a domain hooks.domainResolver does not know - identity.edu_domain_unknown, the document path instead
        expect: { anonymous: 401, "@signed_in": 422 }
      - name: not_edu_tr
        body: bodies/identity/edu_start_not_edu.json
        expect: { anonymous: 401, "@signed_in": 422 }

  confirmEduVerification:
    method: POST
    path: /api/v1/auth/edu-verifications/confirm
    action: identity.edu_verification.confirm
    public: true
    body: bodies/identity/edu_confirm.json
    note: P - the token names the account (student_b renews; the old row is superseded); single use is a scenario
    expect: { "@all": 204 }
    variants:
      - name: invalid_token
        body: bodies/identity/edu_confirm_invalid.json
        expect: { "@all": 422 }

  submitEduDocument:
    method: POST
    path: /api/v1/me/edu-verifications/document
    action: identity.edu_verification.submit_document
    body: bodies/identity/edu_document.json
    note: O - the document is the student persona's edu_document upload; anyone else's own account gets 422 identity.invalid_edu_document (not their file)
    expect: { anonymous: 401, student: 202, "@not_student": 422 }

  getMyEduVerification:
    method: GET
    path: /api/v1/me/edu-verification
    action: identity.edu_verification.read_own
    expect: { anonymous: 401, "@signed_in": 200 }

  adminListEduVerifications:
    method: GET
    path: /api/v1/admin/edu-verifications
    action: identity.edu_verification.list
    expect: { anonymous: 401, "@not_staff": 403, "@edu_bystanders": 403, support: 200, platform_admin: 200 }

  adminGetEduDocument:
    method: GET
    path: /api/v1/admin/edu-verifications/{verification_id}/document
    action: identity.edu_verification.review
    path_params: { verification_id: edu_pending_b }
    note: every download is audited; the URL lives 5 minutes
    expect: { anonymous: 401, "@not_staff": 403, "@edu_bystanders": 403, support: 200, platform_admin: 200 }
    variants:
      - name: own_document
        path_params: { verification_id: edu_pending_pad }
        note: Y6 - nobody reviews their own student document
        expect: { anonymous: 401, "@not_staff": 403, "@edu_bystanders": 403, support: 200, platform_admin: 403 }
      - name: missing
        path_params: { verification_id: "literal:00000000-0000-7000-8000-0000000000e5" }
        note: the gate decides before the row is read; only reviewers learn it is missing
        expect: { anonymous: 401, "@not_staff": 403, "@edu_bystanders": 403, support: 404, platform_admin: 404 }

  adminDecideEduVerification:
    method: POST
    path: /api/v1/admin/edu-verifications/{verification_id}/decision
    action: identity.edu_verification.review
    path_params: { verification_id: edu_pending_b }
    body: bodies/identity/edu_decide_verified.json
    expect: { anonymous: 401, "@not_staff": 403, "@edu_bystanders": 403, support: 200, platform_admin: 200 }
    variants:
      - name: rejected
        body: bodies/identity/edu_decide_rejected.json
        expect: { anonymous: 401, "@not_staff": 403, "@edu_bystanders": 403, support: 200, platform_admin: 200 }
      - name: own_document
        path_params: { verification_id: edu_pending_pad }
        note: Y6 (03 §5.1) - edu_verifications_reviewer_chk is the second layer
        expect: { anonymous: 401, "@not_staff": 403, "@edu_bystanders": 403, support: 200, platform_admin: 403 }
      - name: missing
        path_params: { verification_id: "literal:00000000-0000-7000-8000-0000000000e6" }
        expect: { anonymous: 401, "@not_staff": 403, "@edu_bystanders": 403, support: 404, platform_admin: 404 }
