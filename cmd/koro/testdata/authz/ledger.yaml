# Authz matrix of the ledger module (03 §5.17, 04 §2.17; BE-039, BE-044, BE-129, BE-154). 15 operations × 18 personas.
# Admin surface (03 §7.2-3): everyone without the role → 403, nothing is read first. Org surface
# (/orgs/{org_id}/payees/.../balance, /orgs/{org_id}/payouts; 03 §3.6 "Payee, banka hesabı, payout,
# hakediş bakiyesi"): members of the org without the role → 403, non-members → 404, every platform
# role sees it (403 unless platform_admin / finance_admin). platform_admin and finance_admin sessions
# are MFA verified (03 §7.3); the policy test and scenarios/ledger.yaml cover the MFA-less session.
# Four eyes (03 §6.1): po_pending was created by finance_admin_2, po_own by finance_admin; the
# approval carries the matrix password (R, identity fixtures). Fixtures: fixtures/ledger.yaml
# (matrix_ledger_test.go); the payout fixtures are seeded only under ledger_seed: true (set by the
# BE-044 operations and scenarios): club_a's open payouts would block orgs' closeOrg checks.
version: 1
config:
  ledger_seed: false
groups:
  # signed-in users without a platform role.
  no_platform_role: [user_unverified, student, student_minor, club_member, club_admin, other_club_admin,
                     event_staff, university_rep, company_member, company_admin, other_company_member]
  # platform roles without a ledger cell.
  other_staff: [moderator, support, dpo, talent_auditor]
  # signed-in users without a membership in club_a.
  outsiders_club_a: [user_unverified, student, student_minor, other_club_admin, event_staff, university_rep,
                     company_member, company_admin, other_company_member]
  # signed-in users without a membership in uni_a.
  outsiders_uni_a: [user_unverified, student, student_minor, club_member, club_admin, other_club_admin,
                    event_staff, company_member, company_admin, other_company_member]

operations:
  adminListLedgerTransactions:
    method: GET
    path: /api/v1/admin/ledger/transactions
    action: ledger.journal.list
    expect:
      anonymous: 401
      "@no_platform_role": 403   # admin surface: 403 before reading (03 §7.2-3)
      "@other_staff": 403
      platform_admin: 200
      finance_admin: 200
    variants:
      - name: kind_filter
        query: { kind: order_allocated, ref_type: order }
        expect:
          anonymous: 401
          "@no_platform_role": 403
          "@other_staff": 403
          platform_admin: 200
          finance_admin: 200
      - name: ref_filter
        query: { ref_id: "{{fixture:ledger_payment_a}}", occurred_from: "2020-01-01" }
        note: one business event's transactions in a date window
        expect:
          anonymous: 401
          "@no_platform_role": 403
          "@other_staff": 403
          platform_admin: 200
          finance_admin: 200
      - name: unknown_ref
        query: { ref_id: "00000000-0000-7000-8000-0000000000ab" }
        note: an unknown reference is an empty page, not 404 (a filter, not a resource)
        expect:
          anonymous: 401
          "@no_platform_role": 403
          "@other_staff": 403
          platform_admin: 200
          finance_admin: 200

  getPayeeBalance:
    method: GET
    path: /api/v1/orgs/{org_id}/payees/{payee_id}/balance
    action: ledger.balance.read
    config: { ledger_seed: true }
    path_params: { org_id: club_a, payee_id: payee_club_a }
    expect:
      anonymous: 401
      "@outsiders_club_a": 404
      club_member: 403
      club_admin: 200
      "@other_staff": 403
      platform_admin: 200
      finance_admin: 200
    variants:
      - name: payee_of_other_org
        path_params: { org_id: uni_a, payee_id: payee_club_a }
        note: club_a's payee through uni_a's surface — 404 for everyone allowed on uni_a (06 H-38)
        expect:
          anonymous: 401
          "@outsiders_uni_a": 404
          university_rep: 404
          "@other_staff": 403
          platform_admin: 404
          finance_admin: 404

  listOrgPayouts:
    method: GET
    path: /api/v1/orgs/{org_id}/payouts
    action: ledger.payout.list
    config: { ledger_seed: true }
    path_params: { org_id: club_a }
    expect:
      anonymous: 401
      "@outsiders_club_a": 404
      club_member: 403
      club_admin: 200
      "@other_staff": 403
      platform_admin: 200
      finance_admin: 200
    variants:
      - name: university
        path_params: { org_id: uni_a }
        expect:
          anonymous: 401
          "@outsiders_uni_a": 404
          university_rep: 200
          "@other_staff": 403
          platform_admin: 200
          finance_admin: 200

  getOrgPayout:
    method: GET
    path: /api/v1/orgs/{org_id}/payouts/{payout_id}
    action: ledger.payout.read
    config: { ledger_seed: true }
    path_params: { org_id: club_a, payout_id: po_paid }
    note: the paid payout with its receipt URL; the IBAN masked
    expect:
      anonymous: 401
      "@outsiders_club_a": 404
      club_member: 403
      club_admin: 200
      "@other_staff": 403
      platform_admin: 200
      finance_admin: 200
    variants:
      - name: payout_of_other_org
        path_params: { org_id: club_a, payout_id: po_uni }
        note: uni_a's payout through club_a's surface — 404 after authz (06 H-38)
        expect:
          anonymous: 401
          "@outsiders_club_a": 404
          club_member: 403
          club_admin: 404
          "@other_staff": 403
          platform_admin: 404
          finance_admin: 404

  downloadOrgPayoutReceipt:
    method: GET
    path: /api/v1/orgs/{org_id}/payouts/{payout_id}/receipt
    action: ledger.payout.read
    config: { ledger_seed: true }
    path_params: { org_id: club_a, payout_id: po_paid }
    note: BE-127 — the paid payout's receipt URL, audited per download
    expect:
      anonymous: 401
      "@outsiders_club_a": 404
      club_member: 403
      club_admin: 200
      "@other_staff": 403
      platform_admin: 200
      finance_admin: 200
    variants:
      - name: unpaid_payout
        path_params: { org_id: club_a, payout_id: po_approved }
        note: an approved payout has no receipt yet — 409 after authz
        expect:
          anonymous: 401
          "@outsiders_club_a": 404
          club_member: 403
          club_admin: 409
          "@other_staff": 403
          platform_admin: 409
          finance_admin: 409
      - name: payout_of_other_org
        path_params: { org_id: club_a, payout_id: po_uni }
        expect:
          anonymous: 401
          "@outsiders_club_a": 404
          club_member: 403
          club_admin: 404
          "@other_staff": 403
          platform_admin: 404
          finance_admin: 404

  adminListPayables:
    method: GET
    path: /api/v1/admin/payables
    action: ledger.payable.list
    config: { ledger_seed: true }
    expect:
      anonymous: 401
      "@no_platform_role": 403
      "@other_staff": 403
      platform_admin: 403
      finance_admin: 200
    variants:
      - name: one_payee_as_of
        query: { payee_id: "{{fixture:payee_club_a}}", as_of: "2026-10-03" }
        expect:
          anonymous: 401
          "@no_platform_role": 403
          "@other_staff": 403
          platform_admin: 403
          finance_admin: 200

  adminListPayouts:
    method: GET
    path: /api/v1/admin/payouts
    action: ledger.payout.list
    config: { ledger_seed: true }
    expect:
      anonymous: 401
      "@no_platform_role": 403
      "@other_staff": 403
      platform_admin: 200
      finance_admin: 200
    variants:
      - name: approval_queue
        query: { status: pending_approval }
        expect:
          anonymous: 401
          "@no_platform_role": 403
          "@other_staff": 403
          platform_admin: 200
          finance_admin: 200

  adminGetPayout:
    method: GET
    path: /api/v1/admin/payouts/{payout_id}
    action: ledger.payout.read
    config: { ledger_seed: true }
    path_params: { payout_id: po_pending }
    expect:
      anonymous: 401
      "@no_platform_role": 403
      "@other_staff": 403
      platform_admin: 200
      finance_admin: 200

  adminRevealPayoutIban:
    method: GET
    path: /api/v1/admin/payouts/{payout_id}/iban
    action: ledger.iban.reveal
    config: { ledger_seed: true }
    path_params: { payout_id: po_pending }
    headers: { X-Koro-Access-Reason: "Matris: hakediş EFT'si bankaya yazılacak" }
    note: BE-129 the payout's frozen IBAN (masked in every list and detail); reason required, audited
    expect:
      anonymous: 401
      "@no_platform_role": 403
      "@other_staff": 403
      platform_admin: 200
      finance_admin: 200
    variants:
      - name: unknown_payout
        path_params: { payout_id: "literal:00000000-0000-7000-8000-0000000000b1" }
        expect:
          anonymous: 401
          "@no_platform_role": 403
          "@other_staff": 403
          platform_admin: 404
          finance_admin: 404

  adminListPayeeReceivables:
    method: GET
    path: /api/v1/admin/payees/{payee_id}/receivables
    action: ledger.balance.read
    config: { ledger_seed: true }
    path_params: { payee_id: payee_club_a }
    note: BE-129 the open receivable lines a collection claims (06 H-59); the balance read on the admin surface
    expect:
      anonymous: 401
      "@no_platform_role": 403
      "@other_staff": 403
      platform_admin: 200
      finance_admin: 200
    variants:
      - name: unknown_payee
        path_params: { payee_id: "literal:00000000-0000-7000-8000-0000000000b2" }
        expect:
          anonymous: 401
          "@no_platform_role": 403
          "@other_staff": 403
          platform_admin: 404
          finance_admin: 404

  adminCreatePayout:
    method: POST
    path: /api/v1/admin/payouts
    action: ledger.payout.create
    idempotency: required
    config: { ledger_seed: true }
    body: bodies/ledger/create.json
    note: finance_admin takes payee_club_a's free line (ln_po_free) into a pending payout
    expect:
      anonymous: 401
      "@no_platform_role": 403
      "@other_staff": 403
      platform_admin: 403
      finance_admin: 201
    variants:
      - name: held_line
        body: bodies/ledger/create_held_line.json
        note: ln_po_pending is in po_pending — 409 ledger.line_not_payable
        expect:
          anonymous: 401
          "@no_platform_role": 403
          "@other_staff": 403
          platform_admin: 403
          finance_admin: 409

  adminApprovePayout:
    method: POST
    path: /api/v1/admin/payouts/{payout_id}/approve
    action: ledger.payout.approve
    config: { ledger_seed: true }
    path_params: { payout_id: po_pending }
    body: bodies/ledger/approve.json
    note: second eye — finance_admin approves finance_admin_2's payout (R with the matrix password)
    expect:
      anonymous: 401
      "@no_platform_role": 403
      "@other_staff": 403
      platform_admin: 403     # fin only (03 §5.17)
      finance_admin: 200
    variants:
      - name: own_payout
        path_params: { payout_id: po_own }
        note: four eyes — finance_admin created po_own and may not approve it
        expect:
          anonymous: 401
          "@no_platform_role": 403
          "@other_staff": 403
          platform_admin: 403
          finance_admin: 403
      - name: already_approved
        path_params: { payout_id: po_approved }
        note: only a payout waiting for approval — 409 ledger.invalid_state
        expect:
          anonymous: 401
          "@no_platform_role": 403
          "@other_staff": 403
          platform_admin: 403
          finance_admin: 409

  adminMarkPayoutPaid:
    method: POST
    path: /api/v1/admin/payouts/{payout_id}/mark-paid
    action: ledger.payout.mark_paid
    config: { ledger_seed: true }
    path_params: { payout_id: po_approved }
    body: bodies/ledger/mark_paid.json
    note: the EFT with its receipt (receipt_a) and bank reference — ledger, lines and outbox in one transaction
    expect:
      anonymous: 401
      "@no_platform_role": 403
      "@other_staff": 403
      platform_admin: 403
      finance_admin: 200
    variants:
      - name: not_approved
        path_params: { payout_id: po_pending }
        note: only an approved payout is paid — 409 ledger.invalid_state
        expect:
          anonymous: 401
          "@no_platform_role": 403
          "@other_staff": 403
          platform_admin: 403
          finance_admin: 409

  adminReplacePayoutReceipt:
    method: POST
    path: /api/v1/admin/payouts/{payout_id}/replace-receipt
    action: ledger.payout.mark_paid
    config: { ledger_seed: true }
    path_params: { payout_id: po_rejected }
    body: bodies/ledger/replace_receipt.json
    note: a paid payout whose receipt the scan rejected gets a new one (receipt_a); the same people as mark-paid (BE-154)
    expect:
      anonymous: 401
      "@no_platform_role": 403
      "@other_staff": 403
      platform_admin: 403
      finance_admin: 200
    variants:
      - name: receipt_not_rejected
        path_params: { payout_id: po_paid }
        note: a receipt that was not rejected stays — 409 files.not_rejected
        expect:
          anonymous: 401
          "@no_platform_role": 403
          "@other_staff": 403
          platform_admin: 403
          finance_admin: 409

  adminMarkPayoutFailed:
    method: POST
    path: /api/v1/admin/payouts/{payout_id}/mark-failed
    action: ledger.payout.mark_failed
    config: { ledger_seed: true }
    path_params: { payout_id: po_approved }
    body: bodies/ledger/mark_failed.json
    note: the transfer failed — the line is payable again
    expect:
      anonymous: 401
      "@no_platform_role": 403
      "@other_staff": 403
      platform_admin: 403
      finance_admin: 200

  adminCancelPayout:
    method: POST
    path: /api/v1/admin/payouts/{payout_id}/cancel
    action: ledger.payout.cancel
    config: { ledger_seed: true }
    path_params: { payout_id: po_pending }
    body: bodies/ledger/cancel.json
    expect:
      anonymous: 401
      "@no_platform_role": 403
      "@other_staff": 403
      platform_admin: 403
      finance_admin: 200
    variants:
      - name: paid
        path_params: { payout_id: po_paid }
        note: a paid payout is final — 409 ledger.invalid_state
        expect:
          anonymous: 401
          "@no_platform_role": 403
          "@other_staff": 403
          platform_admin: 403
          finance_admin: 409
