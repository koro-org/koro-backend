# Authz matrix of the orders module (03 §5.15, 04 §2.15; BE-040, BE-093). 12 operations × 18 personas.
# /orgs/{org_id}/orders and /orgs/{org_id}/sales are the org's management surface (03 §3.6, §7.6): non-members 404,
# members without the cell and every platform role 403. /orders/{order_id} and /order-lines/{line_id} are resource
# surfaces: an order (a line) is visible to its buyer's members, to the members of a seller org of its lines and to
# every platform role; anyone else gets 404 (03 k26). Cells: create cma S·k25 (company_admin; the recruiter has no
# purchase); list cmm S, cma S; read the buyer's cmm, cma, the seller's club_admin (k26 view), sup, pad, fin;
# payment instructions cmm, cma, fin; cancel cma, pad, fin; sales cla S, uni S, pad, fin; mark cla S, uni S·k-cs,
# pad; read the delivery evidence (BE-093) the buyer's cma S, the seller's cla S, uni S·k-cs, pad, fin; confirm and
# dispute cma S; resolve pad, fin (admin surface: 403 before reading); admin list sup, pad, fin.
# MFA (cma, uni, sup, pad, fin), the delivery states, k25 and idempotency are scenarios (scenarios/orders.yaml).
# Fixtures: fixtures/orders.yaml (the orders of company_a sold by club_a), catalog's off_a_active, parties'
# party_buyer_a / party_buyer_b. The fixture orders are seeded only under config orders_seed: true (set by the
# operations and scenarios that need them): open orders of company_a would block the orgs matrix's closeOrg.
version: 1
config:
  orders_seed: false
groups:
  # signed-in users outside company_a and club_a without a platform role (company_a's orders sold by club_a).
  outsiders_order_a: [user_unverified, student, student_minor, other_club_admin, event_staff, university_rep, other_company_member]
  # signed-in users outside club_a without a platform role.
  outsiders_club_a: [user_unverified, student, student_minor, other_club_admin, event_staff, university_rep, company_member,
                     company_admin, other_company_member]
  # signed-in users outside uni_a without a platform role.
  outsiders_uni_a: [user_unverified, student, student_minor, club_member, club_admin, other_club_admin, event_staff,
                    company_member, company_admin, other_company_member]
  # signed-in users outside company_a without a platform role.
  outsiders_company_a: [user_unverified, student, student_minor, club_member, club_admin, other_club_admin, event_staff,
                        university_rep, other_company_member]
  # signed-in users outside company_b without a platform role.
  outsiders_company_b: [user_unverified, student, student_minor, club_member, club_admin, other_club_admin, event_staff,
                        university_rep, company_member, company_admin]
  # every non-platform persona.
  no_platform_role: [user_unverified, student, student_minor, club_member, club_admin, other_club_admin, event_staff,
                     university_rep, company_member, company_admin, other_company_member]
  # platform roles.
  staff: [moderator, support, dpo, platform_admin, finance_admin, talent_auditor]
  # platform roles without a read cell on an order.
  non_order_staff: [moderator, dpo, talent_auditor]
  # platform roles without a cell on the delivery of a line.
  non_delivery_staff: [moderator, support, dpo, finance_admin, talent_auditor]
  # platform roles without a cell on the delivery evidence of a line (BE-093).
  non_evidence_staff: [moderator, support, dpo, talent_auditor]

operations:
  createOrder:
    method: POST
    path: /api/v1/orgs/{org_id}/orders
    action: orders.order.create
    idempotency: required
    path_params: { org_id: company_a }
    body: bodies/orders/create_order.json
    expect:
      anonymous: 401
      "@outsiders_company_a": 404
      company_member: 403
      company_admin: 201
      "@staff": 403
    variants:
      - name: other_company
        path_params: { org_id: company_b }
        body: bodies/orders/create_order_b.json
        note: IDOR — company_a's admin does not see company_b; company_b's admin is refused by k25 (party_buyer_b is not verified, 422 orders.buyer_party_required)
        expect:
          anonymous: 401
          "@outsiders_company_b": 404
          other_company_member: 422
          "@staff": 403

  listOrgOrders:
    method: GET
    path: /api/v1/orgs/{org_id}/orders
    action: orders.order.list
    config: { orders_seed: true }
    path_params: { org_id: company_a }
    expect:
      anonymous: 401
      "@outsiders_company_a": 404
      company_member: 200
      company_admin: 200
      "@staff": 403
    variants:
      - name: paid_filter
        query: { status: paid }
        expect:
          anonymous: 401
          "@outsiders_company_a": 404
          company_member: 200
          company_admin: 200
          "@staff": 403
      - name: other_company
        path_params: { org_id: company_b }
        note: IDOR — company_b's orders are company_b's members' only
        expect:
          anonymous: 401
          "@outsiders_company_b": 404
          other_company_member: 200
          "@staff": 403

  getOrder:
    method: GET
    path: /api/v1/orders/{order_id}
    action: orders.order.read
    config: { orders_seed: true }
    path_params: { order_id: ord_a_unpaid }
    expect:
      anonymous: 401
      "@outsiders_order_a": 404
      company_member: 200
      company_admin: 200
      club_member: 403
      club_admin: 200
      "@non_order_staff": 403
      support: 200
      platform_admin: 200
      finance_admin: 200
    variants:
      - name: direct_payee
        path_params: { order_id: ord_c_direct }
        note: Model C bank-account projection is checked by TestOrders_ModelCIBANMatrix.
        expect:
          anonymous: 401
          "@outsiders_order_a": 404
          company_member: 200
          company_admin: 200
          club_member: 403
          club_admin: 200
          "@non_order_staff": 403
          support: 200
          platform_admin: 200
          finance_admin: 200
      - name: other_company
        path_params: { order_id: ord_b_unpaid }
        note: IDOR — company_b's order; club_a's admin sees its own line as the seller (03 k26)
        expect:
          anonymous: 401
          user_unverified: 404
          student: 404
          student_minor: 404
          other_club_admin: 404
          event_staff: 404
          university_rep: 404
          company_member: 404
          company_admin: 404
          other_company_member: 200
          club_member: 403
          club_admin: 200
          "@non_order_staff": 403
          support: 200
          platform_admin: 200
          finance_admin: 200
      - name: unknown_order
        path_params: { order_id: "literal:00000000-0000-7000-8000-0000000000ab" }
        expect:
          anonymous: 401
          "@no_platform_role": 404
          "@staff": 404

  getOrderPaymentInstructions:
    method: GET
    path: /api/v1/orders/{order_id}/payment-instructions
    action: orders.order.payment_instructions
    config: { orders_seed: true }
    path_params: { order_id: ord_a_unpaid }
    expect:
      anonymous: 401
      "@outsiders_order_a": 404
      company_member: 200
      company_admin: 200
      club_member: 403
      club_admin: 403
      moderator: 403
      support: 403
      dpo: 403
      platform_admin: 403
      finance_admin: 200
      talent_auditor: 403
    variants:
      - name: direct_payee
        path_params: { order_id: ord_c_direct }
        expect:
          anonymous: 401
          "@outsiders_order_a": 404
          company_member: 200
          company_admin: 200
          club_member: 403
          club_admin: 403
          moderator: 403
          support: 403
          dpo: 403
          platform_admin: 403
          finance_admin: 200
          talent_auditor: 403

  cancelOrder:
    method: POST
    path: /api/v1/orders/{order_id}/cancel
    action: orders.order.cancel
    config: { orders_seed: true }
    path_params: { order_id: ord_a_unpaid }
    body: bodies/orders/cancel.json
    expect:
      anonymous: 401
      "@outsiders_order_a": 404
      company_member: 403
      company_admin: 200
      club_member: 403
      club_admin: 403
      moderator: 403
      support: 403
      dpo: 403
      platform_admin: 200
      finance_admin: 200
      talent_auditor: 403

  listOrgSales:
    method: GET
    path: /api/v1/orgs/{org_id}/sales
    action: orders.line.list_sales
    config: { orders_seed: true }
    path_params: { org_id: club_a }
    expect:
      anonymous: 401
      "@outsiders_club_a": 404
      club_member: 403
      club_admin: 200
      moderator: 403
      support: 403
      dpo: 403
      platform_admin: 200
      finance_admin: 200
      talent_auditor: 403
    variants:
      - name: university
        path_params: { org_id: uni_a }
        note: a university sells too; its rep lists its sales (career_staff as well, no k-cs)
        expect:
          anonymous: 401
          "@outsiders_uni_a": 404
          university_rep: 200
          moderator: 403
          support: 403
          dpo: 403
          platform_admin: 200
          finance_admin: 200
          talent_auditor: 403
      - name: marked_filter
        query: { fulfillment_status: marked }
        expect:
          anonymous: 401
          "@outsiders_club_a": 404
          club_member: 403
          club_admin: 200
          moderator: 403
          support: 403
          dpo: 403
          platform_admin: 200
          finance_admin: 200
          talent_auditor: 403

  markOrderLineFulfilled:
    method: POST
    path: /api/v1/order-lines/{line_id}/mark-fulfilled
    action: orders.line.mark_fulfilled
    config: { orders_seed: true }
    path_params: { line_id: ln_a_paid }
    body: bodies/orders/mark.json
    expect:
      anonymous: 401
      "@outsiders_order_a": 404
      company_member: 403
      company_admin: 403
      club_member: 403
      club_admin: 200
      "@non_delivery_staff": 403
      platform_admin: 200

  getOrderLineEvidence:
    method: GET
    path: /api/v1/order-lines/{line_id}/evidence
    action: orders.line.read_evidence
    config: { orders_seed: true }
    path_params: { line_id: ln_a_evidence }
    note: >-
      BE-093 (T-292): a 5-minute URL of the delivery evidence club_a attached to company_a's line — the buyer's admins,
      the seller's markers, finance and platform admins; the recruiter, the club member and support see the line (403)
    expect:
      anonymous: 401
      "@outsiders_order_a": 404
      company_member: 403
      company_admin: 200
      club_member: 403
      club_admin: 200
      "@non_evidence_staff": 403
      platform_admin: 200
      finance_admin: 200
    variants:
      - name: no_evidence
        path_params: { line_id: ln_a_marked }
        note: a line marked without evidence has none to download — 404 for whoever holds the cell
        expect:
          anonymous: 401
          "@outsiders_order_a": 404
          company_member: 403
          company_admin: 404
          club_member: 403
          club_admin: 404
          "@non_evidence_staff": 403
          platform_admin: 404
          finance_admin: 404
      - name: other_company
        path_params: { line_id: ln_b_unpaid }
        note: IDOR — company_b's line (no evidence); company_a's admin does not see it
        expect:
          anonymous: 401
          user_unverified: 404
          student: 404
          student_minor: 404
          other_club_admin: 404
          event_staff: 404
          university_rep: 404
          company_member: 404
          company_admin: 404
          club_member: 403
          club_admin: 404
          other_company_member: 404
          "@non_evidence_staff": 403
          platform_admin: 404
          finance_admin: 404

  confirmOrderLine:
    method: POST
    path: /api/v1/order-lines/{line_id}/confirm
    action: orders.line.confirm
    config: { orders_seed: true }
    path_params: { line_id: ln_a_marked }
    expect:
      anonymous: 401
      "@outsiders_order_a": 404
      company_member: 403
      company_admin: 200
      club_member: 403
      club_admin: 403
      "@staff": 403

  disputeOrderLine:
    method: POST
    path: /api/v1/order-lines/{line_id}/dispute
    action: orders.line.dispute
    config: { orders_seed: true }
    path_params: { line_id: ln_a_marked }
    body: bodies/orders/dispute.json
    expect:
      anonymous: 401
      "@outsiders_order_a": 404
      company_member: 403
      company_admin: 200
      club_member: 403
      club_admin: 403
      "@staff": 403

  adminResolveOrderLineDispute:
    method: POST
    path: /api/v1/admin/order-lines/{line_id}/resolve-dispute
    action: orders.line.resolve_dispute
    config: { orders_seed: true }
    path_params: { line_id: ln_a_disputed }
    body: bodies/orders/resolve.json
    expect:
      anonymous: 401
      "@no_platform_role": 403   # admin surface: 403 before reading (03 §7.2-3)
      moderator: 403
      support: 403
      dpo: 403
      platform_admin: 200
      finance_admin: 200
      talent_auditor: 403
    variants:
      - name: unknown_line
        path_params: { line_id: "literal:00000000-0000-7000-8000-0000000000ab" }
        expect:
          anonymous: 401
          "@no_platform_role": 403
          moderator: 403
          support: 403
          dpo: 403
          platform_admin: 404
          finance_admin: 404
          talent_auditor: 403

  adminListOrders:
    method: GET
    path: /api/v1/admin/orders
    action: orders.order.list_admin
    config: { orders_seed: true }
    expect:
      anonymous: 401
      "@no_platform_role": 403   # admin surface: 403 before reading (03 §7.2-3)
      moderator: 403
      support: 200
      dpo: 403
      platform_admin: 200
      finance_admin: 200
      talent_auditor: 403
    variants:
      - name: filters
        query: { status: awaiting_payment, org_id: "{{fixture:company_a}}", placed_from: "2026-01-01T00:00:00Z" }
        expect:
          anonymous: 401
          "@no_platform_role": 403
          moderator: 403
          support: 200
          dpo: 403
          platform_admin: 200
          finance_admin: 200
          talent_auditor: 403
