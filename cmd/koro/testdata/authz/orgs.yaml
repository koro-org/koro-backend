# Authz matrix of the orgs module (03 §5.2, 04 §2.2; BE-017 + BE-019; BE-120 listCompanies). 25 operations × 18 personas.
# Public profile (03 §3.6): active/suspended orgs for everyone; pending_review/closed only for
# members and platform_admin, support, moderator (others 404). Org management surface
# (updateOrg, closeOrg, transferOrgOwnership; 03 §7.6): members without the role → 403,
# non-members → 404, every platform role sees it (403 unless platform_admin). Admin surface
# (03 §7.2-3): everyone without the role → 403 before anything is read. company_admin is not
# the owner of company_a (company_owner_a is, a helper): k-own cells are 403 for it. R
# operations carry the matrix password (identity fixtures). Business rules (412/428, 409,
# 422, suspended org) live in scenarios/orgs.yaml and the service tests.
# BE-019: member lists are the org's management surface; members do not see each other (T-20);
# support and platform_admin read them by break-glass (B: 403 without X-Koro-Access-Reason); a
# sensitive club's list and memberships are hidden from every platform role (Y2: 404). /me and
# acceptOrgInvitation are the caller's own (another's ID or an invitation to another address → 404).
# joinClub is a resource surface (the club is public): a non-student is 403.
version: 1
groups:
  # signed-in users without a membership in company_a.
  outsiders_company_a: [user_unverified, student, student_minor, club_member, club_admin, other_club_admin,
                        event_staff, university_rep, other_company_member]
  # signed-in users without a membership in club_a.
  outsiders_club_a: [user_unverified, student, student_minor, other_club_admin, event_staff, university_rep,
                     company_member, company_admin, other_company_member]
  # signed-in users without a membership in uni_a.
  outsiders_uni_a: [user_unverified, student, student_minor, club_member, club_admin, other_club_admin,
                    event_staff, company_member, company_admin, other_company_member]
  # signed-in users without a platform role.
  no_platform_role: [user_unverified, student, student_minor, club_member, club_admin, other_club_admin,
                     event_staff, university_rep, company_member, company_admin, other_company_member]
  # platform roles without a cell in the org management operations.
  other_staff: [moderator, support, dpo, finance_admin, talent_auditor]
  # orgs.company.create cells: usr, stu, clm, cla, stf, uni, cmm, cma (03 §5.2).
  creators: [user_unverified, student, club_member, club_admin, other_club_admin, event_staff, university_rep,
             company_member, company_admin, other_company_member]
  # platform roles that see pending_review and closed orgs (03 §3.6).
  profile_staff: [moderator, support, platform_admin]
  # platform roles without a break-glass cell in the member list (03 §5.2).
  no_bg_staff: [moderator, dpo, finance_admin, talent_auditor]
  # signed-in users other than student (acceptOrgInvitation of student's invitation).
  not_student: [user_unverified, student_minor, club_member, club_admin, other_club_admin, event_staff,
                university_rep, company_member, company_admin, other_company_member,
                moderator, support, dpo, platform_admin, finance_admin, talent_auditor]
  # signed-in users other than club_member (leaveMyMembership of club_member's membership).
  not_club_member: [user_unverified, student, student_minor, club_admin, other_club_admin, event_staff,
                    university_rep, company_member, company_admin, other_company_member,
                    moderator, support, dpo, platform_admin, finance_admin, talent_auditor]
  # signed-in accounts without a student verification (joinClub: 403 students.verification_required).
  non_students: [user_unverified, university_rep, company_member, company_admin, other_company_member]

operations:
  getOrg:
    method: GET
    path: /api/v1/orgs/{org_id}
    action: orgs.org.read
    public: true
    path_params: { org_id: company_a }
    expect: { "@all": 200 }
    variants:
      - name: suspended_org
        path_params: { org_id: company_suspended }
        note: a suspended org stays readable (03 §2.3)
        expect: { "@all": 200 }
      - name: pending_review_org
        path_params: { org_id: company_pending }
        note: no persona is a member; only moderator, support and platform_admin see it
        expect:
          anonymous: 404
          "@no_platform_role": 404
          "@profile_staff": 200
          dpo: 404
          finance_admin: 404
          talent_auditor: 404
      - name: unknown_org
        path_params: { org_id: "literal:00000000-0000-7000-8000-0000000000aa" }
        expect: { "@all": 404 }

  getOrgBySlug:
    method: GET
    path: /api/v1/orgs/by-slug/{slug}
    action: orgs.org.read
    public: true
    path_params: { slug: "literal:club-a" }
    expect: { "@all": 200 }
    variants:
      - name: pending_review_org
        path_params: { slug: "literal:company-pending" }
        expect:
          anonymous: 404
          "@no_platform_role": 404
          "@profile_staff": 200
          dpo: 404
          finance_admin: 404
          talent_auditor: 404
      - name: unknown_slug
        path_params: { slug: "literal:no-such-org" }
        expect: { "@all": 404 }

  searchOrgs:
    method: GET
    path: /api/v1/orgs
    action: orgs.org.search
    public: true
    expect: { "@all": 200 }
    variants:
      - name: text_and_kind
        query: { q: matris, kind: company, sort: name }
        expect: { "@all": 200 }

  listCompanies:
    method: GET
    path: /api/v1/companies
    action: orgs.org.search
    public: true
    note: BE-120 — the public company list (active companies only)
    expect: { "@all": 200 }
    variants:
      - name: sorted_by_name
        query: { sort: name }
        expect: { "@all": 200 }

  createCompany:
    method: POST
    path: /api/v1/companies
    action: orgs.company.create
    body: bodies/orgs/create_company.json
    note: k-cmp — a minor and the platform staff accounts do not register companies
    expect:
      anonymous: 401
      "@creators": 201
      student_minor: 403
      "@platform_staff": 403

  updateOrg:
    method: PATCH
    path: /api/v1/orgs/{org_id}
    action: orgs.org.update
    path_params: { org_id: company_a }
    headers: { If-Match: '"1hmhuo3hji000"' }
    body: bodies/orgs/update_org.json
    expect:
      anonymous: 401
      "@outsiders_company_a": 404
      company_member: 403       # member, no role
      company_admin: 200        # S
      "@other_staff": 403
      platform_admin: 200
    variants:
      - name: club_org
        path_params: { org_id: club_a }
        expect:
          anonymous: 401
          "@outsiders_club_a": 404
          club_member: 403
          club_admin: 200
          "@other_staff": 403
          platform_admin: 200
      - name: university_org
        path_params: { org_id: uni_a }
        expect:
          anonymous: 401
          "@outsiders_uni_a": 404
          university_rep: 200     # not career_staff (k-cs)
          "@other_staff": 403
          platform_admin: 200
      - name: other_company
        path_params: { org_id: company_b }
        note: IDOR — company_a's admins do not see company_b's management surface
        expect:
          anonymous: 401
          user_unverified: 404
          student: 404
          student_minor: 404
          club_member: 404
          club_admin: 404
          other_club_admin: 404
          event_staff: 404
          university_rep: 404
          company_member: 404
          company_admin: 404
          other_company_member: 200
          "@other_staff": 403
          platform_admin: 200
      - name: unknown_org
        path_params: { org_id: "literal:00000000-0000-7000-8000-0000000000aa" }
        expect:
          anonymous: 401
          "@no_platform_role": 404
          "@other_staff": 404       # staff see management surfaces, but there is no org
          platform_admin: 404

  closeOrg:
    method: POST
    path: /api/v1/orgs/{org_id}/close
    action: orgs.org.close
    path_params: { org_id: company_a }
    body: bodies/orgs/close.json
    expect:
      anonymous: 401
      "@outsiders_company_a": 404
      company_member: 403
      company_admin: 403         # k-own: company_owner only
      "@other_staff": 403
      platform_admin: 200

  transferOrgOwnership:
    method: POST
    path: /api/v1/orgs/{org_id}/ownership-transfer
    action: orgs.ownership.transfer
    path_params: { org_id: company_a }
    body: bodies/orgs/transfer.json
    note: platform_admin moves company_a from company_owner_a to company_admin
    expect:
      anonymous: 401
      "@outsiders_company_a": 404
      company_member: 403
      company_admin: 403         # k-own
      "@other_staff": 403
      platform_admin: 200

  adminListOrgs:
    method: GET
    path: /api/v1/admin/orgs
    action: orgs.org.list_admin
    expect:
      anonymous: 401
      "@no_platform_role": 403
      moderator: 200
      support: 200
      platform_admin: 200
      dpo: 403
      finance_admin: 403
      talent_auditor: 403
    variants:
      - name: status_filter
        query: { status: pending_review, kind: company }
        expect:
          anonymous: 401
          "@no_platform_role": 403
          moderator: 200
          support: 200
          platform_admin: 200
          dpo: 403
          finance_admin: 403
          talent_auditor: 403

  adminVerifyOrg:
    method: POST
    path: /api/v1/admin/orgs/{org_id}/verify
    action: orgs.org.verify
    path_params: { org_id: company_pending }
    body: bodies/orgs/verify.json
    expect:
      anonymous: 401
      "@no_platform_role": 403
      "@other_staff": 403
      platform_admin: 200
    variants:
      - name: unknown_org
        path_params: { org_id: "literal:00000000-0000-7000-8000-0000000000aa" }
        expect:
          anonymous: 401
          "@no_platform_role": 403   # no ID probing without a platform role
          "@other_staff": 403
          platform_admin: 404

  adminSuspendOrg:
    method: POST
    path: /api/v1/admin/orgs/{org_id}/suspend
    action: orgs.org.suspend
    path_params: { org_id: company_a }
    body: bodies/orgs/suspend.json
    expect:
      anonymous: 401
      "@no_platform_role": 403
      "@other_staff": 403
      platform_admin: 200

  adminReactivateOrg:
    method: POST
    path: /api/v1/admin/orgs/{org_id}/reactivate
    action: orgs.org.suspend
    path_params: { org_id: company_suspended }
    body: bodies/orgs/reactivate.json
    expect:
      anonymous: 401
      "@no_platform_role": 403
      "@other_staff": 403
      platform_admin: 200

  # ---------------------------------------------------------------- BE-019: memberships

  listOrgMembers:
    method: GET
    path: /api/v1/orgs/{org_id}/members
    action: orgs.member.list
    path_params: { org_id: club_a }
    expect:
      anonymous: 401
      "@outsiders_club_a": 404
      club_member: 403          # T-20: members do not see each other
      club_admin: 200
      "@no_bg_staff": 403
      support: 403              # B without X-Koro-Access-Reason
      platform_admin: 403
    variants:
      - name: break_glass
        headers: { X-Koro-Access-Reason: "Destek talebi 4711: üyelik kaydı inceleniyor" }
        expect:
          anonymous: 401
          "@outsiders_club_a": 404
          club_member: 403
          club_admin: 200
          "@no_bg_staff": 403
          support: 200
          platform_admin: 200
      - name: sensitive_club
        path_params: { org_id: club_sensitive }
        headers: { X-Koro-Access-Reason: "Destek talebi 4711: üyelik kaydı inceleniyor" }
        note: k4/Y2 — only club_sensitive's club_admin (a helper) lists; staff see nothing, even by break-glass
        expect:
          anonymous: 401
          club_member: 403
          user_unverified: 404
          student: 404
          student_minor: 404
          club_admin: 404
          other_club_admin: 404
          event_staff: 404
          university_rep: 404
          company_member: 404
          company_admin: 404
          other_company_member: 404
          "@platform_staff": 404
      - name: company_org
        path_params: { org_id: company_a }
        expect:
          anonymous: 401
          "@outsiders_company_a": 404
          company_member: 200
          company_admin: 200
          "@no_bg_staff": 403
          support: 403
          platform_admin: 403
      - name: university_org
        path_params: { org_id: uni_a }
        expect:
          anonymous: 401
          "@outsiders_uni_a": 404
          university_rep: 200
          "@no_bg_staff": 403
          support: 403
          platform_admin: 403
      - name: unknown_org
        path_params: { org_id: "literal:00000000-0000-7000-8000-0000000000aa" }
        expect:
          anonymous: 401
          "@signed_in": 404

  getOrgMember:
    method: GET
    path: /api/v1/orgs/{org_id}/members/{membership_id}
    action: orgs.member.read
    path_params: { org_id: club_a, membership_id: m_club_member_club_a }
    expect:
      anonymous: 401
      "@outsiders_club_a": 404
      club_member: 403          # own row, but no read cell for clm
      club_admin: 200
      "@no_bg_staff": 403
      support: 403
      platform_admin: 403
    variants:
      - name: break_glass
        headers: { X-Koro-Access-Reason: "Destek talebi 4711: üyelik kaydı inceleniyor" }
        expect:
          anonymous: 401
          "@outsiders_club_a": 404
          club_member: 403
          club_admin: 200
          "@no_bg_staff": 403
          support: 200
          platform_admin: 200
      - name: sensitive_membership
        path_params: { org_id: club_sensitive, membership_id: m_club_member_sensitive }
        headers: { X-Koro-Access-Reason: "Destek talebi 4711: üyelik kaydı inceleniyor" }
        note: Y2 — the member sees that the row exists (403), everyone else 404
        expect:
          anonymous: 401
          club_member: 403
          user_unverified: 404
          student: 404
          student_minor: 404
          club_admin: 404
          other_club_admin: 404
          event_staff: 404
          university_rep: 404
          company_member: 404
          company_admin: 404
          other_company_member: 404
          "@platform_staff": 404
      - name: other_org_membership
        path_params: { org_id: club_a, membership_id: m_company_member_company_a }
        note: 06 H-38 — another org's membership under club_a's path does not exist
        expect:
          anonymous: 401
          "@signed_in": 404

  approveJoinRequest:
    method: POST
    path: /api/v1/orgs/{org_id}/members/{membership_id}/approve
    action: orgs.member.decide
    path_params: { org_id: club_a, membership_id: join_pending_a }
    expect:
      anonymous: 401
      "@outsiders_club_a": 404
      club_member: 403
      club_admin: 200
      "@other_staff": 403
      platform_admin: 403       # decide is the club_admin's only

  rejectJoinRequest:
    method: POST
    path: /api/v1/orgs/{org_id}/members/{membership_id}/reject
    action: orgs.member.decide
    path_params: { org_id: club_a, membership_id: join_pending_a }
    expect:
      anonymous: 401
      "@outsiders_club_a": 404
      club_member: 403
      club_admin: 200
      "@other_staff": 403
      platform_admin: 403

  removeOrgMember:
    method: POST
    path: /api/v1/orgs/{org_id}/members/{membership_id}/remove
    action: orgs.member.remove
    path_params: { org_id: club_a, membership_id: m_club_member_club_a }
    body: bodies/orgs/remove.json
    expect:
      anonymous: 401
      "@outsiders_club_a": 404
      club_member: 403
      club_admin: 204
      "@other_staff": 403
      platform_admin: 204
    variants:
      - name: company_org
        path_params: { org_id: company_a, membership_id: m_company_member_company_a }
        expect:
          anonymous: 401
          "@outsiders_company_a": 404
          company_member: 403
          company_admin: 204
          "@other_staff": 403
          platform_admin: 204
      - name: university_org
        path_params: { org_id: uni_a, membership_id: m_university_rep_uni_a }
        note: university_rep removes (here its own row; university roles are not guarded by k6)
        expect:
          anonymous: 401
          "@outsiders_uni_a": 404
          university_rep: 204
          "@other_staff": 403
          platform_admin: 204

  changeOrgMemberRole:
    method: POST
    path: /api/v1/orgs/{org_id}/members/{membership_id}/role
    action: orgs.member.change_role
    path_params: { org_id: club_a, membership_id: m_club_member_club_a }
    body: bodies/orgs/role_club_admin.json
    note: club_member is a verified adult student (k5 holds)
    expect:
      anonymous: 401
      "@outsiders_club_a": 404
      club_member: 403
      club_admin: 200
      "@other_staff": 403
      platform_admin: 200
    variants:
      - name: company_org
        path_params: { org_id: company_a, membership_id: m_company_member_company_a }
        body: bodies/orgs/role_company_admin.json
        expect:
          anonymous: 401
          "@outsiders_company_a": 404
          company_member: 403
          company_admin: 200
          "@other_staff": 403
          platform_admin: 200

  listMyMemberships:
    method: GET
    path: /api/v1/me/memberships
    action: orgs.membership.list_own
    expect:
      anonymous: 401
      "@signed_in": 200

  leaveMyMembership:
    method: POST
    path: /api/v1/me/memberships/{membership_id}/leave
    action: orgs.membership.leave
    path_params: { membership_id: m_club_member_club_a }
    expect:
      anonymous: 401
      club_member: 204
      "@not_club_member": 404   # another user's membership

  createOrgInvitation:
    method: POST
    path: /api/v1/orgs/{org_id}/invitations
    action: orgs.invitation.create
    path_params: { org_id: club_a }
    body: bodies/orgs/invite_member.json
    expect:
      anonymous: 401
      "@outsiders_club_a": 404
      club_member: 403
      club_admin: 201
      "@other_staff": 403
      platform_admin: 201
    variants:
      - name: company_org
        path_params: { org_id: company_a }
        body: bodies/orgs/invite_recruiter.json
        expect:
          anonymous: 401
          "@outsiders_company_a": 404
          company_member: 403
          company_admin: 201
          "@other_staff": 403
          platform_admin: 201
      - name: university_org
        path_params: { org_id: uni_a }
        body: bodies/orgs/invite_career_staff.json
        note: k5 — university roles are invited by platform_admin only
        expect:
          anonymous: 401
          "@outsiders_uni_a": 404
          university_rep: 403
          "@other_staff": 403
          platform_admin: 201

  listOrgInvitations:
    method: GET
    path: /api/v1/orgs/{org_id}/invitations
    action: orgs.invitation.list
    path_params: { org_id: club_a }
    expect:
      anonymous: 401
      "@outsiders_club_a": 404
      club_member: 403
      club_admin: 200
      "@other_staff": 403
      platform_admin: 200

  revokeOrgInvitation:
    method: DELETE
    path: /api/v1/orgs/{org_id}/invitations/{invitation_id}
    action: orgs.invitation.revoke
    path_params: { org_id: club_a, invitation_id: inv_club_a }
    expect:
      anonymous: 401
      "@outsiders_club_a": 404
      club_member: 403
      club_admin: 204
      "@other_staff": 403
      platform_admin: 204
    variants:
      - name: other_org_invitation
        path_params: { org_id: company_a, invitation_id: inv_club_a }
        note: 06 H-38 — club_a's invitation under company_a's path does not exist
        expect:
          anonymous: 401
          "@signed_in": 404

  acceptOrgInvitation:
    method: POST
    path: /api/v1/invitations/accept
    action: orgs.invitation.accept
    body: bodies/orgs/accept_for_student.json
    note: the invitation is addressed to student's account; any other account gets 404
    expect:
      anonymous: 401
      student: 200
      "@not_student": 404

  joinClub:
    method: POST
    path: /api/v1/clubs/{club_id}/join-requests
    action: orgs.member.join
    path_params: { club_id: club_unclaimed }
    body: bodies/orgs/join.json
    expect:
      anonymous: 401
      "@verified_students": 201
      "@non_students": 403
      "@platform_staff": 403
    variants:
      - name: unknown_club
        path_params: { club_id: "literal:00000000-0000-7000-8000-0000000000aa" }
        expect:
          anonymous: 401
          "@signed_in": 404
      - name: not_a_club
        path_params: { club_id: company_a }
        expect:
          anonymous: 401
          "@signed_in": 404
