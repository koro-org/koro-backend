# Authz matrix of the payments module (03 §5.16, 04 §2.16; BE-041, BE-043, BE-128, BE-129, BE-132, BE-154b). 51 operations × 18 personas: 04 §2.16's
# 19, the return's request and second eye (06 H-56, T-79, T-228), the model C direct confirmation (T-18) and the
# refunds due (BE-043). Everything is the admin surface (03 §7.2-3): an actor without the role gets 403 before
# anything is read. Cells: collection accounts list pad, fin; create fin·R; approve pad·4·R, fin·4·R; retire /
# make-default pad·R, fin·R; transfers list / read pad, fin; create, import, match (k27), ignore and the direct
# confirmation fin; the three return steps fin·R (k28, four eyes on the second); payments list / read pad, fin;
# refunds list, due list and create pad, fin; approve fin·4·R; reject and complete fin. platform_admin and
# finance_admin sessions are MFA verified (03 §7.3). Four eyes, R, MFA and the capture's and the refund's effects
# are scenarios (scenarios/payments.yaml). Fixtures: fixtures/payments.yaml; orders' ord_a_unpaid / ord_a_paid and
# payments' ord_c_direct exist only under config orders_seed: true (set by the operations that need them). The
# matrix app has no idempotency middleware: Idempotency-Key replays are service and PostgreSQL tests.
# BE-132 adds the buyers' refund requests (Q-26): the buyer's org surface (cma asks; cmm and cma list), the seller's
# (club admin, university rep, career staff, pad, fin list), one request (the buyer's members, the seller's staff, sup,
# pad, fin read; cma withdraws; the evidence: cma, the seller's markers, pad, fin) and finance's queue and decisions
# (admin surface pad, fin; never the requester).
# BE-154b adds the replacement of a rejected receipt or evidence with the cell of its first upload: a transfer's
# receipt (create, fin), a return's receipt (mark_returned, fin·R), a direct payment's evidence (match, fin), a
# completed refund's receipt (complete, fin) and a waiting request's evidence (create on the request: the buyer's cma).
version: 1
groups:
  # signed-in users without a platform role.
  no_platform_role: [user_unverified, student, student_minor, club_member, club_admin, other_club_admin,
                     event_staff, university_rep, company_member, company_admin, other_company_member]
  # platform roles without a payments cell.
  other_staff: [moderator, support, dpo, talent_auditor]
  # BE-132 refund requests: signed-in users outside company_a (its org surface is 404), outside club_a, outside
  # uni_a, outside company_b, and outside both company_a and club_a (a request of company_a's line sold by club_a).
  rr_outsiders_company_a: [user_unverified, student, student_minor, club_member, club_admin, other_club_admin, event_staff,
                           university_rep, other_company_member]
  rr_outsiders_club_a: [user_unverified, student, student_minor, other_club_admin, event_staff, university_rep, company_member,
                        company_admin, other_company_member]
  rr_outsiders_uni_a: [user_unverified, student, student_minor, club_member, club_admin, other_club_admin, event_staff,
                       company_member, company_admin, other_company_member]
  rr_outsiders_company_b: [user_unverified, student, student_minor, club_member, club_admin, other_club_admin, event_staff,
                           university_rep, company_member, company_admin]
  rr_outsiders_request_a: [user_unverified, student, student_minor, other_club_admin, event_staff, university_rep,
                           other_company_member]
  # platform roles without a cell on a request's evidence.
  rr_non_evidence_staff: [moderator, support, dpo, talent_auditor]

operations:
  adminListCollectionAccounts:
    method: GET
    path: /api/v1/admin/collection-accounts
    action: payments.collection_account.list
    expect:
      anonymous: 401
      "@no_platform_role": 403
      "@other_staff": 403
      platform_admin: 200
      finance_admin: 200

  adminRevealCollectionAccountIban:
    method: GET
    path: /api/v1/admin/collection-accounts/{account_id}/iban
    action: payments.iban.reveal
    path_params: { account_id: coll_pending_fin2 }
    headers: { X-Koro-Access-Reason: "Matris: iade EFT'si için IBAN gerekli" }
    note: BE-129 Koro's account in full for the second eye (masked in the list); reason required, audited
    expect:
      anonymous: 401
      "@no_platform_role": 403
      "@other_staff": 403
      platform_admin: 200
      finance_admin: 200
    variants:
      - name: unknown
        path_params: { account_id: "literal:00000000-0000-7000-8000-0000000000c1" }
        expect:
          anonymous: 401
          "@no_platform_role": 403
          "@other_staff": 403
          platform_admin: 404
          finance_admin: 404

  adminCreateCollectionAccount:
    method: POST
    path: /api/v1/admin/collection-accounts
    action: payments.collection_account.create
    body: bodies/payments/create_account.json
    expect:
      anonymous: 401
      "@no_platform_role": 403
      "@other_staff": 403
      platform_admin: 403     # 03 §5.16: create is fin·R only
      finance_admin: 201
    variants:
      - name: iban_in_use
        body: bodies/payments/create_account_taken.json
        note: coll_default is open with this IBAN — 409 payments.iban_in_use
        expect:
          anonymous: 401
          "@no_platform_role": 403
          "@other_staff": 403
          platform_admin: 403
          finance_admin: 409
      - name: no_reauth
        body: bodies/payments/create_account_no_reauth.json
        note: R (03 §6.2) — without the proof 403 identity.reauth_required
        expect:
          anonymous: 401
          "@no_platform_role": 403
          "@other_staff": 403
          platform_admin: 403
          finance_admin: 403

  adminApproveCollectionAccount:
    method: POST
    path: /api/v1/admin/collection-accounts/{account_id}/approve
    action: payments.collection_account.approve
    path_params: { account_id: coll_pending_fin2 }
    body: bodies/payments/approve.json
    expect:
      anonymous: 401
      "@no_platform_role": 403
      "@other_staff": 403
      platform_admin: 200     # second eye ≠ creator (finance_admin_2)
      finance_admin: 200
    variants:
      - name: own_creation
        path_params: { account_id: coll_pending_fin }
        note: four eyes — finance_admin created it and may not decide it (03 §6.1)
        expect:
          anonymous: 401
          "@no_platform_role": 403
          "@other_staff": 403
          platform_admin: 200
          finance_admin: 403
      - name: reject
        body: bodies/payments/reject.json
        expect:
          anonymous: 401
          "@no_platform_role": 403
          "@other_staff": 403
          platform_admin: 200
          finance_admin: 200
      - name: decided
        path_params: { account_id: coll_active }
        note: an approved account is decided — 409 payments.invalid_state
        expect:
          anonymous: 401
          "@no_platform_role": 403
          "@other_staff": 403
          platform_admin: 409
          finance_admin: 409
      - name: unknown
        path_params: { account_id: "literal:00000000-0000-7000-8000-0000000000ac" }
        expect:
          anonymous: 401
          "@no_platform_role": 403
          "@other_staff": 403
          platform_admin: 404
          finance_admin: 404

  adminRetireCollectionAccount:
    method: POST
    path: /api/v1/admin/collection-accounts/{account_id}/retire
    action: payments.collection_account.retire
    path_params: { account_id: coll_active }
    body: bodies/payments/reauth.json
    expect:
      anonymous: 401
      "@no_platform_role": 403
      "@other_staff": 403
      platform_admin: 200
      finance_admin: 200
    variants:
      - name: pending
        path_params: { account_id: coll_pending_fin }
        note: only an active account is retired — 409 payments.invalid_state
        expect:
          anonymous: 401
          "@no_platform_role": 403
          "@other_staff": 403
          platform_admin: 409
          finance_admin: 409

  adminMakeDefaultCollectionAccount:
    method: POST
    path: /api/v1/admin/collection-accounts/{account_id}/make-default
    action: payments.collection_account.retire
    path_params: { account_id: coll_active }
    body: bodies/payments/reauth.json
    expect:
      anonymous: 401
      "@no_platform_role": 403
      "@other_staff": 403
      platform_admin: 200
      finance_admin: 200

  adminQueryIncomingTransfers:
    method: POST
    path: /api/v1/admin/incoming-transfers/search
    action: payments.transfer.list
    body: bodies/payments/query_transfers.json
    note: BE-128 read sent as POST (a sender's name stays out of the URL); the GET list is gone (BE-133)
    expect:
      anonymous: 401
      "@no_platform_role": 403
      "@other_staff": 403
