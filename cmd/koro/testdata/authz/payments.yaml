  adminMatchIncomingTransfer:
    method: POST
    path: /api/v1/admin/incoming-transfers/{transfer_id}/match
    action: payments.transfer.match
    idempotency: required
    config: { orders_seed: true }
    path_params: { transfer_id: tr_unmatched }
    body: bodies/payments/match.json
    expect:
      anonymous: 401
      "@no_platform_role": 403
      "@other_staff": 403
      platform_admin: 403     # k27: fin only
      finance_admin: 200
    variants:
      - name: already_matched
