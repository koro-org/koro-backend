    path_params: { transfer_id: tr_unmatched }
    expect:
      anonymous: 401
      "@no_platform_role": 403
      "@other_staff": 403
      platform_admin: 200
      finance_admin: 200
    variants:
      - name: unknown
        path_params: { transfer_id: "literal:00000000-0000-7000-8000-0000000000ad" }
        expect:
          anonymous: 401
          "@no_platform_role": 403   # admin surface: 403 before reading (03 §7.2-3)
          "@other_staff": 403
          platform_admin: 404
          finance_admin: 404

  adminRevealIncomingTransferIban:
    method: GET
    path: /api/v1/admin/incoming-transfers/{transfer_id}/iban
    action: payments.iban.reveal
    path_params: { transfer_id: tr_unmatched }
    query: { field: sender }
    headers: { X-Koro-Access-Reason: "Matris: iade EFT'si için IBAN gerekli" }
    note: BE-129 the sender's IBAN (maybe a natural person's); reason required, audited
    expect:
      anonymous: 401
      "@no_platform_role": 403
      "@other_staff": 403
      platform_admin: 200
      finance_admin: 200
    variants:
      - name: return_target
        path_params: { transfer_id: tr_return_requested }
        query: { field: return_target }
        expect:
          anonymous: 401
          "@no_platform_role": 403
          "@other_staff": 403
          platform_admin: 200
          finance_admin: 200
      - name: no_return
        query: { field: return_target }
        note: an unmatched transfer has no return target — 404 after authz
        expect:
          anonymous: 401
          "@no_platform_role": 403
          "@other_staff": 403
          platform_admin: 404
          finance_admin: 404

  adminDownloadIncomingTransferReceipt:
    method: GET
    path: /api/v1/admin/incoming-transfers/{transfer_id}/receipt
    action: payments.transfer.read
    path_params: { transfer_id: tr_collect_free }
    note: BE-129 the transfer's bank receipt, a 5-minute URL, every download audited
    expect:
      anonymous: 401
      "@no_platform_role": 403
      "@other_staff": 403
      platform_admin: 200
      finance_admin: 200
    variants:
      - name: no_receipt
        path_params: { transfer_id: tr_unmatched_b }
        expect:
          anonymous: 401
          "@no_platform_role": 403
          "@other_staff": 403
          platform_admin: 404
          finance_admin: 404

  adminCreateIncomingTransfer:
    method: POST
    path: /api/v1/admin/incoming-transfers
    action: payments.transfer.create
    body: bodies/payments/create_transfer.json
    expect:
      anonymous: 401
      "@no_platform_role": 403
      "@other_staff": 403
      platform_admin: 403     # 03 §5.16: create is fin only
      finance_admin: 201
    variants:
      - name: pending_account
        body: bodies/payments/create_transfer_pending_account.json
