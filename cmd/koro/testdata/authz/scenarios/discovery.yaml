# Multi-step scenarios of the discovery module (03 §7.7; BE-051).
version: 1
scenarios:
  discovery_no_entitlement:
    note: >-
      "Hak yok" (03 §7.7, k20): company_b searches with its discovery_access right; once its rights are
      reset, searching and reading a pseudonym are 403 entitlements.not_entitled (after the role check:
      company_a's roles still search).
    steps:
      - { persona: other_company_member, operation: searchDiscovery, path_params: { org_id: company_b }, expect: 200 }
      - { hook: entitlements.reset, args: { org: company_b } }
      - { persona: other_company_member, operation: searchDiscovery, path_params: { org_id: company_b },
          expect: 403, code: entitlements.not_entitled }
      - { persona: other_company_member, operation: getDiscoveryProfile,
          path_params: { org_id: company_b, anon_id: "literal:ael3ea4fuqkpycbd" }, expect: 403, code: entitlements.not_entitled }
      - { persona: company_member, operation: searchDiscovery, path_params: { org_id: company_a }, expect: 200 }
      - { persona: platform_admin, operation: searchDiscovery, path_params: { org_id: company_b }, expect: 403, code: forbidden }
  discovery_no_longer_discoverable:
    note: a student who turns level 2 off is not found under a pseudonym the company already holds (04 §2.10)
    steps:
      - { persona: company_member, operation: getDiscoveryProfile, expect: 200 }
      - { hook: discovery.hide, args: { student: student_granted } }
      - { persona: company_member, operation: getDiscoveryProfile, expect: 404, code: not_found }
      - { persona: company_admin, operation: getDiscoveryProfile, expect: 404, code: not_found }
  discovery_needs_mfa:
    note: company_admin's role path is k-mfa (03 §6.4); the recruiter's is not
    steps:
      - { persona: company_admin, mfa: false, operation: searchDiscovery, expect: 403, code: authz.mfa_required }
      - { persona: company_member, mfa: false, operation: searchDiscovery, expect: 200 }
      - { persona: company_admin, operation: searchDiscovery, expect: 200 }
