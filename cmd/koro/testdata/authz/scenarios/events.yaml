# Multi-step scenarios of the events module (03 §7.7; BE-024, BE-026, BE-028).
version: 1
scenarios:
  update_event_needs_if_match:
    note: updateEvent without If-Match is 428, with a stale ETag 412 (04 §1.13)
    steps:
      - { persona: club_admin, operation: updateEvent, headers: { If-Match: "" }, expect: 428, code: precondition_required }
      - { persona: club_admin, operation: updateEvent, headers: { If-Match: '"0"' }, expect: 412, code: precondition_failed }
      - { persona: club_admin, operation: updateEvent, expect: 200 }
      - { persona: club_admin, operation: updateEvent, expect: 412, code: precondition_failed }
  publish_needs_published_form:
    note: >-
      a new event has an empty form draft only: publishing it is 422 events.form_required (versions are
      BE-026); event_a_draft has a published version and is published once (a second publication is 409)
    steps:
      - { persona: club_admin, operation: createEvent, expect: 201, save: { new_event: event_id } }
      - { persona: club_admin, operation: publishEvent, path_params: { event_id: new_event }, expect: 422,
          code: events.form_required }
      - { persona: club_admin, operation: publishEvent, expect: 200 }
      - { persona: club_admin, operation: publishEvent, expect: 409, code: events.invalid_state }
  only_drafts_are_deleted:
    note: a published event is cancelled, never deleted (409); a draft is deleted once
    steps:
      - { persona: club_admin, operation: deleteEventDraft, path_params: { event_id: event_a }, expect: 409,
          code: events.invalid_state }
      - { persona: club_admin, operation: deleteEventDraft, expect: 204 }
      - { persona: club_admin, operation: deleteEventDraft, expect: 404, code: not_found }
      - { persona: club_admin, operation: getEvent, path_params: { event_id: event_a }, expect: 200 }
  cancelled_event_is_final:
    note: a cancelled event takes no second cancellation and no edit (409 events.invalid_state)
    steps:
      - { persona: club_admin, operation: cancelEvent, expect: 200 }
      - { persona: club_admin, operation: cancelEvent, expect: 409, code: events.invalid_state }
      - { persona: club_admin, operation: updateEvent, expect: 409, code: events.invalid_state }
      - { persona: anonymous, operation: getEvent, path_params: { event_id: event_a }, expect: 200 }
  another_orgs_draft_is_invisible:
    note: >-
      06 H-38 — a draft of club_a does not exist for club_b's admin (404 on every management call);
      staff need an existing account (404) and are added once (409)
    steps:
      - { persona: club_admin, operation: createEvent, expect: 201, save: { draft_a: event_id } }
      - { persona: other_club_admin, operation: getEvent, path_params: { event_id: draft_a }, expect: 404, code: not_found }
      - { persona: other_club_admin, operation: addEventStaff, path_params: { event_id: draft_a }, expect: 404,
          code: not_found }
      - { persona: other_club_admin, operation: deleteEventDraft, path_params: { event_id: draft_a }, expect: 404,
          code: not_found }
      - { persona: club_admin, operation: addEventStaff, path_params: { event_id: draft_a },
          body: bodies/events/add_staff_unknown.json, expect: 404, code: not_found }
      - { persona: club_admin, operation: addEventStaff, path_params: { event_id: draft_a }, expect: 201 }
      - { persona: club_admin, operation: addEventStaff, path_params: { event_id: draft_a }, expect: 409,
          code: events.staff_exists }
  schedule_change_of_published_event:
    note: a published event's new date is accepted with the current ETag (attendees get event.schedule_changed)
    steps:
      - { persona: club_admin, operation: updateEvent, body: bodies/events/update_event_schedule.json, expect: 200 }
      - { persona: club_member, operation: updateEvent, body: bodies/events/update_event_schedule.json, expect: 403,
          code: forbidden }
  form_draft_needs_if_match:
    note: putEventFormDraft without If-Match is 428, with a stale ETag 412; a save makes the read ETag stale (04 §1.13)
    steps:
      - { persona: club_admin, operation: putEventFormDraft, headers: { If-Match: "" }, expect: 428, code: precondition_required }
      - { persona: club_admin, operation: putEventFormDraft, headers: { If-Match: '"0"' }, expect: 412, code: precondition_failed }
      - { persona: club_admin, operation: putEventFormDraft, expect: 200 }
      - { persona: club_admin, operation: putEventFormDraft, expect: 412, code: precondition_failed }
      - { persona: club_admin, operation: getEventFormDraft, expect: 200 }
  form_lint_blocks_and_needs_reasons:
    note: >-
      KVKK lint (02 §11.4, T-133) — a national ID field is never published (422, even with a reason); a
      health field needs lint_override_reason (422 without, 201 with)
    steps:
      - { persona: club_admin, operation: putEventFormDraft, body: bodies/events/put_form_draft_blocked.json, expect: 200 }
      - { persona: club_admin, operation: publishEventForm, expect: 422, code: events.form_blocked_field }
      - { persona: club_admin, operation: publishEventForm, body: bodies/events/publish_form_reason.json, expect: 422,
          code: events.form_blocked_field }
      - { persona: club_admin, operation: putEventFormDraft, path_params: { event_id: event_a_draft },
          body: bodies/events/put_form_draft_sensitive.json, expect: 200 }
      - { persona: club_admin, operation: publishEventForm, path_params: { event_id: event_a_draft }, expect: 422,
          code: events.lint_override_required }
      - { persona: club_admin, operation: publishEventForm, path_params: { event_id: event_a_draft },
          body: bodies/events/publish_form_reason.json, expect: 201 }
      - { persona: club_admin, operation: getEventForm, path_params: { event_id: event_a_draft }, expect: 200 }
  form_versions_are_not_duplicated:
    note: the draft becomes version 2 and the current form; publishing the same draft again is 409 events.form_unchanged
    steps:
      - { persona: club_admin, operation: publishEventForm, expect: 201 }
      - { persona: club_admin, operation: publishEventForm, expect: 409, code: events.form_unchanged }
      - { persona: anonymous, operation: getEventForm, expect: 200 }
  another_orgs_form_is_invisible:
    note: >-
      06 H-38, 03 §3.6 — club_b's admin does not see club_a's form draft (404 on read, write and publish), a member of
      club_a without the role gets 403; the published form stays public
    steps:
      - { persona: other_club_admin, operation: getEventFormDraft, expect: 404, code: not_found }
      - { persona: other_club_admin, operation: putEventFormDraft, expect: 404, code: not_found }
      - { persona: other_club_admin, operation: publishEventForm, expect: 404, code: not_found }
      - { persona: club_member, operation: putEventFormDraft, expect: 403, code: forbidden }
      - { persona: other_club_admin, operation: getEventForm, expect: 200 }
  lint_rule_pattern_must_be_re2:
    note: a pattern that does not compile as RE2 is 422 (02 §11.5); a valid one is created and can be retired
    steps:
      - { persona: dpo, operation: adminCreateFormLintRule, body: bodies/events/create_lint_rule_bad.json, expect: 422,
          code: validation_failed }
      - { persona: dpo, operation: adminCreateFormLintRule, expect: 201 }
      - { persona: platform_admin, operation: adminUpdateFormLintRule, expect: 200 }
      - { persona: club_admin, operation: adminListFormLintRules, expect: 403, code: forbidden }
  consent_field_needs_a_published_text:
    note: >-
      a consent field asks a per-registration consent purpose; without a published consent text of
      event_sponsor_share (none in the consent fixtures) the form is not published (422, consent wired)
    steps:
      - { persona: club_admin, operation: putEventFormDraft, body: bodies/events/put_form_draft_consent.json, expect: 200 }
      - { persona: club_admin, operation: publishEventForm, expect: 422, code: validation_failed }
      - { persona: club_admin, operation: getEventForm, expect: 200 }
  break_glass:
    note: >-
      03 §7.7 "Break-glass" — support lists an event's registrations only with X-Koro-Access-Reason (403
      authz.break_glass_reason_required without), the access is audited; a sensitive club's event is 404 even
      with a reason (Y2)
    steps:
      - { persona: support, operation: listEventRegistrations, expect: 403, code: authz.break_glass_reason_required }
      - { persona: support, operation: listEventRegistrations,
          headers: { X-Koro-Access-Reason: "Destek talebi 4711: kayıt sorunu inceleniyor" }, expect: 200 }
      - { persona: support, operation: listEventRegistrations, path_params: { event_id: event_sensitive },
          headers: { X-Koro-Access-Reason: "Destek talebi 4711: kayıt sorunu inceleniyor" }, expect: 404, code: not_found }
      - { persona: support, operation: getEventRegistration, expect: 403, code: authz.break_glass_reason_required }
      - { persona: platform_admin, operation: getEventRegistration,
          headers: { X-Koro-Access-Reason: "Destek talebi 4711: kayıt sorunu inceleniyor" }, expect: 200 }
  registration_lifecycle:
    note: >-
      a verified student registers once (201, then 409 events.already_registered with a new key), reads and
      cancels their own registration; nobody else sees it (404); a cancelled one is not cancelled twice (409)
    steps:
      - { persona: other_club_admin, operation: createRegistration, path_params: { event_id: event_reg }, expect: 201,
          save: { new_reg: registration_id } }
      - { persona: other_club_admin, operation: createRegistration, path_params: { event_id: event_reg }, expect: 409,
          code: events.already_registered }
      - { persona: other_club_admin, operation: getMyRegistration, path_params: { registration_id: new_reg }, expect: 200 }
      - { persona: student, operation: getMyRegistration, path_params: { registration_id: new_reg }, expect: 404,
          code: not_found }
      - { persona: club_admin, operation: getEventRegistration, path_params: { event_id: event_reg, registration_id: new_reg },
          expect: 200 }
      - { persona: other_club_admin, operation: cancelMyRegistration, path_params: { registration_id: new_reg }, expect: 200 }
      - { persona: other_club_admin, operation: cancelMyRegistration, path_params: { registration_id: new_reg }, expect: 409,
          code: events.invalid_state }
  registration_rules:
    note: >-
      k-uv — an account without a student verification gets 403 students.verification_required; invalid answers
      are 422; a full event without a waiting list is 409 events.capacity_full
    steps:
      - { persona: user_unverified, operation: createRegistration, expect: 403, code: students.verification_required }
      - { persona: student, operation: createRegistration, body: bodies/events/create_registration_invalid.json,
          expect: 422, code: validation_failed }
      - { persona: club_member, operation: createRegistration, path_params: { event_id: event_full }, expect: 409,
          code: events.capacity_full }
      - { persona: club_member, operation: createRegistration, expect: 201 }
  manual_decision:
    note: a pending application is decided once (200, then 409 events.invalid_state); the student sees it confirmed
    steps:
      - { persona: club_member, operation: decideEventRegistration, expect: 403, code: forbidden }
      - { persona: club_admin, operation: decideEventRegistration, expect: 200 }
      - { persona: club_admin, operation: decideEventRegistration, expect: 409, code: events.invalid_state }
      - { persona: student, operation: getMyRegistration, path_params: { registration_id: reg_pending }, expect: 200 }

