# Multi-step scenarios of the feed module (03 §7.7; BE-027).
version: 1
scenarios:
  feed_update_post_needs_if_match:
    note: updatePost without If-Match is 428, with a stale ETag 412 (04 §1.13)
    steps:
      - { persona: club_admin, operation: updatePost, headers: { If-Match: "" }, expect: 428, code: precondition_required }
      - { persona: club_admin, operation: updatePost, headers: { If-Match: '"0"' }, expect: 412, code: precondition_failed }
      - { persona: club_admin, operation: updatePost, expect: 200 }
      - { persona: club_admin, operation: updatePost, expect: 412, code: precondition_failed }
  feed_published_post_keeps_its_audience:
    note: a published post's audience cannot change (409 feed.published_immutable); a draft's can
    steps:
      - { persona: club_admin, operation: updatePost, body: bodies/feed/update_post_audience.json, expect: 409,
          code: feed.published_immutable }
      - { persona: club_admin, operation: updatePost, path_params: { post_id: post_a_draft },
          body: bodies/feed/update_post_audience.json, expect: 200 }
  feed_publish_once:
    note: a draft is published once; a second publication is 409 feed.invalid_state
    steps:
      - { persona: club_admin, operation: publishPost, expect: 200 }
      - { persona: club_admin, operation: publishPost, expect: 409, code: feed.invalid_state }
      - { persona: anonymous, operation: getPost, path_params: { post_id: post_a_draft }, expect: 200 }
  feed_new_company_post_waits_for_review:
    note: company_a is new (T-15) — its published draft is pending_review, invisible to readers
    steps:
      - { persona: company_member, operation: publishPost, path_params: { post_id: post_company_draft }, expect: 200 }
      - { persona: student, operation: getPost, path_params: { post_id: post_company_draft }, expect: 404,
          code: not_found }
      - { persona: company_admin, operation: publishPost, path_params: { post_id: post_company_draft }, expect: 409,
          code: feed.invalid_state }
  feed_another_orgs_draft_is_invisible:
    note: 06 H-38 — a draft of club_a does not exist for club_b's admin (404 on every management call)
    steps:
      - { persona: club_admin, operation: createPost, expect: 201, save: { draft_a: post_id } }
      - { persona: other_club_admin, operation: getPost, path_params: { post_id: draft_a }, expect: 404, code: not_found }
      - { persona: other_club_admin, operation: publishPost, path_params: { post_id: draft_a }, expect: 404,
          code: not_found }
      - { persona: other_club_admin, operation: deletePost, path_params: { post_id: draft_a }, expect: 404,
          code: not_found }
      - { persona: club_admin, operation: publishPost, path_params: { post_id: draft_a }, expect: 200 }
      - { persona: anonymous, operation: getPost, path_params: { post_id: draft_a }, expect: 200 }
  feed_tiptap_body_allow_list:
    note: a node outside the Tiptap allow-list (an image in the body) is 422 (05 §14.6)
    steps:
      - { persona: club_admin, operation: createPost, body: bodies/feed/create_post_bad_body.json, expect: 422,
          code: validation_failed }
      - { persona: club_admin, operation: createPost, expect: 201 }
  feed_removed_post_is_gone:
    note: a published post is removed once; readers and the author then get 404, moderators still see it
    steps:
      - { persona: club_admin, operation: deletePost, path_params: { post_id: post_a }, expect: 204 }
      - { persona: anonymous, operation: getPost, expect: 404, code: not_found }
      - { persona: club_admin, operation: deletePost, path_params: { post_id: post_a }, expect: 404, code: not_found }
      - { persona: moderator, operation: getPost, expect: 200 }
  feed_like_and_save_are_idempotent:
    note: 04 §F.3 — a repeated PUT is one like (the count is pinned by the service and PostgreSQL tests)
    steps:
      - { persona: student, operation: likePost, expect: 204 }
      - { persona: student, operation: likePost, expect: 204 }
      - { persona: student, operation: savePost, expect: 204 }
      - { persona: student, operation: savePost, expect: 204 }
      - { persona: club_admin, operation: getPostStats, expect: 200 }
      - { persona: student, operation: unlikePost, expect: 204 }
      - { persona: student, operation: unlikePost, expect: 204 }
      - { persona: student, operation: listMySavedPosts, expect: 200 }
      - { persona: student, operation: likePost, path_params: { post_id: post_a_draft }, expect: 404, code: not_found }
  feed_unlike_after_removal_is_the_likers_only:
    note: on a removed post only a reader who liked it can still take the like back; others get 404 (no leak)
    steps:
      - { persona: student, operation: likePost, expect: 204 }
      - { persona: club_admin, operation: deletePost, path_params: { post_id: post_a }, expect: 204 }
      - { persona: club_member, operation: likePost, expect: 404, code: not_found }
      - { persona: club_member, operation: unlikePost, expect: 404, code: not_found }
      - { persona: student, operation: unlikePost, expect: 204 }
      - { persona: student, operation: unlikePost, expect: 404, code: not_found }
  feed_follow_mute_cycle:
    note: follow, mute and their reversals are idempotent PUT/DELETE pairs (04 §F.5)
    steps:
      - { persona: student_minor, operation: followOrg, expect: 204 }
      - { persona: student_minor, operation: followOrg, expect: 204 }
      - { persona: student_minor, operation: listMyFollows, expect: 200 }
      - { persona: student_minor, operation: unfollowOrg, expect: 204 }
      - { persona: student_minor, operation: unfollowOrg, expect: 204 }
      - { persona: student_minor, operation: muteOrg, expect: 204 }
      - { persona: student_minor, operation: hidePost, expect: 204 }
      - { persona: student_minor, operation: getFeed, expect: 200 }
      - { persona: student_minor, operation: unmuteOrg, expect: 204 }
      - { persona: student_minor, operation: listMyMutes, expect: 200 }
      - { persona: student_minor, operation: muteOrg, path_params: { org_id: "literal:00000000-0000-7000-8000-0000000000aa" },
          expect: 404, code: not_found }
  # ---- BE-032
  feed_targeted_post_no_entitlement:
    note: >-
      "Hak yok" (03 §7.7, T-58): company_b's rights are reset → its targeted post is 403 entitlements.not_entitled;
      a club's post to its own members needs no right; a finance admin's grant makes it work again.
    steps:
      - { persona: other_company_member, operation: createTargetedPost, path_params: { org_id: company_b },
          body: bodies/feed/create_targeted_uni.json, expect: 201 }
      - { hook: entitlements.reset, args: { org: company_b } }
      - { persona: other_company_member, operation: createTargetedPost, path_params: { org_id: company_b },
          body: bodies/feed/create_targeted_uni.json, expect: 403, code: entitlements.not_entitled }
      - { persona: other_club_admin, operation: createTargetedPost, path_params: { org_id: club_b },
          body: bodies/feed/create_targeted_club_b.json, expect: 201 }
      - { persona: finance_admin, operation: adminGrantEntitlement, path_params: { org_id: company_b },
          body: bodies/feed/grant_targeted_post.json, expect: 201 }
      - { persona: other_company_member, operation: createTargetedPost, path_params: { org_id: company_b },
          body: bodies/feed/create_targeted_uni.json, expect: 201 }
  feed_targeted_post_scope_k16:
    note: >-
      03 k16, Y2, k ≥ 10 — a company's small audience is 422 outreach.audience_too_small (no number), a sensitive
      club 422 outreach.sensitive_target; a club targets its own members only; a sensitive club's admin addresses
      its members (no count) and publishes; the draft's audience never changes.
    steps:
      - { persona: company_member, operation: createTargetedPost, path_params: { org_id: company_a },
          body: bodies/feed/create_targeted_small.json, expect: 422, code: outreach.audience_too_small }
      - { persona: company_member, operation: createTargetedPost, path_params: { org_id: company_a },
          body: bodies/feed/create_targeted_sensitive.json, expect: 422, code: outreach.sensitive_target }
      - { persona: club_admin, operation: createTargetedPost, body: bodies/feed/create_targeted_uni.json, expect: 422,
          code: outreach.target_out_of_scope }
      - { persona: company_member, operation: createTargetedPost, path_params: { org_id: company_a },
          body: bodies/feed/create_targeted_segment.json, expect: 422, code: outreach.audience_too_small }
      - { persona: club_admin_sensitive, operation: createTargetedPost, path_params: { org_id: club_sensitive },
          body: bodies/feed/create_targeted_club_sensitive.json, expect: 201, save: { sensitive_post: post_id } }
      - { persona: club_admin_sensitive, operation: publishPost, path_params: { post_id: sensitive_post }, expect: 200 }
      - { persona: company_member, operation: createTargetedPost, path_params: { org_id: company_a }, expect: 201,
          body: bodies/feed/create_targeted_uni.json, save: { company_draft: post_id } }
      - { persona: company_member, operation: deletePost, path_params: { post_id: company_draft }, expect: 204 }
      - { persona: company_member, operation: deletePost, path_params: { post_id: company_draft }, expect: 404,
          code: not_found }
  feed_report_moderation_cycle:
    note: >-
      04 §F.4 — a repeated report returns the open one (200); an actioned report needs a moderation action; the
      hidden post leaves the readers and comes back on restore; a resolved report takes no other change.
    steps:
      - { persona: club_member, operation: createContentReport, body: bodies/feed/create_report.json, expect: 201 }
      - { persona: club_member, operation: createContentReport, body: bodies/feed/create_report.json, expect: 200 }
      - { persona: club_admin, operation: adminGetReport, expect: 403, code: forbidden }
      - { persona: moderator, operation: adminResolveReport, body: bodies/feed/resolve_actioned.json, expect: 409,
          code: feed.moderation_action_required }
      - { persona: moderator, operation: adminModeratePost, path_params: { post_id: post_a_followers },
          body: bodies/feed/moderate_hide_report.json, expect: 200 }
      - { persona: student, operation: getPost, path_params: { post_id: post_a_followers }, expect: 404, code: not_found }
      - { persona: club_admin, operation: listOrgPostsManage, expect: 200 }
      - { persona: moderator, operation: adminResolveReport, body: bodies/feed/resolve_actioned.json, expect: 200 }
      - { persona: platform_admin, operation: adminResolveReport, body: bodies/feed/resolve_dismissed.json, expect: 409,
          code: feed.invalid_state }
      - { persona: platform_admin, operation: adminModeratePost, path_params: { post_id: post_a_followers },
          body: bodies/feed/moderate_restore.json, expect: 200 }
      - { persona: student, operation: getPost, path_params: { post_id: post_a_followers }, expect: 200 }
      - { persona: moderator, operation: adminListModerationActions, expect: 200 }
  feed_review_queue_approval:
    note: a new company's post waits in review; a moderator approves it once, then readers see it
    steps:
      - { persona: student, operation: getPost, path_params: { post_id: post_company_review }, expect: 404, code: not_found }
      - { persona: moderator, operation: adminListReviewQueue, expect: 200 }
      - { persona: moderator, operation: adminModeratePost, path_params: { post_id: post_company_review },
          body: bodies/feed/moderate_approve.json, expect: 200 }
      - { persona: student, operation: getPost, path_params: { post_id: post_company_review }, expect: 200 }
      - { persona: moderator, operation: adminModeratePost, path_params: { post_id: post_company_review },
          body: bodies/feed/moderate_approve.json, expect: 409, code: feed.invalid_state }
  feed_org_suspension_k17:
    note: >-
      k17 — a moderator neither suspends nor lifts a suspension; a suspended org neither drafts nor publishes (403
      feed.posting_suspended); a platform admin's restriction lifts the suspension (posts go to review).
    steps:
      - { persona: moderator, operation: adminModerateOrg, body: bodies/feed/moderate_org_suspend.json, expect: 403,
          code: forbidden }
      - { persona: platform_admin, operation: adminModerateOrg, body: bodies/feed/moderate_org_suspend.json, expect: 200 }
      - { persona: company_member, operation: createPost, path_params: { org_id: company_a }, expect: 403,
          code: feed.posting_suspended }
      - { persona: company_member, operation: publishPost, path_params: { post_id: post_company_draft }, expect: 403,
          code: feed.posting_suspended }
      - { persona: moderator, operation: adminModerateOrg, body: bodies/feed/moderate_org_restrict.json, expect: 403,
          code: forbidden }
      - { persona: platform_admin, operation: adminModerateOrg, body: bodies/feed/moderate_org_restrict.json, expect: 200 }
      - { persona: company_member, operation: publishPost, path_params: { post_id: post_company_draft }, expect: 200 }
  feed_moderation_needs_mfa:
    note: k-mfa (03 §6.4) — moderator and platform_admin act with an MFA session only
    steps:
      - { persona: moderator, mfa: false, operation: adminListReports, expect: 403, code: authz.mfa_required }
      - { persona: moderator, operation: adminListReports, expect: 200 }
