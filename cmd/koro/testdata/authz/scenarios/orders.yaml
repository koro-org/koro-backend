# Multi-step scenarios of the orders module (03 §7.7; BE-040).
version: 1
scenarios:
  orders_mfa_required:
    config: { orders_seed: true }
    note: >-
      MFA eksik (03 §6.4): the company admin's purchase and the support, platform and finance admins' reads are
      k-mfa role paths — without an MFA-verified session they are 403 authz.mfa_required; a recruiter and a club
      admin need none.
    steps:
      - { persona: company_admin, mfa: false, operation: createOrder, expect: 403, code: authz.mfa_required }
      - { persona: company_admin, mfa: false, operation: listOrgOrders, expect: 403, code: authz.mfa_required }
      - { persona: support, mfa: false, operation: getOrder, expect: 403, code: authz.mfa_required }
      - { persona: finance_admin, mfa: false, operation: adminListOrders, expect: 403, code: authz.mfa_required }
      - { persona: platform_admin, mfa: false, operation: adminResolveOrderLineDispute, expect: 403, code: authz.mfa_required }
      - { persona: company_member, operation: listOrgOrders, expect: 200 }
      - { persona: club_admin, operation: listOrgSales, expect: 200 }
      - { persona: company_admin, operation: createOrder, expect: 201 }
  order_per_buyer_limit:
    note: >-
      BE-038's late binding: off_a_active sells one unit per buyer; the second order of company_a is refused (409
      catalog.per_buyer_limit) — even for its owner — because orders tells catalog what the buyer already holds
      (buyerHeld). (Idempotency-Key replays are service and PostgreSQL tests: the matrix app has no idempotency
      middleware.)
    steps:
      - { persona: company_admin, operation: createOrder, expect: 201 }
      - { persona: company_owner_a, operation: createOrder, expect: 409, code: catalog.per_buyer_limit }
  order_k25_buyer_party:
    note: >-
      03 k25: an order is billed to a verified buyer_company party of the buying company — company_b's party is not
      verified (422 orders.buyer_party_required); company_a's admin cannot bill company_b's party either.
    steps:
      - { persona: other_company_member, operation: createOrder, path_params: { org_id: company_b },
          body: bodies/orders/create_order_b.json, expect: 422, code: orders.buyer_party_required }
      - { persona: company_admin, operation: createOrder, body: bodies/orders/create_order_b.json, expect: 422,
          code: orders.buyer_party_required }
      - { persona: company_admin, operation: createOrder, expect: 201 }
  order_cancel_unpaid:
    config: { orders_seed: true }
    note: >-
      04 §2.15 cancelOrder: an order awaiting payment is cancelled once; a cancelled order has no payment
      instructions (409 orders.invalid_state).
    steps:
      - { persona: company_admin, operation: getOrderPaymentInstructions, expect: 200 }
      - { persona: company_admin, operation: cancelOrder, expect: 200 }
      - { persona: finance_admin, operation: cancelOrder, expect: 409, code: orders.invalid_state }
      - { persona: company_member, operation: getOrderPaymentInstructions, expect: 409, code: orders.invalid_state }
  payment_instructions_without_collection_account:
    config: { orders_seed: true }
    note: >-
      04 §2.15: without Koro's active collection account (payments, BE-041) the instructions are 409
      payments.no_active_collection_account.
    steps:
      - { persona: company_admin, operation: getOrderPaymentInstructions, expect: 200 }
      - { hook: orders.no_collection_account }
      - { persona: company_admin, operation: getOrderPaymentInstructions, expect: 409, code: payments.no_active_collection_account }
  order_line_delivery:
    config: { orders_seed: true }
    note: >-
      04 §C.5: the seller marks a line only on a paid order (409 orders.order_not_paid), once; the buyer confirms
      it; a fulfilled line can no longer be disputed (409 orders.dispute_window_closed).
    steps:
      - { persona: club_admin, operation: markOrderLineFulfilled, path_params: { line_id: ln_a_unpaid }, expect: 409,
          code: orders.order_not_paid }
      - { persona: club_admin, operation: markOrderLineFulfilled, expect: 200 }
      - { persona: club_admin, operation: markOrderLineFulfilled, expect: 409, code: orders.invalid_state }
      - { persona: company_admin, operation: confirmOrderLine, path_params: { line_id: ln_a_paid }, expect: 200 }
      - { persona: company_admin, operation: disputeOrderLine, path_params: { line_id: ln_a_paid }, expect: 409,
          code: orders.dispute_window_closed }
  order_line_dispute:
    config: { orders_seed: true }
    note: >-
      The buyer disputes a marked line inside its window; a disputed line is no longer confirmed; a finance admin
      resolves it with a refund of the whole line (a partial refund is 422, T-291; the line waits for the refund,
      BE-043), and a resolved dispute is not resolved again.
    steps:
      - { persona: company_admin, operation: disputeOrderLine, expect: 200 }
      - { persona: company_admin, operation: confirmOrderLine, expect: 409, code: orders.invalid_state }
      - { persona: finance_admin, operation: adminResolveOrderLineDispute, path_params: { line_id: ln_a_marked },
          body: bodies/orders/resolve_partial.json, expect: 422, code: validation_failed }
      - { persona: finance_admin, operation: adminResolveOrderLineDispute, path_params: { line_id: ln_a_marked },
          body: bodies/orders/resolve_refund.json, expect: 200 }
      - { persona: platform_admin, operation: adminResolveOrderLineDispute, path_params: { line_id: ln_a_marked }, expect: 409,
          code: orders.invalid_state }
