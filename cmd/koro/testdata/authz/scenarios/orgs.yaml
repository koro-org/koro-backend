# Multi-step scenarios of the orgs module (03 §7.7; BE-017).
version: 1
scenarios:
  suspended_org:
    note: >-
      "Askıdaki org" (03 §7.7, §2.3): company_a suspended → its admins' and owner's writes are 403
      orgs.org_suspended, reads stay 200; after reactivation the fixture ETag is stale (the
      suspension changed the org: 412) and the createPost step joins with the feed ticket.
    steps:
      - { persona: platform_admin, operation: adminSuspendOrg, expect: 200 }
      - { persona: company_admin, operation: updateOrg, expect: 403, code: orgs.org_suspended }
      - { persona: company_owner_a, operation: closeOrg, expect: 403, code: orgs.org_suspended }
      - { persona: anonymous, operation: getOrg, expect: 200 }
      - { persona: platform_admin, operation: adminSuspendOrg, expect: 409, code: orgs.invalid_state }
      - { persona: platform_admin, operation: adminReactivateOrg, path_params: { org_id: company_a }, expect: 200 }
      - { persona: company_admin, operation: updateOrg, expect: 412, code: precondition_failed }
  update_needs_if_match:
    note: updateOrg without If-Match is 428, with a stale ETag 412 (04 §1.13)
    steps:
      - { persona: company_admin, operation: updateOrg, headers: { If-Match: "" }, expect: 428, code: precondition_required }
      - { persona: company_admin, operation: updateOrg, headers: { If-Match: '"0"' }, expect: 412, code: precondition_failed }
      - { persona: company_admin, operation: updateOrg, expect: 200 }
      - { persona: company_admin, operation: updateOrg, expect: 412, code: precondition_failed }
  ownership_transfer:
    note: k-own and the transfer target rule (04 §2.2 transferOrgOwnership)
    steps:
      - { persona: company_admin, operation: transferOrgOwnership, expect: 403, code: forbidden }
      - { persona: company_owner_a, operation: transferOrgOwnership, body: bodies/orgs/transfer_to_recruiter.json,
          expect: 422, code: orgs.transfer_target_invalid }
      - { persona: company_owner_a, operation: transferOrgOwnership, expect: 200 }
  close_needs_reauth:
    note: closeOrg is an R operation (03 §6.2); a closed org is hidden from non-members afterwards
    steps:
      - { persona: platform_admin, operation: closeOrg, body: bodies/orgs/close_no_reauth.json, expect: 403,
          code: identity.reauth_required }
      - { persona: platform_admin, operation: closeOrg, body: bodies/orgs/close_wrong_reauth.json, expect: 403,
          code: identity.reauth_failed }
      - { persona: company_owner_a, operation: closeOrg, expect: 200 }
      - { persona: anonymous, operation: getOrg, expect: 404 }
      - { persona: support, operation: getOrg, expect: 200 }
  verify_pending_company:
    note: adminVerifyOrg pending_review → active (public afterwards); verifying again is 409
    steps:
      - { persona: anonymous, operation: getOrg, path_params: { org_id: company_pending }, expect: 404 }
      - { persona: platform_admin, operation: adminVerifyOrg, expect: 200 }
      - { persona: anonymous, operation: getOrg, path_params: { org_id: company_pending }, expect: 200 }
      - { persona: platform_admin, operation: adminVerifyOrg, expect: 409, code: orgs.invalid_state }
  admin_needs_mfa:
    note: platform_admin's org operations are k-mfa role paths (03 §6.4)
    steps:
      - { persona: platform_admin, mfa: false, operation: adminSuspendOrg, expect: 403, code: authz.mfa_required }
      - { persona: platform_admin, operation: adminSuspendOrg, expect: 200 }
  grant_company_only:
    note: >-
      06 H-40 (T-148): an admin grant goes to a company only — a club or a university is 422
      entitlements.org_not_company, a company 201.
    steps:
      - { persona: finance_admin, operation: adminGrantEntitlement, path_params: { org_id: club_a }, expect: 422,
          code: entitlements.org_not_company }
      - { persona: platform_admin, operation: adminGrantEntitlement, path_params: { org_id: uni_a }, expect: 422,
          code: entitlements.org_not_company }
      - { persona: finance_admin, operation: adminGrantEntitlement, expect: 201 }
  role_drop:
    note: >-
      "Rol düşmesi" (03 §7.7, 02 §7.3): club_admin's student verification lapses →
      user.edu_verification_lapsed ends its club_admin membership (orgs.end_lapsed_admin_roles); the row is
      gone from club_a's member surface. The createEvent step (404) joins with the events ticket; the
      persona's static actor still carries the membership here, the real resolver reads hooks.memberships
      (TestActor_MembershipsFromHook).
    steps:
      - { persona: platform_admin, operation: getOrgMember, path_params: { org_id: club_a, membership_id: m_club_admin_club_a },
          headers: { X-Koro-Access-Reason: "Destek talebi 4711: üyelik kaydı inceleniyor" }, expect: 200 }
      - { hook: orgs.edu_lapsed, args: { persona: club_admin } }
      - { persona: platform_admin, operation: getOrgMember, path_params: { org_id: club_a, membership_id: m_club_admin_club_a },
          headers: { X-Koro-Access-Reason: "Destek talebi 4711: üyelik kaydı inceleniyor" }, expect: 404 }
  last_admin:
    note: 03 k6 — club_a's only club_admin cannot leave, be demoted or removed (409 orgs.last_admin)
    steps:
      - { persona: club_admin, operation: leaveMyMembership, path_params: { membership_id: m_club_admin_club_a }, expect: 409,
          code: orgs.last_admin }
      - { persona: club_admin, operation: changeOrgMemberRole, path_params: { membership_id: m_club_admin_club_a },
          body: bodies/orgs/role_member.json, expect: 409, code: orgs.last_admin }
      - { persona: platform_admin, operation: removeOrgMember, path_params: { membership_id: m_club_admin_club_a }, expect: 409,
          code: orgs.last_admin }
      - { persona: club_admin, operation: changeOrgMemberRole, expect: 200 }
      - { persona: club_admin, operation: leaveMyMembership, path_params: { membership_id: m_club_admin_club_a }, expect: 204 }
  join_and_approve:
    note: >-
      joinClub on an approval club leaves the request pending; club_admin approves it once (04 §2.2);
      a second request is 409; an account without a student verification gets students.verification_required
    steps:
      - { persona: student, operation: joinClub, path_params: { club_id: club_a }, expect: 201, save: { join_req: membership_id } }
      - { persona: student, operation: joinClub, path_params: { club_id: club_a }, expect: 409, code: orgs.already_member }
      - { persona: club_admin, operation: approveJoinRequest, path_params: { membership_id: join_req }, expect: 200 }
      - { persona: club_admin, operation: approveJoinRequest, path_params: { membership_id: join_req }, expect: 409,
          code: orgs.member_state }
      - { persona: user_unverified, operation: joinClub, expect: 403, code: students.verification_required }
  invitation_rules:
    note: >-
      acceptOrgInvitation — another account with the token gets 404 (e-mail mismatch), the addressee 200
      once (single use), an expired invitation 409, a minor's club_admin invitation 422 (03 k5, T-55)
    steps:
      - { persona: other_club_admin, operation: acceptOrgInvitation, expect: 404 }
      - { persona: student, operation: acceptOrgInvitation, expect: 200 }
      - { persona: student, operation: acceptOrgInvitation, expect: 404 }
      - { persona: student, operation: acceptOrgInvitation, body: bodies/orgs/accept_expired.json, expect: 409,
          code: orgs.invitation_expired }
      - { persona: student_minor, operation: acceptOrgInvitation, body: bodies/orgs/accept_minor_admin.json, expect: 422,
          code: orgs.club_admin_requires_adult_student }
  break_glass_members:
    note: support lists club_a's members only with X-Koro-Access-Reason (03 §6.3)
    steps:
      - { persona: support, operation: listOrgMembers, expect: 403, code: authz.break_glass_reason_required }
      - { persona: support, operation: listOrgMembers, headers: { X-Koro-Access-Reason: "Destek talebi 4711: üyelik kaydı inceleniyor" },
          expect: 200 }
