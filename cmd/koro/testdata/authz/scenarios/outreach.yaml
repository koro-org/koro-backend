# Multi-step scenarios of the outreach module (03 §7.7; BE-030, BE-035).
version: 1
scenarios:
  sensitive_club_targeting:
    note: >-
      03 k16 and Y2 — a sensitive club's own club_admin (helper club_admin_sensitive) addresses its members:
      the count is allowed but never a number (a sensitive membership is never counted) and the segment is
      saved; a company and the platform never target it (422 outreach.sensitive_target).
    steps:
      - { persona: club_admin_sensitive, operation: countAudience, path_params: { org_id: club_sensitive },
          body: bodies/outreach/count_club_sensitive.json, expect: 200 }
      - { persona: club_admin_sensitive, operation: createSegment, path_params: { org_id: club_sensitive },
          body: bodies/outreach/create_club_sensitive_own.json, expect: 201, save: { seg_sensitive_own: segment_id } }
      - { persona: club_admin_sensitive, operation: getSegment,
          path_params: { org_id: club_sensitive, segment_id: seg_sensitive_own }, expect: 200 }
      - { persona: company_admin, operation: countAudience, path_params: { org_id: company_a },
          body: bodies/outreach/count_club_sensitive.json, expect: 422, code: outreach.sensitive_target }
      - { persona: platform_admin, operation: countAudience, path_params: { org_id: club_sensitive },
          body: bodies/outreach/count_club_sensitive.json, expect: 422, code: outreach.sensitive_target }
  targeting_scope_k16:
    note: >-
      03 k16 — a club_admin targets only its own club, a university_rep only its own university (narrowed by
      department or year); anything else is 422 outreach.target_out_of_scope.
    steps:
      - { persona: club_admin, operation: countAudience, path_params: { org_id: club_a },
          body: bodies/outreach/count_club_b.json, expect: 422, code: outreach.target_out_of_scope }
      - { persona: club_admin, operation: countAudience, path_params: { org_id: club_a },
          body: bodies/outreach/count_company.json, expect: 422, code: outreach.target_out_of_scope }
      - { persona: club_admin, operation: countAudience, path_params: { org_id: club_a },
          body: bodies/outreach/count_club_a.json, expect: 200 }
      - { persona: university_rep, operation: countAudience, path_params: { org_id: uni_a },
          body: bodies/outreach/count_uni_b.json, expect: 422, code: outreach.target_out_of_scope }
      - { persona: university_rep, operation: countAudience, path_params: { org_id: uni_a },
          body: bodies/outreach/count_club_a.json, expect: 422, code: outreach.target_out_of_scope }
      - { persona: university_rep, operation: countAudience, path_params: { org_id: uni_a },
          body: bodies/outreach/count_uni_a.json, expect: 200 }
      - { persona: company_member, operation: countAudience, path_params: { org_id: company_a },
          body: bodies/outreach/count_uni_b.json, expect: 200 }
  segment_lifecycle:
    note: >-
      04 §1.13 — updateSegment needs If-Match (428 without, 412 stale); an archived segment cannot change (409
      outreach.invalid_state); archiving twice changes nothing.
    steps:
      - { persona: company_member, operation: createSegment, path_params: { org_id: company_a }, expect: 201,
          save: { seg_new: segment_id } }
      - { persona: company_admin, operation: getSegment, path_params: { org_id: company_a, segment_id: seg_new },
          expect: 200 }
      - { persona: company_member, operation: updateSegment, path_params: { org_id: company_a, segment_id: seg_new },
          headers: { If-Match: "" }, expect: 428, code: precondition_required }
      - { persona: company_member, operation: updateSegment,
          path_params: { org_id: company_a, segment_id: seg_company_a }, headers: { If-Match: '"0"' },
          expect: 412, code: precondition_failed }
      - { persona: company_admin, operation: archiveSegment, path_params: { org_id: company_a, segment_id: seg_new },
          expect: 200 }
      - { persona: company_admin, operation: archiveSegment, path_params: { org_id: company_a, segment_id: seg_new },
          expect: 200 }
      - { persona: company_member, operation: updateSegment,
          path_params: { org_id: company_a, segment_id: seg_company_a_archived }, expect: 409,
          code: outreach.invalid_state }
      - { persona: company_member, operation: listSegments, path_params: { org_id: company_a },
          query: { archived: "true" }, expect: 200 }
  audience_count_mfa:
    note: >-
      k-mfa (03 §6.4) — company_admin and university_rep count with an MFA session only; company_member
      (recruiter) needs none.
    steps:
      - { persona: company_admin, mfa: false, operation: countAudience, path_params: { org_id: company_a },
          expect: 403, code: authz.mfa_required }
      - { persona: university_rep, mfa: false, operation: countAudience, path_params: { org_id: uni_a },
          body: bodies/outreach/count_uni_a.json, expect: 403, code: authz.mfa_required }
      - { persona: company_member, mfa: false, operation: countAudience, path_params: { org_id: company_a },
          expect: 200 }
  dispatch_k18_lifecycle:
    note: >-
      03 k18, 04 §2.8 (BE-035) — a company's dispatch is commercial and spends one targeted_dispatch unit; one
      dispatch per post (409 outreach.dispatch_exists); cancel while scheduled (a second cancel changes nothing), a
      finished dispatch cannot be cancelled (409 outreach.invalid_state); a commercial dispatch never goes in-app and
      cannot be informational (422); a sensitive club is never a company's target (422); only a targeted post is
      dispatched (422 outreach.post_not_targeted); without a unit 403 entitlements.not_entitled ("Hak yok").
    steps:
      - { persona: company_member, operation: createDispatch, path_params: { post_id: tpost_company_a },
          body: bodies/outreach/dispatch_push.json, expect: 201, save: { disp_new: dispatch_id } }
      - { persona: company_admin, operation: createDispatch, path_params: { post_id: tpost_company_a },
          body: bodies/outreach/dispatch_push.json, expect: 409, code: outreach.dispatch_exists }
      - { persona: company_admin, operation: getDispatch, path_params: { org_id: company_a, dispatch_id: disp_new },
          expect: 200 }
      - { persona: company_admin, operation: cancelDispatch, path_params: { org_id: company_a, dispatch_id: disp_new },
          expect: 200 }
      - { persona: company_member, operation: cancelDispatch, path_params: { org_id: company_a, dispatch_id: disp_new },
          expect: 200 }
      - { persona: company_admin, operation: cancelDispatch,
          path_params: { org_id: company_a, dispatch_id: disp_company_a }, expect: 409, code: outreach.invalid_state }
      - { persona: company_admin, operation: createDispatch, path_params: { post_id: tpost_company_a_free },
          body: bodies/outreach/dispatch_in_app.json, expect: 422, code: validation_failed }
      - { persona: company_admin, operation: createDispatch, path_params: { post_id: tpost_company_a_free },
          body: bodies/outreach/dispatch_not_commercial.json, expect: 422, code: validation_failed }
      - { persona: company_admin, operation: createDispatch, path_params: { post_id: tpost_company_sensitive },
          body: bodies/outreach/dispatch_push.json, expect: 422, code: outreach.sensitive_target }
      - { persona: company_admin, operation: createDispatch, path_params: { post_id: post_company },
          body: bodies/outreach/dispatch_push.json, expect: 422, code: outreach.post_not_targeted }
      - { hook: entitlements.reset, args: { org: company_a } }
      - { persona: company_admin, operation: createDispatch, path_params: { post_id: tpost_company_a_free },
          body: bodies/outreach/dispatch_push.json, expect: 403, code: entitlements.not_entitled }
  dispatch_scope_t258:
    note: >-
      T-258, 03 k16 (BE-035) — a sensitive club's own club_admin notifies its members (the member list, no count);
      nobody else reaches a club's or a university's post (404 outside the org); a club_admin addresses only its own
      members.
    steps:
      - { persona: club_admin_sensitive, operation: createDispatch, path_params: { post_id: tpost_sensitive },
          body: bodies/outreach/dispatch_in_app.json, expect: 201, save: { disp_sensitive: dispatch_id } }
      - { persona: club_admin_sensitive, operation: getDispatch,
          path_params: { org_id: club_sensitive, dispatch_id: disp_sensitive }, expect: 200 }
      - { persona: club_admin, operation: createDispatch, path_params: { post_id: tpost_sensitive },
          body: bodies/outreach/dispatch_in_app.json, expect: 404 }
      - { persona: university_rep, operation: createDispatch, path_params: { post_id: tpost_club_a },
          body: bodies/outreach/dispatch_in_app.json, expect: 404 }
      - { persona: club_admin, operation: createDispatch, path_params: { post_id: tpost_club_a },
          body: bodies/outreach/dispatch_in_app.json, expect: 201 }
  dispatch_mfa:
    note: >-
      k-mfa (03 §6.4) — company_admin dispatches with an MFA session only; company_member (recruiter) needs none.
    steps:
      - { persona: company_admin, mfa: false, operation: createDispatch, path_params: { post_id: tpost_company_a },
          body: bodies/outreach/dispatch_push.json, expect: 403, code: authz.mfa_required }
      - { persona: company_member, mfa: false, operation: createDispatch, path_params: { post_id: tpost_company_a },
          body: bodies/outreach/dispatch_push.json, expect: 201 }
