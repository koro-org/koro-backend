# Multi-step scenarios of the parties module (03 §7.7; BE-036, BE-037).
version: 1
scenarios:
  verify_then_change_reverifies:
    note: >-
      A new buyer party waits for finance (pending_verification); a decided party is 409; a change
      to a verified party sends it back to pending_verification (04 §2.13), a stale If-Match is 412
      and finance verifies it again.
    steps:
      - { persona: company_admin, operation: createBuyerLegalParty, expect: 201, save: { new_buyer: party_id } }
      - { persona: company_admin, operation: adminVerifyLegalParty, path_params: { party_id: new_buyer }, expect: 403,
          code: forbidden }
      - { persona: finance_admin, operation: adminVerifyLegalParty, path_params: { party_id: new_buyer }, expect: 200 }
      - { persona: platform_admin, operation: adminVerifyLegalParty, path_params: { party_id: new_buyer }, expect: 409,
          code: parties.invalid_state }
      - { persona: company_admin, operation: updateLegalParty, expect: 200 }
      - { persona: company_admin, operation: updateLegalParty, expect: 412, code: precondition_failed }
      - { persona: platform_admin, operation: adminVerifyLegalParty, path_params: { party_id: party_buyer_a }, expect: 200 }
  document_four_eyes:
    note: >-
      The uploader of a document never verifies it (four eyes, like 06 H-19): platform_admin uploads
      through club_a's surface, is refused, finance_admin verifies; a second verification is 409.
    steps:
      - { persona: platform_admin, operation: uploadLegalPartyDocument, path_params: { org_id: club_a, party_id: party_foundation_a },
          body: bodies/parties/upload_club_a.json, expect: 201, save: { pad_document: document_id } }
      - { persona: platform_admin, operation: adminVerifyLegalPartyDocument, path_params: { document_id: pad_document },
          expect: 403, code: authz.four_eyes_violation }
      - { persona: club_admin, operation: adminVerifyLegalPartyDocument, path_params: { document_id: pad_document },
          expect: 403, code: forbidden }
      - { persona: finance_admin, operation: adminVerifyLegalPartyDocument, path_params: { document_id: pad_document }, expect: 200 }
      - { persona: finance_admin, operation: adminVerifyLegalPartyDocument, path_params: { document_id: pad_document },
          expect: 409, code: parties.invalid_state }
      - { persona: club_admin, operation: downloadLegalPartyDocument,
          path_params: { org_id: club_a, party_id: party_foundation_a, document_id: pad_document }, expect: 200 }
  mfa_required:
    note: company_admin, university_rep and finance_admin cells are k-mfa role paths (03 §6.4)
    steps:
      - { persona: company_admin, mfa: false, operation: createBuyerLegalParty, expect: 403, code: authz.mfa_required }
      - { persona: university_rep, mfa: false, operation: listOrgLegalParties, path_params: { org_id: uni_a }, expect: 403,
          code: authz.mfa_required }
      - { persona: finance_admin, mfa: false, operation: adminListLegalParties, expect: 403, code: authz.mfa_required }
      - { persona: company_admin, operation: createBuyerLegalParty, expect: 201 }
  iban_four_eyes_org_submission:
    note: >-
      03 §7.7 "4 göz – IBAN": club_admin submits a new IBAN for club_a's payee (R); a club admin is no
      eye; finance_admin verifies (first eye) and may not approve it too (four eyes); the second eye
      needs the re-authentication proof (missing / wrong / right); the approval supersedes the
      approved account in the same transaction, which can no longer be revoked.
    steps:
      - { persona: club_admin, operation: submitPayeeBankAccount, expect: 201, save: { new_account: bank_account_id } }
      - { persona: club_admin, operation: adminVerifyBankAccount, path_params: { bank_account_id: new_account },
          expect: 403, code: forbidden }
      - { persona: finance_admin, operation: adminApproveBankAccount, path_params: { bank_account_id: new_account },
          expect: 409, code: parties.invalid_state }
      - { persona: finance_admin, operation: adminVerifyBankAccount, path_params: { bank_account_id: new_account }, expect: 200 }
      - { persona: finance_admin, operation: adminApproveBankAccount, path_params: { bank_account_id: new_account },
          expect: 403, code: authz.four_eyes_violation }
      - { persona: platform_admin, operation: adminApproveBankAccount, path_params: { bank_account_id: new_account },
          body: bodies/parties/approve_account_no_reauth.json, expect: 403, code: identity.reauth_required }
      - { persona: platform_admin, operation: adminApproveBankAccount, path_params: { bank_account_id: new_account },
          body: bodies/parties/approve_account_wrong_reauth.json, expect: 403, code: identity.reauth_failed }
      - { persona: platform_admin, operation: adminApproveBankAccount, path_params: { bank_account_id: new_account }, expect: 200 }
      - { persona: finance_admin, operation: adminRevokeBankAccount, path_params: { bank_account_id: acct_club_a },
          expect: 409, code: parties.invalid_state }
      - { persona: club_admin, operation: listPayeeBankAccounts, expect: 200 }
  iban_four_eyes_admin_submission:
    note: >-
      An admin submission starts pending_approval (the submitter is the first eye): the same admin
      may not approve it (Y6), another admin does.
    steps:
      - { persona: finance_admin, operation: adminSubmitBankAccount, expect: 201, save: { admin_account: bank_account_id } }
      - { persona: finance_admin, operation: adminVerifyBankAccount, path_params: { bank_account_id: admin_account },
          expect: 403, code: authz.four_eyes_violation }
      - { persona: finance_admin, operation: adminApproveBankAccount, path_params: { bank_account_id: admin_account },
          expect: 403, code: authz.four_eyes_violation }
      - { persona: platform_admin, operation: adminApproveBankAccount, path_params: { bank_account_id: admin_account }, expect: 200 }
  iban_holder_mismatch_needs_note:
    note: >-
      T-19: the first eye says the holder is not the legal party's title — a note is required (422),
      with the note the account goes on to the second eye. An invalid IBAN never enters (422).
    steps:
      - { persona: finance_admin, operation: adminVerifyBankAccount, body: bodies/parties/verify_account_mismatch.json,
          expect: 422, code: validation_failed }
      - { persona: finance_admin, operation: adminVerifyBankAccount, body: bodies/parties/verify_account_mismatch_note.json,
          expect: 200 }
      - { persona: club_admin, operation: submitPayeeBankAccount, body: bodies/parties/submit_account_invalid_iban.json,
          expect: 422, code: parties.iban_invalid }
  iban_mfa_required:
    note: finance_admin and university_rep cells are k-mfa role paths (03 §6.4); club_admin is not
    steps:
      - { persona: finance_admin, mfa: false, operation: adminListBankAccounts, expect: 403, code: authz.mfa_required }
      - { persona: university_rep, mfa: false, operation: listOrgPayees, path_params: { org_id: uni_a }, expect: 403,
          code: authz.mfa_required }
      - { persona: finance_admin, operation: adminListBankAccounts, expect: 200 }
  ownership_correction:
    note: >-
      06 H-60: company_admin registers its own VKN, which company_b's party holds (409); finance may
      not correct it (403), platform_admin retires the wrong party with the evidence, and the owner
      registers.
    steps:
      - { persona: company_admin, operation: createBuyerLegalParty, body: bodies/parties/create_buyer_taken.json,
          expect: 409, code: parties.tax_id_taken }
      - { persona: finance_admin, operation: adminCorrectLegalPartyOwnership, expect: 403, code: forbidden }
      - { persona: platform_admin, operation: adminCorrectLegalPartyOwnership, expect: 200 }
      - { persona: platform_admin, operation: adminCorrectLegalPartyOwnership, expect: 409, code: parties.invalid_state }
      - { persona: company_admin, operation: createBuyerLegalParty, body: bodies/parties/create_buyer_taken.json, expect: 201 }
