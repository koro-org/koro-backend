# Multi-step scenarios of the parties module (03 §7.7; BE-036).
version: 1
scenarios:
  verify_then_change_reverifies:
    note: >-
      A new buyer party waits for finance (pending_verification); a decided party is 409; a change
      to a verified party sends it back to pending_verification (04 §2.13), a stale If-Match is 412
      and finance verifies it again.
    steps:
      - { persona: company_admin, operation: createBuyerLegalParty, expect: 201, save: { new_buyer: party_id } }
      - { persona: company_admin, operation: adminVerifyLegalParty, path_params: { party_id: new_buyer }, expect: 403,
          code: forbidden }
      - { persona: finance_admin, operation: adminVerifyLegalParty, path_params: { party_id: new_buyer }, expect: 200 }
      - { persona: platform_admin, operation: adminVerifyLegalParty, path_params: { party_id: new_buyer }, expect: 409,
          code: parties.invalid_state }
      - { persona: company_admin, operation: updateLegalParty, expect: 200 }
      - { persona: company_admin, operation: updateLegalParty, expect: 412, code: precondition_failed }
      - { persona: platform_admin, operation: adminVerifyLegalParty, path_params: { party_id: party_buyer_a }, expect: 200 }
  document_four_eyes:
    note: >-
      The uploader of a document never verifies it (four eyes, like 06 H-19): platform_admin uploads
      through club_a's surface, is refused, finance_admin verifies; a second verification is 409.
    steps:
      - { persona: platform_admin, operation: uploadLegalPartyDocument, path_params: { org_id: club_a, party_id: party_foundation_a },
          body: bodies/parties/upload_club_a.json, expect: 201, save: { pad_document: document_id } }
      - { persona: platform_admin, operation: adminVerifyLegalPartyDocument, path_params: { document_id: pad_document },
          expect: 403, code: authz.four_eyes_violation }
      - { persona: club_admin, operation: adminVerifyLegalPartyDocument, path_params: { document_id: pad_document },
          expect: 403, code: forbidden }
      - { persona: finance_admin, operation: adminVerifyLegalPartyDocument, path_params: { document_id: pad_document }, expect: 200 }
      - { persona: finance_admin, operation: adminVerifyLegalPartyDocument, path_params: { document_id: pad_document },
          expect: 409, code: parties.invalid_state }
      - { persona: club_admin, operation: downloadLegalPartyDocument,
          path_params: { org_id: club_a, party_id: party_foundation_a, document_id: pad_document }, expect: 200 }
  mfa_required:
    note: company_admin, university_rep and finance_admin cells are k-mfa role paths (03 §6.4)
    steps:
      - { persona: company_admin, mfa: false, operation: createBuyerLegalParty, expect: 403, code: authz.mfa_required }
      - { persona: university_rep, mfa: false, operation: listOrgLegalParties, path_params: { org_id: uni_a }, expect: 403,
          code: authz.mfa_required }
      - { persona: finance_admin, mfa: false, operation: adminListLegalParties, expect: 403, code: authz.mfa_required }
      - { persona: company_admin, operation: createBuyerLegalParty, expect: 201 }
