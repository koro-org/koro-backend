# Multi-step scenarios of the payments module (03 §7.7; BE-041).
version: 1
scenarios:
  collection_account_four_eyes:
    note: >-
      03 §6.1: the admin who creates a collection account never decides it (403 authz.four_eyes_violation, a
      platform admin's own creation included); another admin approves it once (a second decision is 409), and only
      make-default puts it on the payment instructions.
    steps:
      - { persona: finance_admin, operation: adminCreateCollectionAccount, expect: 201, save: { new_account: account_id } }
      - { persona: finance_admin, operation: adminApproveCollectionAccount, path_params: { account_id: new_account },
          expect: 403, code: authz.four_eyes_violation }
      - { persona: platform_admin, operation: adminApproveCollectionAccount, path_params: { account_id: new_account }, expect: 200 }
      - { persona: finance_admin_2, operation: adminApproveCollectionAccount, path_params: { account_id: new_account },
          body: bodies/payments/reject.json, expect: 409, code: payments.invalid_state }
      - { persona: finance_admin, operation: adminMakeDefaultCollectionAccount, path_params: { account_id: new_account }, expect: 200 }
  collection_account_reauth:
    note: >-
      03 §6.2 (R): the decision on a collection account carries the re-authentication proof — without it 403
      identity.reauth_required, with a wrong one 403 identity.reauth_failed; nothing changes until it is right.
    steps:
      - { persona: platform_admin, operation: adminApproveCollectionAccount, body: bodies/payments/approve_no_reauth.json,
          expect: 403, code: identity.reauth_required }
      - { persona: platform_admin, operation: adminApproveCollectionAccount, body: bodies/payments/approve_wrong_reauth.json,
          expect: 403, code: identity.reauth_failed }
      - { persona: platform_admin, operation: adminApproveCollectionAccount, expect: 200 }
  payments_mfa_required:
    note: platform_admin and finance_admin reach payments only on k-mfa role paths (03 §6.4)
    steps:
      - { persona: finance_admin, mfa: false, operation: adminListIncomingTransfers, expect: 403, code: authz.mfa_required }
      - { persona: platform_admin, mfa: false, operation: adminListCollectionAccounts, expect: 403, code: authz.mfa_required }
      - { persona: finance_admin, mfa: false, operation: adminCreateIncomingTransfer, expect: 403, code: authz.mfa_required }
      - { persona: finance_admin, operation: adminCreateIncomingTransfer, expect: 201 }
  transfer_return_four_eyes:
    note: >-
      06 H-18, H-56: a transfer goes back to its sender in three steps — a finance admin requests it, another
      approves it (the requester gets 403 authz.four_eyes_violation), the EFT receipt closes it once.
    steps:
      - { persona: finance_admin, operation: adminRequestIncomingTransferReturn, expect: 200 }
      - { persona: finance_admin, operation: adminMarkIncomingTransferReturned, path_params: { transfer_id: tr_unmatched_b },
          expect: 409, code: payments.invalid_state }
      - { persona: finance_admin, operation: adminApproveIncomingTransferReturn, path_params: { transfer_id: tr_unmatched_b },
          expect: 403, code: authz.four_eyes_violation }
      - { persona: finance_admin_2, operation: adminApproveIncomingTransferReturn, path_params: { transfer_id: tr_unmatched_b }, expect: 200 }
      - { persona: finance_admin, operation: adminMarkIncomingTransferReturned, path_params: { transfer_id: tr_unmatched_b }, expect: 200 }
      - { persona: finance_admin_2, operation: adminMarkIncomingTransferReturned, path_params: { transfer_id: tr_unmatched_b },
          expect: 409, code: payments.invalid_state }
  transfer_match_once:
    config: { orders_seed: true }
    note: >-
      01 §6.3: the match captures the payment and pays ord_a_unpaid in one go (its payment instructions are then 409
      orders.invalid_state); the same transfer is never captured twice (409 payments.transfer_already_matched).
    steps:
      - { persona: company_admin, operation: getOrderPaymentInstructions, path_params: { order_id: ord_a_unpaid }, expect: 200 }
      - { persona: finance_admin, operation: adminMatchIncomingTransfer, expect: 200 }
      - { persona: finance_admin, operation: adminMatchIncomingTransfer, expect: 409, code: payments.transfer_already_matched }
      - { persona: company_admin, operation: getOrderPaymentInstructions, path_params: { order_id: ord_a_unpaid }, expect: 409,
          code: orders.invalid_state }
  collection_account_hook:
    config: { orders_seed: true }
    note: >-
      hooks.collectionAccount: the payment instructions show Koro's active default account; retiring it leaves none
      (409 payments.no_active_collection_account) until another account is made the default.
    steps:
      - { persona: company_admin, operation: getOrderPaymentInstructions, path_params: { order_id: ord_a_unpaid }, expect: 200 }
      - { persona: finance_admin, operation: adminRetireCollectionAccount, path_params: { account_id: coll_default }, expect: 200 }
      - { persona: company_admin, operation: getOrderPaymentInstructions, path_params: { order_id: ord_a_unpaid }, expect: 409,
          code: payments.no_active_collection_account }
      - { persona: platform_admin, operation: adminMakeDefaultCollectionAccount, expect: 200 }
      - { persona: company_member, operation: getOrderPaymentInstructions, path_params: { order_id: ord_a_unpaid }, expect: 200 }
  refund_four_eyes:
    config: { orders_seed: true }
    note: >-
      03 §6.1, §7.7 "4 göz – iade": the finance admin who requests a refund never approves it (403
      authz.four_eyes_violation); another finance admin approves it once (a second decision is 409); the EFT receipt
      completes it once (ledger refund_completed from buyer_advances, the payment partially refunded, payment.refunded)
      and a completed refund neither completes again nor is rejected. The refund is pay_a's overpayment (the matrix
      ledger holds no allocation of ord_a_paid: a line refund would be 409 ledger.negative_payee_balance there).
    steps:
      - { persona: finance_admin, operation: adminCreateRefund, body: bodies/payments/create_refund_overpayment.json, expect: 201,
          save: { new_refund: refund_id } }
      - { persona: finance_admin, operation: adminApproveRefund, path_params: { refund_id: new_refund },
          expect: 403, code: authz.four_eyes_violation }
      - { persona: finance_admin, operation: adminCompleteRefund, path_params: { refund_id: new_refund },
          expect: 409, code: payments.invalid_state }
      - { persona: finance_admin_2, operation: adminApproveRefund, path_params: { refund_id: new_refund }, expect: 200 }
      - { persona: finance_admin, operation: adminApproveRefund, path_params: { refund_id: new_refund },
          expect: 403, code: authz.four_eyes_violation }
      - { persona: finance_admin_2, operation: adminRejectRefund, path_params: { refund_id: new_refund },
          expect: 409, code: payments.invalid_state }
      - { persona: finance_admin, operation: adminCompleteRefund, path_params: { refund_id: new_refund }, expect: 200 }
      - { persona: finance_admin_2, operation: adminCompleteRefund, path_params: { refund_id: new_refund },
          expect: 409, code: payments.invalid_state }
      - { persona: finance_admin_2, operation: adminGetPayment, expect: 200 }
  refund_four_eyes_platform_admin:
    config: { orders_seed: true }
    note: >-
      03 §5.16: a platform admin may request a refund but never approve one (fin·4·R); a finance admin approves the
      platform admin's request.
    steps:
      - { persona: platform_admin, operation: adminCreateRefund, expect: 201, save: { pad_refund: refund_id } }
      - { persona: platform_admin_2, operation: adminApproveRefund, path_params: { refund_id: pad_refund }, expect: 403 }
      - { persona: finance_admin, operation: adminApproveRefund, path_params: { refund_id: pad_refund }, expect: 200 }
  refund_reauth:
    note: >-
      03 §6.2 (R): the approval of a refund carries the re-authentication proof — without it 403
      identity.reauth_required, with a wrong one 403 identity.reauth_failed; nothing changes until it is right.
    steps:
      - { persona: finance_admin, operation: adminApproveRefund, body: bodies/payments/approve_refund_no_reauth.json,
          expect: 403, code: identity.reauth_required }
      - { persona: finance_admin, operation: adminApproveRefund, body: bodies/payments/approve_refund_wrong_reauth.json,
          expect: 403, code: identity.reauth_failed }
      - { persona: finance_admin, operation: adminApproveRefund, expect: 200 }
  refund_reject_by_requester:
    note: >-
      A refund request may be rejected by any finance admin — its requester included (no money moves); a rejected
      refund is never approved.
    steps:
      - { persona: finance_admin_2, operation: adminRejectRefund, expect: 200 }
      - { persona: finance_admin, operation: adminApproveRefund, expect: 409, code: payments.invalid_state }

  receivable_collection_four_eyes:
    config: { orders_seed: true }
    note: An existing receipt is claimed once; another finance admin with reauthentication approves the cash and debt entry.
    steps:
      - { persona: finance_admin, operation: adminCreateReceivableCollection, expect: 201, save: { new_collection: collection_id } }
      - { persona: finance_admin, operation: adminApproveReceivableCollection, path_params: { collection_id: new_collection }, expect: 403, code: authz.four_eyes_violation }
      - { persona: finance_admin_2, operation: adminApproveReceivableCollection, path_params: { collection_id: new_collection }, body: bodies/payments/approve_refund_no_reauth.json, expect: 403, code: identity.reauth_required }
      - { persona: finance_admin_2, operation: adminApproveReceivableCollection, path_params: { collection_id: new_collection }, expect: 200 }
      - { persona: finance_admin_2, operation: adminApproveReceivableCollection, path_params: { collection_id: new_collection }, expect: 409, code: payments.invalid_state }
      - { persona: finance_admin, operation: adminCreateReceivableCollection, expect: 409, code: payments.invalid_state }
  refund_closure_four_eyes:
    config: { orders_seed: true }
    note: Approved EFT closure keeps its approval, has a different finance eye and reauthentication, and releases the unused refund limit.
    steps:
      - { persona: finance_admin_2, operation: adminCancelRefund, expect: 403, code: authz.four_eyes_violation }
      - { persona: finance_admin, operation: adminCancelRefund, expect: 200 }
      - { persona: finance_admin, operation: adminCompleteRefund, expect: 409, code: payments.invalid_state }
      - { persona: finance_admin, operation: adminMarkRefundFailed, expect: 409, code: payments.invalid_state }
  refund_failed_four_eyes:
    config: { orders_seed: true }
    note: A failed EFT is closed before completion; requester never marks it failed.
    steps:
      - { persona: finance_admin_2, operation: adminMarkRefundFailed, expect: 403, code: authz.four_eyes_violation }
      - { persona: finance_admin, operation: adminMarkRefundFailed, expect: 200 }
      - { persona: finance_admin, operation: adminCompleteRefund, expect: 409, code: payments.invalid_state }
