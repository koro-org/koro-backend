# Multi-step scenarios of the students module (03 §7.7; BE-023, BE-025).
version: 1
scenarios:
  minor:
    note: >-
      "Reşit olmayan" (03 §2.3, k9, Y4): a minor edits the profile and the club/ranking settings, but can
      never turn level 2 (discoverable) or contact sharing on, with or without the consent text; the
      settings stay private. An adult student turns level 2 on with the same request.
    steps:
      - { persona: student_minor, operation: updateMyStudentProfile, expect: 200 }
      - { persona: student_minor, operation: updateMyPrivacy, body: bodies/students/update_privacy_discoverable.json,
          expect: 422, code: students.minor_restricted }
      - { persona: student_minor, operation: updateMyPrivacy, body: bodies/students/update_privacy_discoverable_no_consent.json,
          expect: 422, code: students.minor_restricted }
      - { persona: student_minor, operation: getMyPrivacy, expect: 200 }
      - { persona: student_minor, operation: updateMyPrivacy, expect: 200 }
      - { persona: student, operation: updateMyPrivacy, body: bodies/students/update_privacy_discoverable.json, expect: 200 }
      - { persona: student, operation: updateMyPrivacy, body: bodies/students/update_privacy_contact_off.json, expect: 200 }
  verification_required:
    note: k-uv (03 §2.3) — an account without a student verification gets 403 students.verification_required
    steps:
      - { persona: user_unverified, operation: getMyStudentProfile, expect: 403, code: students.verification_required }
      - { persona: company_admin, operation: updateMyPrivacy, expect: 403, code: students.verification_required }
      - { persona: student, operation: getMyStudentProfile, expect: 200 }
  experience_idor:
    note: an experience is its owner's only — another student 404, a company account 403 before the lookup
    steps:
      - { persona: student_b, operation: createMyExperience, expect: 201, save: { b_experience: experience_id } }
      - { persona: student, operation: updateMyExperience, path_params: { experience_id: b_experience }, expect: 404, code: not_found }
      - { persona: student, operation: deleteMyExperience, path_params: { experience_id: b_experience }, expect: 404, code: not_found }
      - { persona: other_company_member, operation: deleteMyExperience, path_params: { experience_id: b_experience },
          expect: 403, code: students.verification_required }
      - { persona: student_b, operation: updateMyExperience, path_params: { experience_id: b_experience }, expect: 200 }
      - { persona: student_b, operation: deleteMyExperience, path_params: { experience_id: b_experience }, expect: 204 }
  department_of_own_university:
    note: >-
      the university comes from the verification; a department of another university is 422
      students.unknown_department (other_club_admin studies at uni_b, department_a is uni_a's)
    steps:
      - { persona: other_club_admin, operation: updateMyStudentProfile, body: bodies/students/update_profile_department.json,
          expect: 422, code: students.unknown_department }
      - { persona: club_admin, operation: updateMyStudentProfile, body: bodies/students/update_profile_department.json, expect: 200 }
      - { persona: club_admin, operation: getMyStudentProfile, expect: 200 }
  cv_lifecycle:
    note: >-
      BE-025 (02 §9.6, 04 §2.4): a CV is added from the student's cv upload, served, made current and hard
      deleted with its file (the same upload is unknown afterwards); another student never reaches it.
    steps:
      - { persona: student, operation: createMyCv, expect: 201, save: { new_cv: cv_id } }
      - { persona: student, operation: listMyCvs, expect: 200 }
      - { persona: student, operation: downloadMyCv, path_params: { cv_id: new_cv }, expect: 200 }
      - { persona: student_b, operation: deleteMyCv, path_params: { cv_id: new_cv }, expect: 404, code: not_found }
      - { persona: student, operation: setMyCurrentCv, path_params: { cv_id: cv_student }, expect: 200 }
      - { persona: student, operation: deleteMyCv, path_params: { cv_id: new_cv }, expect: 204 }
      - { persona: student, operation: downloadMyCv, path_params: { cv_id: new_cv }, expect: 404, code: not_found }
      - { persona: student, operation: createMyCv, expect: 422, code: validation_failed }
  member_card_sensitive_club:
    note: >-
      03 k10, Y2: the sensitive club's own club_admin reads its member's card (audited); club_a's admin and
      staff never learn the membership exists.
    steps:
      - { persona: club_admin_sensitive, operation: getMemberCard,
          path_params: { org_id: club_sensitive, membership_id: m_club_member_sensitive }, expect: 200 }
      - { persona: club_admin, operation: getMemberCard,
          path_params: { org_id: club_sensitive, membership_id: m_club_member_sensitive }, expect: 404, code: not_found }
      - { persona: platform_admin, operation: getMemberCard,
          path_params: { org_id: club_sensitive, membership_id: m_club_member_sensitive }, expect: 404, code: not_found }
  admin_view_justification:
    note: >-
      03 §6.3, k11: support needs the break-glass reason (authz.break_glass_reason_required); a dpo's free-text
      reason is no data subject request (403); the request ID of the student opens it.
    steps:
      - { persona: support, operation: adminGetStudentProfile, expect: 403, code: authz.break_glass_reason_required }
      - { persona: dpo, operation: adminGetStudentProfile, headers: { X-Koro-Access-Reason: "KVKK başvurusu inceleniyor" },
          expect: 403, code: forbidden }
      - { persona: dpo, operation: adminGetStudentProfile, headers: { X-Koro-Access-Reason: "{{fixture:dsr_student_open}}" },
          expect: 200 }
  access_grant_student_revokes:
    note: >-
      BE-046 (02 §9.7, 03 Y5): company_a reads the level 3 profile of the student who granted it access
      (no CV: 404); the student lists and revokes the grant; the company's next read is 404, its list and its
      own revocation find nothing.
    steps:
      - { persona: company_member, operation: getCompanyStudentProfile, path_params: { org_id: company_a, user_id: student_granted },
          expect: 200 }
      - { persona: company_member, operation: downloadCompanyStudentCv, path_params: { org_id: company_a, user_id: student_granted },
          expect: 404, code: not_found }
      - { persona: student_granted, operation: listMyAccessGrants, expect: 200 }
      - { persona: student_granted, operation: revokeMyAccessGrant, path_params: { grant_id: grant_granted_a }, expect: 204 }
      - { persona: company_member, operation: getCompanyStudentProfile, path_params: { org_id: company_a, user_id: student_granted },
          expect: 404, code: not_found }
      - { persona: company_admin, operation: listCompanyGrantedStudents, path_params: { org_id: company_a }, expect: 200 }
      - { persona: company_admin, operation: revokeCompanyAccessGrant, path_params: { org_id: company_a, user_id: student_granted },
          expect: 404, code: not_found }
  access_grant_company_revokes:
    note: >-
      BE-046: company_b downloads the CV of the student who granted it access, then gives the access up; the
      student's revocation of the ended grant changes nothing (204) and the company's CV download is 404.
    steps:
      - { persona: other_company_member, operation: downloadCompanyStudentCv, path_params: { org_id: company_b, user_id: student },
          expect: 200 }
      - { persona: other_company_member, operation: revokeCompanyAccessGrant, path_params: { org_id: company_b, user_id: student },
          expect: 204 }
      - { persona: student, operation: revokeMyAccessGrant, path_params: { grant_id: grant_student_b }, expect: 204 }
      - { persona: other_company_member, operation: downloadCompanyStudentCv, path_params: { org_id: company_b, user_id: student },
          expect: 404, code: not_found }
      - { persona: other_company_member, operation: getCompanyStudentProfile, path_params: { org_id: company_b, user_id: student },
          expect: 404, code: not_found }
