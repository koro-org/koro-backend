# Authz matrix of the students module (03 §5.4, 04 §2.4; BE-023, BE-025, BE-046, BE-077, BE-088). 23 operations × 18 personas.
# Every operation is an O cell on the caller's own profile for verified students (stu, min, clm,
# cla, stf); an account without an active student verification (usr k-uv, uni, the companies,
# platform staff) is 403 students.verification_required, anonymous 401 (03 §5.0, §2.3). The
# experience operations address an entry by ID: another student's entry is 404 (IDOR), a
# non-student is refused before the lookup (403). k9 (a minor turning level 2 or contact sharing
# on, 422 students.minor_restricted) is pinned below and in scenarios/students.yaml.
# BE-025: the CV operations are the same O cell (cv_student is the student's current CV, its file
# file_attached; createMyCv takes file_unattached, the student's cv upload: another student 422).
# getMemberCard is cla S·k10 on club_a's surface (members of club_a: club_member 403, club_admin
# 200; staff 403, 404 in a sensitive club; everyone else 404; a pending or another club's
# membership 404). adminGetStudentProfile is the admin surface (403 without a platform role):
# support and platform_admin B (403 without X-Koro-Access-Reason), dpo k11 (the reason is the ID
# of an open data subject request of the student: dsr_student_open of kvkk's fixtures).
# BE-046 (level 3): listMyAccessGrants and revokeMyAccessGrant are the O cell of verified students
# (grant_student_b is the persona student's grant of company_b; another student's grant 404). The
# company operations are cmm S / cma S on the company's management surface (members of another
# company and everyone else 404, platform staff 403); the profile and the CV add G: without an
# active grant of that company the student is 404 (Y5) — grant_granted_a is company_a's grant on
# helper student_granted (no CV), grant_student_b company_b's on student (CV cv_student).
# BE-077 (KVKK md. 11): listMyAccessGrants and revokeMyAccessGrant need no student verification (usr
# O: every signed-in account on its own grants; another user's grant 404). grant_lapsed_a is the
# suspended grant of user_unverified (a student whose verification lapsed): the account lists and
# revokes it; for company_a the student is unknown (404) and the company cannot end it (404).
# BE-088 (T-332): resumeMyAccessGrant is the O cell of verified students only (usr k-uv: 403
# students.verification_required; another user's grant 404). grant_resumable_a is the persona student's
# grant of company_a, suspended an hour ago and resumable (verified again, inside the window);
# grant_expired_a is club_member's, suspended more than 90 days ago (409 students.resume_window_expired);
# an active grant is 409 students.invalid_state.
version: 1
groups:
  # accounts without an active student verification (03 §1.1 usr; companies and staff too).
  non_students: [user_unverified, university_rep, company_member, company_admin, other_company_member,
                 moderator, support, dpo, platform_admin, finance_admin, talent_auditor]
  # verified students other than the owner of experience_student.
  other_students: [student_minor, club_member, club_admin, other_club_admin, event_staff]
  # verified adult students (k9 does not apply).
  adult_students: [student, club_member, club_admin, other_club_admin, event_staff]
  # every signed-in user without a platform role (admin surface: 403 before reading).
  no_platform_role: [user_unverified, student, student_minor, club_member, club_admin, other_club_admin,
                     event_staff, university_rep, company_member, company_admin, other_company_member]
  # platform staff without a cell on the admin student view.
  staff_without_cell: [moderator, finance_admin, talent_auditor]
  # signed-in users who are neither members of company_a nor platform staff (company_a's surface: 404).
  not_company_a: [user_unverified, student, student_minor, club_member, club_admin, other_club_admin, event_staff,
                  university_rep, other_company_member]
  # signed-in users who are neither members of company_b nor platform staff (company_b's surface: 404).
  not_company_b: [user_unverified, student, student_minor, club_member, club_admin, other_club_admin, event_staff,
                  university_rep, company_member, company_admin]
  # verified students other than club_member (the owner of grant_expired_a).
  not_club_member_students: [student, student_minor, club_admin, other_club_admin, event_staff]
  # signed-in users other than user_unverified (the owner of grant_lapsed_a).
  not_user_unverified: [student, student_minor, club_member, club_admin, other_club_admin, event_staff, university_rep,
                        company_member, company_admin, other_company_member, moderator, support, dpo, platform_admin,
                        finance_admin, talent_auditor]

operations:
  getMyStudentProfile:
    method: GET
    path: /api/v1/me/student-profile
    action: students.profile.read_own
    expect: { anonymous: 401, "@verified_students": 200, "@non_students": 403 }

  updateMyStudentProfile:
    method: PATCH
    path: /api/v1/me/student-profile
    action: students.profile.update_own
    body: bodies/students/update_profile.json
    expect: { anonymous: 401, "@verified_students": 200, "@non_students": 403 }
    variants:
      - name: university_id_sent
        body: bodies/students/update_profile_university.json
        note: "university_id is not a member of the body (it comes from the verification): the schema refuses it (422) before any role check"
        expect: { anonymous: 401, "@signed_in": 422 }

  putMySkills:
    method: PUT
    path: /api/v1/me/student-profile/skills
    action: students.profile_section.manage
    body: bodies/students/put_skills.json
    expect: { anonymous: 401, "@verified_students": 200, "@non_students": 403 }

  createMyExperience:
    method: POST
    path: /api/v1/me/student-profile/experiences
    action: students.profile_section.manage
    body: bodies/students/create_experience.json
    expect: { anonymous: 401, "@verified_students": 201, "@non_students": 403 }

  updateMyExperience:
    method: PATCH
    path: /api/v1/me/student-profile/experiences/{experience_id}
    action: students.profile_section.manage
    path_params: { experience_id: experience_student }
    body: bodies/students/update_experience.json
    note: student's entry; another student's ID is 404 (IDOR), a non-student is 403 before the lookup
    expect: { anonymous: 401, student: 200, "@other_students": 404, "@non_students": 403 }
    variants:
      - name: missing
        path_params: { experience_id: "literal:00000000-0000-7000-8000-0000000000e1" }
        expect: { anonymous: 401, "@verified_students": 404, "@non_students": 403 }

  deleteMyExperience:
    method: DELETE
    path: /api/v1/me/student-profile/experiences/{experience_id}
    action: students.profile_section.manage
    path_params: { experience_id: experience_student }
    note: student's entry; another student's ID is 404 (IDOR), a non-student is 403 before the lookup
    expect: { anonymous: 401, student: 204, "@other_students": 404, "@non_students": 403 }

  putMyLanguages:
    method: PUT
    path: /api/v1/me/student-profile/languages
    action: students.profile_section.manage
    body: bodies/students/put_languages.json
    expect: { anonymous: 401, "@verified_students": 200, "@non_students": 403 }

  getMyPrivacy:
    method: GET
    path: /api/v1/me/privacy
    action: students.privacy.read_own
    expect: { anonymous: 401, "@verified_students": 200, "@non_students": 403 }

  updateMyPrivacy:
    method: PATCH
    path: /api/v1/me/privacy
    action: students.privacy.update_own
    body: bodies/students/update_privacy_clubs.json
    note: club sharing and the ranking choice need no consent; minors may change them
    expect: { anonymous: 401, "@verified_students": 200, "@non_students": 403 }
    variants:
      - name: discoverable_with_consent
        body: bodies/students/update_privacy_discoverable.json
        note: level 2 on with the discovery_profile consent text; a minor gets 422 students.minor_restricted (03 k9)
        expect: { anonymous: 401, "@adult_students": 200, student_minor: 422, "@non_students": 403 }
      - name: discoverable_without_consent
        body: bodies/students/update_privacy_discoverable_no_consent.json
        note: turning level 2 on needs the consent text (422 consent.proof_required); a minor 422 students.minor_restricted
        expect: { anonymous: 401, "@adult_students": 422, student_minor: 422, "@non_students": 403 }
      - name: turn_off
        body: bodies/students/update_privacy_contact_off.json
        note: turning the mirrored flags off is always allowed, minors included (already off by default)
        expect: { anonymous: 401, "@verified_students": 200, "@non_students": 403 }

  listMyCvs:
    method: GET
    path: /api/v1/me/cvs
    action: students.cv.read_own
    expect: { anonymous: 401, "@verified_students": 200, "@non_students": 403 }

  createMyCv:
    method: POST
    path: /api/v1/me/cvs
    action: students.cv.manage
    body: bodies/students/create_cv.json
    note: file_unattached is the student's cv upload; another student may not use it (422 validation_failed, a body rule after the role check)
    expect: { anonymous: 401, student: 201, "@other_students": 422, "@non_students": 403 }

  setMyCurrentCv:
    method: POST
    path: /api/v1/me/cvs/{cv_id}/current
    action: students.cv.manage
    path_params: { cv_id: cv_student }
    note: student's CV; another student's ID is 404 (IDOR), a non-student is 403 before the lookup
    expect: { anonymous: 401, student: 200, "@other_students": 404, "@non_students": 403 }
    variants:
      - name: missing
        path_params: { cv_id: "literal:00000000-0000-7000-8000-0000000000c1" }
        expect: { anonymous: 401, "@verified_students": 404, "@non_students": 403 }

  deleteMyCv:
    method: DELETE
    path: /api/v1/me/cvs/{cv_id}
    action: students.cv.manage
    path_params: { cv_id: cv_student }
    expect: { anonymous: 401, student: 204, "@other_students": 404, "@non_students": 403 }

  downloadMyCv:
    method: GET
    path: /api/v1/me/cvs/{cv_id}/download
    action: students.cv.read_own
    path_params: { cv_id: cv_student }
    expect: { anonymous: 401, student: 200, "@other_students": 404, "@non_students": 403 }

  getMemberCard:
    method: GET
    path: /api/v1/orgs/{org_id}/members/{membership_id}/profile
    action: students.profile.read_member_card
    path_params: { org_id: club_a, membership_id: m_club_member_club_a }
    note: club_a's surface; club_member is a plain member (403); staff see the surface (403)
    expect: { anonymous: 401, "@outsiders_a": 404, club_member: 403, club_admin: 200, "@platform_staff": 403 }
    variants:
      - name: sensitive_club
        path_params: { org_id: club_sensitive, membership_id: m_club_member_sensitive }
        note: a sensitive club's surface is its members' only (Y2, k4); club_admin is not one of them
        expect: { anonymous: 401, "@outsiders_a": 404, club_member: 403, club_admin: 404, "@platform_staff": 404 }
      - name: pending_membership
        path_params: { org_id: club_a, membership_id: join_pending_a }
        note: k10, a card exists for an active member only
        expect: { anonymous: 401, "@outsiders_a": 404, club_member: 403, club_admin: 404, "@platform_staff": 403 }
      - name: other_club_membership
        path_params: { org_id: club_b, membership_id: m_club_member_club_a }
        note: club_b's admin asks for club_a's membership under club_b (IDOR)
        expect: { anonymous: 401, "@outsiders_a": 404, club_member: 404, club_admin: 404, "@platform_staff": 403 }

  adminGetStudentProfile:
    method: GET
    path: /api/v1/admin/users/{user_id}/student-profile
    action: students.profile.read_admin
    path_params: { user_id: student }
    note: support and platform_admin need X-Koro-Access-Reason (B); the dpo an open request of the student (k11)
    expect: { anonymous: 401, "@no_platform_role": 403, "@staff_without_cell": 403, support: 403, dpo: 403,
              platform_admin: 403 }
    variants:
      - name: break_glass
        headers: { X-Koro-Access-Reason: "Destek talebi 4711: öğrenci profili inceleniyor" }
        expect: { anonymous: 401, "@no_platform_role": 403, "@staff_without_cell": 403, support: 200, dpo: 403,
                  platform_admin: 200 }
      - name: dsr_of_the_student
        headers: { X-Koro-Access-Reason: "{{fixture:dsr_student_open}}" }
        note: the request ID is also a valid break-glass reason for support and platform_admin
        expect: { anonymous: 401, "@no_platform_role": 403, "@staff_without_cell": 403, support: 200, dpo: 200,
                  platform_admin: 200 }
      - name: dsr_of_another_user
        path_params: { user_id: student_b }
        headers: { X-Koro-Access-Reason: "{{fixture:dsr_student_open}}" }
        note: the request's subject is student, not student_b (k11); student_b has no profile, so B answers 404
        expect: { anonymous: 401, "@no_platform_role": 403, "@staff_without_cell": 403, support: 404, dpo: 403,
                  platform_admin: 404 }

  listMyAccessGrants:
    method: GET
    path: /api/v1/me/access-grants
    action: students.access_grant.list_own
    note: every signed-in account lists its own grants, without a student verification (BE-077)
    expect: { anonymous: 401, "@signed_in": 200 }

  revokeMyAccessGrant:
    method: POST
    path: /api/v1/me/access-grants/{grant_id}/revoke
    action: students.access_grant.revoke
    path_params: { grant_id: grant_student_b }
    note: student's grant of company_b; another user's grant is 404 (IDOR) for every account, verified or not (BE-077)
    expect: { anonymous: 401, student: 204, "@other_students": 404, "@non_students": 404 }
    variants:
      - name: other_students_grant
        path_params: { grant_id: grant_granted_a }
        note: student_granted's grant; no persona owns it
        expect: { anonymous: 401, "@signed_in": 404 }
      - name: missing
        path_params: { grant_id: "literal:00000000-0000-7000-8000-0000000000a1" }
        expect: { anonymous: 401, "@signed_in": 404 }
      - name: lapsed_students_grant
        path_params: { grant_id: grant_lapsed_a }
        note: the suspended grant of user_unverified (verification lapsed); its owner revokes it without a verification
        expect: { anonymous: 401, user_unverified: 204, "@not_user_unverified": 404 }

  resumeMyAccessGrant:
    method: POST
    path: /api/v1/me/access-grants/{grant_id}/resume
    action: students.access_grant.resume
    path_params: { grant_id: grant_resumable_a }
    note: >-
      the persona student's suspended grant of company_a, resumable (verified again, inside the window; BE-088);
      verified students only (usr k-uv 403 students.verification_required), another user's grant 404
    expect: { anonymous: 401, student: 200, "@other_students": 404, "@non_students": 403 }
    variants:
      - name: lapsed_students_grant
        path_params: { grant_id: grant_lapsed_a }
        note: user_unverified's suspended grant; its owner, still unverified, cannot resume it (k-uv 403)
        expect: { anonymous: 401, "@verified_students": 404, "@non_students": 403 }
      - name: active_grant
        path_params: { grant_id: grant_student_b }
        note: the student's active grant of company_b is not suspended — 409 students.invalid_state
        expect: { anonymous: 401, student: 409, "@other_students": 404, "@non_students": 403 }
      - name: window_expired
        path_params: { grant_id: grant_expired_a }
        note: club_member's grant was suspended more than 90 days ago — 409 students.resume_window_expired
        expect: { anonymous: 401, club_member: 409, "@not_club_member_students": 404, "@non_students": 403 }
      - name: missing
        path_params: { grant_id: "literal:00000000-0000-7000-8000-0000000000a3" }
        expect: { anonymous: 401, "@verified_students": 404, "@non_students": 403 }

  listCompanyGrantedStudents:
    method: GET
    path: /api/v1/orgs/{org_id}/students
    action: students.access_grant.list_company
    path_params: { org_id: company_a }
    note: company_a's surface; recruiter (cmm) and company_admin (cma, MFA) S; staff see the surface (403)
    expect: { anonymous: 401, company_member: 200, company_admin: 200, "@not_company_a": 404, "@platform_staff": 403 }
    variants:
      - name: company_b
        path_params: { org_id: company_b }
        expect: { anonymous: 401, other_company_member: 200, "@not_company_b": 404, "@platform_staff": 403 }

  getCompanyStudentProfile:
    method: GET
    path: /api/v1/orgs/{org_id}/students/{user_id}
    action: students.profile.read_company
    path_params: { org_id: company_a, user_id: student_granted }
    note: company_a holds an active grant on student_granted (G); audited
    expect: { anonymous: 401, company_member: 200, company_admin: 200, "@not_company_a": 404, "@platform_staff": 403 }
    variants:
      - name: no_grant
        path_params: { org_id: company_a, user_id: student }
        note: student granted company_b only; company_a's roles get 404 as for an unknown student (Y5)
        expect: { anonymous: 401, company_member: 404, company_admin: 404, "@not_company_a": 404, "@platform_staff": 403 }
      - name: other_company_grant
        path_params: { org_id: company_b, user_id: student }
        expect: { anonymous: 401, other_company_member: 200, "@not_company_b": 404, "@platform_staff": 403 }
      - name: missing
        path_params: { org_id: company_a, user_id: "literal:00000000-0000-7000-8000-0000000000a2" }
        expect: { anonymous: 401, company_member: 404, company_admin: 404, "@not_company_a": 404, "@platform_staff": 403 }
      - name: suspended_grant
        path_params: { org_id: company_a, user_id: user_unverified }
        note: company_a's grant on user_unverified is suspended (verification lapsed, BE-077); the student is unknown
        expect: { anonymous: 401, company_member: 404, company_admin: 404, "@not_company_a": 404, "@platform_staff": 403 }

  downloadCompanyStudentCv:
    method: GET
    path: /api/v1/orgs/{org_id}/students/{user_id}/cv
    action: students.cv.read_company
    path_params: { org_id: company_b, user_id: student }
    note: company_b's grant on student, whose current CV is cv_student; every call audited
    expect: { anonymous: 401, other_company_member: 200, "@not_company_b": 404, "@platform_staff": 403 }
    variants:
      - name: no_current_cv
        path_params: { org_id: company_a, user_id: student_granted }
        note: an active grant but no current CV (04 §2.4 "Güncel CV yoksa 404")
        expect: { anonymous: 401, company_member: 404, company_admin: 404, "@not_company_a": 404, "@platform_staff": 403 }
      - name: no_grant
        path_params: { org_id: company_a, user_id: student }
        expect: { anonymous: 401, company_member: 404, company_admin: 404, "@not_company_a": 404, "@platform_staff": 403 }
      - name: suspended_grant
        path_params: { org_id: company_a, user_id: user_unverified }
        expect: { anonymous: 401, company_member: 404, company_admin: 404, "@not_company_a": 404, "@platform_staff": 403 }

  revokeCompanyAccessGrant:
    method: POST
    path: /api/v1/orgs/{org_id}/students/{user_id}/access-grant/revoke
    action: students.access_grant.revoke
    path_params: { org_id: company_a, user_id: student_granted }
    expect: { anonymous: 401, company_member: 204, company_admin: 204, "@not_company_a": 404, "@platform_staff": 403 }
    variants:
      - name: no_grant
        path_params: { org_id: company_a, user_id: student }
        expect: { anonymous: 401, company_member: 404, company_admin: 404, "@not_company_a": 404, "@platform_staff": 403 }
      - name: suspended_grant
        path_params: { org_id: company_a, user_id: user_unverified }
        note: a suspended grant is the student's to end; the company finds no active grant (404, BE-077)
        expect: { anonymous: 401, company_member: 404, company_admin: 404, "@not_company_a": 404, "@platform_staff": 403 }

  unshareMyAccessGrantContact:
    method: DELETE
    path: /api/v1/me/access-grants/{grant_id}/contact
    action: students.access_grant.revoke
    path_params: { grant_id: grant_student_b }
    note: >-
      BE-089 (T-345): the student stops sharing the e-mail with one company (a partial revoke of its own grant, the
      revokeMyAccessGrant cell: O for every account, no verification); a grant that shares nothing is 204 too;
      another user's grant is 404 (IDOR)
    expect: { anonymous: 401, student: 204, "@other_students": 404, "@non_students": 404 }
    variants:
      - name: other_students_grant
        path_params: { grant_id: grant_granted_a }
        note: student_granted's grant; no persona owns it
        expect: { anonymous: 401, "@signed_in": 404 }
      - name: missing
        path_params: { grant_id: "literal:00000000-0000-7000-8000-0000000000a2" }
        expect: { anonymous: 401, "@signed_in": 404 }
      - name: lapsed_students_grant
        path_params: { grant_id: grant_lapsed_a }
        note: the suspended grant of user_unverified; its owner stops the sharing without a verification
        expect: { anonymous: 401, user_unverified: 204, "@not_user_unverified": 404 }
