    post:
      description: "Verified students only (403 students.verification_required). The answers are validated against the current form version (form_version_id of an older version: 409 events.form_version_stale; field errors: 422 at body.answers.<key>). Every consent field answered true needs its consent text proof in consents. auto mode: confirmed (with a ticket) or, when full, waitlisted (waiting list open) or 409 events.capacity_full; manual mode: pending. One live registration per user (409 events.already_registered). Outside the registration window: 409 events.registration_closed. Idempotency-Key is required: a retry with the same key and body replays the first answer."
