components:
  responses:
    Problem:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      description: RFC 9457 problem details
  schemas:
    AdminGrantInputBody:
      additionalProperties: false
      properties:
        feature:
          enum:
            - targeted_post
            - targeted_dispatch
            - contact_request
            - discovery_access
          type: string
        kind:
          description: access for discovery_access, quota otherwise
          enum:
            - quota
            - access
          type: string
        quantity_total:
          description: Units (quota only)
          format: int64
          maximum: 100000
          minimum: 1
          type: integer
        reason:
          description: Why the right is granted (audited; no personal data)
          maxLength: 300
          minLength: 3
          type: string
        source_type:
          description: "admin_grant: a package sold offline; promo: a promotion"
          enum:
            - admin_grant
            - promo
          type: string
        valid_from:
          description: Start of the validity window
          format: date-time
          type: string
        valid_to:
          description: End of the validity window (exclusive; in the future, at most three years after valid_from)
          format: date-time
          type: string
      required:
        - feature
        - kind
        - valid_from
        - valid_to
        - source_type
        - reason
      type: object
    AdminRevokeInputBody:
      additionalProperties: false
      properties:
        reason:
          description: Why the right is taken back (stored and audited; no personal data)
          maxLength: 300
          minLength: 3
          type: string
      required:
        - reason
      type: object
    AuditActorDTO:
      additionalProperties: false
      properties:
        display:
          description: Display name, when known
          type: string
        user_id:
          description: Absent for system jobs and anonymous requests
          format: uuid
          type: string
      type: object
    AuditEventDTO:
      additionalProperties: false
      properties:
        action:
          description: Audit action (authz action name)
          type: string
        actor:
          $ref: "#/components/schemas/AuditActorDTO"
        ip:
          type: string
        metadata:
          description: Event details (IDs, kinds, flags); never secrets
        occurred_at:
          format: date-time
          type: string
        outcome:
          enum:
            - success
            - denied
            - failure
          type: string
        reason:
          type: string
        resource_id:
          format: uuid
          type: string
        resource_type:
          type: string
        user_agent:
          type: string
      required:
        - action
        - outcome
        - actor
        - occurred_at
      type: object
    AuditEventList:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/AuditEventDTO"
          type: array
        next_cursor:
          type: string
      required:
        - items
      type: object
    AvailabilityDTO:
      additionalProperties: false
      properties:
        access_until:
          description: End of the running access right (discovery_access; absent when none)
          format: date-time
          type: string
        feature:
          enum:
            - targeted_post
            - targeted_dispatch
            - contact_request
            - discovery_access
          type: string
        remaining:
          description: Units usable now (quota features)
          format: int64
          type: integer
      required:
        - feature
      type: object
    CompleteUploadInputBody:
      additionalProperties: false
      properties:
        sha256:
          description: Lower-case hex SHA-256 of the uploaded bytes
          pattern: ^[0-9a-f]{64}$
          type: string
      required:
        - sha256
      type: object
    CreateUploadInputBody:
      additionalProperties: false
      properties:
        content_type:
          description: Declared MIME type; verified by magic bytes on completion
          enum:
            - application/pdf
            - image/jpeg
            - image/png
            - image/webp
          type: string
        filename:
          description: Original file name (display only; never part of the storage key)
          maxLength: 1024
          minLength: 1
          type: string
        org_id:
          description: Owning organisation (required for org_logo, event_cover, post_media)
          format: uuid
          type: string
        purpose:
          description: What the file is for; decides the MIME/size allow-list and who may upload (03 k30)
          enum:
            - avatar
            - cv
            - edu_document
            - org_logo
            - event_cover
            - post_media
            - club_claim_evidence
            - party_document
            - bank_account_evidence
            - transfer_receipt
            - payout_receipt
            - refund_receipt
            - invoice_pdf
          type: string
        size_bytes:
          description: "Exact size in bytes (the purpose may allow less: avatar 5 MB)"
          format: int64
          maximum: 10485760
          minimum: 1
          type: integer
      required:
        - purpose
        - filename
        - content_type
        - size_bytes
      type: object
    EntitlementDTO:
      additionalProperties: false
      properties:
        entitlement_id:
          format: uuid
          type: string
        feature:
          enum:
            - targeted_post
            - targeted_dispatch
            - contact_request
            - discovery_access
          type: string
        kind:
          enum:
            - quota
            - access
          type: string
        quantity_total:
          description: Units bought (quota only)
          format: int64
          type: integer
        quantity_used:
          format: int64
          type: integer
        source_type:
          enum:
            - order_line
            - admin_grant
            - promo
          type: string
        status:
          enum:
            - pending
            - active
            - exhausted
            - expired
            - revoked
          type: string
        valid_from:
          format: date-time
          type: string
        valid_to:
          format: date-time
          type: string
      required:
        - entitlement_id
        - feature
        - kind
        - quantity_used
        - valid_from
        - valid_to
        - status
        - source_type
      type: object
    EntitlementList:
      additionalProperties: false
      properties:
        available:
          items:
            $ref: "#/components/schemas/AvailabilityDTO"
          type: array
        items:
          items:
            $ref: "#/components/schemas/EntitlementDTO"
          type: array
        next_cursor:
          type: string
      required:
        - items
        - available
      type: object
    FieldError:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.email' or 'path.org_id'
          type: string
        message:
          description: Error message text
          type: string
      required:
        - message
      type: object
    FileState:
      additionalProperties: false
      properties:
        file_id:
          format: uuid
          type: string
        scan_status:
          enum:
            - pending
            - clean
            - infected
            - skipped
          type: string
        status:
          enum:
            - uploading
            - active
          type: string
      required:
        - file_id
        - status
        - scan_status
      type: object
    FileUpload:
      additionalProperties: false
      properties:
        expires_at:
          format: date-time
          type: string
        file_id:
          format: uuid
          type: string
        upload_headers:
          additionalProperties:
            type: string
          description: Headers the PUT must carry exactly (Content-Type)
          type: object
        upload_url:
          description: Presigned PUT URL of the object storage
          type: string
      required:
        - file_id
        - upload_url
        - upload_headers
        - expires_at
      type: object
    Problem:
      additionalProperties: false
      properties:
        code:
          description: Stable machine-readable error code
          examples:
            - validation_failed
          type: string
        detail:
          description: Occurrence-specific explanation without personal data
          type: string
        errors:
          description: Field errors (never contain the submitted value)
          items:
            $ref: "#/components/schemas/FieldError"
          type: array
        instance:
          description: urn:koro:request:<request id>
          examples:
            - urn:koro:request:01J9Z3T2Q5V6
          format: uri-reference
          type: string
        status:
          description: HTTP status code
          examples:
            - 422
          format: int64
          type: integer
        title:
          description: Fixed English summary of the code; clients translate by code
          examples:
            - Validation failed
          type: string
        type:
          description: PROBLEM_TYPE_BASE + code
          examples:
            - urn:koro:problem:validation_failed
          format: uri-reference
          type: string
      required:
        - type
        - title
        - status
        - code
      type: object
    RevokedEntitlementDTO:
      additionalProperties: false
      properties:
        entitlement_id:
          format: uuid
          type: string
        feature:
          enum:
            - targeted_post
            - targeted_dispatch
            - contact_request
            - discovery_access
          type: string
        kind:
          enum:
            - quota
            - access
          type: string
        quantity_total:
          description: Units bought (quota only)
          format: int64
          type: integer
        quantity_used:
          format: int64
          type: integer
        source_type:
          enum:
            - order_line
            - admin_grant
            - promo
          type: string
        status:
          enum:
            - pending
            - active
            - exhausted
            - expired
            - revoked
          type: string
        valid_from:
          format: date-time
          type: string
        valid_to:
          format: date-time
          type: string
        warning:
          description: "Set when the right was bought with an order: no refund was started"
          enum:
            - order_refund_not_started
          type: string
      required:
        - entitlement_id
        - feature
        - kind
        - quantity_used
        - valid_from
        - valid_to
        - status
        - source_type
      type: object
    SecurityEventDTO:
      additionalProperties: false
      properties:
        action:
          description: Audit action (authz action name)
          type: string
        ip_prefix:
          description: Network of the client (/24 or /48); absent for accesses by staff
          type: string
        occurred_at:
          format: date-time
          type: string
        outcome:
          enum:
            - success
            - denied
            - failure
          type: string
        user_agent_family:
          description: Browser or app family, e.g. Chrome, Koro app
          type: string
      required:
        - action
        - outcome
        - occurred_at
      type: object
    SecurityEventList:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/SecurityEventDTO"
          type: array
        next_cursor:
          type: string
      required:
        - items
      type: object
    UsageDTO:
      additionalProperties: false
      properties:
        actor_user_id:
          description: Who consumed; platform_admin and finance_admin only
          format: uuid
          type: string
        created_at:
          format: date-time
          type: string
        feature:
          enum:
            - targeted_post
            - targeted_dispatch
            - contact_request
            - discovery_access
          type: string
        quantity:
          description: "Positive: consumption; negative: reversal (release)"
          format: int64
          type: integer
        ref_id:
          format: uuid
          type: string
        ref_type:
          enum:
            - post
            - dispatch
            - contact_request
          type: string
        usage_id:
          format: uuid
          type: string
      required:
        - usage_id
        - feature
        - quantity
        - ref_type
        - ref_id
        - created_at
      type: object
    UsageList:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/UsageDTO"
          type: array
        next_cursor:
          type: string
      required:
        - items
      type: object
    VerifyDTO:
      additionalProperties: false
      properties:
        checked_rows:
          format: int64
          type: integer
        first_bad_chain_seq:
          description: First chain position that fails verification
          format: int64
          type: integer
        ok:
          type: boolean
      required:
        - ok
        - checked_rows
      type: object
    VerifyRequest:
      additionalProperties: false
      properties:
        from_day:
          description: First day (Europe/Istanbul)
          format: date
          type: string
        to_day:
          description: Last day (Europe/Istanbul), at most 31 days after from_day
          format: date
          type: string
      required:
        - from_day
        - to_day
      type: object
  securitySchemes:
    bearerAuth:
      bearerFormat: opaque
      scheme: bearer
      type: http
    sessionCookie:
      in: cookie
      name: __Host-koro_session
      type: apiKey
info:
  description: Koro backend API. Errors are RFC 9457 application/problem+json with a stable `code`.
  title: Koro API
  version: 1.0.0
openapi: 3.1.0
paths:
  /api/v1/admin/audit-events:
    get:
      description: The search itself is recorded in the audit log.
      operationId: adminListAuditEvents
      parameters:
        - description: Page size
          explode: false
          in: query
          name: limit
          schema:
            default: 25
            description: Page size
            format: int64
            maximum: 100
            minimum: 1
            type: integer
        - description: Opaque cursor from next_cursor
          explode: false
          in: query
          name: cursor
          schema:
            description: Opaque cursor from next_cursor
            maxLength: 512
            type: string
        - description: RFC 3339 time or YYYY-MM-DD (start of that day, Europe/Istanbul)
          explode: false
          in: query
          name: occurred_from
          required: true
          schema:
            description: RFC 3339 time or YYYY-MM-DD (start of that day, Europe/Istanbul)
            maxLength: 40
            type: string
        - description: RFC 3339 time or YYYY-MM-DD (end of that day, Europe/Istanbul); inclusive
          explode: false
          in: query
          name: occurred_to
          required: true
          schema:
            description: RFC 3339 time or YYYY-MM-DD (end of that day, Europe/Istanbul); inclusive
            maxLength: 40
            type: string
        - explode: false
          in: query
          name: actor_user_id
          schema:
            format: uuid
            type: string
        - explode: false
          in: query
          name: org_id
          schema:
            format: uuid
            type: string
        - explode: false
          in: query
          name: resource_type
          schema:
            maxLength: 64
            pattern: ^[a-z_]+$
            type: string
        - explode: false
          in: query
          name: resource_id
          schema:
            format: uuid
            type: string
        - description: Exact action name
          explode: false
          in: query
          name: action
          schema:
            description: Exact action name
            maxLength: 100
            pattern: ^[a-z_]+(\.[a-z_]+)+$
            type: string
        - explode: false
          in: query
          name: outcome
          schema:
            enum:
              - success
              - denied
              - failure
            type: string
        - description: Only break-glass accesses (true) or none of them (false)
          explode: false
          in: query
          name: break_glass
          schema:
            description: Only break-glass accesses (true) or none of them (false)
            enum:
              - "true"
              - "false"
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEventList"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      security:
        - sessionCookie: []
        - bearerAuth: []
      summary: Search all audit events
      tags:
        - audit
      x-koro-action: audit.event.list
      x-koro-rate-limit: search
      x-koro-surface: admin
  /api/v1/admin/audit/verify:
    post:
      operationId: adminVerifyAuditChain
      parameters:
        - description: "Optional client-generated key; a retry with the same key and body replays the first response (Idempotent-Replayed: true)"
          in: header
          name: Idempotency-Key
          schema:
            description: "Optional client-generated key; a retry with the same key and body replays the first response (Idempotent-Replayed: true)"
            maxLength: 255
            minLength: 8
            pattern: ^[A-Za-z0-9_-]+$
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifyDTO"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      security:
        - sessionCookie: []
        - bearerAuth: []
      summary: Verify the audit hash chain and its signed daily roots
      tags:
        - audit
      x-koro-action: audit.chain.verify
      x-koro-idempotency: optional
      x-koro-rate-limit: write_default
      x-koro-surface: admin
  /api/v1/admin/entitlements/{entitlement_id}/revoke:
    post:
      description: "Units already used stay used. Revoking an expired right is 409; a revoked one is returned unchanged. A right bought with an order is revoked without a refund: warning order_refund_not_started tells the admin to start the refund separately."
      operationId: adminRevokeEntitlement
      parameters:
        - description: "Optional client-generated key; a retry with the same key and body replays the first response (Idempotent-Replayed: true)"
          in: header
          name: Idempotency-Key
          schema:
            description: "Optional client-generated key; a retry with the same key and body replays the first response (Idempotent-Replayed: true)"
            maxLength: 255
            minLength: 8
            pattern: ^[A-Za-z0-9_-]+$
            type: string
        - description: Entitlement ID (an unknown or malformed ID is 404)
          in: path
          name: entitlement_id
          required: true
          schema:
            description: Entitlement ID (an unknown or malformed ID is 404)
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminRevokeInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevokedEntitlementDTO"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      security:
        - sessionCookie: []
        - bearerAuth: []
      summary: Revoke an entitlement
      tags:
        - entitlements
      x-koro-action: entitlements.entitlement.revoke
      x-koro-idempotency: optional
      x-koro-rate-limit: write_default
      x-koro-surface: admin
  /api/v1/admin/orgs/{org_id}/entitlements:
    post:
      description: "Grants a right by hand (pilot packages are sold offline; promotions). The grant is active at once and usable inside [valid_from, valid_to). Idempotency-Key is required: a retry replays the first grant."
      operationId: adminGrantEntitlement
      parameters:
        - description: "Client-generated key; a retry with the same key and body replays the first response (Idempotent-Replayed: true)"
          in: header
          name: Idempotency-Key
          required: true
          schema:
            description: "Client-generated key; a retry with the same key and body replays the first response (Idempotent-Replayed: true)"
            maxLength: 255
            minLength: 8
            pattern: ^[A-Za-z0-9_-]+$
            type: string
        - description: Organisation ID (an unknown or malformed ID is 404)
          in: path
          name: org_id
          required: true
          schema:
            description: Organisation ID (an unknown or malformed ID is 404)
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminGrantInputBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntitlementDTO"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      security:
        - sessionCookie: []
        - bearerAuth: []
      summary: Grant an entitlement to an organisation
      tags:
        - entitlements
      x-koro-action: entitlements.entitlement.grant
      x-koro-idempotency: required
      x-koro-rate-limit: write_default
      x-koro-surface: admin
  /api/v1/files/uploads:
    post:
      description: Checks the purpose's MIME/size allow-list and returns a presigned PUT URL (valid 10 minutes) for the object storage. Send exactly upload_headers with the PUT; the API never receives the file itself (04 §1.14).
      operationId: createUpload
      parameters:
        - description: "Optional client-generated key; a retry with the same key and body replays the first response (Idempotent-Replayed: true)"
          in: header
          name: Idempotency-Key
          schema:
            description: "Optional client-generated key; a retry with the same key and body replays the first response (Idempotent-Replayed: true)"
            maxLength: 255
            minLength: 8
            pattern: ^[A-Za-z0-9_-]+$
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUploadInputBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileUpload"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      security:
        - sessionCookie: []
        - bearerAuth: []
      summary: Start a file upload
      tags:
        - files
      x-koro-action: files.upload.create
      x-koro-idempotency: optional
      x-koro-rate-limit: upload
      x-koro-surface: self
  /api/v1/files/{file_id}:
    delete:
      description: Deletes a file the caller uploaded and no record uses yet; an attached file is deleted where it is used (409).
      operationId: deleteMyFile
      parameters:
        - description: File ID (an unknown or malformed ID is 404)
          in: path
          name: file_id
          required: true
          schema:
            description: File ID (an unknown or malformed ID is 404)
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      security:
        - sessionCookie: []
        - bearerAuth: []
      summary: Delete my unattached file
      tags:
        - files
      x-koro-action: files.file.delete_own
      x-koro-rate-limit: write_default
      x-koro-surface: self
  /api/v1/files/{file_id}/complete:
    post:
      description: Verifies the uploaded object (size, SHA-256, magic bytes; 422 on a mismatch) and queues the virus scan. Repeating it with the same sha256 returns the current state.
      operationId: completeUpload
      parameters:
        - description: "Optional client-generated key; a retry with the same key and body replays the first response (Idempotent-Replayed: true)"
          in: header
          name: Idempotency-Key
          schema:
            description: "Optional client-generated key; a retry with the same key and body replays the first response (Idempotent-Replayed: true)"
            maxLength: 255
            minLength: 8
            pattern: ^[A-Za-z0-9_-]+$
            type: string
        - description: File ID (an unknown or malformed ID is 404)
          in: path
          name: file_id
          required: true
          schema:
            description: File ID (an unknown or malformed ID is 404)
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteUploadInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileState"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      security:
        - sessionCookie: []
        - bearerAuth: []
      summary: Complete a file upload
      tags:
        - files
      x-koro-action: files.upload.complete
      x-koro-idempotency: optional
      x-koro-rate-limit: write_default
      x-koro-surface: self
  /api/v1/me/security-events:
    get:
      description: Sign-in, password, session, MFA and consent events of the caller, and break-glass accesses to the caller's data.
      operationId: listMySecurityEvents
      parameters:
        - description: Page size
          explode: false
          in: query
          name: limit
          schema:
            default: 25
            description: Page size
            format: int64
            maximum: 100
            minimum: 1
            type: integer
        - description: Opaque cursor from next_cursor
          explode: false
          in: query
          name: cursor
          schema:
            description: Opaque cursor from next_cursor
            maxLength: 512
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecurityEventList"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      security:
        - sessionCookie: []
        - bearerAuth: []
