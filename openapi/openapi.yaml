components:
  responses:
    Problem:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      description: RFC 9457 problem details
  schemas:
    AdminGrantInputBody:
      additionalProperties: false
      properties:
        feature:
          enum:
            - targeted_post
            - targeted_dispatch
            - contact_request
            - discovery_access
          type: string
        kind:
          description: access for discovery_access, quota otherwise
          enum:
            - quota
            - access
          type: string
        quantity_total:
          description: Units (quota only)
          format: int64
          maximum: 100000
          minimum: 1
          type: integer
        reason:
          description: Why the right is granted (audited; no personal data)
          maxLength: 300
          minLength: 3
          type: string
        source_type:
          description: "admin_grant: a package sold offline; promo: a promotion"
          enum:
            - admin_grant
            - promo
          type: string
        valid_from:
          description: Start of the validity window
          format: date-time
          type: string
        valid_to:
          description: End of the validity window (exclusive; in the future, at most three years after valid_from)
          format: date-time
          type: string
      required:
        - feature
        - kind
        - valid_from
        - valid_to
        - source_type
        - reason
      type: object
    AdminRevokeInputBody:
      additionalProperties: false
      properties:
        reason:
          description: Why the right is taken back (stored and audited; no personal data)
          maxLength: 300
          minLength: 3
          type: string
      required:
        - reason
      type: object
    AuditActorDTO:
      additionalProperties: false
      properties:
        display:
          description: Display name, when known
          type: string
        user_id:
          description: Absent for system jobs and anonymous requests
          format: uuid
          type: string
      type: object
    AuditEventDTO:
      additionalProperties: false
      properties:
        action:
          description: Audit action (authz action name)
          type: string
        actor:
          $ref: "#/components/schemas/AuditActorDTO"
        ip:
          type: string
        metadata:
          description: Event details (IDs, kinds, flags); never secrets
        occurred_at:
          format: date-time
          type: string
        outcome:
          enum:
            - success
            - denied
            - failure
          type: string
        reason:
          type: string
        resource_id:
          format: uuid
          type: string
        resource_type:
          type: string
        user_agent:
          type: string
      required:
        - action
        - outcome
        - actor
        - occurred_at
      type: object
    AuditEventList:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/AuditEventDTO"
          type: array
        next_cursor:
          type: string
      required:
        - items
      type: object
    AvailabilityDTO:
      additionalProperties: false
      properties:
        access_until:
          description: End of the running access right (discovery_access; absent when none)
          format: date-time
          type: string
        feature:
          enum:
            - targeted_post
            - targeted_dispatch
            - contact_request
            - discovery_access
          type: string
        remaining:
          description: Units usable now (quota features)
          format: int64
          type: integer
      required:
        - feature
      type: object
    CompleteUploadInputBody:
      additionalProperties: false
      properties:
        sha256:
          description: Lower-case hex SHA-256 of the uploaded bytes
          pattern: ^[0-9a-f]{64}$
          type: string
      required:
        - sha256
      type: object
    ConsentDTO:
      additionalProperties: false
      properties:
        action:
          enum:
            - granted
            - withdrawn
          type: string
        consent_id:
          format: uuid
          type: string
        occurred_at:
          format: date-time
          type: string
        purpose_code:
          type: string
        scope_id:
          description: Event registration of a per-registration purpose
          format: uuid
          type: string
      required:
        - consent_id
        - purpose_code
        - action
        - occurred_at
      type: object
    ConsentProofDTO:
      additionalProperties: false
      properties:
        action:
          enum:
            - granted
            - withdrawn
          type: string
        channel:
          enum:
            - web
            - mobile
            - email_link
            - admin
            - import
          type: string
        consent_id:
          format: uuid
          type: string
        ip:
          type: string
        notice_version_id:
          format: uuid
          type: string
        occurred_at:
          format: date-time
          type: string
        purpose_code:
          type: string
        scope_id:
          format: uuid
          type: string
        scope_type:
          enum:
            - none
            - registration
          type: string
        text_sha256:
          description: Hex SHA-256 of the text the user saw
          type: string
        user_agent:
          type: string
      required:
        - consent_id
        - purpose_code
        - action
        - scope_type
        - channel
        - occurred_at
      type: object
    ConsentProofList:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/ConsentProofDTO"
          type: array
        next_cursor:
          type: string
      required:
        - items
      type: object
    ConsentStateDTO:
      additionalProperties: false
      properties:
        purpose_code:
          type: string
        scope_id:
          format: uuid
          type: string
        since:
          format: date-time
          type: string
        state:
          description: The newest act decides
          enum:
            - granted
            - withdrawn
          type: string
      required:
        - purpose_code
        - state
        - since
      type: object
    CreateNoticeInputBody:
      additionalProperties: false
      properties:
        audience:
          enum:
            - all
            - student
            - company
            - club
            - university
          type: string
        body_md:
          description: Markdown; line breaks are stored as LF
          maxLength: 400000
          minLength: 1
          type: string
        kind:
          enum:
            - privacy_notice
            - consent_text
            - terms_of_use
            - cookie_notice
          type: string
        locale:
          enum:
            - tr-TR
            - en-US
          type: string
        purpose_code:
          description: Required for consent_text, forbidden otherwise
          pattern: ^[a-z][a-z0-9_]{2,40}$
          type: string
        reauth:
          $ref: "#/components/schemas/ReauthDTO"
          description: Re-authentication proof (03 §6.2)
        title:
          maxLength: 200
          minLength: 1
          type: string
        version:
          description: e.g. 2026.10.02 or 2026.10.02-2
          pattern: ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}(-[0-9]+)?$
          type: string
      required:
        - kind
        - audience
        - locale
        - version
        - title
        - body_md
      type: object
    CreateUploadInputBody:
      additionalProperties: false
      properties:
        content_type:
          description: Declared MIME type; verified by magic bytes on completion
          enum:
            - application/pdf
            - image/jpeg
            - image/png
            - image/webp
          type: string
        filename:
          description: Original file name (display only; never part of the storage key)
          maxLength: 1024
          minLength: 1
          type: string
        org_id:
          description: Owning organisation (required for org_logo, event_cover, post_media)
          format: uuid
          type: string
        purpose:
          description: What the file is for; decides the MIME/size allow-list and who may upload (03 k30)
          enum:
            - avatar
            - cv
            - edu_document
            - org_logo
            - event_cover
            - post_media
            - club_claim_evidence
            - party_document
            - bank_account_evidence
            - transfer_receipt
            - payout_receipt
            - refund_receipt
            - invoice_pdf
          type: string
        size_bytes:
          description: "Exact size in bytes (the purpose may allow less: avatar 5 MB)"
          format: int64
          maximum: 10485760
          minimum: 1
          type: integer
      required:
        - purpose
        - filename
        - content_type
        - size_bytes
      type: object
    DeliveryDTO:
      additionalProperties: false
      properties:
        channel:
          enum:
            - email
            - push
            - in_app
          type: string
        created_at:
          format: date-time
          type: string
        delivery_id:
          format: uuid
          type: string
        status:
          type: string
        template:
          type: string
      required:
        - delivery_id
        - channel
        - template
        - status
        - created_at
      type: object
    DeliveryList:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/DeliveryDTO"
          type: array
        next_cursor:
          type: string
      required:
        - items
      type: object
    EntitlementDTO:
      additionalProperties: false
      properties:
        entitlement_id:
          format: uuid
          type: string
        feature:
          enum:
            - targeted_post
            - targeted_dispatch
            - contact_request
            - discovery_access
          type: string
        kind:
          enum:
            - quota
            - access
          type: string
        quantity_total:
          description: Units bought (quota only)
          format: int64
          type: integer
        quantity_used:
          format: int64
          type: integer
        source_type:
          enum:
            - order_line
            - admin_grant
            - promo
          type: string
        status:
          enum:
            - pending
            - active
            - exhausted
            - expired
            - revoked
          type: string
        valid_from:
          format: date-time
          type: string
        valid_to:
          format: date-time
          type: string
      required:
        - entitlement_id
        - feature
        - kind
        - quantity_used
        - valid_from
        - valid_to
        - status
        - source_type
      type: object
    EntitlementList:
      additionalProperties: false
      properties:
        available:
          items:
            $ref: "#/components/schemas/AvailabilityDTO"
          type: array
        items:
          items:
            $ref: "#/components/schemas/EntitlementDTO"
          type: array
        next_cursor:
          type: string
      required:
        - items
        - available
      type: object
    FieldError:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.email' or 'path.org_id'
          type: string
        message:
          description: Error message text
          type: string
      required:
        - message
      type: object
    FileState:
      additionalProperties: false
      properties:
        file_id:
          format: uuid
          type: string
        scan_status:
          enum:
            - pending
            - clean
            - infected
            - skipped
          type: string
        status:
          enum:
            - uploading
            - active
          type: string
      required:
        - file_id
        - status
        - scan_status
      type: object
    FileUpload:
      additionalProperties: false
      properties:
        expires_at:
          format: date-time
          type: string
        file_id:
          format: uuid
          type: string
        upload_headers:
          additionalProperties:
            type: string
          description: Headers the PUT must carry exactly (Content-Type)
          type: object
        upload_url:
          description: Presigned PUT URL of the object storage
          type: string
      required:
        - file_id
        - upload_url
        - upload_headers
        - expires_at
      type: object
    MyConsentsDTO:
      additionalProperties: false
      properties:
        current:
          description: Current state of every purpose the caller ever acted on (all pages)
          items:
            $ref: "#/components/schemas/ConsentStateDTO"
          type: array
        items:
          description: Consent history, newest first
          items:
            $ref: "#/components/schemas/ConsentDTO"
          type: array
        next_cursor:
          type: string
      required:
        - current
        - items
      type: object
    NoticeDTO:
      additionalProperties: false
      properties:
        audience:
          enum:
            - all
            - student
            - company
            - club
            - university
          type: string
        body_md:
          description: Markdown text exactly as shown
          type: string
        body_sha256:
          description: Lower-case hex SHA-256 of the UTF-8 bytes of body_md
          type: string
        kind:
          enum:
            - privacy_notice
            - consent_text
            - terms_of_use
            - cookie_notice
          type: string
        locale:
          enum:
            - tr-TR
            - en-US
          type: string
        notice_version_id:
          format: uuid
          type: string
        published_at:
          format: date-time
          type: string
        purpose_code:
          description: Consent purpose of a consent_text; absent for every other kind
          type: string
        retired_at:
          format: date-time
          type: string
        status:
          description: Retired versions stay readable as proof
          enum:
            - draft
            - published
            - retired
          type: string
        title:
          type: string
        version:
          description: YYYY.MM.DD or YYYY.MM.DD-N
          type: string
      required:
        - notice_version_id
        - kind
        - audience
        - locale
        - version
        - title
        - body_md
        - body_sha256
        - status
      type: object
    NoticeList:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/NoticeDTO"
          type: array
      required:
        - items
      type: object
    NoticeTransitionInputBody:
      additionalProperties: false
      properties:
        reauth:
          $ref: "#/components/schemas/ReauthDTO"
          description: Re-authentication proof (03 §6.2)
      type: object
    NotificationDTO:
      additionalProperties: false
      properties:
        body:
          type: string
        created_at:
          format: date-time
          type: string
        data:
          additionalProperties:
            type: string
          description: Opaque IDs only
          type: object
        kind:
          description: The notification kind (template ID)
          type: string
        link_path:
          description: In-app relative path
          type: string
        notification_id:
          format: uuid
          type: string
        read_at:
          format: date-time
          type: string
        source_org:
          $ref: "#/components/schemas/SourceOrgDTO"
        title:
          type: string
      required:
        - notification_id
        - kind
        - title
        - created_at
      type: object
    NotificationList:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/NotificationDTO"
          type: array
        next_cursor:
          type: string
      required:
        - items
      type: object
    PreferenceDTO:
      additionalProperties: false
      properties:
        category:
          enum:
            - security
            - registration_updates
            - event_updates
            - contact_requests
            - feed_follows
            - orders_payments
            - moderation
          type: string
        channel:
          enum:
            - email
            - push
            - in_app
          type: string
        enabled:
          type: boolean
      required:
        - category
        - channel
        - enabled
      type: object
    PreferenceList:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/PreferenceDTO"
          type: array
      required:
        - items
      type: object
    Problem:
      additionalProperties: false
      properties:
        code:
          description: Stable machine-readable error code
          examples:
            - validation_failed
          type: string
        detail:
          description: Occurrence-specific explanation without personal data
          type: string
        errors:
          description: Field errors (never contain the submitted value)
          items:
            $ref: "#/components/schemas/FieldError"
          type: array
        instance:
          description: urn:koro:request:<request id>
          examples:
            - urn:koro:request:01J9Z3T2Q5V6
          format: uri-reference
          type: string
        status:
          description: HTTP status code
          examples:
            - 422
          format: int64
          type: integer
        title:
          description: Fixed English summary of the code; clients translate by code
          examples:
            - Validation failed
          type: string
        type:
          description: PROBLEM_TYPE_BASE + code
          examples:
            - urn:koro:problem:validation_failed
          format: uri-reference
          type: string
      required:
        - type
        - title
        - status
        - code
      type: object
    PurposeDTO:
      additionalProperties: false
      properties:
        active:
          type: boolean
        created_at:
          format: date-time
          type: string
        description_tr:
          type: string
        iys_channel:
          enum:
            - email
            - sms
            - call
          type: string
        legal_basis:
          enum:
            - explicit_consent
            - contract
            - legal_obligation
            - legitimate_interest
          type: string
        purpose_code:
          type: string
        requires_iys:
          type: boolean
        scope_type:
          enum:
            - none
            - registration
          type: string
      required:
        - purpose_code
        - description_tr
        - legal_basis
        - requires_iys
        - scope_type
        - active
        - created_at
      type: object
    PurposeList:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/PurposeDTO"
          type: array
      required:
        - items
      type: object
    PushTokenCreatedDTO:
      additionalProperties: false
      properties:
        push_token_id:
          format: uuid
          type: string
      required:
        - push_token_id
      type: object
    PutPreferencesInputBody:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/PreferenceDTO"
          maxItems: 21
          minItems: 1
          type: array
      required:
        - items
      type: object
    ReauthDTO:
      additionalProperties: false
      properties:
        password:
          description: Account password (account without MFA)
          maxLength: 1024
          type: string
        totp_code:
          description: Current TOTP code (account with MFA; recovery codes are not accepted)
          pattern: ^[0-9]{6}$
          type: string
      type: object
    RecordMineInputBody:
      additionalProperties: false
      properties:
        action:
          enum:
            - granted
            - withdrawn
          type: string
        notice_version_id:
          description: The consent text shown (required to grant)
          format: uuid
          type: string
        purpose_code:
          pattern: ^[a-z][a-z0-9_]{2,40}$
          type: string
        scope_id:
          description: Event registration (per-registration purposes only)
          format: uuid
          type: string
        text_sha256:
          description: body_sha256 of that text (required to grant)
          pattern: ^[0-9a-f]{64}$
          type: string
      required:
        - purpose_code
        - action
      type: object
    RegisterPushInputBody:
      additionalProperties: false
      properties:
        app_version:
          maxLength: 40
          type: string
        platform:
          enum:
            - ios
            - android
            - web
          type: string
        token:
          maxLength: 4096
          minLength: 1
          type: string
      required:
        - platform
        - token
      type: object
    RevokedEntitlementDTO:
      additionalProperties: false
      properties:
        entitlement_id:
          format: uuid
          type: string
        feature:
          enum:
            - targeted_post
            - targeted_dispatch
            - contact_request
            - discovery_access
          type: string
        kind:
          enum:
            - quota
            - access
          type: string
        quantity_total:
          description: Units bought (quota only)
          format: int64
          type: integer
        quantity_used:
          format: int64
          type: integer
        source_type:
          enum:
            - order_line
            - admin_grant
            - promo
          type: string
        status:
          enum:
            - pending
            - active
            - exhausted
            - expired
            - revoked
          type: string
        valid_from:
          format: date-time
          type: string
        valid_to:
          format: date-time
          type: string
        warning:
          description: "Set when the right was bought with an order: no refund was started"
          enum:
            - order_refund_not_started
          type: string
      required:
        - entitlement_id
        - feature
        - kind
        - quantity_used
        - valid_from
        - valid_to
        - status
        - source_type
      type: object
    SecurityEventDTO:
      additionalProperties: false
      properties:
        action:
          description: Audit action (authz action name)
          type: string
        ip_prefix:
          description: Network of the client (/24 or /48); absent for accesses by staff
          type: string
        occurred_at:
          format: date-time
          type: string
        outcome:
          enum:
            - success
            - denied
            - failure
          type: string
        user_agent_family:
          description: Browser or app family, e.g. Chrome, Koro app
          type: string
      required:
        - action
        - outcome
        - occurred_at
      type: object
    SecurityEventList:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/SecurityEventDTO"
          type: array
        next_cursor:
          type: string
      required:
        - items
      type: object
    SourceOrgDTO:
      additionalProperties: false
      properties:
        org_id:
          format: uuid
          type: string
      required:
        - org_id
      type: object
    SuppressionDTO:
      additionalProperties: false
      properties:
        created_at:
          format: date-time
          type: string
        reason:
          enum:
            - hard_bounce
            - complaint
            - manual
            - invalid
          type: string
        source:
          enum:
            - provider_webhook
            - admin
            - user_request
          type: string
        suppression_id:
          type: string
      required:
        - suppression_id
        - reason
        - source
        - created_at
      type: object
    SuppressionList:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/SuppressionDTO"
          type: array
        next_cursor:
          type: string
      required:
        - items
      type: object
    UpdatePurposeInputBody:
      additionalProperties: false
      properties:
        active:
          description: false switches the purpose off for everyone
          type: boolean
        description_tr:
          maxLength: 1000
          type: string
        reauth:
          $ref: "#/components/schemas/ReauthDTO"
          description: Re-authentication proof (03 §6.2)
      type: object
    UsageDTO:
      additionalProperties: false
      properties:
        actor_user_id:
          description: Who consumed; platform_admin and finance_admin only
          format: uuid
          type: string
        created_at:
          format: date-time
          type: string
        feature:
          enum:
            - targeted_post
            - targeted_dispatch
            - contact_request
            - discovery_access
          type: string
        quantity:
          description: "Positive: consumption; negative: reversal (release)"
          format: int64
          type: integer
        ref_id:
          format: uuid
          type: string
        ref_type:
          enum:
            - post
            - dispatch
            - contact_request
          type: string
        usage_id:
          format: uuid
          type: string
      required:
        - usage_id
        - feature
        - quantity
        - ref_type
        - ref_id
        - created_at
      type: object
    UsageList:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/UsageDTO"
          type: array
        next_cursor:
          type: string
      required:
        - items
      type: object
    VerifyDTO:
      additionalProperties: false
      properties:
        checked_rows:
          format: int64
          type: integer
        first_bad_chain_seq:
          description: First chain position that fails verification
          format: int64
          type: integer
        ok:
          type: boolean
      required:
        - ok
        - checked_rows
      type: object
    VerifyRequest:
      additionalProperties: false
      properties:
        from_day:
          description: First day (Europe/Istanbul)
          format: date
          type: string
        to_day:
          description: Last day (Europe/Istanbul), at most 31 days after from_day
          format: date
          type: string
      required:
        - from_day
        - to_day
      type: object
  securitySchemes:
    bearerAuth:
      bearerFormat: opaque
      scheme: bearer
      type: http
    sessionCookie:
      in: cookie
      name: __Host-koro_session
      type: apiKey
info:
  description: Koro backend API. Errors are RFC 9457 application/problem+json with a stable `code`.
  title: Koro API
  version: 1.0.0
openapi: 3.1.0
paths:
  /api/v1/admin/audit-events:
    get:
      description: The search itself is recorded in the audit log.
      operationId: adminListAuditEvents
      parameters:
        - description: Page size
          explode: false
          in: query
