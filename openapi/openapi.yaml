        required: true
      responses:
        "204":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountActionDTO"
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      security:
        - sessionCookie: []
        - bearerAuth: []
      summary: Close every session of a user
      tags:
        - identity
      x-koro-action: identity.user.revoke_sessions
