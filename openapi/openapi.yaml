        - description: Who reads the notices; audience all is the fallback
          explode: false
          in: query
          name: audience
          required: true
          schema:
            description: Who reads the notices; audience all is the fallback
            enum:
              - all
              - student
              - company
              - club
              - university
            type: string
        - explode: false
          in: query
          name: kind
          schema:
            enum:
              - privacy_notice
              - consent_text
              - terms_of_use
              - cookie_notice
