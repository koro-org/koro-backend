      x-koro-idempotency: optional
      x-koro-rate-limit: write_default
      x-koro-surface: admin
  /api/v1/auth/edu-verifications/confirm:
    post:
      description: Single use; an unknown, used or expired token is 422 identity.invalid_token. The account becomes a verified student for one year; a renewal supersedes the previous verification. An address that verifies another account is 409 identity.edu_email_taken.
      operationId: confirmEduVerification
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenInputBody"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: Confirm a .edu.tr address
      tags:
        - identity
      x-koro-action: identity.edu_verification.confirm
      x-koro-idempotency: optional
      x-koro-rate-limit: token_confirm
      x-koro-surface: public
  /api/v1/auth/email-change/confirm:
    post:
      operationId: confirmEmailChange
      requestBody:
        content:
          application/json:
