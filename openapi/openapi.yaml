  /api/v1/admin/users:
    get:
      description: q is an exact e-mail address or a fragment of the name (2-100 characters). Every search is audited (query kind and the users found, not the query).
      operationId: adminSearchUsers
      parameters:
        - description: An exact e-mail address or a fragment of the name (2-100 characters)
          explode: false
          in: query
          name: q
          schema:
            description: An exact e-mail address or a fragment of the name (2-100 characters)
            maxLength: 254
            type: string
        - explode: false
          in: query
          name: status
          schema:
            enum:
              - pending_email
              - active
              - suspended
              - erased
            type: string
        - description: Page size
          explode: false
          in: query
          name: limit
          schema:
            default: 25
            description: Page size
            format: int64
            maximum: 100
            minimum: 1
            type: integer
        - description: Opaque cursor from next_cursor
          explode: false
          in: query
          name: cursor
          schema:
            description: Opaque cursor from next_cursor
            maxLength: 512
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserList"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      security:
        - sessionCookie: []
        - bearerAuth: []
      summary: Search users
      tags:
        - identity
      x-koro-action: identity.user.search
      x-koro-rate-limit: search
      x-koro-surface: admin
  /api/v1/admin/users/{user_id}:
    get:
      description: Status, roles, student verification and non-club memberships; no profile content and never a club membership (a sensitive one must not show).
      operationId: adminGetUser
      parameters:
        - description: User ID (an unknown or malformed ID is 404)
          in: path
          name: user_id
          required: true
          schema:
            description: User ID (an unknown or malformed ID is 404)
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserDTO"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      security:
        - sessionCookie: []
        - bearerAuth: []
      summary: Account summary for platform staff
      tags:
        - identity
      x-koro-action: identity.user.read
      x-koro-rate-limit: read_default
      x-koro-surface: admin
  /api/v1/admin/users/{user_id}/consents:
    get:
      description: IP, channel and text digest of every consent act. support needs X-Koro-Access-Reason (break-glass); every read is audited.
      operationId: adminListUserConsents
      parameters:
        - description: User ID (a malformed ID is 404)
          in: path
          name: user_id
          required: true
          schema:
            description: User ID (a malformed ID is 404)
            type: string
        - description: Page size
          explode: false
          in: query
          name: limit
          schema:
            default: 25
            description: Page size
            format: int64
            maximum: 100
            minimum: 1
            type: integer
        - description: Opaque cursor from next_cursor
          explode: false
          in: query
          name: cursor
          schema:
            description: Opaque cursor from next_cursor
            maxLength: 512
            type: string
        - explode: false
          in: query
          name: purpose_code
          schema:
            pattern: ^[a-z][a-z0-9_]{2,40}$
            type: string
        - description: "Break-glass justification (support: 10–500 characters, mandatory)"
          in: header
          name: X-Koro-Access-Reason
          schema:
            description: "Break-glass justification (support: 10–500 characters, mandatory)"
            maxLength: 500
            type: string
        - description: Support ticket reference (optional)
          in: header
          name: X-Koro-Ticket-Ref
          schema:
            description: Support ticket reference (optional)
            maxLength: 100
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentProofList"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      security:
        - sessionCookie: []
        - bearerAuth: []
      summary: List the consent proof of a user
      tags:
        - consent
      x-koro-action: consent.record.list_admin
      x-koro-break-glass: true
      x-koro-rate-limit: read_default
      x-koro-surface: admin
  /api/v1/admin/users/{user_id}/mfa/reset:
    post:
      description: Deletes the TOTP secret and recovery codes, closes every session and notifies the user (204). Not for the own account (403). Against a holder of platform_admin, finance_admin or talent_auditor the first call only opens a four-eyes request (202 with pending_action; valid 24 hours); the same call by a second platform_admin approves and performs it (the requester gets 403 authz.four_eyes_violation).
      operationId: adminResetUserMfa
      parameters:
        - description: User ID (an unknown or malformed ID is 404)
          in: path
          name: user_id
          required: true
          schema:
            description: User ID (an unknown or malformed ID is 404)
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetMFAInputBody"
        required: true
      responses:
        "204":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountActionDTO"
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      security:
        - sessionCookie: []
        - bearerAuth: []
      summary: Reset a user's TOTP
      tags:
        - identity
      x-koro-action: identity.user.reset_mfa
      x-koro-idempotency: optional
      x-koro-rate-limit: reauth
      x-koro-reauth: true
      x-koro-surface: admin
  /api/v1/admin/users/{user_id}/notification-deliveries:
    get:
      description: "IDs, channel, template, status and time only: never the content, the data or the address. Break-glass: X-Koro-Access-Reason is mandatory; the read is audited and the user is notified."
      operationId: adminListUserDeliveries
      parameters:
        - description: Break-glass justification (10–500 characters, mandatory)
          in: header
          name: X-Koro-Access-Reason
          schema:
            description: Break-glass justification (10–500 characters, mandatory)
            maxLength: 500
            type: string
        - description: Support ticket reference (optional)
          in: header
          name: X-Koro-Ticket-Ref
          schema:
            description: Support ticket reference (optional)
            maxLength: 100
            type: string
        - description: Page size
          explode: false
          in: query
          name: limit
          schema:
            default: 25
            description: Page size
            format: int64
            maximum: 100
            minimum: 1
            type: integer
        - description: Opaque cursor from next_cursor
          explode: false
          in: query
          name: cursor
          schema:
            description: Opaque cursor from next_cursor
            maxLength: 512
            type: string
        - description: User ID (a malformed ID is 404)
          in: path
          name: user_id
          required: true
          schema:
            description: User ID (a malformed ID is 404)
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryList"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      security:
        - sessionCookie: []
        - bearerAuth: []
      summary: List a user's notification deliveries
      tags:
        - notify
      x-koro-action: notify.delivery.list
      x-koro-break-glass: true
      x-koro-rate-limit: read_default
      x-koro-surface: admin
  /api/v1/admin/users/{user_id}/sessions/revoke:
    post:
      description: 204 when done. Against a holder of platform_admin, finance_admin or talent_auditor the first call only opens a four-eyes request (202 with pending_action; valid 24 hours); the same call by a second platform_admin approves and performs it (the requester gets 403 authz.four_eyes_violation). Only a platform_admin can be the second eye.
      operationId: adminRevokeUserSessions
      parameters:
        - description: User ID (an unknown or malformed ID is 404)
          in: path
