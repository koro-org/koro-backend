  /api/v1/webhooks/email/{provider}:
    post:
      description: "Bounce, complaint and delivery notifications of the e-mail provider (ses: SNS-signed SES notifications; resend: svix-signed events). The identity is the signature: cookies and bearer tokens are ignored. A delivery that does not verify is 401; a verified one is stored in the webhook inbox under the provider's event ID (a redelivery is a no-op, also 204) and processed asynchronously."
      operationId: receiveEmailWebhook
      parameters:
        - description: E-mail provider (00 T-62)
          in: path
          name: provider
          required: true
          schema:
            description: E-mail provider (00 T-62)
            enum:
              - ses
              - resend
            type: string
        - in: header
          name: svix-id
          schema:
            maxLength: 200
            type: string
        - in: header
          name: svix-timestamp
          schema:
            maxLength: 20
            type: string
        - in: header
          name: svix-signature
          schema:
            maxLength: 2000
            type: string
        - in: header
          name: x-amz-sns-message-type
          schema:
            maxLength: 50
            type: string
      requestBody:
        content:
          application/json:
            schema:
              contentMediaType: application/octet-stream
              format: binary
              type: string
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: Receive an e-mail provider webhook
      tags:
        - notify
      x-koro-action: notify.provider_webhook.receive
      x-koro-idempotency: optional
      x-koro-rate-limit: webhook
      x-koro-surface: webhook
