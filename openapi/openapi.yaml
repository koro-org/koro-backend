info:
  description: "Koro backend API. Errors are RFC 9457 application/problem+json with a stable `code`. A signed-in user who has not accepted the terms of use in force for them (getMe terms.acceptance_required) gets 403 consent.terms_acceptance_required from every operation marked x-koro-terms-gate: enforced until acceptTerms records the current version; reads and the operations marked exempt (the acceptance, logout, account security, KVKK rights and consent acts) stay open."
  title: Koro API
  version: 1.0.0
openapi: 3.1.0
paths:
  /api/v1/admin/audit-events:
    get:
      description: The search itself is recorded in the audit log.
      operationId: adminListAuditEvents
      parameters:
        - description: Page size
          explode: false
          in: query
          name: limit
          schema:
            default: 25
            description: Page size
            format: int64
            maximum: 100
            minimum: 1
            type: integer
        - description: Opaque cursor from next_cursor
          explode: false
          in: query
          name: cursor
          schema:
            description: Opaque cursor from next_cursor
            maxLength: 512
            type: string
        - description: RFC 3339 time or YYYY-MM-DD (start of that day, Europe/Istanbul)
          explode: false
          in: query
          name: occurred_from
          required: true
          schema:
            description: RFC 3339 time or YYYY-MM-DD (start of that day, Europe/Istanbul)
            maxLength: 40
            type: string
        - description: RFC 3339 time or YYYY-MM-DD (end of that day, Europe/Istanbul); inclusive
          explode: false
          in: query
          name: occurred_to
          required: true
          schema:
            description: RFC 3339 time or YYYY-MM-DD (end of that day, Europe/Istanbul); inclusive
            maxLength: 40
            type: string
        - explode: false
          in: query
          name: actor_user_id
          schema:
            format: uuid
            type: string
        - explode: false
          in: query
          name: org_id
          schema:
            format: uuid
            type: string
        - explode: false
          in: query
          name: resource_type
          schema:
            maxLength: 64
            pattern: ^[a-z_]+$
            type: string
        - explode: false
          in: query
          name: resource_id
          schema:
            format: uuid
            type: string
        - description: Exact action name
          explode: false
          in: query
          name: action
          schema:
            description: Exact action name
            maxLength: 100
            pattern: ^[a-z_]+(\.[a-z_]+)+$
            type: string
        - explode: false
          in: query
          name: outcome
          schema:
            enum:
              - success
              - denied
              - failure
            type: string
        - description: Only break-glass accesses (true) or none of them (false)
          explode: false
          in: query
          name: break_glass
          schema:
            description: Only break-glass accesses (true) or none of them (false)
            enum:
              - "true"
              - "false"
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEventList"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      security:
        - sessionCookie: []
        - bearerAuth: []
      summary: Search all audit events
      tags:
        - audit
      x-koro-action: audit.event.list
      x-koro-rate-limit: search
      x-koro-surface: admin
  /api/v1/admin/audit/verify:
    post:
      operationId: adminVerifyAuditChain
      parameters:
        - description: "Optional client-generated key; a retry with the same key and body replays the first response (Idempotent-Replayed: true)"
          in: header
          name: Idempotency-Key
          schema:
            description: "Optional client-generated key; a retry with the same key and body replays the first response (Idempotent-Replayed: true)"
            maxLength: 255
            minLength: 8
            pattern: ^[A-Za-z0-9_-]+$
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifyDTO"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      security:
        - sessionCookie: []
        - bearerAuth: []
      summary: Verify the audit hash chain and its signed daily roots
      tags:
        - audit
      x-koro-action: audit.chain.verify
