components:
  responses:
    Problem:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      description: RFC 9457 problem details
  schemas:
    AcceptInputBody:
      additionalProperties: false
      properties:
        token:
          description: Token from the invitation e-mail
          maxLength: 128
          minLength: 1
          type: string
      required:
        - token
      type: object
    AcceptedInvitationDTO:
      additionalProperties: false
      properties:
        membership_id:
          type: string
        org_id:
          type: string
        role:
          type: string
      required:
        - membership_id
        - org_id
        - role
      type: object
    AcceptedOutputBody:
      additionalProperties: false
      type: object
    AccountActionDTO:
      additionalProperties: false
      properties:
        action:
          enum:
            - suspend
            - revoke_sessions
            - reset_mfa
          type: string
        expires_at:
          format: date-time
          type: string
        request_id:
          format: uuid
          type: string
        requested_at:
          format: date-time
          type: string
        requested_by:
          format: uuid
          type: string
        status:
          enum:
            - pending
            - approved
            - expired
          type: string
        user_id:
          format: uuid
          type: string
      required:
        - request_id
        - user_id
        - action
        - status
        - requested_by
        - requested_at
        - expires_at
      type: object
    AddStaffInputBody:
      additionalProperties: false
      properties:
        email:
          description: Address of an existing account
          maxLength: 254
          minLength: 3
          type: string
        role:
          enum:
            - scanner
            - manager
          type: string
      required:
        - email
        - role
      type: object
    AddressDTO:
      additionalProperties: false
      properties:
        city:
          maxLength: 60
          type: string
        country:
          description: ISO 3166-1 alpha-2; TR when omitted
          maxLength: 2
          type: string
        district:
          maxLength: 100
          type: string
        line1:
          description: Street address
          maxLength: 200
          type: string
        postal_code:
          description: 5 digits
          maxLength: 5
          type: string
      required:
        - line1
        - city
      type: object
    AdminClubClaimDTO:
      additionalProperties: false
      properties:
        approver:
          description: "Who decides the claim (detail and decision only): the university's representative when it has one and the club is not sensitive, a platform admin otherwise"
          enum:
            - university_rep
            - platform_admin
          type: string
        claim_id:
          type: string
        claimant:
          $ref: "#/components/schemas/ClaimantDTO"
        club:
          $ref: "#/components/schemas/ClaimClubDTO"
        created_at:
          format: date-time
          type: string
        decision_note:
          type: string
        evidence:
          $ref: "#/components/schemas/EvidenceDownloadDTO"
        evidence_file_id:
          type: string
        evidence_state:
          description: "available: evidence holds a 5-minute download (adminGetClubClaim only); not_clean: the virus scan has not cleared the file"
          enum:
            - none
            - available
            - not_clean
          type: string
        evidence_text:
          type: string
        reviewed_at:
          format: date-time
          type: string
        reviewed_by:
          type: string
        role_in_club:
          type: string
        status:
          enum:
            - pending
            - approved
            - rejected
            - withdrawn
          type: string
      required:
        - claim_id
        - status
        - club
        - claimant
        - role_in_club
        - evidence_state
        - created_at
      type: object
    AdminClubClaimList:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/AdminClubClaimDTO"
          type: array
        next_cursor:
          type: string
      required:
        - items
      type: object
    AdminCreateClubInputBody:
      additionalProperties: false
      properties:
        category:
          enum:
            - academic
            - technology
            - career
            - entrepreneurship
            - arts
            - culture
            - sports
            - social_responsibility
            - hobby
            - religious
            - political
            - identity
            - other
          type: string
        is_sensitive:
          type: boolean
        join_policy:
          enum:
            - open
            - approval
          type: string
        name:
          maxLength: 200
          minLength: 2
          type: string
        sensitive_reason:
          enum:
            - religion
            - political_opinion
            - philosophical_belief
            - lgbtiq
            - ethnic_origin
            - health
            - union
            - other
          type: string
        slug:
          description: Derived from the name when omitted
          maxLength: 80
          type: string
        university_id:
          format: uuid
          type: string
      required:
        - university_id
        - name
        - category
        - join_policy
      type: object
    AdminCreateDepartmentInputBody:
      additionalProperties: false
      properties:
        degree_level:
          enum:
            - associate
            - bachelor
            - master
            - doctorate
          type: string
        duration_years:
          format: int32
          maximum: 7
          minimum: 1
          type: integer
        faculty_id:
          description: A faculty of this university
          format: uuid
          type: string
        name:
          maxLength: 200
          minLength: 2
          type: string
        yok_program_code:
          maxLength: 40
          type: string
      required:
        - name
        - degree_level
      type: object
    AdminCreateInputBody:
      additionalProperties: false
      properties:
        channel:
          enum:
            - email
            - post
            - kep
            - in_person
          type: string
        details:
          maxLength: 4000
          type: string
        requester_email:
          description: Applicant without an account (mandatory then)
          maxLength: 254
          type: string
        requester_name:
          description: Applicant without an account
          maxLength: 200
          type: string
        type:
          enum:
            - access
            - export
            - rectification
            - erasure
            - restriction
            - objection
            - profiling_access
            - profiling_objection
            - info
          type: string
        user_id:
          description: Account of the applicant, if any
          format: uuid
          type: string
      required:
        - type
        - channel
      type: object
    AdminCreatePartyInputBody:
      additionalProperties: false
      properties:
        address:
          $ref: "#/components/schemas/AddressDTO"
        e_invoice_alias:
          maxLength: 200
          type: string
        email:
          description: Invoice / payout contact address
          maxLength: 254
          type: string
        kind:
          description: Buyer parties are created by their company (createBuyerLegalParty)
          enum:
            - payee
            - platform
          type: string
        legal_type:
          enum:
            - company
            - university
            - foundation
            - association
            - sole_prop
            - individual
            - public_body
            - other
          type: string
        mersis_no:
          description: "MERSİS number: 16 digits"
          maxLength: 30
          type: string
        org_id:
          description: "payee only: the university organization the party is"
          format: uuid
          type: string
        phone:
          maxLength: 30
          type: string
        tax_no:
          description: "Tax number (VKN): 10 digits with its check digit"
          maxLength: 20
          type: string
        tax_office:
          maxLength: 100
          type: string
        tckn:
          description: "individual only: national ID (11 digits); stored encrypted, never returned"
          maxLength: 20
          type: string
        title:
          description: Invoice title (unvan)
          maxLength: 300
          minLength: 2
          type: string
        vat_status:
          description: unknown when omitted
          enum:
            - vat_payer
            - vat_exempt
            - not_vat_payer
            - unknown
          type: string
      required:
        - kind
        - legal_type
        - title
      type: object
    AdminCreateSkillInputBody:
      additionalProperties: false
      properties:
        category:
          enum:
            - technical
            - tool
            - soft
            - domain
            - language_tool
            - other
          type: string
        name_en:
          maxLength: 200
          type: string
        name_tr:
          maxLength: 200
          minLength: 1
          type: string
        slug:
          maxLength: 80
          pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
          type: string
      required:
        - slug
        - name_tr
        - category
      type: object
    AdminCreateUniversityInputBody:
      additionalProperties: false
      properties:
        city:
          maxLength: 60
          minLength: 2
          type: string
        name:
          maxLength: 200
          minLength: 2
          type: string
        short_name:
          maxLength: 60
          type: string
        type:
          enum:
            - state
            - foundation
            - other
          type: string
        website_url:
          maxLength: 2048
          type: string
        yok_code:
          maxLength: 40
          minLength: 1
          type: string
      required:
        - yok_code
        - name
        - city
        - type
      type: object
    AdminDecideClaimInputBody:
      additionalProperties: false
      properties:
        decision:
          enum:
            - approved
            - rejected
          type: string
        decision_note:
          description: Shown to the reviewers only, never to the claimant
          maxLength: 1000
          type: string
      required:
        - decision
      type: object
    AdminEduUserDTO:
      additionalProperties: false
      properties:
        first_name:
          type: string
        id:
          format: uuid
          type: string
        last_name:
          type: string
      required:
        - id
      type: object
    AdminEduVerificationDTO:
      additionalProperties: false
      properties:
        created_at:
          format: date-time
          type: string
        expires_at:
          format: date-time
          type: string
        method:
          enum:
            - edu_email
            - document
          type: string
        review_note:
          type: string
        reviewed_by:
          format: uuid
          type: string
        status:
          enum:
            - pending
            - verified
            - rejected
            - expired
            - revoked
            - superseded
          type: string
        university:
          $ref: "#/components/schemas/UniversityRefDTO"
          description: Claimed while pending, confirmed once verified
        user:
          $ref: "#/components/schemas/AdminEduUserDTO"
        verification_id:
          format: uuid
          type: string
        verified_at:
          format: date-time
          type: string
      required:
        - verification_id
        - user
        - method
        - status
        - created_at
      type: object
    AdminEduVerificationList:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/AdminEduVerificationDTO"
          type: array
        next_cursor:
          type: string
      required:
        - items
      type: object
    AdminGrantInputBody:
      additionalProperties: false
      properties:
        feature:
          enum:
            - targeted_post
            - targeted_dispatch
            - contact_request
            - discovery_access
          type: string
        kind:
          description: access for discovery_access, quota otherwise
          enum:
            - quota
            - access
          type: string
        quantity_total:
          description: Units (quota only)
          format: int64
          maximum: 100000
          minimum: 1
          type: integer
        reason:
          description: Why the right is granted (audited; no personal data)
          maxLength: 300
          minLength: 3
          type: string
        source_type:
          description: "admin_grant: a package sold offline; promo: a promotion"
          enum:
            - admin_grant
            - promo
          type: string
        valid_from:
          description: Start of the validity window
          format: date-time
          type: string
        valid_to:
          description: End of the validity window (exclusive; in the future, at most three years after valid_from)
          format: date-time
          type: string
      required:
        - feature
        - kind
        - valid_from
        - valid_to
        - source_type
        - reason
      type: object
    AdminOrgDTO:
      additionalProperties: false
      properties:
        city:
          type: string
        closed_at:
          format: date-time
          type: string
        created_at:
          format: date-time
          type: string
        created_by:
          description: User who registered the org
          type: string
        kind:
          enum:
            - platform
            - university
            - club
            - company
            - ngo
          type: string
        name:
          type: string
        org_id:
          type: string
        slug:
          type: string
        status:
          enum:
            - pending_review
            - active
            - suspended
            - closed
          type: string
        verified:
          type: boolean
        verified_at:
          format: date-time
          type: string
      required:
        - org_id
        - kind
        - name
        - slug
        - status
        - verified
        - created_at
      type: object
    AdminOrgList:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/AdminOrgDTO"
          type: array
        next_cursor:
          type: string
      required:
        - items
      type: object
    AdminPutDomainInputBody:
      additionalProperties: false
      properties:
        domain_kind:
          enum:
            - student
            - staff
            - mixed
          type: string
        is_active:
          type: boolean
      required:
        - domain_kind
        - is_active
      type: object
    AdminRevokeInputBody:
      additionalProperties: false
      properties:
        reason:
          description: Why the right is taken back (stored and audited; no personal data)
          maxLength: 300
          minLength: 3
          type: string
      required:
        - reason
      type: object
    AdminSensitivityInputBody:
      additionalProperties: false
      properties:
        is_sensitive:
          type: boolean
        reauth:
          $ref: "#/components/schemas/ReauthDTO"
          description: Re-authentication proof (03 §6.2)
        sensitive_reason:
          enum:
            - religion
            - political_opinion
            - philosophical_belief
            - lgbtiq
            - ethnic_origin
            - health
            - union
            - other
          type: string
      required:
        - is_sensitive
      type: object
    AdminSkillDTO:
      additionalProperties: false
      properties:
        category:
          enum:
            - technical
            - tool
            - soft
            - domain
            - language_tool
            - other
          type: string
        is_active:
          type: boolean
        name_en:
          type: string
        name_tr:
          type: string
        skill_id:
          type: string
        slug:
          type: string
      required:
        - skill_id
        - slug
        - name_tr
        - category
        - is_active
      type: object
    AdminStudentDTO:
      additionalProperties: false
      properties:
        expires_at:
          format: date-time
          type: string
        status:
          enum:
            - none
            - verified
            - lapsed
          type: string
        university_id:
          format: uuid
          type: string
        verified_at:
          format: date-time
          type: string
      required:
        - status
      type: object
    AdminStudentMembershipDTO:
      additionalProperties: false
      properties:
        org_id:
          format: uuid
          type: string
        org_kind:
          type: string
        role:
          type: string
      required:
        - org_id
        - org_kind
        - role
      type: object
    AdminStudentProfileDTO:
      additionalProperties: false
      properties:
        about:
          type: string
        class_year:
          format: int64
          type: integer
        department:
          $ref: "#/components/schemas/StudentDepartmentDTO"
        experiences:
          items:
            $ref: "#/components/schemas/StudentExperienceDTO"
          type: array
        headline:
          type: string
        languages:
          items:
            $ref: "#/components/schemas/StudentLanguageDTO"
          type: array
        skills:
          items:
            $ref: "#/components/schemas/StudentSkillDTO"
          type: array
      required:
        - skills
        - experiences
        - languages
      type: object
    AdminStudentRegistrationDTO:
      additionalProperties: false
      properties:
        event_id:
          format: uuid
          type: string
        event_title:
          type: string
        registered_at:
          format: date-time
          type: string
        status:
          type: string
      required:
        - event_id
        - event_title
        - status
        - registered_at
      type: object
    AdminStudentVerificationDTO:
      additionalProperties: false
      properties:
        expires_at:
          format: date-time
          type: string
        status:
          enum:
            - none
            - verified
            - lapsed
          type: string
        university:
          $ref: "#/components/schemas/StudentUniversityDTO"
        verified_at:
          format: date-time
          type: string
      required:
        - status
      type: object
    AdminStudentViewDTO:
      additionalProperties: false
      properties:
        birth_date:
          description: YYYY-MM-DD; dpo only (data subject request)
          type: string
        created_at:
          format: date-time
          type: string
        email:
          type: string
        first_name:
          type: string
        last_login_at:
          format: date-time
          type: string
        last_name:
          type: string
        locale:
          type: string
        memberships:
          description: Non-sensitive memberships only
          items:
            $ref: "#/components/schemas/AdminStudentMembershipDTO"
          type: array
        mfa_enabled:
          type: boolean
        platform_roles:
          items:
            type: string
          type: array
        privacy:
          $ref: "#/components/schemas/StudentPrivacyDTO"
        profile:
          $ref: "#/components/schemas/AdminStudentProfileDTO"
        registrations:
          description: Event registrations without answers; absent while the events module does not provide them
          items:
            $ref: "#/components/schemas/AdminStudentRegistrationDTO"
          type: array
        status:
          type: string
        student:
          $ref: "#/components/schemas/AdminStudentVerificationDTO"
        user_id:
          format: uuid
          type: string
      required:
        - user_id
        - email
        - first_name
        - last_name
        - status
        - created_at
        - mfa_enabled
        - locale
        - student
        - platform_roles
        - memberships
        - profile
        - privacy
      type: object
    AdminUpdateInputBody:
      additionalProperties: false
      properties:
        assigned_to:
          description: The DPO handling the request
          format: uuid
          type: string
        identity_verified_at:
          description: When the applicant's identity was verified
          format: date-time
          type: string
        response_summary:
          description: Draft of the answer
          maxLength: 4000
          type: string
        status:
          enum:
            - identity_check
            - in_progress
          type: string
      type: object
    AdminUpdatePartyInputBody:
      additionalProperties: false
      properties:
        address:
          $ref: "#/components/schemas/AddressDTO"
          description: Replaces the whole address
        e_invoice_alias:
          description: Empty string clears it
          maxLength: 200
          type: string
        email:
          description: Empty string clears it
          maxLength: 254
          type: string
        legal_type:
          enum:
            - company
            - university
            - foundation
            - association
            - sole_prop
            - individual
            - public_body
            - other
          type: string
        mersis_no:
          description: Empty string clears it
          maxLength: 30
          type: string
        phone:
          description: Empty string clears it
          maxLength: 30
          type: string
        status:
          description: inactive retires the party (not the platform party)
          enum:
            - inactive
          type: string
        tax_no:
          description: VKN; empty string clears it
          maxLength: 20
          type: string
        tax_office:
          description: Empty string clears it
          maxLength: 100
          type: string
        tckn:
          description: "individual only: replaces the national ID (never returned)"
          maxLength: 20
          type: string
        title:
          maxLength: 300
          minLength: 2
          type: string
        vat_status:
          enum:
            - vat_payer
            - vat_exempt
            - not_vat_payer
            - unknown
          type: string
      type: object
    AdminUpdateSkillInputBody:
      additionalProperties: false
      properties:
        category:
          enum:
            - technical
            - tool
            - soft
            - domain
            - language_tool
            - other
          type: string
        is_active:
          type: boolean
        name_en:
          description: Empty string clears it
          maxLength: 200
          type: string
        name_tr:
          maxLength: 200
          minLength: 1
          type: string
      type: object
    AdminUpdateUniversityInputBody:
      additionalProperties: false
      properties:
        city:
          maxLength: 60
          minLength: 2
          type: string
        is_active:
          type: boolean
        name:
          maxLength: 200
          minLength: 2
          type: string
        short_name:
          description: Empty string clears it
          maxLength: 60
          type: string
        type:
          enum:
            - state
            - foundation
            - other
          type: string
        website_url:
          description: Empty string clears it
          maxLength: 2048
          type: string
      type: object
    AdminUserDTO:
      additionalProperties: false
      properties:
        birth_date:
          description: dpo only
          format: date
          type: string
        created_at:
          format: date-time
          type: string
        email:
          type: string
        first_name:
          type: string
        last_login_at:
          format: date-time
          type: string
        last_name:
          type: string
        locale:
          enum:
            - tr-TR
            - en-US
          type: string
        memberships:
          description: Non-club memberships only
          items:
            $ref: "#/components/schemas/MembershipDTO"
          type: array
        mfa_enabled:
          type: boolean
        pending_action:
          $ref: "#/components/schemas/AccountActionDTO"
          description: Set when this call opened (or kept) a four-eyes request instead of acting (06 H-47)
        platform_roles:
          items:
            type: string
          type: array
        status:
          enum:
            - pending_email
            - active
            - suspended
            - erased
          type: string
        student:
          $ref: "#/components/schemas/AdminStudentDTO"
        suspended_at:
          format: date-time
          type: string
        suspension_reason:
          type: string
        user_id:
          format: uuid
          type: string
      required:
        - user_id
        - status
        - locale
        - mfa_enabled
        - created_at
        - student
        - platform_roles
        - memberships
      type: object
    AdminUserList:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/AdminUserSummaryDTO"
          type: array
        next_cursor:
          type: string
      required:
        - items
      type: object
    AdminUserSummaryDTO:
      additionalProperties: false
      properties:
        created_at:
          format: date-time
          type: string
        email:
          type: string
        first_name:
          type: string
        last_login_at:
          format: date-time
          type: string
        last_name:
          type: string
        mfa_enabled:
          type: boolean
        status:
          enum:
            - pending_email
            - active
            - suspended
            - erased
          type: string
        user_id:
          format: uuid
          type: string
      required:
        - user_id
        - status
        - mfa_enabled
        - created_at
      type: object
    AdminVerifyPartyInputBody:
      additionalProperties: false
      properties:
        decision:
          enum:
            - verified
            - rejected
          type: string
        note:
          description: Internal note (audited; no personal data)
          maxLength: 500
          type: string
      required:
        - decision
      type: object
    ApproveInputBody:
      additionalProperties: false
      properties:
        stage:
          enum:
            - first
            - second
          type: string
      required:
        - stage
      type: object
    AssignmentInputBody:
      additionalProperties: false
      properties:
        reauth:
          $ref: "#/components/schemas/ReauthDTO"
          description: Re-authentication proof of the admin (03 §6.2)
      type: object
    AuditActorDTO:
      additionalProperties: false
      properties:
        display:
          description: Display name, when known
          type: string
        user_id:
          description: Absent for system jobs and anonymous requests
          format: uuid
          type: string
      type: object
    AuditEventDTO:
      additionalProperties: false
      properties:
        action:
          description: Audit action (authz action name)
          type: string
        actor:
          $ref: "#/components/schemas/AuditActorDTO"
        ip:
          type: string
        metadata:
          description: Event details (IDs, kinds, flags); never secrets
        occurred_at:
          format: date-time
          type: string
        outcome:
          enum:
            - success
            - denied
            - failure
          type: string
        reason:
