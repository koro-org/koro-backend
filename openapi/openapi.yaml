  /api/v1/events:
    get:
      description: "Published events the caller may see (anonymous: public events only). Without a date range, events that have ended are left out. q matches title, summary and description (full text) or part of the title. Repeated org_id / university_id values are ORed; the two filters together intersect. A date-only starts_from / starts_to is the start / end of that day in Europe/Istanbul."
      operationId: listEvents
      parameters:
        - description: Page size
          explode: false
          in: query
          name: limit
          schema:
            default: 25
            description: Page size
            format: int64
            maximum: 100
            minimum: 1
            type: integer
        - description: Opaque cursor from next_cursor
          explode: false
          in: query
          name: cursor
          schema:
            description: Opaque cursor from next_cursor
            maxLength: 512
            type: string
        - description: Free text, 2-100 characters
          explode: false
          in: query
          name: q
          schema:
            description: Free text, 2-100 characters
            maxLength: 100
            type: string
        - description: Organiser org IDs (repeat the parameter)
          explode: true
          in: query
          name: org_id
          schema:
            description: Organiser org IDs (repeat the parameter)
            items:
              type: string
            maxItems: 20
            type: array
        - description: "University IDs: the university's own org and its clubs"
          explode: true
          in: query
          name: university_id
          schema:
            description: "University IDs: the university's own org and its clubs"
            items:
              type: string
            maxItems: 20
            type: array
        - explode: false
          in: query
          name: category
          schema:
            enum:
              - workshop
              - talk
              - competition
              - career
              - social
              - trip
              - sports
              - culture
              - volunteering
              - other
            type: string
        - explode: false
          in: query
          name: format
          schema:
            enum:
              - in_person
              - online
              - hybrid
            type: string
        - explode: false
          in: query
          name: city
          schema:
            maxLength: 60
            type: string
        - description: RFC 3339 instant or YYYY-MM-DD (Europe/Istanbul day start); inclusive
          explode: false
          in: query
          name: starts_from
          schema:
            description: RFC 3339 instant or YYYY-MM-DD (Europe/Istanbul day start); inclusive
            maxLength: 40
            type: string
        - description: RFC 3339 instant or YYYY-MM-DD (Europe/Istanbul day end); exclusive
          explode: false
          in: query
          name: starts_to
          schema:
            description: RFC 3339 instant or YYYY-MM-DD (Europe/Istanbul day end); exclusive
            maxLength: 40
            type: string
        - description: starts_at (default, soonest first) or -published_at
          explode: false
          in: query
          name: sort
          schema:
            description: starts_at (default, soonest first) or -published_at
            enum:
              - starts_at
              - -published_at
            type: string
