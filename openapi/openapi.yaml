components:
  responses:
    Problem:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      description: RFC 9457 problem details
  schemas:
    AcceptedOutputBody:
      additionalProperties: false
      type: object
    AdminGrantInputBody:
      additionalProperties: false
      properties:
        feature:
          enum:
            - targeted_post
            - targeted_dispatch
            - contact_request
            - discovery_access
          type: string
        kind:
          description: access for discovery_access, quota otherwise
          enum:
            - quota
            - access
          type: string
        quantity_total:
          description: Units (quota only)
          format: int64
          maximum: 100000
          minimum: 1
          type: integer
        reason:
          description: Why the right is granted (audited; no personal data)
          maxLength: 300
          minLength: 3
          type: string
        source_type:
          description: "admin_grant: a package sold offline; promo: a promotion"
          enum:
            - admin_grant
            - promo
          type: string
        valid_from:
          description: Start of the validity window
          format: date-time
          type: string
        valid_to:
          description: End of the validity window (exclusive; in the future, at most three years after valid_from)
          format: date-time
          type: string
      required:
        - feature
        - kind
        - valid_from
        - valid_to
        - source_type
        - reason
      type: object
    AdminOrgDTO:
      additionalProperties: false
      properties:
        city:
          type: string
        closed_at:
          format: date-time
          type: string
        created_at:
          format: date-time
          type: string
        created_by:
          description: User who registered the org
          type: string
        kind:
          enum:
            - platform
            - university
            - club
            - company
            - ngo
          type: string
        name:
          type: string
        org_id:
          type: string
        slug:
          type: string
        status:
          enum:
            - pending_review
            - active
            - suspended
            - closed
          type: string
        verified:
          type: boolean
        verified_at:
          format: date-time
          type: string
      required:
        - org_id
        - kind
        - name
        - slug
        - status
        - verified
        - created_at
      type: object
    AdminOrgList:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/AdminOrgDTO"
          type: array
        next_cursor:
          type: string
      required:
        - items
      type: object
    AdminRevokeInputBody:
      additionalProperties: false
      properties:
        reason:
          description: Why the right is taken back (stored and audited; no personal data)
          maxLength: 300
          minLength: 3
          type: string
      required:
        - reason
      type: object
    AuditActorDTO:
      additionalProperties: false
      properties:
        display:
          description: Display name, when known
          type: string
        user_id:
          description: Absent for system jobs and anonymous requests
          format: uuid
          type: string
      type: object
    AuditEventDTO:
      additionalProperties: false
      properties:
        action:
          description: Audit action (authz action name)
          type: string
        actor:
          $ref: "#/components/schemas/AuditActorDTO"
        ip:
          type: string
        metadata:
          description: Event details (IDs, kinds, flags); never secrets
        occurred_at:
          format: date-time
          type: string
        outcome:
          enum:
            - success
            - denied
            - failure
          type: string
        reason:
          type: string
        resource_id:
          format: uuid
          type: string
        resource_type:
          type: string
        user_agent:
          type: string
      required:
        - action
        - outcome
        - actor
        - occurred_at
      type: object
    AuditEventList:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/AuditEventDTO"
          type: array
        next_cursor:
          type: string
      required:
        - items
      type: object
    AvailabilityDTO:
      additionalProperties: false
      properties:
        access_until:
          description: End of the running access right (discovery_access; absent when none)
          format: date-time
          type: string
        feature:
          enum:
            - targeted_post
            - targeted_dispatch
            - contact_request
            - discovery_access
          type: string
        remaining:
          description: Units usable now (quota features)
          format: int64
          type: integer
      required:
        - feature
      type: object
    ChangePasswordInputBody:
      additionalProperties: false
      properties:
        current_password:
          description: Re-authentication proof (03 §6.2)
          maxLength: 1024
          type: string
        new_password:
          maxLength: 1024
          minLength: 1
          type: string
        reauth:
          $ref: "#/components/schemas/ReauthDTO"
          description: "MFA accounts: reauth.totp_code"
      required:
        - new_password
      type: object
    CompanyDTO:
      additionalProperties: false
      properties:
        domain_verified_at:
          format: date-time
          type: string
        email_domain:
          type: string
        hq_city:
          type: string
        sector_code:
          type: string
        size_band:
          type: string
      type: object
    CompanyPublicDTO:
      additionalProperties: false
      properties:
        hq_city:
          type: string
        sector_code:
          type: string
        size_band:
          type: string
      type: object
    CompleteUploadInputBody:
      additionalProperties: false
      properties:
        sha256:
          description: Lower-case hex SHA-256 of the uploaded bytes
          pattern: ^[0-9a-f]{64}$
          type: string
      required:
        - sha256
      type: object
    ConsentDTO:
      additionalProperties: false
      properties:
        action:
          enum:
            - granted
            - withdrawn
          type: string
        consent_id:
          format: uuid
          type: string
        occurred_at:
          format: date-time
          type: string
        purpose_code:
          type: string
        scope_id:
          description: Event registration of a per-registration purpose
          format: uuid
          type: string
      required:
        - consent_id
        - purpose_code
        - action
        - occurred_at
      type: object
    ConsentGrantBody:
      additionalProperties: false
      properties:
        notice_version_id:
          description: The consent text shown
          format: uuid
          type: string
        purpose_code:
          pattern: ^[a-z][a-z0-9_]{2,40}$
          type: string
        text_sha256:
          description: body_sha256 of that text
          pattern: ^[0-9a-f]{64}$
          type: string
      required:
        - purpose_code
        - notice_version_id
        - text_sha256
      type: object
    ConsentProofDTO:
      additionalProperties: false
      properties:
        action:
          enum:
            - granted
            - withdrawn
          type: string
        channel:
          enum:
            - web
            - mobile
            - email_link
            - admin
            - import
          type: string
        consent_id:
          format: uuid
          type: string
        ip:
          type: string
        notice_version_id:
          format: uuid
          type: string
        occurred_at:
          format: date-time
          type: string
        purpose_code:
          type: string
        scope_id:
          format: uuid
          type: string
        scope_type:
          enum:
            - none
            - registration
          type: string
        text_sha256:
          description: Hex SHA-256 of the text the user saw
          type: string
        user_agent:
          type: string
      required:
        - consent_id
        - purpose_code
        - action
        - scope_type
        - channel
        - occurred_at
      type: object
    ConsentProofList:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/ConsentProofDTO"
          type: array
        next_cursor:
          type: string
      required:
        - items
      type: object
    ConsentStateDTO:
      additionalProperties: false
      properties:
        purpose_code:
          type: string
        scope_id:
          format: uuid
          type: string
        since:
          format: date-time
          type: string
        state:
          description: The newest act decides
          enum:
            - granted
            - withdrawn
          type: string
      required:
        - purpose_code
        - state
        - since
      type: object
    CreateCompanyInputBody:
      additionalProperties: false
      properties:
        email_domain:
          description: The company's e-mail domain (not verified yet)
          maxLength: 253
          type: string
        hq_city:
          maxLength: 60
          type: string
        name:
          maxLength: 200
          minLength: 2
          type: string
        sector_code:
          pattern: ^[a-z_]{2,40}$
          type: string
        size_band:
          enum:
            - 1-10
            - 11-50
            - 51-200
            - 201-1000
            - 1000+
          type: string
        slug:
          description: Derived from the name when omitted
          maxLength: 80
          type: string
        website_url:
          description: https:// only
          maxLength: 2048
          type: string
      required:
        - name
        - sector_code
        - size_band
      type: object
    CreateNoticeInputBody:
      additionalProperties: false
      properties:
        audience:
          enum:
            - all
            - student
            - company
            - club
            - university
          type: string
        body_md:
          description: Markdown; line breaks are stored as LF
          maxLength: 400000
          minLength: 1
          type: string
        kind:
          enum:
            - privacy_notice
            - consent_text
            - terms_of_use
            - cookie_notice
          type: string
        locale:
          enum:
            - tr-TR
            - en-US
          type: string
        purpose_code:
          description: Required for consent_text, forbidden otherwise
          pattern: ^[a-z][a-z0-9_]{2,40}$
          type: string
        reauth:
          $ref: "#/components/schemas/ReauthDTO"
          description: Re-authentication proof (03 §6.2)
        title:
          maxLength: 200
          minLength: 1
          type: string
        version:
          description: e.g. 2026.10.02 or 2026.10.02-2
          pattern: ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}(-[0-9]+)?$
          type: string
      required:
        - kind
        - audience
        - locale
        - version
        - title
        - body_md
      type: object
    CreateUploadInputBody:
      additionalProperties: false
      properties:
        content_type:
          description: Declared MIME type; verified by magic bytes on completion
          enum:
            - application/pdf
            - image/jpeg
            - image/png
            - image/webp
          type: string
        filename:
          description: Original file name (display only; never part of the storage key)
          maxLength: 1024
          minLength: 1
          type: string
        org_id:
          description: Owning organisation (required for org_logo, event_cover, post_media)
          format: uuid
          type: string
        purpose:
          description: What the file is for; decides the MIME/size allow-list and who may upload (03 k30)
          enum:
            - avatar
            - cv
            - edu_document
            - org_logo
            - event_cover
            - post_media
            - club_claim_evidence
            - party_document
            - bank_account_evidence
            - transfer_receipt
            - payout_receipt
            - refund_receipt
            - invoice_pdf
          type: string
        size_bytes:
          description: "Exact size in bytes (the purpose may allow less: avatar 5 MB)"
          format: int64
          maximum: 10485760
          minimum: 1
          type: integer
      required:
        - purpose
        - filename
        - content_type
        - size_bytes
      type: object
    DeliveryDTO:
      additionalProperties: false
      properties:
        channel:
          enum:
            - email
            - push
            - in_app
          type: string
        created_at:
          format: date-time
          type: string
        delivery_id:
          format: uuid
          type: string
        status:
          type: string
        template:
          type: string
      required:
        - delivery_id
        - channel
        - template
        - status
        - created_at
      type: object
    DeliveryList:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/DeliveryDTO"
          type: array
        next_cursor:
          type: string
      required:
        - items
      type: object
    EmailChangeInputBody:
      additionalProperties: false
      properties:
        new_email:
          maxLength: 320
          type: string
        reauth:
          $ref: "#/components/schemas/ReauthDTO"
          description: Re-authentication proof (03 §6.2)
      required:
        - new_email
      type: object
    EmailInputBody:
      additionalProperties: false
      properties:
        email:
          maxLength: 320
          type: string
      required:
        - email
      type: object
    EntitlementDTO:
      additionalProperties: false
      properties:
        entitlement_id:
          format: uuid
          type: string
        feature:
          enum:
            - targeted_post
            - targeted_dispatch
            - contact_request
            - discovery_access
          type: string
        kind:
          enum:
            - quota
            - access
          type: string
        quantity_total:
          description: Units bought (quota only)
          format: int64
          type: integer
        quantity_used:
          format: int64
          type: integer
        source_type:
          enum:
            - order_line
            - admin_grant
            - promo
          type: string
        status:
          enum:
            - pending
            - active
            - exhausted
            - expired
            - revoked
          type: string
        valid_from:
          format: date-time
          type: string
        valid_to:
          format: date-time
          type: string
      required:
        - entitlement_id
        - feature
        - kind
        - quantity_used
        - valid_from
        - valid_to
        - status
        - source_type
      type: object
    EntitlementList:
      additionalProperties: false
      properties:
        available:
          items:
            $ref: "#/components/schemas/AvailabilityDTO"
          type: array
        items:
          items:
            $ref: "#/components/schemas/EntitlementDTO"
          type: array
        next_cursor:
          type: string
      required:
        - items
        - available
      type: object
    FieldError:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.email' or 'path.org_id'
          type: string
        message:
          description: Error message text
          type: string
      required:
        - message
      type: object
    FileState:
      additionalProperties: false
      properties:
        file_id:
          format: uuid
          type: string
        scan_status:
          enum:
            - pending
            - clean
            - infected
            - skipped
          type: string
        status:
          enum:
            - uploading
            - active
          type: string
      required:
        - file_id
        - status
        - scan_status
      type: object
    FileUpload:
      additionalProperties: false
      properties:
        expires_at:
          format: date-time
          type: string
        file_id:
          format: uuid
          type: string
        upload_headers:
          additionalProperties:
            type: string
          description: Headers the PUT must carry exactly (Content-Type)
          type: object
        upload_url:
          description: Presigned PUT URL of the object storage
          type: string
      required:
        - file_id
        - upload_url
        - upload_headers
        - expires_at
      type: object
    LoginInputBody:
      additionalProperties: false
      properties:
        device_label:
          description: Shown in the session list
          maxLength: 100
          type: string
        email:
          maxLength: 320
          type: string
        password:
          maxLength: 1024
          minLength: 1
          type: string
      required:
        - email
        - password
      type: object
    MeDTO:
      additionalProperties: false
      properties:
        birth_date:
          format: date
          type: string
        capabilities:
          description: Menu hints only; every request is authorized on its own
          items:
            type: string
          type: array
        email:
          type: string
        email_verified_at:
          format: date-time
          type: string
        first_name:
          type: string
        is_minor:
          type: boolean
        last_name:
          type: string
        locale:
          enum:
            - tr-TR
            - en-US
          type: string
        memberships:
          items:
            $ref: "#/components/schemas/MembershipDTO"
          type: array
        mfa_enabled:
          type: boolean
        platform_roles:
          items:
            type: string
          type: array
        signup_persona:
          enum:
            - student
            - company
            - university
            - club
            - platform
          type: string
        student:
          $ref: "#/components/schemas/StudentDTO"
        user_id:
          format: uuid
          type: string
      required:
        - user_id
        - email
        - first_name
        - last_name
        - locale
        - signup_persona
        - mfa_enabled
        - is_minor
        - student
        - memberships
        - platform_roles
        - capabilities
      type: object
    MembershipDTO:
      additionalProperties: false
      properties:
        org_id:
          format: uuid
          type: string
        org_kind:
          enum:
            - club
            - university
            - company
            - platform
            - ngo
          type: string
        role:
          type: string
      required:
        - org_id
        - org_kind
        - role
      type: object
    MyConsentsDTO:
      additionalProperties: false
      properties:
        current:
          description: Current state of every purpose the caller ever acted on (all pages)
          items:
            $ref: "#/components/schemas/ConsentStateDTO"
          type: array
        items:
          description: Consent history, newest first
          items:
            $ref: "#/components/schemas/ConsentDTO"
          type: array
        next_cursor:
          type: string
      required:
        - current
        - items
      type: object
    MySessionDTO:
      additionalProperties: false
      properties:
        client_kind:
          enum:
            - web
            - mobile
          type: string
        created_at:
          format: date-time
          type: string
        current:
          description: The session of this request
          type: boolean
        device_label:
          type: string
        last_seen_at:
          format: date-time
          type: string
        session_id:
          format: uuid
          type: string
      required:
        - session_id
        - client_kind
        - created_at
        - last_seen_at
        - current
      type: object
    MySessionList:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/MySessionDTO"
          type: array
        next_cursor:
          type: string
      required:
        - items
      type: object
    NoticeDTO:
      additionalProperties: false
      properties:
        audience:
          enum:
            - all
            - student
            - company
            - club
            - university
          type: string
        body_md:
          description: Markdown text exactly as shown
          type: string
        body_sha256:
          description: Lower-case hex SHA-256 of the UTF-8 bytes of body_md
          type: string
        kind:
          enum:
            - privacy_notice
            - consent_text
            - terms_of_use
            - cookie_notice
          type: string
        locale:
          enum:
            - tr-TR
            - en-US
          type: string
        notice_version_id:
          format: uuid
          type: string
        published_at:
          format: date-time
          type: string
        purpose_code:
          description: Consent purpose of a consent_text; absent for every other kind
          type: string
        retired_at:
          format: date-time
          type: string
        status:
          description: Retired versions stay readable as proof
          enum:
            - draft
            - published
            - retired
          type: string
        title:
          type: string
        version:
          description: YYYY.MM.DD or YYYY.MM.DD-N
          type: string
      required:
        - notice_version_id
        - kind
        - audience
        - locale
        - version
        - title
        - body_md
        - body_sha256
        - status
      type: object
    NoticeList:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/NoticeDTO"
          type: array
      required:
        - items
      type: object
    NoticeTransitionInputBody:
      additionalProperties: false
      properties:
        reauth:
          $ref: "#/components/schemas/ReauthDTO"
          description: Re-authentication proof (03 §6.2)
      type: object
    NotificationDTO:
      additionalProperties: false
      properties:
        body:
          type: string
        created_at:
          format: date-time
          type: string
        data:
          additionalProperties:
            type: string
          description: Opaque IDs only
          type: object
        kind:
          description: The notification kind (template ID)
          type: string
        link_path:
          description: In-app relative path
          type: string
        notification_id:
          format: uuid
          type: string
        read_at:
          format: date-time
          type: string
        source_org:
          $ref: "#/components/schemas/SourceOrgDTO"
        title:
          type: string
      required:
        - notification_id
        - kind
        - title
        - created_at
      type: object
    NotificationList:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/NotificationDTO"
          type: array
        next_cursor:
          type: string
      required:
        - items
      type: object
    OrgCardDTO:
      additionalProperties: false
      properties:
        city:
          type: string
        kind:
          enum:
            - platform
            - university
            - club
            - company
            - ngo
          type: string
        logo_url:
          type: string
        name:
          type: string
        org_id:
          type: string
        slug:
          type: string
        verified:
          type: boolean
      required:
        - org_id
        - kind
        - name
        - slug
        - verified
      type: object
    OrgCardList:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/OrgCardDTO"
          type: array
        next_cursor:
          type: string
      required:
        - items
      type: object
    OrgDTO:
      additionalProperties: false
      properties:
        city:
          type: string
        closed_at:
          format: date-time
          type: string
        company:
          $ref: "#/components/schemas/CompanyDTO"
        created_at:
          format: date-time
          type: string
        description:
          type: string
        kind:
          enum:
            - platform
            - university
            - club
            - company
            - ngo
          type: string
        logo_file_id:
          type: string
        logo_url:
          type: string
        name:
          type: string
        org_id:
          type: string
        slug:
          type: string
        status:
          enum:
            - pending_review
            - active
            - suspended
            - closed
          type: string
        updated_at:
          format: date-time
          type: string
        verified:
          type: boolean
        verified_at:
          format: date-time
          type: string
        website_url:
          type: string
      required:
        - org_id
        - kind
        - name
        - slug
        - status
        - verified
        - created_at
        - updated_at
      type: object
    OrgPublicDTO:
      additionalProperties: false
      properties:
        city:
          type: string
        company:
          $ref: "#/components/schemas/CompanyPublicDTO"
        description:
          type: string
        follower_count:
          description: null below 10 followers (k-anonymity)
          format: int64
          type:
            - integer
            - "null"
        kind:
          enum:
            - platform
            - university
            - club
            - company
            - ngo
          type: string
        logo_url:
          description: Short-lived download URL (at most 5 minutes)
          type: string
        name:
          type: string
        org_id:
          type: string
        slug:
          type: string
        status:
          enum:
            - pending_review
            - active
            - suspended
            - closed
          type: string
        verified:
          type: boolean
        website_url:
          type: string
      required:
        - org_id
        - kind
        - name
        - slug
        - status
        - verified
        - follower_count
      type: object
    PreferenceDTO:
      additionalProperties: false
      properties:
        category:
          enum:
            - security
            - registration_updates
            - event_updates
            - contact_requests
            - feed_follows
            - orders_payments
            - moderation
          type: string
        channel:
          enum:
            - email
            - push
            - in_app
          type: string
        enabled:
          type: boolean
      required:
        - category
        - channel
        - enabled
      type: object
    PreferenceList:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/PreferenceDTO"
          type: array
      required:
        - items
      type: object
    Problem:
      additionalProperties: false
      properties:
        code:
          description: Stable machine-readable error code
          examples:
            - validation_failed
          type: string
        detail:
          description: Occurrence-specific explanation without personal data
          type: string
        errors:
          description: Field errors (never contain the submitted value)
          items:
            $ref: "#/components/schemas/FieldError"
          type: array
        instance:
          description: urn:koro:request:<request id>
          examples:
            - urn:koro:request:01J9Z3T2Q5V6
          format: uri-reference
          type: string
        status:
          description: HTTP status code
          examples:
            - 422
          format: int64
          type: integer
        title:
          description: Fixed English summary of the code; clients translate by code
          examples:
            - Validation failed
          type: string
        type:
          description: PROBLEM_TYPE_BASE + code
          examples:
            - urn:koro:problem:validation_failed
          format: uri-reference
          type: string
      required:
        - type
        - title
        - status
        - code
      type: object
    PurposeDTO:
      additionalProperties: false
      properties:
        active:
          type: boolean
        created_at:
          format: date-time
          type: string
        description_tr:
          type: string
        iys_channel:
          enum:
            - email
            - sms
            - call
          type: string
        legal_basis:
          enum:
            - explicit_consent
            - contract
            - legal_obligation
            - legitimate_interest
          type: string
        purpose_code:
          type: string
        requires_iys:
          type: boolean
        scope_type:
          enum:
            - none
            - registration
          type: string
      required:
        - purpose_code
        - description_tr
        - legal_basis
        - requires_iys
        - scope_type
        - active
        - created_at
      type: object
    PurposeList:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/PurposeDTO"
          type: array
      required:
        - items
      type: object
    PushTokenCreatedDTO:
      additionalProperties: false
      properties:
        push_token_id:
          format: uuid
          type: string
      required:
        - push_token_id
      type: object
    PutPreferencesInputBody:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/PreferenceDTO"
          maxItems: 21
          minItems: 1
          type: array
      required:
        - items
      type: object
    ReasonReauthInputBody:
      additionalProperties: false
      properties:
        reason:
          maxLength: 500
          minLength: 3
          type: string
        reauth:
          $ref: "#/components/schemas/ReauthDTO"
          description: Re-authentication proof (03 §6.2)
      required:
        - reason
      type: object
    ReauthDTO:
      additionalProperties: false
      properties:
        password:
          description: Account password (account without MFA)
          maxLength: 1024
          type: string
        totp_code:
          description: Current TOTP code (account with MFA; recovery codes are not accepted)
          pattern: ^[0-9]{6}$
          type: string
      type: object
    RecordMineInputBody:
      additionalProperties: false
      properties:
        action:
          enum:
            - granted
            - withdrawn
          type: string
        notice_version_id:
          description: The consent text shown (required to grant)
          format: uuid
          type: string
        purpose_code:
          pattern: ^[a-z][a-z0-9_]{2,40}$
          type: string
        scope_id:
          description: Event registration (per-registration purposes only)
          format: uuid
          type: string
        text_sha256:
          description: body_sha256 of that text (required to grant)
          pattern: ^[0-9a-f]{64}$
          type: string
      required:
        - purpose_code
        - action
      type: object
    RegisterInputBody:
      additionalProperties: false
      properties:
        birth_date:
          description: YYYY-MM-DD; required for students (age gate)
          format: date
          type: string
        consents:
          description: Optional consents, one per purpose (unticked by default)
          items:
            $ref: "#/components/schemas/ConsentGrantBody"
          maxItems: 10
          type: array
        email:
          maxLength: 320
          type: string
        first_name:
          maxLength: 200
          minLength: 1
          type: string
        last_name:
          maxLength: 200
          minLength: 1
          type: string
        locale:
          enum:
            - tr-TR
            - en-US
          type: string
        password:
          description: 15-128 characters; common passwords are refused
          maxLength: 1024
          minLength: 1
          type: string
        privacy_notice_version_id:
          description: The privacy notice shown on the page
          format: uuid
          type: string
        signup_persona:
          enum:
            - student
            - company
            - university
            - club
          type: string
      required:
        - email
        - password
        - first_name
        - last_name
        - signup_persona
        - locale
        - privacy_notice_version_id
      type: object
    RegisterPushInputBody:
      additionalProperties: false
      properties:
        app_version:
          maxLength: 40
          type: string
        platform:
          enum:
            - ios
            - android
            - web
          type: string
        token:
          maxLength: 4096
          minLength: 1
          type: string
      required:
        - platform
        - token
      type: object
    ResetConfirmInputBody:
      additionalProperties: false
      properties:
        new_password:
          maxLength: 1024
          minLength: 1
          type: string
        token:
          maxLength: 128
          minLength: 1
          type: string
      required:
        - token
        - new_password
      type: object
    RevokedEntitlementDTO:
      additionalProperties: false
      properties:
        entitlement_id:
          format: uuid
          type: string
        feature:
          enum:
            - targeted_post
            - targeted_dispatch
            - contact_request
            - discovery_access
          type: string
        kind:
          enum:
            - quota
            - access
          type: string
        quantity_total:
          description: Units bought (quota only)
          format: int64
          type: integer
        quantity_used:
          format: int64
          type: integer
        source_type:
          enum:
            - order_line
            - admin_grant
            - promo
          type: string
        status:
          enum:
            - pending
            - active
            - exhausted
            - expired
            - revoked
          type: string
        valid_from:
          format: date-time
          type: string
        valid_to:
          format: date-time
          type: string
        warning:
          description: "Set when the right was bought with an order: no refund was started"
          enum:
            - order_refund_not_started
          type: string
      required:
        - entitlement_id
        - feature
        - kind
        - quantity_used
        - valid_from
        - valid_to
        - status
        - source_type
      type: object
    SecurityEventDTO:
      additionalProperties: false
      properties:
        action:
          description: Audit action (authz action name)
          type: string
        ip_prefix:
          description: Network of the client (/24 or /48); absent for accesses by staff
          type: string
        occurred_at:
          format: date-time
          type: string
        outcome:
          enum:
            - success
            - denied
            - failure
          type: string
        user_agent_family:
          description: Browser or app family, e.g. Chrome, Koro app
          type: string
      required:
        - action
        - outcome
        - occurred_at
      type: object
    SecurityEventList:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/SecurityEventDTO"
          type: array
        next_cursor:
          type: string
      required:
        - items
      type: object
    SessionDTO:
      additionalProperties: false
      properties:
        challenge_id:
          format: uuid
          type: string
        expires_at:
          description: Absolute expiry of the session (or of the MFA challenge)
          format: date-time
          type: string
        idle_expires_at:
          description: Expiry if the session stays idle; slides with use
          format: date-time
          type: string
        mfa_required:
          description: "true: complete the login with completeMfaLogin"
          type: boolean
        token:
          description: Opaque bearer token (mobile clients only; shown once)
          type: string
        user_id:
          format: uuid
          type: string
      type: object
    SourceOrgDTO:
      additionalProperties: false
      properties:
        org_id:
          format: uuid
          type: string
      required:
        - org_id
      type: object
    StudentDTO:
      additionalProperties: false
      properties:
        status:
          enum:
            - none
            - verified
            - lapsed
          type: string
        university_id:
          format: uuid
          type: string
      required:
        - status
      type: object
    SuppressionDTO:
      additionalProperties: false
      properties:
        created_at:
          format: date-time
          type: string
        reason:
          enum:
            - hard_bounce
            - complaint
            - manual
            - invalid
          type: string
        source:
          enum:
            - provider_webhook
            - admin
            - user_request
          type: string
        suppression_id:
          type: string
      required:
        - suppression_id
        - reason
        - source
        - created_at
      type: object
    SuppressionList:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/SuppressionDTO"
          type: array
        next_cursor:
          type: string
      required:
        - items
      type: object
    TokenInputBody:
      additionalProperties: false
      properties:
        token:
          description: The token from the e-mail link
          maxLength: 128
          minLength: 1
          type: string
      required:
        - token
      type: object
    TransferInputBody:
      additionalProperties: false
      properties:
        new_owner_user_id:
          description: An active company_admin of the company
          format: uuid
          type: string
        reauth:
          $ref: "#/components/schemas/ReauthDTO"
          description: Re-authentication proof (03 §6.2)
      required:
        - new_owner_user_id
      type: object
    UpdateMeInputBody:
      additionalProperties: false
      properties:
        first_name:
          maxLength: 200
          minLength: 1
          type: string
        last_name:
          maxLength: 200
          minLength: 1
          type: string
        locale:
          enum:
            - tr-TR
            - en-US
          type: string
      type: object
    UpdateOrgInputBody:
      additionalProperties: false
      properties:
        city:
          maxLength: 60
          type: string
        description:
          description: Empty string clears it
          maxLength: 5000
          type: string
        email_domain:
          description: Companies only; a change resets its verification
          maxLength: 253
          type: string
        hq_city:
          description: Companies only
          maxLength: 60
          type: string
        logo_file_id:
          description: An org_logo upload (createUpload); empty string removes the logo
          type: string
        name:
          maxLength: 200
          minLength: 2
          type: string
        sector_code:
          description: Companies only
          maxLength: 40
          type: string
        size_band:
          description: "Companies only: 1-10, 11-50, 51-200, 201-1000, 1000+"
          maxLength: 10
          type: string
        website_url:
          description: https:// only; empty string clears it
          maxLength: 2048
          type: string
      type: object
    UpdatePurposeInputBody:
      additionalProperties: false
      properties:
        active:
          description: false switches the purpose off for everyone
          type: boolean
        description_tr:
          maxLength: 1000
          type: string
        reauth:
          $ref: "#/components/schemas/ReauthDTO"
          description: Re-authentication proof (03 §6.2)
      type: object
    UsageDTO:
      additionalProperties: false
      properties:
        actor_user_id:
          description: Who consumed; platform_admin and finance_admin only
          format: uuid
          type: string
        created_at:
          format: date-time
          type: string
        feature:
          enum:
            - targeted_post
            - targeted_dispatch
            - contact_request
            - discovery_access
          type: string
        quantity:
          description: "Positive: consumption; negative: reversal (release)"
          format: int64
          type: integer
        ref_id:
          format: uuid
          type: string
        ref_type:
          enum:
            - post
            - dispatch
            - contact_request
          type: string
        usage_id:
          format: uuid
          type: string
      required:
        - usage_id
        - feature
        - quantity
        - ref_type
        - ref_id
        - created_at
      type: object
    UsageList:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/UsageDTO"
          type: array
        next_cursor:
          type: string
      required:
        - items
      type: object
    VerifyDTO:
      additionalProperties: false
      properties:
        checked_rows:
          format: int64
          type: integer
        first_bad_chain_seq:
          description: First chain position that fails verification
          format: int64
          type: integer
        ok:
          type: boolean
      required:
        - ok
        - checked_rows
      type: object
    VerifyInputBody:
      additionalProperties: false
      properties:
        note:
          description: Internal note (audited)
          maxLength: 500
          type: string
      type: object
    VerifyRequest:
      additionalProperties: false
      properties:
        from_day:
          description: First day (Europe/Istanbul)
          format: date
          type: string
        to_day:
          description: Last day (Europe/Istanbul), at most 31 days after from_day
          format: date
          type: string
      required:
        - from_day
        - to_day
      type: object
  securitySchemes:
    bearerAuth:
      bearerFormat: opaque
      scheme: bearer
      type: http
    sessionCookie:
      in: cookie
      name: __Host-koro_session
      type: apiKey
info:
  description: Koro backend API. Errors are RFC 9457 application/problem+json with a stable `code`.
  title: Koro API
  version: 1.0.0
openapi: 3.1.0
paths:
  /api/v1/admin/audit-events:
    get:
      description: The search itself is recorded in the audit log.
      operationId: adminListAuditEvents
      parameters:
        - description: Page size
          explode: false
          in: query
          name: limit
          schema:
            default: 25
            description: Page size
            format: int64
            maximum: 100
            minimum: 1
            type: integer
        - description: Opaque cursor from next_cursor
          explode: false
          in: query
          name: cursor
          schema:
            description: Opaque cursor from next_cursor
            maxLength: 512
            type: string
        - description: RFC 3339 time or YYYY-MM-DD (start of that day, Europe/Istanbul)
          explode: false
          in: query
          name: occurred_from
          required: true
          schema:
            description: RFC 3339 time or YYYY-MM-DD (start of that day, Europe/Istanbul)
            maxLength: 40
            type: string
        - description: RFC 3339 time or YYYY-MM-DD (end of that day, Europe/Istanbul); inclusive
          explode: false
          in: query
          name: occurred_to
          required: true
          schema:
            description: RFC 3339 time or YYYY-MM-DD (end of that day, Europe/Istanbul); inclusive
            maxLength: 40
            type: string
        - explode: false
          in: query
          name: actor_user_id
          schema:
            format: uuid
            type: string
        - explode: false
          in: query
          name: org_id
          schema:
            format: uuid
            type: string
        - explode: false
          in: query
          name: resource_type
          schema:
            maxLength: 64
            pattern: ^[a-z_]+$
            type: string
        - explode: false
          in: query
          name: resource_id
          schema:
            format: uuid
            type: string
        - description: Exact action name
          explode: false
          in: query
          name: action
          schema:
            description: Exact action name
            maxLength: 100
            pattern: ^[a-z_]+(\.[a-z_]+)+$
            type: string
        - explode: false
          in: query
          name: outcome
          schema:
            enum:
              - success
              - denied
              - failure
            type: string
        - description: Only break-glass accesses (true) or none of them (false)
          explode: false
          in: query
          name: break_glass
          schema:
            description: Only break-glass accesses (true) or none of them (false)
            enum:
              - "true"
              - "false"
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEventList"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      security:
        - sessionCookie: []
        - bearerAuth: []
      summary: Search all audit events
      tags:
        - audit
      x-koro-action: audit.event.list
      x-koro-rate-limit: search
      x-koro-surface: admin
  /api/v1/admin/audit/verify:
    post:
      operationId: adminVerifyAuditChain
      parameters:
        - description: "Optional client-generated key; a retry with the same key and body replays the first response (Idempotent-Replayed: true)"
          in: header
          name: Idempotency-Key
          schema:
            description: "Optional client-generated key; a retry with the same key and body replays the first response (Idempotent-Replayed: true)"
            maxLength: 255
            minLength: 8
            pattern: ^[A-Za-z0-9_-]+$
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifyDTO"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      security:
        - sessionCookie: []
        - bearerAuth: []
      summary: Verify the audit hash chain and its signed daily roots
      tags:
        - audit
      x-koro-action: audit.chain.verify
      x-koro-idempotency: optional
      x-koro-rate-limit: write_default
      x-koro-surface: admin
  /api/v1/admin/consent-purposes:
    get:
      operationId: adminListConsentPurposes
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurposeList"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      security:
        - sessionCookie: []
        - bearerAuth: []
      summary: List the consent purposes
      tags:
        - consent
      x-koro-action: consent.purpose.manage
      x-koro-rate-limit: read_default
      x-koro-surface: admin
  /api/v1/admin/consent-purposes/{purpose_code}:
    patch:
      description: An inactive purpose is never in force for anyone; the ledger keeps its rows.
      operationId: adminUpdateConsentPurpose
      parameters:
        - description: Purpose code (an unknown code is 404)
          in: path
          name: purpose_code
          required: true
          schema:
            description: Purpose code (an unknown code is 404)
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePurposeInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurposeDTO"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      security:
        - sessionCookie: []
        - bearerAuth: []
      summary: Switch a consent purpose on or off, or edit its description
      tags:
        - consent
      x-koro-action: consent.purpose.manage
      x-koro-rate-limit: reauth
      x-koro-reauth: true
      x-koro-surface: admin
  /api/v1/admin/email-suppressions:
    get:
      description: "Addresses are kept as blind indexes only: email finds one address by exact match. Break-glass: X-Koro-Access-Reason is mandatory and every read is audited."
      operationId: adminListEmailSuppressions
      parameters:
        - description: Break-glass justification (10–500 characters, mandatory)
          in: header
          name: X-Koro-Access-Reason
          schema:
            description: Break-glass justification (10–500 characters, mandatory)
            maxLength: 500
            type: string
        - description: Support ticket reference (optional)
          in: header
          name: X-Koro-Ticket-Ref
          schema:
            description: Support ticket reference (optional)
            maxLength: 100
            type: string
        - description: Page size
          explode: false
          in: query
          name: limit
          schema:
            default: 25
            description: Page size
            format: int64
            maximum: 100
            minimum: 1
            type: integer
        - description: Opaque cursor from next_cursor
          explode: false
          in: query
          name: cursor
          schema:
            description: Opaque cursor from next_cursor
            maxLength: 512
            type: string
        - description: Exact address (matched by its blind index; never stored)
          explode: false
          in: query
          name: email
          schema:
            description: Exact address (matched by its blind index; never stored)
            maxLength: 254
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuppressionList"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      security:
        - sessionCookie: []
        - bearerAuth: []
      summary: List e-mail suppressions
      tags:
        - notify
      x-koro-action: notify.suppression.manage
      x-koro-break-glass: true
      x-koro-rate-limit: read_default
      x-koro-surface: admin
  /api/v1/admin/email-suppressions/{suppression_id}:
    delete:
      description: "The address may receive e-mail again. Break-glass: X-Koro-Access-Reason is mandatory; audited."
      operationId: adminDeleteEmailSuppression
      parameters:
        - description: Break-glass justification (10–500 characters, mandatory)
          in: header
          name: X-Koro-Access-Reason
          schema:
            description: Break-glass justification (10–500 characters, mandatory)
            maxLength: 500
            type: string
        - description: Support ticket reference (optional)
          in: header
          name: X-Koro-Ticket-Ref
          schema:
            description: Support ticket reference (optional)
            maxLength: 100
            type: string
        - description: Suppression ID (an unknown or malformed ID is 404)
          in: path
          name: suppression_id
          required: true
          schema:
            description: Suppression ID (an unknown or malformed ID is 404)
            maxLength: 64
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      security:
        - sessionCookie: []
        - bearerAuth: []
      summary: Remove an e-mail suppression
      tags:
        - notify
      x-koro-action: notify.suppression.manage
      x-koro-break-glass: true
      x-koro-rate-limit: write_default
      x-koro-surface: admin
  /api/v1/admin/entitlements/{entitlement_id}/revoke:
    post:
      description: "Units already used stay used. Revoking an expired right is 409; a revoked one is returned unchanged. A right bought with an order is revoked without a refund: warning order_refund_not_started tells the admin to start the refund separately."
      operationId: adminRevokeEntitlement
      parameters:
        - description: "Optional client-generated key; a retry with the same key and body replays the first response (Idempotent-Replayed: true)"
          in: header
          name: Idempotency-Key
          schema:
            description: "Optional client-generated key; a retry with the same key and body replays the first response (Idempotent-Replayed: true)"
            maxLength: 255
            minLength: 8
            pattern: ^[A-Za-z0-9_-]+$
            type: string
        - description: Entitlement ID (an unknown or malformed ID is 404)
          in: path
          name: entitlement_id
          required: true
          schema:
            description: Entitlement ID (an unknown or malformed ID is 404)
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminRevokeInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevokedEntitlementDTO"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      security:
        - sessionCookie: []
        - bearerAuth: []
      summary: Revoke an entitlement
      tags:
        - entitlements
