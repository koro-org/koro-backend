          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      security:
        - sessionCookie: []
        - bearerAuth: []
      summary: Confirm TOTP enrollment
      tags:
        - identity
      x-koro-action: identity.mfa.confirm
