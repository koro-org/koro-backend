  /api/v1/auth/register:
    post:
      description: Always 202 for a valid request, whether the address is new or already registered (no account enumeration); a verification e-mail follows. birth_date is required for students (age gate). The privacy notice shown on the page is recorded as shown, never as consent; terms_notice_version_id is the current terms of use the user accepted with the mandatory box (422 consent.terms_not_current otherwise); consents are optional, one per purpose.
      operationId: registerAccount
      parameters:
        - description: Client kind (consent channel); default web
          in: header
          name: X-Koro-Client
          schema:
            description: Client kind (consent channel); default web
            enum:
              - web
              - mobile
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInputBody"
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedOutputBody"
          description: Accepted
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: Register an account
      tags:
        - identity
      x-koro-action: identity.account.register
      x-koro-idempotency: optional
      x-koro-rate-limit: auth_register
      x-koro-surface: public
  /api/v1/auth/sessions:
    post:
      description: "Web clients (X-Koro-Client: web, the default) get the __Host-koro_session cookie and no token; mobile clients get the bearer token once in the body. Wrong credentials, unknown or locked accounts all answer 401 identity.invalid_credentials; an unverified account 403 identity.email_not_verified. An MFA account gets mfa_required with a challenge (5 minutes) instead of a session: completeMfaLogin opens it."
      operationId: createSession
      parameters:
        - description: "web (default): cookie; mobile: bearer token in the body"
          in: header
          name: X-Koro-Client
          schema:
            description: "web (default): cookie; mobile: bearer token in the body"
            enum:
              - web
              - mobile
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionDTO"
          description: OK
          headers:
            Set-Cookie:
              schema:
                type: string
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: Sign in
      tags:
        - identity
      x-koro-action: identity.session.create
      x-koro-idempotency: optional
      x-koro-rate-limit: auth_login
      x-koro-surface: public
  /api/v1/auth/sessions/current:
    delete:
      description: Revokes the session of this request and clears the cookie.
      operationId: deleteCurrentSession
      responses:
        "204":
          description: No Content
          headers:
            Set-Cookie:
              schema:
                type: string
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      security:
        - sessionCookie: []
        - bearerAuth: []
      summary: Sign out
      tags:
        - identity
      x-koro-action: identity.session.delete_current
      x-koro-rate-limit: write_default
      x-koro-surface: self
      x-koro-terms-gate: exempt
  /api/v1/auth/sessions/mfa:
    post:
      description: "Second step of an MFA account's login: the challenge of createSession (valid 5 minutes, single use) with a TOTP code or a recovery code (exactly one). The session opens MFA-verified; web clients get the cookie, mobile clients the token (the client kind of the password step). Any failure is 401 identity.mfa_login_failed. A recovery code sign-in sends a security notice."
      operationId: completeMfaLogin
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MfaLoginInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionDTO"
          description: OK
          headers:
            Set-Cookie:
              schema:
                type: string
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: Complete an MFA sign-in
      tags:
        - identity
      x-koro-action: identity.session.create
      x-koro-idempotency: optional
      x-koro-rate-limit: auth_login
      x-koro-surface: public
  /api/v1/clubs:
    get:
      description: q matches the club name with Turkish rules (İSTANBUL, Istanbul and istanbul are the same word). member_count is null below 10 members and for sensitive clubs.
      operationId: listClubs
      parameters:
        - description: Page size
          explode: false
          in: query
          name: limit
          schema:
            default: 25
            description: Page size
            format: int64
            maximum: 100
            minimum: 1
            type: integer
        - description: Opaque cursor from next_cursor
          explode: false
          in: query
          name: cursor
          schema:
            description: Opaque cursor from next_cursor
            maxLength: 512
            type: string
        - description: Free text, 2-100 characters
          explode: false
          in: query
          name: q
          schema:
            description: Free text, 2-100 characters
            maxLength: 100
            type: string
        - explode: false
          in: query
          name: university_id
          schema:
            format: uuid
            type: string
        - explode: false
          in: query
          name: category
          schema:
            enum:
              - academic
              - technology
              - career
              - entrepreneurship
              - arts
              - culture
              - sports
              - social_responsibility
              - hobby
              - religious
              - political
              - identity
              - other
            type: string
        - explode: false
          in: query
          name: claimed
          schema:
            enum:
              - "true"
              - "false"
            type: string
        - description: name (A-Z, Turkish order); default newest first
          explode: false
          in: query
          name: sort
          schema:
            description: name (A-Z, Turkish order); default newest first
            enum:
              - name
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClubCardList"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: List clubs
      tags:
        - directory
      x-koro-action: directory.club.list
      x-koro-rate-limit: read_default
      x-koro-surface: public
  /api/v1/clubs/{club_id}:
    get:
      description: club_id is the club's org_id. The ETag is the If-Match value of updateClub.
      operationId: getClub
      parameters:
        - description: The club's org ID
          in: path
          name: club_id
          required: true
          schema:
            description: The club's org ID
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClubDTO"
          description: OK
          headers:
            ETag:
              schema:
                type: string
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: Get a club
      tags:
        - directory
      x-koro-action: directory.club.read
      x-koro-rate-limit: read_default
      x-koro-surface: public
    patch:
      description: "If-Match with the ETag of getClub is required: missing → 428, stale → 412. A religious, political or identity category needs the sensitive flag first (422 directory.sensitivity_required)."
      operationId: updateClub
      parameters:
        - description: The club's org ID
          in: path
          name: club_id
          required: true
          schema:
