          description: false switches the purpose off for everyone
          type: boolean
        description_tr:
          maxLength: 1000
          type: string
        reauth:
          $ref: "#/components/schemas/ReauthDTO"
          description: Re-authentication proof (03 §6.2)
      type: object
    UsageDTO:
      additionalProperties: false
      properties:
        actor_user_id:
          description: Who consumed; platform_admin and finance_admin only
          format: uuid
          type: string
        created_at:
          format: date-time
          type: string
        feature:
          enum:
            - targeted_post
            - targeted_dispatch
            - contact_request
            - discovery_access
          type: string
        quantity:
          description: "Positive: consumption; negative: reversal (release)"
          format: int64
          type: integer
        ref_id:
          format: uuid
          type: string
        ref_type:
          enum:
            - post
            - dispatch
            - contact_request
          type: string
        usage_id:
          format: uuid
          type: string
      required:
        - usage_id
        - feature
        - quantity
        - ref_type
        - ref_id
        - created_at
      type: object
    UsageList:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/UsageDTO"
          type: array
        next_cursor:
          type: string
      required:
        - items
      type: object
    UserRefDTO:
      additionalProperties: false
      properties:
        first_name:
          type: string
        last_name:
          type: string
        user_id:
          format: uuid
          type: string
      required:
        - user_id
      type: object
    VerifyDTO:
      additionalProperties: false
      properties:
        checked_rows:
          format: int64
          type: integer
        first_bad_chain_seq:
          description: First chain position that fails verification
          format: int64
          type: integer
        ok:
          type: boolean
      required:
        - ok
        - checked_rows
      type: object
    VerifyInputBody:
      additionalProperties: false
      properties:
        note:
          description: Internal note (audited)
          maxLength: 500
          type: string
      type: object
    VerifyRequest:
      additionalProperties: false
      properties:
        from_day:
          description: First day (Europe/Istanbul)
          format: date
          type: string
        to_day:
          description: Last day (Europe/Istanbul), at most 31 days after from_day
          format: date
          type: string
      required:
        - from_day
        - to_day
      type: object
  securitySchemes:
    bearerAuth:
      bearerFormat: opaque
      scheme: bearer
      type: http
    sessionCookie:
      in: cookie
      name: __Host-koro_session
      type: apiKey
info:
  description: Koro backend API. Errors are RFC 9457 application/problem+json with a stable `code`.
  title: Koro API
  version: 1.0.0
openapi: 3.1.0
paths:
  /api/v1/admin/audit-events:
    get:
      description: The search itself is recorded in the audit log.
      operationId: adminListAuditEvents
      parameters:
        - description: Page size
          explode: false
          in: query
          name: limit
          schema:
            default: 25
            description: Page size
            format: int64
            maximum: 100
            minimum: 1
            type: integer
        - description: Opaque cursor from next_cursor
          explode: false
          in: query
          name: cursor
          schema:
            description: Opaque cursor from next_cursor
            maxLength: 512
            type: string
        - description: RFC 3339 time or YYYY-MM-DD (start of that day, Europe/Istanbul)
          explode: false
          in: query
          name: occurred_from
          required: true
          schema:
            description: RFC 3339 time or YYYY-MM-DD (start of that day, Europe/Istanbul)
            maxLength: 40
            type: string
        - description: RFC 3339 time or YYYY-MM-DD (end of that day, Europe/Istanbul); inclusive
          explode: false
          in: query
          name: occurred_to
          required: true
          schema:
            description: RFC 3339 time or YYYY-MM-DD (end of that day, Europe/Istanbul); inclusive
            maxLength: 40
            type: string
        - explode: false
          in: query
          name: actor_user_id
          schema:
            format: uuid
            type: string
        - explode: false
          in: query
          name: org_id
          schema:
            format: uuid
            type: string
        - explode: false
          in: query
          name: resource_type
          schema:
            maxLength: 64
            pattern: ^[a-z_]+$
            type: string
        - explode: false
          in: query
          name: resource_id
          schema:
            format: uuid
            type: string
        - description: Exact action name
          explode: false
          in: query
          name: action
          schema:
            description: Exact action name
            maxLength: 100
            pattern: ^[a-z_]+(\.[a-z_]+)+$
            type: string
        - explode: false
          in: query
          name: outcome
          schema:
            enum:
              - success
              - denied
              - failure
            type: string
        - description: Only break-glass accesses (true) or none of them (false)
          explode: false
          in: query
          name: break_glass
          schema:
            description: Only break-glass accesses (true) or none of them (false)
            enum:
              - "true"
              - "false"
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEventList"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      security:
        - sessionCookie: []
        - bearerAuth: []
      summary: Search all audit events
      tags:
        - audit
      x-koro-action: audit.event.list
      x-koro-rate-limit: search
      x-koro-surface: admin
  /api/v1/admin/audit/verify:
    post:
      operationId: adminVerifyAuditChain
      parameters:
        - description: "Optional client-generated key; a retry with the same key and body replays the first response (Idempotent-Replayed: true)"
          in: header
          name: Idempotency-Key
          schema:
            description: "Optional client-generated key; a retry with the same key and body replays the first response (Idempotent-Replayed: true)"
            maxLength: 255
            minLength: 8
            pattern: ^[A-Za-z0-9_-]+$
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifyDTO"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      security:
        - sessionCookie: []
        - bearerAuth: []
      summary: Verify the audit hash chain and its signed daily roots
      tags:
        - audit
      x-koro-action: audit.chain.verify
      x-koro-idempotency: optional
      x-koro-rate-limit: write_default
      x-koro-surface: admin
  /api/v1/admin/clubs:
    post:
      description: Opens the club's org and its catalog row together.
      operationId: adminCreateClub
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminCreateClubInputBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClubDTO"
          description: Created
          headers:
            ETag:
              schema:
                type: string
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      security:
        - sessionCookie: []
        - bearerAuth: []
      summary: Add a club to the catalog
      tags:
        - directory
      x-koro-action: directory.club.create
      x-koro-idempotency: optional
      x-koro-rate-limit: write_default
      x-koro-surface: admin
  /api/v1/admin/clubs/{club_id}/sensitivity:
    post:
      description: With re-authentication. A change of the flag emits club.sensitivity_changed in the same transaction (the club's audience keys are removed). Religious, political and identity clubs stay sensitive.
      operationId: adminSetClubSensitivity
      parameters:
        - description: The club's org ID
          in: path
          name: club_id
          required: true
          schema:
            description: The club's org ID
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminSensitivityInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClubDTO"
          description: OK
          headers:
            ETag:
              schema:
                type: string
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      security:
        - sessionCookie: []
        - bearerAuth: []
      summary: Set or clear the sensitive club flag
      tags:
        - directory
      x-koro-action: directory.club.set_sensitivity
      x-koro-idempotency: optional
      x-koro-rate-limit: reauth
      x-koro-reauth: true
      x-koro-surface: admin
  /api/v1/admin/consent-purposes:
    get:
      operationId: adminListConsentPurposes
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurposeList"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      security:
        - sessionCookie: []
        - bearerAuth: []
      summary: List the consent purposes
      tags:
        - consent
      x-koro-action: consent.purpose.manage
      x-koro-rate-limit: read_default
      x-koro-surface: admin
  /api/v1/admin/consent-purposes/{purpose_code}:
    patch:
      description: An inactive purpose is never in force for anyone; the ledger keeps its rows.
      operationId: adminUpdateConsentPurpose
      parameters:
        - description: Purpose code (an unknown code is 404)
          in: path
          name: purpose_code
          required: true
          schema:
            description: Purpose code (an unknown code is 404)
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePurposeInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurposeDTO"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      security:
        - sessionCookie: []
        - bearerAuth: []
      summary: Switch a consent purpose on or off, or edit its description
      tags:
        - consent
      x-koro-action: consent.purpose.manage
      x-koro-rate-limit: reauth
      x-koro-reauth: true
      x-koro-surface: admin
  /api/v1/admin/data-requests:
    get:
      description: Soonest deadline first. platform_admin sees only requests awaiting the second approval (03 k32).
      operationId: adminListDataRequests
      parameters:
        - description: Page size
          explode: false
          in: query
          name: limit
          schema:
            default: 25
            description: Page size
            format: int64
            maximum: 100
            minimum: 1
            type: integer
        - description: Opaque cursor from next_cursor
          explode: false
          in: query
          name: cursor
          schema:
            description: Opaque cursor from next_cursor
            maxLength: 512
            type: string
        - explode: false
          in: query
          name: status
          schema:
            enum:
              - received
              - identity_check
              - in_progress
              - awaiting_second_approval
              - completed
              - rejected
              - cancelled
            type: string
        - explode: false
          in: query
          name: type
          schema:
            enum:
              - access
              - export
              - rectification
              - erasure
              - restriction
              - objection
              - profiling_access
              - profiling_objection
              - info
            type: string
        - description: Only requests due before this instant
          explode: false
          in: query
          name: due_before
          schema:
            description: Only requests due before this instant
            format: date-time
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DsrAdminList"
          description: OK
          headers:
            Cache-Control:
              schema:
                type: string
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      security:
        - sessionCookie: []
        - bearerAuth: []
      summary: List the data subject request queue
      tags:
        - kvkk
      x-koro-action: kvkk.dsr.list
      x-koro-rate-limit: read_default
      x-koro-surface: admin
    post:
      description: user_id for an account holder, requester_email (and requester_name) otherwise. The identity check is recorded with adminUpdateDataRequest before the request can be completed.
      operationId: adminCreateDataRequest
      parameters:
        - description: "Optional client-generated key; a retry with the same key and body replays the first response (Idempotent-Replayed: true)"
          in: header
          name: Idempotency-Key
          schema:
            description: "Optional client-generated key; a retry with the same key and body replays the first response (Idempotent-Replayed: true)"
            maxLength: 255
            minLength: 8
            pattern: ^[A-Za-z0-9_-]+$
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminCreateInputBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DsrAdminDTO"
          description: Created
          headers:
            Cache-Control:
              schema:
                type: string
            ETag:
              schema:
                type: string
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      security:
        - sessionCookie: []
        - bearerAuth: []
      summary: Record a postal, KEP, e-mail or in-person application
      tags:
        - kvkk
      x-koro-action: kvkk.dsr.create_admin
      x-koro-idempotency: optional
      x-koro-rate-limit: write_default
      x-koro-surface: admin
  /api/v1/admin/data-requests/{dsr_id}:
    get:
      description: The ETag is the If-Match of adminUpdateDataRequest.
      operationId: adminGetDataRequest
      parameters:
        - description: Request ID (an unknown or malformed ID is 404)
          in: path
          name: dsr_id
          required: true
          schema:
            description: Request ID (an unknown or malformed ID is 404)
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DsrAdminDTO"
          description: OK
          headers:
            Cache-Control:
              schema:
                type: string
            ETag:
              schema:
                type: string
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      security:
        - sessionCookie: []
        - bearerAuth: []
      summary: Get a data subject request
      tags:
        - kvkk
      x-koro-action: kvkk.dsr.read
      x-koro-rate-limit: read_default
      x-koro-surface: admin
    patch:
      operationId: adminUpdateDataRequest
      parameters:
        - description: Request ID (an unknown or malformed ID is 404)
          in: path
          name: dsr_id
          required: true
          schema:
            description: Request ID (an unknown or malformed ID is 404)
            type: string
        - description: ETag of adminGetDataRequest (428 without, 412 when stale)
          in: header
          name: If-Match
          schema:
            description: ETag of adminGetDataRequest (428 without, 412 when stale)
            maxLength: 100
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUpdateInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DsrAdminDTO"
          description: OK
          headers:
            Cache-Control:
              schema:
                type: string
            ETag:
              schema:
                type: string
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      security:
        - sessionCookie: []
        - bearerAuth: []
      summary: Assign, record the identity check, set the working status or draft the answer
      tags:
        - kvkk
      x-koro-action: kvkk.dsr.update
      x-koro-rate-limit: write_default
      x-koro-surface: admin
  /api/v1/admin/data-requests/{dsr_id}/approve:
    post:
      description: profiling_access only. The second approver must differ from the first (403 authz.four_eyes_violation); platform_admin may give the second approval only.
      operationId: adminApproveDataRequest
      parameters:
        - description: "Optional client-generated key; a retry with the same key and body replays the first response (Idempotent-Replayed: true)"
          in: header
          name: Idempotency-Key
          schema:
            description: "Optional client-generated key; a retry with the same key and body replays the first response (Idempotent-Replayed: true)"
            maxLength: 255
            minLength: 8
            pattern: ^[A-Za-z0-9_-]+$
            type: string
        - description: Request ID (an unknown or malformed ID is 404)
          in: path
          name: dsr_id
          required: true
          schema:
            description: Request ID (an unknown or malformed ID is 404)
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApproveInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DsrAdminDTO"
          description: OK
          headers:
            Cache-Control:
              schema:
                type: string
            ETag:
              schema:
                type: string
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      security:
        - sessionCookie: []
        - bearerAuth: []
      summary: Approve the release of a profiling report
      tags:
        - kvkk
      x-koro-action: kvkk.dsr.approve
      x-koro-idempotency: optional
      x-koro-rate-limit: write_default
      x-koro-surface: admin
  /api/v1/admin/data-requests/{dsr_id}/complete:
    post:
      description: "Re-authentication required. Queues what the answer sets in motion: the data export (access, export, profiling_access) or the account erasure; the applicant is notified when it is done."
      operationId: adminCompleteDataRequest
      parameters:
        - description: "Optional client-generated key; a retry with the same key and body replays the first response (Idempotent-Replayed: true)"
          in: header
          name: Idempotency-Key
          schema:
            description: "Optional client-generated key; a retry with the same key and body replays the first response (Idempotent-Replayed: true)"
            maxLength: 255
            minLength: 8
            pattern: ^[A-Za-z0-9_-]+$
            type: string
        - description: Request ID (an unknown or malformed ID is 404)
          in: path
          name: dsr_id
          required: true
          schema:
            description: Request ID (an unknown or malformed ID is 404)
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteInputBody"
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DsrAdminDTO"
          description: Accepted
          headers:
            Cache-Control:
              schema:
                type: string
            ETag:
              schema:
                type: string
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      security:
        - sessionCookie: []
        - bearerAuth: []
      summary: Answer and close a data subject request
      tags:
        - kvkk
      x-koro-action: kvkk.dsr.complete
      x-koro-idempotency: optional
      x-koro-rate-limit: reauth
      x-koro-reauth: true
      x-koro-surface: admin
  /api/v1/admin/data-requests/{dsr_id}/export:
    get:
      description: A presigned URL valid for at most 5 minutes; audited.
      operationId: adminDownloadDataExport
      parameters:
        - description: Request ID (an unknown or malformed ID is 404)
          in: path
          name: dsr_id
          required: true
          schema:
            description: Request ID (an unknown or malformed ID is 404)
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignedURLDTO"
          description: OK
          headers:
            Cache-Control:
              schema:
                type: string
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      security:
        - sessionCookie: []
        - bearerAuth: []
      summary: Get a download link of a data export
      tags:
        - kvkk
      x-koro-action: kvkk.dsr.export_download
      x-koro-rate-limit: read_default
      x-koro-surface: admin
  /api/v1/admin/data-requests/{dsr_id}/reject:
    post:
      operationId: adminRejectDataRequest
      parameters:
        - description: "Optional client-generated key; a retry with the same key and body replays the first response (Idempotent-Replayed: true)"
          in: header
          name: Idempotency-Key
          schema:
            description: "Optional client-generated key; a retry with the same key and body replays the first response (Idempotent-Replayed: true)"
            maxLength: 255
            minLength: 8
            pattern: ^[A-Za-z0-9_-]+$
            type: string
        - description: Request ID (an unknown or malformed ID is 404)
          in: path
          name: dsr_id
          required: true
          schema:
            description: Request ID (an unknown or malformed ID is 404)
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DsrAdminDTO"
          description: OK
          headers:
            Cache-Control:
              schema:
                type: string
            ETag:
              schema:
                type: string
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      security:
        - sessionCookie: []
        - bearerAuth: []
      summary: Reject a data subject request with a reason
      tags:
        - kvkk
      x-koro-action: kvkk.dsr.reject
      x-koro-idempotency: optional
      x-koro-rate-limit: write_default
      x-koro-surface: admin
  /api/v1/admin/edu-verifications:
    get:
      description: Student documents of one status (default pending, oldest first; other statuses newest first). Applicants by name only; open a document with adminGetEduDocument.
      operationId: adminListEduVerifications
      parameters:
        - description: Default pending
          explode: false
          in: query
          name: status
          schema:
            description: Default pending
            enum:
              - pending
              - verified
              - rejected
              - expired
              - revoked
              - superseded
            type: string
        - description: Page size
          explode: false
          in: query
          name: limit
          schema:
            default: 25
            description: Page size
            format: int64
            maximum: 100
            minimum: 1
            type: integer
        - description: Opaque cursor from next_cursor
          explode: false
          in: query
          name: cursor
          schema:
            description: Opaque cursor from next_cursor
            maxLength: 512
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminEduVerificationList"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      security:
        - sessionCookie: []
        - bearerAuth: []
      summary: Student document review queue
      tags:
        - identity
      x-koro-action: identity.edu_verification.list
      x-koro-rate-limit: read_default
      x-koro-surface: admin
  /api/v1/admin/edu-verifications/{verification_id}/decision:
    post:
      description: "verified needs university_id and a clean document; the student is verified for one year (a current verification is superseded). rejected keeps review_note for the student. Own document: 403; a decided verification: 409 identity.edu_invalid_state."
      operationId: adminDecideEduVerification
      parameters:
        - description: Verification ID (an unknown or malformed ID is 404)
          in: path
          name: verification_id
          required: true
