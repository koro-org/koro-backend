    get:
      description: "The organiser's managers; support and platform_admin by break-glass (X-Koro-Access-Reason, 10–500 characters; never a sensitive event). The special-category answers are never in the list. Every list is audited. When the read concerns one user, the X-Koro-Access-Reason justification is shown to that user (support access notification; reason of the break_glass item of listMySecurityEvents): write no other person's data in it."
