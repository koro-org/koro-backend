          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserDTO"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      security:
        - sessionCookie: []
        - bearerAuth: []
      summary: Suspend an account
      tags:
        - identity
      x-koro-action: identity.user.suspend
      x-koro-idempotency: optional
      x-koro-rate-limit: write_default
      x-koro-surface: admin
  /api/v1/admin/users/{user_id}/unsuspend:
    post:
      operationId: adminUnsuspendUser
      parameters:
