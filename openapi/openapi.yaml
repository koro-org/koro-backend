          required: true
          schema:
            description: "Client-generated key; a retry with the same key and body replays the first response (Idempotent-Replayed: true)"
            maxLength: 255
            minLength: 8
            pattern: ^[A-Za-z0-9_-]+$
            type: string
        - description: Client kind; the registration source and the consent channel (default web)
          in: header
