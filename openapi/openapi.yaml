      tags:
        - events
      x-koro-action: events.form.manage
      x-koro-rate-limit: read_default
      x-koro-surface: resource
    put:
      description: "If-Match with the ETag of getEventFormDraft is required: missing → 428, stale → 412. At most 20 fields; keys match ^[a-z][a-z0-9_]{1,40}$; help and description are HTML cleaned by the server's allow-list. Every save returns the lint preview. Cancelled and completed events: 409."
      operationId: putEventFormDraft
      parameters:
        - description: Event ID
          in: path
          name: event_id
          required: true
          schema:
            description: Event ID
            type: string
        - description: "ETag of getEventFormDraft (required: missing → 428, stale → 412)"
          in: header
          name: If-Match
          schema:
            description: "ETag of getEventFormDraft (required: missing → 428, stale → 412)"
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PutFormDraftInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventFormDraftDTO"
          description: OK
          headers:
            ETag:
              schema:
                type: string
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      security:
        - sessionCookie: []
        - bearerAuth: []
      summary: Replace the form draft
      tags:
        - events
      x-koro-action: events.form.manage
      x-koro-rate-limit: write_default
