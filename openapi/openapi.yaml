  /api/v1/unsubscribe-links/{token}:
    get:
      description: "The data of the unsubscribe confirmation page: the consent purpose of the link (commercial_email). Nothing about the recipient or the current consent state; no side effect (mail scanners open links). A malformed, tampered or expired link is 422 consent.invalid_unsubscribe_link, the same answer for every reason."
      operationId: getUnsubscribeLink
      parameters:
        - description: The signed token of the unsubscribe link (base64url, at most 200 characters)
          in: path
          name: token
          required: true
          schema:
            description: The signed token of the unsubscribe link (base64url, at most 200 characters)
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnsubscribeLinkDTO"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: Show what an unsubscribe link withdraws
      tags:
        - consent
      x-koro-action: consent.record.create
      x-koro-rate-limit: read_default
      x-koro-surface: public
    post:
      description: "The List-Unsubscribe-Post target of commercial e-mail: the request body (List-Unsubscribe=One-Click, form or multipart) and its content type are ignored. Withdraws the recipient's consent to the link's purpose through the email_link channel and queues the İYS refusal (RET). Idempotent: 204 whether a consent was withdrawn or none was in force. A malformed, tampered or expired link is 422 consent.invalid_unsubscribe_link."
      operationId: confirmUnsubscribe
      parameters:
        - description: The signed token of the unsubscribe link (base64url, at most 200 characters)
          in: path
          name: token
          required: true
          schema:
            description: The signed token of the unsubscribe link (base64url, at most 200 characters)
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: Unsubscribe with one click (RFC 8058)
      tags:
        - consent
      x-koro-action: consent.record.create
      x-koro-idempotency: optional
      x-koro-rate-limit: write_default
      x-koro-surface: public
  /api/v1/webhooks/email/{provider}:
    post:
      description: "Bounce, complaint and delivery notifications of the e-mail provider (ses: SNS-signed SES notifications; resend: svix-signed events). The identity is the signature: cookies and bearer tokens are ignored. A delivery that does not verify is 401; a verified one is stored in the webhook inbox under the provider's event ID (a redelivery is a no-op, also 204) and processed asynchronously."
      operationId: receiveEmailWebhook
      parameters:
        - description: E-mail provider (00 T-62)
          in: path
          name: provider
          required: true
          schema:
            description: E-mail provider (00 T-62)
            enum:
              - ses
              - resend
            type: string
        - in: header
          name: svix-id
          schema:
            maxLength: 200
            type: string
        - in: header
          name: svix-timestamp
          schema:
            maxLength: 20
            type: string
        - in: header
          name: svix-signature
          schema:
            maxLength: 2000
            type: string
        - in: header
          name: x-amz-sns-message-type
          schema:
            maxLength: 50
            type: string
      requestBody:
        content:
          application/json:
            schema:
              contentMediaType: application/octet-stream
              format: binary
              type: string
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: Receive an e-mail provider webhook
      tags:
        - notify
      x-koro-action: notify.provider_webhook.receive
      x-koro-idempotency: optional
      x-koro-rate-limit: webhook
      x-koro-surface: webhook
  /api/v1/webhooks/iys/{provider}/{token}:
    post:
      description: "İYS's answers to Koro's consent uploads and the approvals and refusals recipients give İYS itself, pushed by the configured İYS integrator (netgsm, BE-110). The identity is the secret token of the URL (and the source address when CONSENT_IYS_NETGSM_WEBHOOK_ALLOWED_IPS is set): cookies and bearer tokens are ignored. A wrong token or address is 401 and nothing is stored; a body that is not the integrator's item list is 422; a stored delivery (a redelivery too) is 200, its items are applied by consent.iys_status_sync. A provider that is not the configured, pushing one is 404."
      operationId: receiveIYSWebhook
      parameters:
        - description: "The İYS integrator (CONSENT_IYS_PROVIDER): netgsm"
          in: path
          name: provider
          required: true
          schema:
            description: "The İYS integrator (CONSENT_IYS_PROVIDER): netgsm"
            maxLength: 32
            type: string
        - description: The secret of the webhook URL (CONSENT_IYS_NETGSM_WEBHOOK_TOKEN)
          in: path
          name: token
          required: true
          schema:
            description: The secret of the webhook URL (CONSENT_IYS_NETGSM_WEBHOOK_TOKEN)
            type: string
      requestBody:
        content:
          application/json:
            schema:
              contentMediaType: application/octet-stream
              format: binary
              type: string
        required: true
      responses:
        "200":
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: Receive an İYS integrator webhook
      tags:
        - consent
      x-koro-action: consent.iys_webhook.receive
      x-koro-idempotency: optional
      x-koro-rate-limit: webhook
      x-koro-surface: webhook
