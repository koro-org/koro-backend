  /api/v1/notices/current:
    get:
      description: The published version of every notice for the audience (falling back to audience all) in the Accept-Language locale (falling back to tr-TR). Privacy notices are shown, never consented to.
      operationId: listCurrentNotices
      parameters:
        - description: Who reads the notices; audience all is the fallback
          explode: false
          in: query
          name: audience
          required: true
          schema:
            description: Who reads the notices; audience all is the fallback
            enum:
              - all
              - student
              - company
              - club
              - university
            type: string
        - explode: false
          in: query
          name: kind
          schema:
            enum:
              - privacy_notice
              - consent_text
              - terms_of_use
              - cookie_notice
            type: string
        - description: Only the consent text of this purpose
          explode: false
          in: query
          name: purpose_code
          schema:
            description: Only the consent text of this purpose
            pattern: ^[a-z][a-z0-9_]{2,40}$
            type: string
        - description: tr or en; tr-TR otherwise
          in: header
          name: Accept-Language
          schema:
            description: tr or en; tr-TR otherwise
            maxLength: 1000
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoticeList"
          description: OK
          headers:
            Content-Language:
              schema:
                type: string
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: List the current notices and consent texts
      tags:
        - consent
      x-koro-action: consent.notice.read
      x-koro-rate-limit: read_default
      x-koro-surface: public
