      type: object
    UpdateRuleInputBody:
      additionalProperties: false
      properties:
        active:
          description: false retires the rule
          type: boolean
        class:
          enum:
            - blocked
            - warn_special
            - review_identifier
          type: string
        description_tr:
          maxLength: 500
          minLength: 3
          type: string
        pattern:
          maxLength: 500
          minLength: 1
          type: string
      type: object
    UpdateStaffInputBody:
      additionalProperties: false
      properties:
        role:
          enum:
            - scanner
            - manager
          type: string
      required:
        - role
      type: object
    UpdateSubInputBody:
      additionalProperties: false
      properties:
        active:
          description: false retires the sub-processor (never deleted)
          type: boolean
        authority_notified_at:
          format: date
          type: string
        contract_signed_at:
          format: date
          type: string
        country_code:
          pattern: ^[A-Z]{2}$
          type: string
        data_categories:
          items:
            type: string
          maxItems: 30
          minItems: 1
          type: array
        name:
          maxLength: 200
          minLength: 1
          type: string
        notes:
          maxLength: 2000
          type: string
        region:
          maxLength: 100
          minLength: 1
          type: string
        service:
          maxLength: 200
          minLength: 1
          type: string
        transfer_mechanism:
          enum:
            - domestic
            - standard_contract
            - adequacy
            - explicit_consent
            - undecided
          type: string
      type: object
    UploadDocumentInputBody:
      additionalProperties: false
      properties:
        file_id:
          description: A party_document upload (createUpload, completeUpload)
          format: uuid
          type: string
        kind:
          enum:
            - tax_certificate
            - signature_circular
            - foundation_deed
            - university_protocol
            - authorization_letter
            - other
          type: string
      required:
        - kind
        - file_id
      type: object
    UsageDTO:
      additionalProperties: false
      properties:
        actor_user_id:
          description: Who consumed; platform_admin and finance_admin only
          format: uuid
          type: string
        created_at:
          format: date-time
          type: string
        feature:
          enum:
            - targeted_post
            - targeted_dispatch
            - contact_request
            - discovery_access
          type: string
        quantity:
          description: "Positive: consumption; negative: reversal (release)"
          format: int64
          type: integer
        ref_id:
          format: uuid
          type: string
        ref_type:
          enum:
            - post
            - dispatch
            - contact_request
          type: string
        usage_id:
          format: uuid
          type: string
      required:
        - usage_id
        - feature
        - quantity
        - ref_type
        - ref_id
        - created_at
      type: object
    UsageList:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/UsageDTO"
          type: array
        next_cursor:
          type: string
      required:
        - items
      type: object
    UserRefDTO:
      additionalProperties: false
      properties:
        first_name:
          type: string
        last_name:
          type: string
        user_id:
          format: uuid
          type: string
      required:
        - user_id
      type: object
    VerifyDTO:
      additionalProperties: false
      properties:
        checked_rows:
          format: int64
          type: integer
        first_bad_chain_seq:
          description: First chain position that fails verification
          format: int64
          type: integer
        ok:
          type: boolean
      required:
        - ok
        - checked_rows
      type: object
    VerifyInputBody:
      additionalProperties: false
      properties:
        note:
          description: Internal note (audited)
          maxLength: 500
          type: string
      type: object
    VerifyRequest:
      additionalProperties: false
      properties:
        from_day:
          description: First day (Europe/Istanbul)
          format: date
          type: string
        to_day:
          description: Last day (Europe/Istanbul), at most 31 days after from_day
          format: date
          type: string
      required:
        - from_day
        - to_day
      type: object
    ViewerDTO:
      additionalProperties: false
      properties:
        following_author:
          type: boolean
        liked:
          type: boolean
        saved:
          type: boolean
      required:
        - liked
        - saved
        - following_author
      type: object
  securitySchemes:
    bearerAuth:
      bearerFormat: opaque
      scheme: bearer
      type: http
    sessionCookie:
      in: cookie
      name: __Host-koro_session
      type: apiKey
info:
  description: Koro backend API. Errors are RFC 9457 application/problem+json with a stable `code`.
  title: Koro API
  version: 1.0.0
openapi: 3.1.0
paths:
  /api/v1/admin/audit-events:
    get:
      description: The search itself is recorded in the audit log.
      operationId: adminListAuditEvents
      parameters:
        - description: Page size
          explode: false
          in: query
          name: limit
          schema:
            default: 25
            description: Page size
            format: int64
            maximum: 100
            minimum: 1
            type: integer
        - description: Opaque cursor from next_cursor
          explode: false
          in: query
          name: cursor
          schema:
            description: Opaque cursor from next_cursor
            maxLength: 512
            type: string
        - description: RFC 3339 time or YYYY-MM-DD (start of that day, Europe/Istanbul)
          explode: false
          in: query
          name: occurred_from
          required: true
          schema:
            description: RFC 3339 time or YYYY-MM-DD (start of that day, Europe/Istanbul)
            maxLength: 40
            type: string
        - description: RFC 3339 time or YYYY-MM-DD (end of that day, Europe/Istanbul); inclusive
          explode: false
          in: query
          name: occurred_to
          required: true
          schema:
            description: RFC 3339 time or YYYY-MM-DD (end of that day, Europe/Istanbul); inclusive
            maxLength: 40
            type: string
        - explode: false
          in: query
          name: actor_user_id
          schema:
            format: uuid
            type: string
        - explode: false
          in: query
          name: org_id
          schema:
            format: uuid
            type: string
        - explode: false
          in: query
          name: resource_type
          schema:
            maxLength: 64
            pattern: ^[a-z_]+$
            type: string
        - explode: false
          in: query
          name: resource_id
          schema:
            format: uuid
            type: string
        - description: Exact action name
          explode: false
          in: query
          name: action
          schema:
            description: Exact action name
            maxLength: 100
            pattern: ^[a-z_]+(\.[a-z_]+)+$
            type: string
        - explode: false
          in: query
          name: outcome
          schema:
            enum:
              - success
              - denied
              - failure
            type: string
        - description: Only break-glass accesses (true) or none of them (false)
          explode: false
          in: query
          name: break_glass
          schema:
            description: Only break-glass accesses (true) or none of them (false)
            enum:
              - "true"
              - "false"
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEventList"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      security:
        - sessionCookie: []
        - bearerAuth: []
      summary: Search all audit events
      tags:
        - audit
      x-koro-action: audit.event.list
      x-koro-rate-limit: search
      x-koro-surface: admin
  /api/v1/admin/audit/verify:
    post:
      operationId: adminVerifyAuditChain
      parameters:
        - description: "Optional client-generated key; a retry with the same key and body replays the first response (Idempotent-Replayed: true)"
          in: header
          name: Idempotency-Key
          schema:
            description: "Optional client-generated key; a retry with the same key and body replays the first response (Idempotent-Replayed: true)"
            maxLength: 255
            minLength: 8
            pattern: ^[A-Za-z0-9_-]+$
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifyDTO"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      security:
        - sessionCookie: []
        - bearerAuth: []
      summary: Verify the audit hash chain and its signed daily roots
      tags:
        - audit
      x-koro-action: audit.chain.verify
      x-koro-idempotency: optional
      x-koro-rate-limit: write_default
      x-koro-surface: admin
  /api/v1/admin/breaches:
    get:
      description: With the 72-hour deadline of the Board notification and the 24-hour notice to the data controller.
      operationId: adminListBreaches
      parameters:
        - explode: false
          in: query
          name: status
          schema:
            enum:
              - open
              - contained
              - notified
              - closed
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BreachListOutputBody"
          description: OK
          headers:
            Cache-Control:
              schema:
                type: string
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      security:
        - sessionCookie: []
        - bearerAuth: []
      summary: List the personal data breaches
      tags:
        - kvkk
      x-koro-action: kvkk.breach.list
      x-koro-rate-limit: read_default
      x-koro-surface: admin
    post:
      description: authority_deadline_at = detected_at + 72 hours. The DPO and the platform admins are alerted at once and again at 48/24/6 hours left. Do not put a person's name in the title or the description.
      operationId: adminCreateBreach
      parameters:
        - description: "Optional client-generated key; a retry with the same key and body replays the first response (Idempotent-Replayed: true)"
          in: header
          name: Idempotency-Key
          schema:
            description: "Optional client-generated key; a retry with the same key and body replays the first response (Idempotent-Replayed: true)"
            maxLength: 255
            minLength: 8
            pattern: ^[A-Za-z0-9_-]+$
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBreachInputBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BreachDTO"
          description: Created
          headers:
            Cache-Control:
              schema:
                type: string
            ETag:
              schema:
                type: string
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      security:
        - sessionCookie: []
        - bearerAuth: []
      summary: Record a personal data breach
      tags:
        - kvkk
      x-koro-action: kvkk.breach.manage
      x-koro-idempotency: optional
      x-koro-rate-limit: write_default
      x-koro-surface: admin
  /api/v1/admin/breaches/{breach_id}:
    patch:
      description: If-Match. The status only moves forward (open → contained → notified → closed); notified needs authority_notified_at; notification times are written once; detected_at may only move earlier.
      operationId: adminUpdateBreach
      parameters:
        - description: Breach ID (an unknown or malformed ID is 404)
          in: path
          name: breach_id
          required: true
          schema:
            description: Breach ID (an unknown or malformed ID is 404)
            type: string
        - description: etag of the list item (428 without, 412 when stale)
          in: header
          name: If-Match
          schema:
            description: etag of the list item (428 without, 412 when stale)
            maxLength: 100
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBreachInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BreachDTO"
          description: OK
          headers:
            Cache-Control:
              schema:
                type: string
            ETag:
              schema:
                type: string
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      security:
        - sessionCookie: []
        - bearerAuth: []
      summary: "Update a breach: containment, notifications, closing"
      tags:
        - kvkk
      x-koro-action: kvkk.breach.manage
      x-koro-rate-limit: write_default
      x-koro-surface: admin
  /api/v1/admin/club-claims:
    get:
      description: "The review queue: pending claims oldest first (default), other statuses newest first. Support and platform admins see every claim; a university representative the claims of their universities' non-sensitive clubs (the claims they decide). Audited."
      operationId: adminListClubClaims
      parameters:
        - description: Page size
          explode: false
          in: query
          name: limit
          schema:
            default: 25
            description: Page size
            format: int64
            maximum: 100
            minimum: 1
            type: integer
        - description: Opaque cursor from next_cursor
          explode: false
          in: query
          name: cursor
          schema:
            description: Opaque cursor from next_cursor
            maxLength: 512
            type: string
        - description: Default pending
          explode: false
          in: query
          name: status
          schema:
            description: Default pending
            enum:
              - pending
              - approved
              - rejected
              - withdrawn
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminClubClaimList"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      security:
        - sessionCookie: []
        - bearerAuth: []
      summary: List club claims
      tags:
        - directory
      x-koro-action: directory.club_claim.list
      x-koro-rate-limit: read_default
      x-koro-surface: admin
  /api/v1/admin/club-claims/{claim_id}:
    get:
      description: With a 5-minute download of the evidence file once the virus scan cleared it, and the claim's approver. A university representative reads only the claims they decide (others 404). Audited.
      operationId: adminGetClubClaim
      parameters:
        - description: Club claim ID
          in: path
          name: claim_id
          required: true
          schema:
            description: Club claim ID
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminClubClaimDTO"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      security:
        - sessionCookie: []
        - bearerAuth: []
      summary: Get a club claim
      tags:
        - directory
      x-koro-action: directory.club_claim.list
      x-koro-rate-limit: read_default
      x-koro-surface: admin
  /api/v1/admin/club-claims/{claim_id}/decision:
    post:
      description: "The approver decides: the representative of the club's university when the university has one and the club is not sensitive, a platform admin otherwise (403 for a platform admin where a representative decides). Approval makes the claimant a club admin and marks the club claimed, in one transaction (422 orgs.club_admin_requires_adult_student rolls it back). Nobody decides their own claim (403). The decision note is never shown to the claimant."
      operationId: adminDecideClubClaim
      parameters:
        - description: Club claim ID
          in: path
          name: claim_id
          required: true
          schema:
            description: Club claim ID
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminDecideClaimInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminClubClaimDTO"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      security:
        - sessionCookie: []
        - bearerAuth: []
      summary: Decide a club claim
      tags:
        - directory
      x-koro-action: directory.club_claim.decide
      x-koro-idempotency: optional
      x-koro-rate-limit: write_default
      x-koro-surface: admin
  /api/v1/admin/clubs:
    post:
      description: Opens the club's org and its catalog row together.
      operationId: adminCreateClub
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminCreateClubInputBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClubDTO"
          description: Created
          headers:
            ETag:
              schema:
                type: string
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      security:
        - sessionCookie: []
        - bearerAuth: []
      summary: Add a club to the catalog
      tags:
        - directory
      x-koro-action: directory.club.create
      x-koro-idempotency: optional
      x-koro-rate-limit: write_default
      x-koro-surface: admin
  /api/v1/admin/clubs/{club_id}/sensitivity:
    post:
      description: With re-authentication. A change of the flag emits club.sensitivity_changed in the same transaction (the club's audience keys are removed). Religious, political and identity clubs stay sensitive.
      operationId: adminSetClubSensitivity
      parameters:
        - description: The club's org ID
          in: path
          name: club_id
          required: true
          schema:
            description: The club's org ID
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminSensitivityInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClubDTO"
          description: OK
          headers:
            ETag:
              schema:
                type: string
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      security:
        - sessionCookie: []
        - bearerAuth: []
      summary: Set or clear the sensitive club flag
      tags:
        - directory
      x-koro-action: directory.club.set_sensitivity
      x-koro-idempotency: optional
      x-koro-rate-limit: reauth
      x-koro-reauth: true
      x-koro-surface: admin
  /api/v1/admin/consent-purposes:
    get:
      operationId: adminListConsentPurposes
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurposeList"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      security:
        - sessionCookie: []
        - bearerAuth: []
      summary: List the consent purposes
      tags:
        - consent
      x-koro-action: consent.purpose.manage
      x-koro-rate-limit: read_default
      x-koro-surface: admin
  /api/v1/admin/consent-purposes/{purpose_code}:
    patch:
      description: An inactive purpose is never in force for anyone; the ledger keeps its rows.
      operationId: adminUpdateConsentPurpose
      parameters:
        - description: Purpose code (an unknown code is 404)
          in: path
          name: purpose_code
          required: true
          schema:
            description: Purpose code (an unknown code is 404)
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePurposeInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurposeDTO"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      security:
        - sessionCookie: []
        - bearerAuth: []
      summary: Switch a consent purpose on or off, or edit its description
      tags:
        - consent
      x-koro-action: consent.purpose.manage
      x-koro-rate-limit: reauth
      x-koro-reauth: true
      x-koro-surface: admin
  /api/v1/admin/data-requests:
    get:
      description: Soonest deadline first. platform_admin sees only requests awaiting the second approval (03 k32).
      operationId: adminListDataRequests
      parameters:
        - description: Page size
          explode: false
          in: query
          name: limit
          schema:
            default: 25
            description: Page size
            format: int64
            maximum: 100
            minimum: 1
            type: integer
        - description: Opaque cursor from next_cursor
          explode: false
          in: query
          name: cursor
          schema:
            description: Opaque cursor from next_cursor
            maxLength: 512
            type: string
        - explode: false
          in: query
          name: status
          schema:
            enum:
              - received
              - identity_check
              - in_progress
              - awaiting_second_approval
              - completed
              - rejected
              - cancelled
            type: string
        - explode: false
          in: query
          name: type
          schema:
            enum:
              - access
              - export
              - rectification
              - erasure
              - restriction
              - objection
              - profiling_access
              - profiling_objection
              - info
            type: string
        - description: Only requests due before this instant
          explode: false
          in: query
          name: due_before
          schema:
            description: Only requests due before this instant
            format: date-time
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DsrAdminList"
          description: OK
          headers:
            Cache-Control:
              schema:
                type: string
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      security:
        - sessionCookie: []
        - bearerAuth: []
      summary: List the data subject request queue
      tags:
        - kvkk
      x-koro-action: kvkk.dsr.list
      x-koro-rate-limit: read_default
      x-koro-surface: admin
    post:
      description: user_id for an account holder, requester_email (and requester_name) otherwise. The identity check is recorded with adminUpdateDataRequest before the request can be completed.
      operationId: adminCreateDataRequest
      parameters:
        - description: "Optional client-generated key; a retry with the same key and body replays the first response (Idempotent-Replayed: true)"
          in: header
          name: Idempotency-Key
          schema:
            description: "Optional client-generated key; a retry with the same key and body replays the first response (Idempotent-Replayed: true)"
            maxLength: 255
            minLength: 8
            pattern: ^[A-Za-z0-9_-]+$
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminCreateInputBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DsrAdminDTO"
          description: Created
          headers:
            Cache-Control:
              schema:
                type: string
            ETag:
              schema:
                type: string
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      security:
        - sessionCookie: []
        - bearerAuth: []
      summary: Record a postal, KEP, e-mail or in-person application
      tags:
        - kvkk
      x-koro-action: kvkk.dsr.create_admin
      x-koro-idempotency: optional
      x-koro-rate-limit: write_default
      x-koro-surface: admin
  /api/v1/admin/data-requests/{dsr_id}:
    get:
      description: The ETag is the If-Match of adminUpdateDataRequest.
      operationId: adminGetDataRequest
      parameters:
        - description: Request ID (an unknown or malformed ID is 404)
          in: path
          name: dsr_id
          required: true
          schema:
            description: Request ID (an unknown or malformed ID is 404)
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DsrAdminDTO"
          description: OK
          headers:
            Cache-Control:
              schema:
                type: string
            ETag:
              schema:
                type: string
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      security:
        - sessionCookie: []
        - bearerAuth: []
