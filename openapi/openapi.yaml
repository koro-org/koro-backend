        - description: Opaque cursor from next_cursor
          explode: false
          in: query
          name: cursor
          schema:
            description: Opaque cursor from next_cursor
            maxLength: 512
            type: string
        - description: Statuses (repeat the parameter)
          explode: true
          in: query
          name: status
          schema:
            description: Statuses (repeat the parameter)
            items:
              enum:
                - pending
                - confirmed
                - waitlisted
                - rejected
                - cancelled
                - checked_in
                - no_show
                - expired
                - withdrawn
              type: string
            maxItems: 9
            type: array
        - description: created_at (default, oldest first) or -created_at
          explode: false
