components:
  responses:
    Problem:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      description: RFC 9457 problem details
  schemas:
    AcceptInputBody:
      additionalProperties: false
      properties:
        token:
          description: Token from the invitation e-mail
          maxLength: 128
          minLength: 1
          type: string
      required:
        - token
      type: object
    AcceptedInvitationDTO:
      additionalProperties: false
      properties:
        membership_id:
          type: string
        org_id:
          type: string
        role:
          type: string
      required:
        - membership_id
        - org_id
        - role
      type: object
    AcceptedOutputBody:
      additionalProperties: false
      type: object
    AccountActionDTO:
      additionalProperties: false
      properties:
        action:
          enum:
            - suspend
            - revoke_sessions
            - reset_mfa
          type: string
        expires_at:
          format: date-time
          type: string
        request_id:
          format: uuid
          type: string
        requested_at:
          format: date-time
          type: string
        requested_by:
          format: uuid
          type: string
        status:
          enum:
            - pending
            - approved
            - expired
          type: string
        user_id:
          format: uuid
          type: string
      required:
        - request_id
        - user_id
        - action
        - status
        - requested_by
        - requested_at
        - expires_at
      type: object
    AdminCreateClubInputBody:
      additionalProperties: false
      properties:
        category:
          enum:
            - academic
            - technology
            - career
            - entrepreneurship
            - arts
            - culture
            - sports
            - social_responsibility
            - hobby
            - religious
            - political
            - identity
            - other
          type: string
        is_sensitive:
          type: boolean
        join_policy:
          enum:
            - open
            - approval
          type: string
        name:
          maxLength: 200
          minLength: 2
          type: string
        sensitive_reason:
          enum:
            - religion
            - political_opinion
            - philosophical_belief
            - lgbtiq
            - ethnic_origin
            - health
            - union
            - other
          type: string
        slug:
          description: Derived from the name when omitted
          maxLength: 80
          type: string
        university_id:
          format: uuid
          type: string
      required:
        - university_id
        - name
        - category
        - join_policy
      type: object
    AdminCreateDepartmentInputBody:
      additionalProperties: false
      properties:
        degree_level:
          enum:
            - associate
            - bachelor
            - master
            - doctorate
          type: string
        duration_years:
          format: int32
          maximum: 7
          minimum: 1
          type: integer
        faculty_id:
          description: A faculty of this university
          format: uuid
          type: string
        name:
          maxLength: 200
          minLength: 2
          type: string
        yok_program_code:
          maxLength: 40
          type: string
      required:
        - name
        - degree_level
      type: object
    AdminCreateInputBody:
      additionalProperties: false
      properties:
        channel:
          enum:
            - email
            - post
            - kep
            - in_person
          type: string
        details:
          maxLength: 4000
          type: string
        requester_email:
          description: Applicant without an account (mandatory then)
          maxLength: 254
          type: string
        requester_name:
          description: Applicant without an account
          maxLength: 200
          type: string
        type:
          enum:
            - access
            - export
            - rectification
            - erasure
            - restriction
            - objection
            - profiling_access
            - profiling_objection
            - info
          type: string
        user_id:
          description: Account of the applicant, if any
          format: uuid
          type: string
      required:
        - type
        - channel
      type: object
    AdminCreateSkillInputBody:
      additionalProperties: false
      properties:
        category:
          enum:
            - technical
            - tool
            - soft
            - domain
            - language_tool
            - other
          type: string
        name_en:
          maxLength: 200
          type: string
        name_tr:
          maxLength: 200
          minLength: 1
          type: string
        slug:
          maxLength: 80
          pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
          type: string
      required:
        - slug
        - name_tr
        - category
      type: object
    AdminCreateUniversityInputBody:
      additionalProperties: false
      properties:
        city:
          maxLength: 60
          minLength: 2
          type: string
        name:
          maxLength: 200
          minLength: 2
          type: string
        short_name:
          maxLength: 60
          type: string
        type:
          enum:
            - state
            - foundation
            - other
          type: string
        website_url:
          maxLength: 2048
          type: string
        yok_code:
          maxLength: 40
          minLength: 1
          type: string
      required:
        - yok_code
        - name
        - city
        - type
      type: object
    AdminEduUserDTO:
      additionalProperties: false
      properties:
        first_name:
          type: string
        id:
          format: uuid
          type: string
        last_name:
          type: string
      required:
        - id
      type: object
    AdminEduVerificationDTO:
      additionalProperties: false
      properties:
        created_at:
          format: date-time
          type: string
        expires_at:
          format: date-time
          type: string
        method:
          enum:
            - edu_email
            - document
          type: string
        review_note:
          type: string
        reviewed_by:
          format: uuid
          type: string
        status:
          enum:
            - pending
            - verified
            - rejected
            - expired
            - revoked
            - superseded
          type: string
        university:
          $ref: "#/components/schemas/UniversityRefDTO"
          description: Claimed while pending, confirmed once verified
        user:
          $ref: "#/components/schemas/AdminEduUserDTO"
        verification_id:
          format: uuid
          type: string
        verified_at:
          format: date-time
          type: string
      required:
        - verification_id
        - user
        - method
        - status
        - created_at
      type: object
    AdminEduVerificationList:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/AdminEduVerificationDTO"
          type: array
        next_cursor:
          type: string
      required:
        - items
      type: object
    AdminGrantInputBody:
      additionalProperties: false
      properties:
        feature:
          enum:
            - targeted_post
            - targeted_dispatch
            - contact_request
            - discovery_access
          type: string
        kind:
          description: access for discovery_access, quota otherwise
          enum:
            - quota
            - access
          type: string
        quantity_total:
          description: Units (quota only)
          format: int64
          maximum: 100000
          minimum: 1
          type: integer
        reason:
          description: Why the right is granted (audited; no personal data)
          maxLength: 300
          minLength: 3
          type: string
        source_type:
          description: "admin_grant: a package sold offline; promo: a promotion"
          enum:
            - admin_grant
            - promo
          type: string
        valid_from:
          description: Start of the validity window
          format: date-time
          type: string
        valid_to:
          description: End of the validity window (exclusive; in the future, at most three years after valid_from)
          format: date-time
          type: string
      required:
        - feature
        - kind
        - valid_from
        - valid_to
        - source_type
        - reason
      type: object
    AdminOrgDTO:
      additionalProperties: false
      properties:
        city:
          type: string
        closed_at:
          format: date-time
          type: string
        created_at:
          format: date-time
          type: string
        created_by:
          description: User who registered the org
          type: string
        kind:
          enum:
            - platform
            - university
            - club
            - company
            - ngo
          type: string
        name:
          type: string
        org_id:
          type: string
        slug:
          type: string
        status:
          enum:
            - pending_review
            - active
            - suspended
            - closed
          type: string
        verified:
          type: boolean
        verified_at:
          format: date-time
          type: string
      required:
        - org_id
        - kind
        - name
        - slug
        - status
        - verified
        - created_at
      type: object
    AdminOrgList:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/AdminOrgDTO"
          type: array
        next_cursor:
          type: string
      required:
        - items
      type: object
    AdminPutDomainInputBody:
      additionalProperties: false
      properties:
        domain_kind:
          enum:
            - student
            - staff
            - mixed
          type: string
        is_active:
          type: boolean
      required:
        - domain_kind
        - is_active
      type: object
    AdminRevokeInputBody:
      additionalProperties: false
      properties:
        reason:
          description: Why the right is taken back (stored and audited; no personal data)
          maxLength: 300
          minLength: 3
          type: string
      required:
        - reason
      type: object
    AdminSensitivityInputBody:
      additionalProperties: false
      properties:
        is_sensitive:
          type: boolean
        reauth:
          $ref: "#/components/schemas/ReauthDTO"
          description: Re-authentication proof (03 §6.2)
        sensitive_reason:
          enum:
            - religion
            - political_opinion
            - philosophical_belief
            - lgbtiq
            - ethnic_origin
            - health
            - union
            - other
          type: string
      required:
        - is_sensitive
      type: object
    AdminSkillDTO:
      additionalProperties: false
      properties:
        category:
          enum:
            - technical
            - tool
            - soft
            - domain
            - language_tool
            - other
          type: string
        is_active:
          type: boolean
        name_en:
          type: string
        name_tr:
          type: string
        skill_id:
          type: string
        slug:
          type: string
      required:
        - skill_id
        - slug
        - name_tr
        - category
        - is_active
      type: object
    AdminStudentDTO:
      additionalProperties: false
      properties:
        expires_at:
          format: date-time
          type: string
        status:
          enum:
            - none
            - verified
            - lapsed
          type: string
        university_id:
          format: uuid
          type: string
        verified_at:
          format: date-time
          type: string
      required:
        - status
      type: object
    AdminUpdateInputBody:
      additionalProperties: false
      properties:
        assigned_to:
          description: The DPO handling the request
          format: uuid
          type: string
        identity_verified_at:
          description: When the applicant's identity was verified
          format: date-time
          type: string
        response_summary:
          description: Draft of the answer
          maxLength: 4000
          type: string
        status:
          enum:
            - identity_check
            - in_progress
          type: string
      type: object
    AdminUpdateSkillInputBody:
      additionalProperties: false
      properties:
        category:
          enum:
            - technical
            - tool
            - soft
            - domain
            - language_tool
            - other
          type: string
        is_active:
          type: boolean
        name_en:
          description: Empty string clears it
          maxLength: 200
          type: string
        name_tr:
          maxLength: 200
          minLength: 1
          type: string
      type: object
    AdminUpdateUniversityInputBody:
      additionalProperties: false
      properties:
        city:
          maxLength: 60
          minLength: 2
          type: string
        is_active:
          type: boolean
        name:
          maxLength: 200
          minLength: 2
          type: string
        short_name:
          description: Empty string clears it
          maxLength: 60
          type: string
        type:
          enum:
            - state
            - foundation
            - other
          type: string
        website_url:
          description: Empty string clears it
          maxLength: 2048
          type: string
      type: object
    AdminUserDTO:
      additionalProperties: false
      properties:
        birth_date:
          description: dpo only
          format: date
          type: string
        created_at:
          format: date-time
          type: string
        email:
          type: string
        first_name:
          type: string
        last_login_at:
          format: date-time
          type: string
        last_name:
          type: string
        locale:
          enum:
            - tr-TR
            - en-US
          type: string
        memberships:
          description: Non-club memberships only
          items:
            $ref: "#/components/schemas/MembershipDTO"
          type: array
        mfa_enabled:
          type: boolean
        pending_action:
          $ref: "#/components/schemas/AccountActionDTO"
          description: Set when this call opened (or kept) a four-eyes request instead of acting (06 H-47)
        platform_roles:
          items:
            type: string
          type: array
        status:
          enum:
            - pending_email
            - active
            - suspended
            - erased
          type: string
        student:
          $ref: "#/components/schemas/AdminStudentDTO"
        suspended_at:
          format: date-time
          type: string
        suspension_reason:
          type: string
        user_id:
          format: uuid
          type: string
      required:
        - user_id
        - status
        - locale
        - mfa_enabled
        - created_at
        - student
        - platform_roles
        - memberships
      type: object
    AdminUserList:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/AdminUserSummaryDTO"
          type: array
        next_cursor:
          type: string
      required:
        - items
      type: object
    AdminUserSummaryDTO:
      additionalProperties: false
      properties:
        created_at:
          format: date-time
          type: string
        email:
          type: string
        first_name:
          type: string
        last_login_at:
          format: date-time
          type: string
        last_name:
          type: string
        mfa_enabled:
          type: boolean
        status:
          enum:
            - pending_email
            - active
            - suspended
            - erased
          type: string
        user_id:
          format: uuid
          type: string
      required:
        - user_id
        - status
        - mfa_enabled
        - created_at
      type: object
    ApproveInputBody:
      additionalProperties: false
      properties:
        stage:
          enum:
            - first
            - second
          type: string
      required:
        - stage
      type: object
    AssignmentInputBody:
      additionalProperties: false
      properties:
        reauth:
          $ref: "#/components/schemas/ReauthDTO"
          description: Re-authentication proof of the admin (03 §6.2)
      type: object
    AuditActorDTO:
      additionalProperties: false
      properties:
        display:
          description: Display name, when known
          type: string
        user_id:
          description: Absent for system jobs and anonymous requests
          format: uuid
          type: string
      type: object
    AuditEventDTO:
      additionalProperties: false
      properties:
        action:
          description: Audit action (authz action name)
          type: string
        actor:
          $ref: "#/components/schemas/AuditActorDTO"
        ip:
          type: string
        metadata:
          description: Event details (IDs, kinds, flags); never secrets
        occurred_at:
          format: date-time
          type: string
        outcome:
          enum:
            - success
            - denied
            - failure
          type: string
        reason:
          type: string
        resource_id:
          format: uuid
          type: string
        resource_type:
          type: string
        user_agent:
          type: string
      required:
        - action
        - outcome
        - actor
        - occurred_at
      type: object
    AuditEventList:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/AuditEventDTO"
          type: array
        next_cursor:
          type: string
      required:
        - items
      type: object
    AvailabilityDTO:
      additionalProperties: false
      properties:
        access_until:
          description: End of the running access right (discovery_access; absent when none)
          format: date-time
          type: string
        feature:
          enum:
            - targeted_post
            - targeted_dispatch
            - contact_request
            - discovery_access
          type: string
        remaining:
          description: Units usable now (quota features)
          format: int64
          type: integer
      required:
        - feature
      type: object
    ChangePasswordInputBody:
      additionalProperties: false
      properties:
        current_password:
          description: Re-authentication proof (03 §6.2)
          maxLength: 1024
          type: string
        new_password:
          maxLength: 1024
          minLength: 1
          type: string
        reauth:
          $ref: "#/components/schemas/ReauthDTO"
          description: "MFA accounts: reauth.totp_code"
      required:
        - new_password
      type: object
    ClubCardDTO:
      additionalProperties: false
      properties:
        category:
          type: string
        claim_status:
          enum:
            - unclaimed
            - claimed
          type: string
        club_id:
          description: The club's org_id
          type: string
        join_policy:
          enum:
            - open
            - approval
          type: string
        member_count:
          description: null below 10 members or for a sensitive club (k-anonymity)
          format: int64
          type:
            - integer
            - "null"
        membership_private:
          description: "true for a sensitive club: its membership is never shown"
          type: boolean
        name:
          type: string
        slug:
          type: string
        university_id:
          type: string
      required:
        - club_id
        - name
        - slug
        - university_id
        - category
        - join_policy
        - claim_status
        - membership_private
        - member_count
      type: object
    ClubCardList:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/ClubCardDTO"
          type: array
        next_cursor:
          type: string
      required:
        - items
      type: object
    ClubDTO:
      additionalProperties: false
      properties:
        category:
          type: string
        claim_status:
          enum:
            - unclaimed
            - claimed
          type: string
        club_id:
          description: The club's org_id
          type: string
        founded_year:
          format: int32
          type: integer
        join_policy:
          enum:
            - open
            - approval
          type: string
        member_count:
          description: null below 10 members or for a sensitive club (k-anonymity)
          format: int64
          type:
            - integer
            - "null"
        membership_private:
          description: "true for a sensitive club: its membership is never shown"
          type: boolean
        org:
          $ref: "#/components/schemas/OrgPublicDTO"
        social_links:
          additionalProperties:
            type: string
          description: Network name → https URL
          type: object
        university:
          $ref: "#/components/schemas/ClubUniversityDTO"
      required:
        - club_id
        - org
        - university
        - category
        - join_policy
        - claim_status
        - membership_private
        - member_count
        - social_links
      type: object
    ClubUniversityDTO:
      additionalProperties: false
      properties:
        city:
          type: string
        name:
          type: string
        org_id:
          type: string
        short_name:
          type: string
        university_id:
          type: string
      required:
        - university_id
        - org_id
        - name
        - city
      type: object
    CodeInputBody:
      additionalProperties: false
      properties:
        code:
          description: The current 6-digit TOTP code
          maxLength: 16
          minLength: 1
          type: string
      required:
        - code
      type: object
    CompanyDTO:
      additionalProperties: false
      properties:
        domain_verified_at:
          format: date-time
          type: string
        email_domain:
          type: string
        hq_city:
          type: string
        sector_code:
          type: string
        size_band:
          type: string
      type: object
    CompanyPublicDTO:
      additionalProperties: false
      properties:
        hq_city:
          type: string
        sector_code:
          type: string
        size_band:
          type: string
      type: object
    CompleteInputBody:
      additionalProperties: false
      properties:
        reauth:
          $ref: "#/components/schemas/DsrReauthDTO"
          description: Re-authentication proof (03 §6.2)
        response_summary:
          description: The answer to the applicant
          maxLength: 4000
          minLength: 1
          type: string
      required:
        - response_summary
      type: object
    CompleteUploadInputBody:
      additionalProperties: false
      properties:
        sha256:
          description: Lower-case hex SHA-256 of the uploaded bytes
          pattern: ^[0-9a-f]{64}$
          type: string
      required:
        - sha256
      type: object
    ConfirmInputBody:
      additionalProperties: false
      properties:
        code:
          description: The current 6-digit TOTP code
          maxLength: 16
          minLength: 1
          type: string
        reauth:
          $ref: "#/components/schemas/ReauthDTO"
          description: "Re-authentication proof (06 H-46): reauth.password"
      required:
        - code
      type: object
    ConsentDTO:
      additionalProperties: false
      properties:
        action:
          enum:
            - granted
            - withdrawn
          type: string
        consent_id:
          format: uuid
          type: string
        occurred_at:
          format: date-time
          type: string
        purpose_code:
          type: string
        scope_id:
          description: Event registration of a per-registration purpose
          format: uuid
          type: string
      required:
        - consent_id
        - purpose_code
        - action
        - occurred_at
      type: object
    ConsentGrantBody:
      additionalProperties: false
      properties:
        notice_version_id:
          description: The consent text shown
          format: uuid
          type: string
        purpose_code:
          pattern: ^[a-z][a-z0-9_]{2,40}$
          type: string
        text_sha256:
          description: body_sha256 of that text
          pattern: ^[0-9a-f]{64}$
          type: string
      required:
        - purpose_code
        - notice_version_id
        - text_sha256
      type: object
    ConsentProofDTO:
      additionalProperties: false
      properties:
        action:
          enum:
            - granted
            - withdrawn
          type: string
        channel:
          enum:
            - web
            - mobile
            - email_link
            - admin
            - import
          type: string
        consent_id:
          format: uuid
          type: string
        ip:
          type: string
        notice_version_id:
          format: uuid
          type: string
        occurred_at:
          format: date-time
          type: string
        purpose_code:
          type: string
        scope_id:
          format: uuid
          type: string
        scope_type:
          enum:
            - none
            - registration
          type: string
        text_sha256:
          description: Hex SHA-256 of the text the user saw
          type: string
        user_agent:
          type: string
      required:
        - consent_id
        - purpose_code
        - action
        - scope_type
        - channel
        - occurred_at
      type: object
    ConsentProofList:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/ConsentProofDTO"
          type: array
        next_cursor:
          type: string
      required:
        - items
      type: object
    ConsentStateDTO:
      additionalProperties: false
      properties:
        purpose_code:
          type: string
        scope_id:
          format: uuid
          type: string
        since:
          format: date-time
          type: string
        state:
          description: The newest act decides
          enum:
            - granted
            - withdrawn
          type: string
      required:
        - purpose_code
        - state
        - since
      type: object
    CreateCompanyInputBody:
      additionalProperties: false
      properties:
        email_domain:
          description: The company's e-mail domain (not verified yet)
          maxLength: 253
          type: string
        hq_city:
          maxLength: 60
          type: string
        name:
          maxLength: 200
          minLength: 2
          type: string
        sector_code:
          pattern: ^[a-z_]{2,40}$
          type: string
        size_band:
          enum:
            - 1-10
            - 11-50
            - 51-200
            - 201-1000
            - 1000+
          type: string
        slug:
          description: Derived from the name when omitted
          maxLength: 80
          type: string
        website_url:
          description: https:// only
          maxLength: 2048
          type: string
      required:
        - name
        - sector_code
