  /api/v1/orgs/{org_id}/invoices:
    get:
      description: "The invoices the organization issues (direction=issued: a payee's service invoices) and receives (direction=received: a company's invoices, Koro's commission invoices to a payee), newest first; both when direction is omitted. Planned invoices are the documents the commerce model expects (02 §18.3)."
      operationId: listOrgInvoices
      parameters:
        - description: Page size
          explode: false
          in: query
          name: limit
          schema:
            default: 25
            description: Page size
            format: int64
            maximum: 100
            minimum: 1
            type: integer
        - description: Opaque cursor from next_cursor
          explode: false
          in: query
          name: cursor
          schema:
            description: Opaque cursor from next_cursor
            maxLength: 512
            type: string
        - in: path
          name: org_id
          required: true
          schema:
            format: uuid
            type: string
        - description: "issued: the org issues them; received: the org receives them; both when omitted"
          explode: false
          in: query
          name: direction
          schema:
            description: "issued: the org issues them; received: the org receives them; both when omitted"
            enum:
              - issued
              - received
            type: string
        - explode: false
          in: query
          name: kind
          schema:
            enum:
              - service_sale
              - commission
              - platform_fee
              - payee_to_koro
              - credit_note
            type: string
        - explode: false
          in: query
          name: status
          schema:
            enum:
              - planned
              - queued
              - provider_pending
              - issued
              - failed
              - mismatch
              - cancelled
            type: string
